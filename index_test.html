<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清海無上師甘露法語播放器</title>
<style>
:root {
  --fg:#eef7f6;
  --muted:rgba(240,248,248,.82);
  --card:rgba(255,255,255,.16);
  --card2:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.22);
  --shadow:0 18px 60px rgba(0,0,0,.28);
}
* { box-sizing:border-box; }
html,body {
  margin:0; padding:0; height:100%; overflow:hidden;
  font-family:"Noto Serif TC","Microsoft JhengHei",serif;
  color:var(--fg);
}
html {
  background: radial-gradient(circle at center, rgba(210,230,245,0.55), rgba(223,239,255,0.95));
}
body {
  background: transparent;
}
body {
  display:grid; place-items:center;
}
.shell {
  position:relative;
  width:min(92vw,430px);
  aspect-ratio:9/16;
  border-radius:30px;
  overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.45);
  background:#dfefff center/cover no-repeat;
}
.bg {
  position:absolute; inset:0;
  background:#dfefff center/cover no-repeat;
  transition:opacity 1.6s ease;
}
#bgA{opacity:1} #bgB{opacity:0}
.mist {
  position:absolute; inset:0;
  background:
    radial-gradient(circle at top right, rgba(255,230,185,.20), transparent 28%),
    radial-gradient(circle at left bottom, rgba(180,255,230,.12), transparent 25%),
    linear-gradient(to bottom, rgba(15,22,24,.08), rgba(6,14,17,.36));
  backdrop-filter: blur(2px);
}
.topbar {
  position:absolute; left:16px; right:16px; top:16px; z-index:5;
  display:flex; justify-content:space-between; align-items:flex-start;
}
.datetime {
  min-width:132px; padding:10px 14px;
  border-radius:18px; background:var(--card2); border:1px solid var(--line);
  backdrop-filter: blur(10px); box-shadow:var(--shadow);
  font-size:12px; line-height:1.5; letter-spacing:.4px; text-decoration:none !important; color:var(--fg) !important;
}
.datetime .line1{font-size:13px; font-weight:600}
.iconbar {display:flex; gap:10px}
.icon-btn {
  width:38px; height:38px; border:none; border-radius:50%;
  background:var(--card2); border:1px solid var(--line);
  backdrop-filter: blur(10px); color:var(--fg);
  display:grid; place-items:center; cursor:pointer;
  box-shadow:var(--shadow);
}
.icon-btn svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
#bgBtn{z-index:20; touch-action:manipulation;}
.title-wrap {
  position:absolute; top:72px; left:50%; transform:translateX(-50%); z-index:4;
  width:84%; text-align:center;
}

.lotus-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  cursor:pointer;
  opacity:.96;
  transition:transform .25s ease, opacity .25s ease, filter .25s ease;
}
.lotus-link:hover{
  opacity:1;
  transform:scale(1.05);
  filter:drop-shadow(0 0 8px rgba(255,255,255,.45));
}

.lotus-mark {
  width:64px; height:24px; margin:0 auto 8px; opacity:.96;
}
.title {
  font-size:19px; letter-spacing:3px; font-weight:700;
  text-shadow:0 2px 12px rgba(0,0,0,.18);
}
.search-wrap {
  position:absolute; top:150px; left:50%; transform:translateX(-50%);
  width:82%; z-index:6;
}
.search-box {
  position:relative;
  width:100%; display:flex; align-items:center; gap:10px;
  padding:12px 16px;
  border-radius:26px; border:1px solid var(--line); background:rgba(255,255,255,.18);
  backdrop-filter: blur(12px); box-shadow:var(--shadow);
}
.search-box input {
  flex:1; border:none; outline:none; background:transparent;
  color:var(--fg); font-size:15px; padding-right:122px;
}
.search-box input::placeholder { color:rgba(240,248,248,.78); }
.search-box svg { width:18px; height:18px; stroke:rgba(240,248,248,.84); fill:none; stroke-width:1.8 }
.search-action-buttons{
  position:absolute; right:10px; top:50%; transform:translateY(-50%);
  display:none; align-items:center; gap:10px;
}
.search-action-buttons.show{ display:flex; }
.search-mode-btn{
  border:none; background:none; color:rgba(240,248,248,.78);
  padding:0; margin:0; font-size:13px; cursor:pointer;
  text-shadow:0 1px 6px rgba(0,0,0,.18);
  transition:color .2s ease, text-shadow .2s ease, opacity .2s ease, transform .2s ease;
  opacity:.92;
}
.search-mode-btn:hover{ color:rgba(255,255,255,.94); }
.search-mode-btn.active{
  color:#ffffff;
  text-shadow:0 0 8px rgba(255,255,255,.88), 0 0 18px rgba(223,239,255,.72);
}
.search-mode-btn:active{ transform:scale(.98); }
.search-panel {
  display:none;
  margin-top:10px; max-height:228px; overflow:auto;
  border-radius:18px; border:1px solid var(--line);
  background:rgba(8,22,28,.58); backdrop-filter: blur(16px);
  box-shadow:var(--shadow); padding:8px 0;
}
.search-panel::-webkit-scrollbar{display:none}
.section-label {
  padding:8px 14px 4px; font-size:12px; color:rgba(245,251,251,.72);
}
.search-item {
  padding:10px 14px; cursor:pointer; border-top:1px solid rgba(255,255,255,.06);
}
.search-item:hover { background:rgba(255,255,255,.08); }
.search-pager {
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:8px 14px 6px; border-top:1px solid rgba(255,255,255,.06);
}
.search-pager-btn{
  appearance:none; border:none; background:none; box-shadow:none;
  color:rgba(246,252,252,.74); cursor:pointer;
  padding:4px 2px; margin:0; line-height:1;
  font-size:20px; font-weight:500;
  text-shadow:0 1px 6px rgba(0,0,0,.18);
  transition:opacity .2s ease, transform .2s ease, color .2s ease;
}
.search-pager-btn:hover,
.search-pager-btn:active{
  color:rgba(246,252,252,.96);
  transform:scale(1.06);
}
.search-pager-btn[disabled]{
  opacity:.35; cursor:default; transform:none;
}
.search-pager .page-info {
  font-size:11px; color:rgba(245,251,251,.68);
}
.quote-card {
  position:absolute; top:205px; left:50%; transform:translateX(-50%);
  width:84%; height:360px;
  padding:22px 22px 54px; border-radius:28px;
  background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.20);
  backdrop-filter: blur(14px); box-shadow:var(--shadow); z-index:4;
  display:flex; flex-direction:column;
}
.decor-line {
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin-bottom:12px; opacity:.78;
}
.decor-line::before, .decor-line::after {
  content:""; display:block; width:88px; height:1px; background:rgba(255,255,255,.25);
}
.decor-lotus { width:16px; height:16px; opacity:.95; }
.quote-text {
  flex:1; min-height:0; overflow:auto; scrollbar-width:none;
  text-align:center; white-space:pre-wrap;
  font-size:clamp(16px, 3.15vw, 18px); line-height:1.9;
  text-shadow:0 1px 4px rgba(0,0,0,.12);
  opacity:1; transition:opacity 1.6s ease;
}
.quote-text::-webkit-scrollbar{display:none}
.source {
  margin-top:16px; text-align:center; display:block;
  font-size:12px; color:rgba(246,252,252,.92); text-decoration:none;
  line-height:1.5;
  max-width:100%;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:break-word;
}
.quote-image{
  display:block;
  max-width:100%;
  max-height:100%;
  margin:0 auto 12px;
  border-radius:14px;
  object-fit:contain;
  box-shadow:0 8px 24px rgba(0,0,0,.16);
}
.source.disabled { pointer-events:none; opacity:.72; }
.next-btn { display:none !important; }
.next-btn svg { width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.player {
  position:absolute; left:14px; right:14px; bottom:28px; z-index:5;
  padding:10px 12px 8px; border-radius:22px;
  background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.18);
  backdrop-filter: blur(16px); box-shadow:var(--shadow);
}
.player-top { display:flex; gap:10px; align-items:flex-start; }
.cover-col { width:66px; flex:0 0 66px; display:flex; flex-direction:column; align-items:center; gap:6px; }
.cover {
  width:58px; height:58px; border-radius:12px; object-fit:cover;
  flex:0 0 auto; box-shadow:0 8px 24px rgba(0,0,0,.2);
}
.player-source {
  font-size:10px; line-height:1.28; color:var(--fg); text-decoration:none; text-align:center; opacity:.92;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.song-area { flex:1; min-width:0; }
.song-title { font-size:14px; font-weight:700; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.song-meta { margin-top:2px; font-size:11px; color:rgba(240,248,248,.75); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.progress-wrap { margin-top:8px; }
.progress {
  width:100%; appearance:none; height:3px; border-radius:999px; background:rgba(255,255,255,.28); outline:none;
}
.progress::-webkit-slider-thumb, .volume-slider::-webkit-slider-thumb {
  appearance:none; width:12px; height:12px; border-radius:50%; background:#fff; box-shadow:0 2px 10px rgba(0,0,0,.25);
}
.time-row {
  display:flex; justify-content:space-between; margin-top:3px;
  font-size:10px; color:rgba(240,248,248,.72);
}
.controls {
  margin-top:6px; display:flex; align-items:center; justify-content:center; gap:12px;
}
.control-btn {
  border:none; background:none; color:var(--fg); cursor:pointer; padding:0; display:grid; place-items:center;
}
.control-btn svg { width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.play-btn {
  width:46px; height:46px; border-radius:50%;
  background:rgba(255,255,255,.22); border:1px solid rgba(255,255,255,.28);
  box-shadow:0 8px 24px rgba(0,0,0,.16);
}
.repeat-text{
  font-size:17px; font-weight:700; line-height:1;
}
.quote-nav{
  position:absolute; right:14px; bottom:14px; z-index:6;
  display:flex; align-items:center; gap:10px;
}
.quote-nav-btn{
  appearance:none; border:none; background:none; box-shadow:none;
  color:rgba(246,252,252,.74); cursor:pointer;
  padding:4px 2px; margin:0; line-height:1;
  font-size:22px; font-weight:500;
  text-shadow:0 1px 6px rgba(0,0,0,.18);
  transition:opacity .2s ease, transform .2s ease, color .2s ease;
}
.quote-nav-btn:hover,
.quote-nav-btn:active{
  color:rgba(246,252,252,.96);
  transform:scale(1.06);
}
.quote-nav-btn:disabled{
  opacity:.35; cursor:default; transform:none;
}
.volume-hint {
  position:absolute; right:18px; bottom:110px; z-index:8; display:none;
  padding:8px 10px; border-radius:12px;
  background:rgba(6,20,24,.78); border:1px solid rgba(255,255,255,.16); backdrop-filter: blur(14px);
  font-size:11px; text-align:center; white-space:nowrap;
}
.toast {
  display:none !important;
}

/* ===== 手機播放器收合與音量修正 ===== */
.restore-player-btn{
  display:none;
  align-items:center;
  justify-content:center;
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:none !important;
  border:none !important;
  box-shadow:none !important;
  width:24px !important;
  height:24px !important;
  min-width:24px;
  min-height:24px;
  border-radius:0 !important;
  padding:0;
  font-size:20px;
  line-height:1;
  color:rgba(255,255,255,0.88);
  cursor:pointer;
}
#miniPlayerBtn svg{ width:18px; height:18px; }
.player{
  transition:width .25s ease, height .25s ease, padding .25s ease, border-radius .25s ease, right .25s ease, bottom .25s ease;
}
.player.minimized{
  left:14px;
  right:auto;
  bottom:18px;
  width:44px;
  height:44px;
  padding:0;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:visible;
}
.player.minimized .player-top,
.player.minimized .volume-hint{
  display:none !important;
}
.player.minimized .restore-player-btn{
  all:unset !important;
  font-size:18px;
  color:rgba(255,255,255,0.9);
  cursor:pointer;
}
.player.minimized .restore-player-btn{
  all:unset !important;
  font-size:18px;
  color:rgba(255,255,255,0.9);
  cursor:pointer;
}
@media (max-width: 640px){
  .player.minimized{
    left:12px;
    right:auto;
    bottom:16px;
  }
  .volume-hint{
    right:12px;
    bottom:118px;
    font-size:10px;
  }
}


/* ===== 背景模糊鋪滿 ===== */
html::before {
  content: "";
  position: fixed;
  inset: 0;
  background: url("BG/bg1.png") center center / cover no-repeat;
  filter: blur(20px) brightness(0.9);
  transform: scale(1.08);
  z-index: -2;
}

html::after {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.08);
  z-index: -1;
}

html, body {
  background: transparent !important;
}


/* ===== 外圍背景同步模糊 ===== */
#outerBlurBg{
  position: fixed;
  inset: 0;
  background: #dfefff;
  filter: blur(20px) brightness(0.92);
  transform: scale(1.08);
  z-index: -3;
  transition: background-image .8s ease, opacity .8s ease;
}
html::before,
html::after{
  content:none !important;
}
body::before{
  content:"";
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.08);
  z-index: -2;
  pointer-events:none;
}
html, body {
  background: transparent !important;
}


/* ===== 極簡音符（最終完全版）===== */
.player.minimized{
  position:absolute !important;
  left:12px !important;
  bottom:16px !important;
  width:auto !important;
  height:auto !important;
  padding:0 !important;
  border-radius:0 !important;
  background:none !important;
  border:none !important;
  box-shadow:none !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
}
.player.minimized .player-top,
.player.minimized .volume-hint{
  display:none !important;
}
.player.minimized .restore-player-btn{
  all:unset !important;
  font-size:18px;
  color:rgba(255,255,255,0.9);
  cursor:pointer;
}
.player.minimized .player-top,
.player.minimized .volume-hint{
  display:none !important;
}
.player.minimized .restore-player-btn{
  all:unset !important;
  font-size:18px;
  color:rgba(255,255,255,0.9);
  cursor:pointer;
}

</style>
</head>

  <div id="bgA" class="bg"></div>
  <div id="bgB" class="bg"></div>
  <div class="mist"></div>

  <div class="topbar">
    <a class="datetime" id="datetime" href="https://www.cwa.gov.tw/V8/C/W/Town/Town.html?TID=1000502" target="_blank" rel="noopener noreferrer"></a>

  <div class="title-wrap">

    <div class="title">清海無上師甘露法語</div>
  </div>

  <div class="search-wrap">
    <div class="search-box">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="searchInput" type="text" placeholder="搜尋法語或音樂…" autocomplete="off">
      <div class="search-action-buttons" id="searchActionButtons">
        <button type="button" class="search-mode-btn active" data-mode="quote">搜法語</button>
        <button type="button" class="search-mode-btn" data-mode="track">搜音樂</button>
      </div>

let TRACKS = TRACKS_FALLBACK.slice();
const TRACKS_JSON_URL = 'tracks.json';

async function loadExternalTracks() {
  try {
    const resp = await fetch(TRACKS_JSON_URL, { cache: 'no-store' });
    if (!resp.ok) throw new Error('tracks.json HTTP ' + resp.status);
    const data = await resp.json();
    if (!Array.isArray(data) || !data.length) throw new Error('tracks.json 格式不正確');
    TRACKS = data.filter(item => item && item.file && item.title);
  } catch (err) {
    console.warn('讀取 tracks.json 失敗，改用內建清單：', err);
    TRACKS = TRACKS_FALLBACK.slice();
  }
}

function normalizeCurrentTrackIndex() {
  if (!Number.isFinite(currentTrackIndex) || currentTrackIndex < 0 || currentTrackIndex >= TRACKS.length) {
    currentTrackIndex = 0;
  }
}

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}


function setBackground(index) {
  bgIndex = (index + BACKGROUNDS.length) % BACKGROUNDS.length;
  localStorage.setItem('ganlu_bg_index', bgIndex);
  const nextBg = BACKGROUNDS[bgIndex];

  const img = new Image();
  img.onload = () => {
    if (bgFront) {
      bgB.style.backgroundImage = `url(${nextBg})`;
      bgB.style.opacity = '1';
      bgA.style.opacity = '0';
    } else {
      bgA.style.backgroundImage = `url(${nextBg})`;
      bgA.style.opacity = '1';
      bgB.style.opacity = '0';
    }

    const outerBlurBg = document.getElementById('outerBlurBg');
    if (outerBlurBg) {
      outerBlurBg.style.backgroundImage = `url(${nextBg})`;
    }

    bgFront = !bgFront;
  };
  img.onerror = () => {
    console.warn('背景載入失敗：', nextBg);
  };
  img.src = nextBg;
}
// 外部 BG 圖包自動接管：如果同層 BG/ 有 bg1.png ~ bg21.png，就優先使用它們；否則保留原本內建背景。
const EXTERNAL_BG_LIST = Array.from({ length: 30 }, (_, i) => `BG/bg${i + 1}.png`);
const THEME_GROUPS = [
  { name: '禪風詩意', start: 0, end: 10, speed: 10000 },
  { name: '浪漫戀愛', start: 10, end: 20, speed: 7000 },
  { name: '活力充沛', start: 20, end: 30, speed: 5000 }
];

let externalBackgrounds = [];
let currentThemeIndex = -1;
let currentBgSpeed = 8000;
let bgPressTimer = null;
let bgLongPressTriggered = false;

function preloadExternalImage(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = src;
  });
}

function restartBackgroundTimer() {
  clearInterval(window._ganluBgTimer);
  window._ganluBgTimer = setInterval(() => {
    setBackground(bgIndex + 1);
    renderTrack();
  }, currentBgSpeed);
}

function useBackgroundList(list, resetIndex = true) {
  if (!list || !list.length) return;
  BACKGROUNDS.splice(0, BACKGROUNDS.length, ...list);
  if (resetIndex) {
    bgIndex = 0;
    bgFront = true;
    localStorage.setItem('ganlu_bg_index', '0');
    bgA.style.backgroundImage = `url(${BACKGROUNDS[0]})`;
    bgB.style.backgroundImage = `url(${BACKGROUNDS[0]})`;
    bgA.style.opacity = '1';
    bgB.style.opacity = '0';

    const outerBlurBg = document.getElementById('outerBlurBg');
    if (outerBlurBg) {
      outerBlurBg.style.backgroundImage = `url(${BACKGROUNDS[0]})`;
    }
  } else {
    setBackground(bgIndex);
  }
  renderTrack();
}

function applyThemeByIndex(index) {
  if (!externalBackgrounds.length) return;

  if (externalBackgrounds.length < 30) {
    currentThemeIndex = 0;
    currentBgSpeed = 8000;
    useBackgroundList(externalBackgrounds, true);
    restartBackgroundTimer();
    localStorage.removeItem('ganlu_theme_index');
    return;
  }

  currentThemeIndex = (index + THEME_GROUPS.length) % THEME_GROUPS.length;
  const theme = THEME_GROUPS[currentThemeIndex];
  const group = externalBackgrounds.slice(theme.start, theme.end);
  if (!group.length) return;
  currentBgSpeed = theme.speed;
  useBackgroundList(group, true);
  restartBackgroundTimer();
  localStorage.setItem('ganlu_theme_index', String(currentThemeIndex));
}

async function enableExternalBackgrounds() {
  const valid = [];
  for (const src of EXTERNAL_BG_LIST) {
    const ok = await preloadExternalImage(src);
    if (ok) valid.push(src);
  }

  externalBackgrounds = valid.slice();

  if (valid.length) {
    const savedThemeIndex = Number(localStorage.getItem('ganlu_theme_index') || -1);
    if (valid.length >= 30 && savedThemeIndex >= 0 && savedThemeIndex < THEME_GROUPS.length) {
      currentThemeIndex = savedThemeIndex - 1;
      applyThemeByIndex(savedThemeIndex);
    } else {
      currentBgSpeed = 8000;
      useBackgroundList(valid, true);
      restartBackgroundTimer();
    }
  } else {
    currentBgSpeed = 8000;
    restartBackgroundTimer();
  }
}

window.addEventListener('load', async () => {
  await enableExternalBackgrounds();
});

const bgBtn = document.getElementById('bgBtn');

function clearBgPressTimer() {
  if (bgPressTimer) {
    clearTimeout(bgPressTimer);
    bgPressTimer = null;
  }
}

function handleBgShortPress() {
  setBackground(bgIndex + 1);
  renderTrack();
}

function handleBgLongPress() {
  bgLongPressTriggered = true;
  applyThemeByIndex(currentThemeIndex + 1);
}

bgBtn.style.touchAction = 'manipulation';

bgBtn.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  bgLongPressTriggered = false;
  clearBgPressTimer();
  bgPressTimer = setTimeout(handleBgLongPress, 650);
});

bgBtn.addEventListener('pointerup', (e) => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const wasLong = bgLongPressTriggered;
  clearBgPressTimer();
  if (!wasLong) handleBgShortPress();

    const todayId = getTaipeiDateId();

function getCreatedAtMs(value) {
  if (!value) return 0;
  try {
    if (typeof value === 'number' && isFinite(value)) return value;
    if (typeof value.toDate === 'function') return value.toDate().getTime();
    if (typeof value.seconds === 'number') {
      const nanos = typeof value.nanoseconds === 'number' ? value.nanoseconds : 0;
      return value.seconds * 1000 + Math.floor(nanos / 1000000);
    }
    const parsed = Date.parse(value);
    return Number.isNaN(parsed) ? 0 : parsed;
  } catch (e) {
    return 0;
  }
}

function sanitizeQuoteRotationState(state = {}) {
  return {
    seen: Array.isArray(state?.seen) ? state.seen.map(v => String(v || '')).filter(Boolean) : [],
    currentSignature: String(state?.currentSignature || ''),
    history: Array.isArray(state?.history) ? state.history.map(v => String(v || '')).filter(Boolean) : [],
    historyIndex: Number.isInteger(state?.historyIndex) ? state.historyIndex : -1
  };
}

function writeQuoteRotationState(state) {

  } catch (e) {

}

function isImageQuote(item = {}) {

function getRandomItem(items = []) {
  if (!items.length) return null;
  return items[Math.floor(Math.random() * items.length)] || items[0] || null;
}

const PRIORITY_TEXT_POOL_SIZE = 20;
const IMAGE_INSERT_CHANCE = 0.12;

function sortTextQuotesByOrder(items = []) {
  return [...items].sort((a, b) => {
    const orderDiff = getQuoteOrder(b) - getQuoteOrder(a);
    if (orderDiff !== 0) return orderDiff;

    const timeDiff = getCreatedAtMs(b.createdAt) - getCreatedAtMs(a.createdAt);
    if (timeDiff !== 0) return timeDiff;

    return String(a.content || '').localeCompare(String(b.content || ''), 'zh-Hant');
  });
}

function getPriorityTextPool(items = [], size = PRIORITY_TEXT_POOL_SIZE) {
  return sortTextQuotesByOrder(items.filter(item => !isImageQuote(item))).slice(0, size);
}

function normalizeRotationStateForCurrentQuotes(state) {
  const signatures = QUOTES.map(quoteSignature);
  const validSignatureSet = new Set(signatures);
  const currentSignature = validSignatureSet.has(state.currentSignature) ? state.currentSignature : '';
  const seen = state.seen.filter(sig => validSignatureSet.has(sig));
  const history = state.history.filter(sig => validSignatureSet.has(sig));
  let historyIndex = Number(state.historyIndex);

  if (!Number.isInteger(historyIndex)) {
    historyIndex = history.length ? history.length - 1 : -1;
  }

  if (historyIndex >= history.length) {
    historyIndex = history.length - 1;
  }

  if (historyIndex < -1) {
    historyIndex = -1;
  }

  return { signatures, validSignatureSet, currentSignature, seen, history, historyIndex };
}

function chooseNextQuoteItem(seen = [], currentSignature = '') {
  let unseen = QUOTES.filter(item => !seen.includes(quoteSignature(item)));

  if (!unseen.length) {
    unseen = [...QUOTES];
    seen = [];
  }

  const currentItem = QUOTES.find(item => quoteSignature(item) === currentSignature) || null;
  const currentIsImage = isImageQuote(currentItem);

  const unseenText = unseen.filter(item => !isImageQuote(item));
  const unseenImages = unseen.filter(item => isImageQuote(item));
  const priorityTextPool = getPriorityTextPool(unseenText, PRIORITY_TEXT_POOL_SIZE);

  // 圖片法語不參與 order 排序：維持偶爾隨機安插，但避免連續圖片。
  if (!currentIsImage && unseenImages.length && Math.random() < IMAGE_INSERT_CHANCE) {
    const imageItem = getRandomItem(unseenImages);
    if (imageItem) return { nextItem: imageItem, resetSeen: seen };
  }

  const nextItem =
    getRandomItem(priorityTextPool) ||
    getRandomItem(unseenText) ||
    getRandomItem(unseenImages) ||
    getRandomItem(unseen) ||
    QUOTES[0] ||
    null;

  return { nextItem, resetSeen: seen };
}

function setCurrentQuoteBySignature(signature, state = null) {
  if (!signature) return 0;
  const signatures = QUOTES.map(quoteSignature);
  const index = signatures.indexOf(signature);
  if (index >= 0) {
    currentQuoteIndex = index;
    if (state) {
      writeQuoteRotationState(state);
    }
    return index;
  }
  currentQuoteIndex = 0;
  if (state) {
    writeQuoteRotationState(state);
  }
  return 0;
}

function applyDailyQuoteRotation(forceRefresh = false) {
  if (!QUOTES.length) {
    currentQuoteIndex = 0;
    return 0;
  }

  const normalized = normalizeRotationStateForCurrentQuotes(readQuoteRotationState());
  let { currentSignature, seen, history, historyIndex } = normalized;

  if (!forceRefresh && currentSignature) {
    const currentIndex = normalized.signatures.indexOf(currentSignature);
    if (currentIndex >= 0) {
      currentQuoteIndex = currentIndex;
      writeQuoteRotationState({ seen, currentSignature, history, historyIndex });
      return currentIndex;
    }
  }

  const selection = chooseNextQuoteItem(seen, currentSignature);
  const nextItem = selection.nextItem || QUOTES[0];
  const nextSignature = quoteSignature(nextItem);
  const nextSeen = selection.resetSeen.slice();

  if (!nextSeen.includes(nextSignature)) {
    nextSeen.push(nextSignature);
  }

  if (!history.length || history[history.length - 1] !== nextSignature) {
    history = history.slice(0, historyIndex + 1);
    history.push(nextSignature);
  }
  historyIndex = history.length - 1;

  const nextState = { seen: nextSeen, currentSignature: nextSignature, history, historyIndex };
  return setCurrentQuoteBySignature(nextSignature, nextState);
}

function goToNextQuote() {
  if (!QUOTES.length) return 0;

  const normalized = normalizeRotationStateForCurrentQuotes(readQuoteRotationState());
  let { currentSignature, seen, history, historyIndex } = normalized;

  if (historyIndex < history.length - 1) {
    historyIndex += 1;
    const nextSignature = history[historyIndex];
    return setCurrentQuoteBySignature(nextSignature, { seen, currentSignature: nextSignature, history, historyIndex });
  }

  const selection = chooseNextQuoteItem(seen, currentSignature);
  const nextItem = selection.nextItem || QUOTES[0];
  const nextSignature = quoteSignature(nextItem);
  const nextSeen = selection.resetSeen.slice();

  if (!nextSeen.includes(nextSignature)) {
    nextSeen.push(nextSignature);
  }

  history = history.slice(0, historyIndex + 1);
  history.push(nextSignature);
  historyIndex = history.length - 1;

  return setCurrentQuoteBySignature(nextSignature, { seen: nextSeen, currentSignature: nextSignature, history, historyIndex });
}

function goToPrevQuote() {
  if (!QUOTES.length) return 0;

  const normalized = normalizeRotationStateForCurrentQuotes(readQuoteRotationState());
  let { currentSignature, seen, history, historyIndex } = normalized;

  if (historyIndex > 0) {
    historyIndex -= 1;
    const prevSignature = history[historyIndex];
    return setCurrentQuoteBySignature(prevSignature, { seen, currentSignature: prevSignature, history, historyIndex });
  }

  if (currentSignature) {
    return setCurrentQuoteBySignature(currentSignature, { seen, currentSignature, history, historyIndex });
  }

  return applyDailyQuoteRotation();
}

function renderImmediateFallback() {

}

function hasMeaningfulOrderValue(value) {
  const n = Number(value);
  return Number.isFinite(n) && n > 0;
}

function sortQuotesForRotation(items = []) {
  const textQuotes = sortTextQuotesByOrder(items.filter(item => !isImageQuote(item)));
  const imageQuotes = items.filter(item => isImageQuote(item));

  // 圖片法語不照 order 排序；保留在圖片池中，由 chooseNextQuoteItem 偶爾隨機安插。
  return [...textQuotes, ...imageQuotes];
}

function prioritizeLatestQuote(items = []) {
  const sorted = sortQuotesForRotation(items);
  if (sorted.length <= 1) return sorted;

  let newestIndex = -1;
  let newestMs = 0;

  sorted.forEach((item, index) => {
    const ms = getCreatedAtMs(item.createdAt);
    if (ms > newestMs) {
      newestMs = ms;
      newestIndex = index;
    }
  });

  if (newestIndex <= 0) return sorted;

  const [featured] = sorted.splice(newestIndex, 1);
  return [featured, ...sorted];
}

function formatTime(sec) {

  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');

function getDefaultCover() {

function removeAudioExt(name) {
  return String(name || '').replace(/\.(mp3|m4a|wav|ogg|flac)$/i, '');
}

function trackCover() {
  const track = TRACKS[currentTrackIndex];
  if (!track || !track.file) return getDefaultCover();

  const normalized = String(track.file).replace(/^\/+/, '');
  const parts = normalized.split('/').filter(Boolean);

  if (parts[0] !== 'music' || parts.length < 3) {
    return getDefaultCover();
  }

  const batchFolder = parts[1];
  const lastPart = parts[parts.length - 1];

  // music/3/單曲.mp3 -> images/3/單曲.jpg
  if (parts.length === 3) {
    return `images/${batchFolder}/${removeAudioExt(lastPart)}.jpg`;
  }

  // music/3/專輯資料夾/歌曲.mp3 -> images/3/專輯資料夾.jpg
  const albumFolder = parts[2];
  if (batchFolder && albumFolder) {
    return `images/${batchFolder}/${albumFolder}.jpg`;
  }

  return getDefaultCover();
}

function renderTrack() {
  const track = TRACKS[currentTrackIndex];
  if (!track) return;
  songTitle.textContent = track.display || track.title;
  songMeta.textContent = track.category || '';

  const desiredCover = trackCover();
  cover.onerror = () => {
    cover.onerror = null;
    cover.src = getDefaultCover();
  };
  cover.src = desiredCover;

  localStorage.setItem('ganlu_track_index', String(currentTrackIndex));
}

function loadTrack(index) {
  if (!TRACKS.length) return;
  currentTrackIndex = (index + TRACKS.length) % TRACKS.length;
  const track = TRACKS[currentTrackIndex];
  audio.src = track.file;
  renderTrack();
}

function updatePlayIcon() {
  const playIcon = document.getElementById('playIcon');
  playIcon.innerHTML = audio.paused
    ? '<path d="M8 5v14l11-7Z"/>'
    : '<path d="M9 5h2v14H9z"/><path d="M13 5h2v14h-2z"/>';
}

function updateMuteIcon() {
  const muteIcon = document.getElementById('muteIcon');
  muteIcon.innerHTML = audio.muted
    ? '<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m17 9 4 6"/><path d="m21 9-4 6"/>'
    : '<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M18.5 8.5a5 5 0 0 1 0 7"/><path d="M15.5 11a2 2 0 0 1 0 2"/>';
}

function updateVolumeIcon() {
  const volumeIcon = document.getElementById('volumeIcon');
  if (!volumeIcon) return;
  if (audio.muted || audio.volume === 0) {
    volumeIcon.innerHTML = '<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m17 9 4 6"/><path d="m21 9-4 6"/>';
  } else if (audio.volume < 0.5) {
    volumeIcon.innerHTML = '<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 11a2 2 0 0 1 0 2"/>';
  } else {
    volumeIcon.innerHTML = '<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M18.5 8.5a5 5 0 0 1 0 7"/><path d="M15.5 11a2 2 0 0 1 0 2"/>';
  }
}

function updateRepeatIcon() {
  const btn = document.getElementById('repeatBtn');
  const repeatText = document.getElementById('repeatText');
  btn.style.opacity = '1';
  btn.title = repeatMode === 'single' ? '單曲循環' : '全部循環';
  repeatText.textContent = repeatMode === 'single' ? '1' : '∞';
  localStorage.setItem('ganlu_repeat_mode', repeatMode);
}

async function togglePlay() {
  try {
    if (!audio.src) loadTrack(currentTrackIndex);
    if (audio.paused) {
      await audio.play();
    } else {
      audio.pause();
    }
    updatePlayIcon();
  } catch (e) {
    showToast('首次通常需手動按播放');
  }
}

function nextTrack() {
  loadTrack((currentTrackIndex + 1) % TRACKS.length);
  audio.play().catch(()=>showToast('請手動按播放'));
  updatePlayIcon();
}

function prevTrack() {
  loadTrack((currentTrackIndex - 1 + TRACKS.length) % TRACKS.length);
  audio.play().catch(()=>showToast('請手動按播放'));
  updatePlayIcon();
}

let lastVolume = Number(localStorage.getItem('ganlu_last_volume') || 1);
if (!Number.isFinite(lastVolume) || lastVolume <= 0 || lastVolume > 1) lastVolume = 1;

function showVolumeHint() {
  const hint = document.getElementById('volumeHint');
  if (!hint) return;
  hint.style.display = 'block';
  clearTimeout(showVolumeHint._t);
  showVolumeHint._t = setTimeout(() => hint.style.display = 'none', 1600);
}

function applyVolume(v) {
  const next = Math.max(0, Math.min(1, Number(v)));
  audio.volume = next;
  audio.muted = next === 0;
  if (next > 0) lastVolume = next;
  localStorage.setItem('ganlu_last_volume', String(lastVolume));
  updateMuteIcon();
  updateVolumeIcon();
}

function toggleMute() {
  showVolumeHint();
  if (audio.muted || audio.volume === 0) {
    applyVolume(lastVolume || 1);
  } else {
    lastVolume = audio.volume || 1;
    applyVolume(0);
  }
}

function toggleRepeat() {
  repeatMode = repeatMode === 'single' ? 'all' : 'single';
  updateRepeatIcon();
  showToast(repeatMode === 'single' ? '單曲循環' : '全部循環');
}

document.getElementById('playBtn').onclick = togglePlay;
document.getElementById('nextBtn').onclick = nextTrack;
document.getElementById('prevBtn').onclick = prevTrack;
const muteBtnEl = document.getElementById('muteBtn');
const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
function cycleVolumeMobile() {
  const levels = [0, 0.33, 0.66, 1];
  const current = audio.muted ? 0 : Math.round(audio.volume * 100) / 100;
  let next = levels.find(v => v > current + 0.01);
  if (next === undefined) next = 0;
  applyVolume(next);
  showVolumeHint();
}
muteBtnEl.onclick = isTouchDevice ? cycleVolumeMobile : toggleMute;
document.getElementById('repeatBtn').onclick = toggleRepeat;

if (!isTouchDevice) {
  muteBtnEl.addEventListener('wheel', (e) => {
    e.preventDefault();
    showVolumeHint();
    const step = e.deltaY < 0 ? 0.05 : -0.05;
    const base = audio.muted ? (lastVolume || 0.5) : audio.volume;
    applyVolume(base + step);
  }, { passive:false });
}


audio.addEventListener('loadedmetadata', () => {
  durationTimeEl.textContent = formatTime(audio.duration);
  progressBar.value = 0;
});
audio.addEventListener('timeupdate', () => {
  currentTimeEl.textContent = formatTime(audio.currentTime);
  if (audio.duration) progressBar.value = audio.currentTime / audio.duration * 100;
});
audio.addEventListener('play', updatePlayIcon);
audio.addEventListener('pause', updatePlayIcon);
audio.addEventListener('ended', () => {
  if (repeatMode === 'single') {
    audio.currentTime = 0;
    audio.play().catch(()=>showToast('請手動按播放'));
  } else {
    nextTrack();
  }
});
audio.addEventListener('error', () => {
  showToast('找不到音樂檔，請確認 music 資料夾結構');
});
progressBar.addEventListener('input', () => {
  if (audio.duration) audio.currentTime = progressBar.value / 100 * audio.duration;
});

const SEARCH_PAGE_SIZE = 20;
const searchActionButtons = document.getElementById('searchActionButtons');
const searchState = {
  query: '',
  mode: 'quote',
  quoteResults: [],
  trackResults: [],
  quotePage: 0,
  trackPage: 0
};

function updateSearchModeButtons() {
  document.querySelectorAll('.search-mode-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === searchState.mode);
  });
}

function setSearchMode(mode) {
  searchState.mode = mode === 'track' ? 'track' : 'quote';
  searchState.quotePage = 0;
  searchState.trackPage = 0;
  updateSearchModeButtons();
  renderSearchPanelResults();
}

function selectQuote(index) {
  currentQuoteIndex = index;
  renderQuote();
  searchPanel.style.display = 'none';
  searchInput.value = '';
  if (searchActionButtons) searchActionButtons.classList.remove('show');
}

function playTrackByIndex(index) {
  loadTrack(index);
  audio.play().catch(()=>showToast('請手動按播放'));
  updatePlayIcon();
  searchPanel.style.display = 'none';
  searchInput.value = '';
  if (searchActionButtons) searchActionButtons.classList.remove('show');
}

function buildSearchPager(type, page, total) {
  const totalPages = Math.max(1, Math.ceil(total / SEARCH_PAGE_SIZE));
  return `
    <div class="search-pager">
      <button type="button" class="search-pager-btn" data-page-type="${type}" data-page-delta="-1" ${page <= 0 ? 'disabled' : ''}>‹</button>
      <div class="page-info">${page + 1} / ${totalPages}　共 ${total} 筆</div>
      <button type="button" class="search-pager-btn" data-page-type="${type}" data-page-delta="1" ${page >= totalPages - 1 ? 'disabled' : ''}>›</button>
    </div>`;
}

function renderSearchPanelResults() {
  const q = searchState.query;
  if (!q) {
    searchPanel.style.display = 'none';
    searchPanel.innerHTML = '';
    return;
  }

  const qr = searchState.quoteResults;
  const tr = searchState.trackResults;
  const mode = searchState.mode;
  let html = '';

  if (mode === 'quote') {
    const total = qr.length;
    const totalPages = Math.max(1, Math.ceil(total / SEARCH_PAGE_SIZE));
    searchState.quotePage = Math.min(searchState.quotePage, totalPages - 1);
    const start = searchState.quotePage * SEARCH_PAGE_SIZE;
    const pageItems = qr.slice(start, start + SEARCH_PAGE_SIZE);
    pageItems.forEach(([idx,item]) => {
      const short = item.content.length > 34 ? item.content.slice(0,34) + '…' : item.content;
      html += `<div class="search-item" data-action="quote" data-index="${idx}"><div>${short}</div></div>`;
    });
    if (!pageItems.length) html = '<div class="search-item">找不到結果</div>';
    else html += buildSearchPager('quote', searchState.quotePage, total);
  } else {
    const total = tr.length;
    const totalPages = Math.max(1, Math.ceil(total / SEARCH_PAGE_SIZE));
    searchState.trackPage = Math.min(searchState.trackPage, totalPages - 1);
    const start = searchState.trackPage * SEARCH_PAGE_SIZE;
    const pageItems = tr.slice(start, start + SEARCH_PAGE_SIZE);
    pageItems.forEach(([idx,item]) => {
      html += `<div class="search-item" data-action="track" data-index="${idx}"><div>${item.display}</div></div>`;
    });
    if (!pageItems.length) html = '<div class="search-item">找不到結果</div>';
    else html += buildSearchPager('track', searchState.trackPage, total);
  }

  searchPanel.innerHTML = html;
  searchPanel.style.display = 'block';
  searchPanel.scrollTop = 0;
}

function updateSearchResults() {
  const q = searchInput.value.trim();
  searchState.query = q;
  searchState.quotePage = 0;
  searchState.trackPage = 0;

  if (searchActionButtons) {
    searchActionButtons.classList.toggle('show', !!q);
  }

  if (!q) {
    renderSearchPanelResults();
    return;
  }

  searchState.quoteResults = [];
  QUOTES.forEach((item, idx) => {
    if ((item.content || '').includes(q) || (item.date || '').includes(q)) searchState.quoteResults.push([idx, item]);
  });

  searchState.trackResults = [];
  TRACKS.forEach((item, idx) => {
    if ((item.display || '').includes(q) || (item.title || '').includes(q) || (item.file || '').includes(q) || (item.category || '').includes(q)) {
      searchState.trackResults.push([idx, item]);
    }
  });

  renderSearchPanelResults();
}

function changeSearchPage(type, delta) {
  if (type === 'quote') {
    const totalPages = Math.max(1, Math.ceil(searchState.quoteResults.length / SEARCH_PAGE_SIZE));
    searchState.quotePage = Math.min(totalPages - 1, Math.max(0, searchState.quotePage + delta));
  } else {
    const totalPages = Math.max(1, Math.ceil(searchState.trackResults.length / SEARCH_PAGE_SIZE));
    searchState.trackPage = Math.min(totalPages - 1, Math.max(0, searchState.trackPage + delta));
  }
  renderSearchPanelResults();
}
window.changeSearchPage = changeSearchPage;

searchInput.addEventListener('input', updateSearchResults);

if (searchActionButtons) {
  searchActionButtons.addEventListener('click', (e) => {
    const btn = e.target.closest('.search-mode-btn');
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();
    setSearchMode(btn.dataset.mode || 'quote');
  });
}

searchPanel.addEventListener('click', (e) => {
  const pagerBtn = e.target.closest('.search-pager-btn');
  if (pagerBtn) {
    e.preventDefault();
    e.stopPropagation();
    if (!pagerBtn.disabled) changeSearchPage(pagerBtn.dataset.pageType, Number(pagerBtn.dataset.pageDelta || 0));
    return;
  }

  const itemEl = e.target.closest('.search-item[data-action]');
  if (itemEl) {
    const action = itemEl.dataset.action;
    const index = Number(itemEl.dataset.index);
    if (action === 'track') playTrackByIndex(index);
    else if (action === 'quote') selectQuote(index);
  }
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrap')) searchPanel.style.display = 'none';
});

updateSearchModeButtons();

async function bootstrapTracksAndPlayer() {
  await loadExternalTracks();
  normalizeCurrentTrackIndex();
  loadTrack(currentTrackIndex);
  updatePlayIcon();
  updateMuteIcon();
  updateVolumeIcon();
  updateRepeatIcon();
}

bootstrapTracksAndPlayer();
