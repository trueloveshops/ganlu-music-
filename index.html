tw/ch/news/40/"},{"content":"我們修行開悟了以後，如果自己不真正的了解為什麼開悟、為什麼這樣子，我們一定會再有問題，那個魔會再來。魔就是這樣，等在那邊考驗我們的，所以不要怪魔 ；如果我們自己不好，怪多少魔也沒有用；如果我們好，多少魔來也不能傷害我們。","date":"清海無上師以中文講於福爾摩沙西湖道場1994.10.9","url":"http://edenrules.com/index.php?route=product/product&product_id=439  造成輪迴的原因"},{"content":"真正的智慧才是我們最可靠的地方，不是世界的地位，不是世界的財產，也不是世界的美色或是才華。","date":"清海無上師以中文講於福爾摩沙西湖道場1994.10.9","url":"http://edenrules.com/index.php?route=product/product&product_id=439  造成輪迴的原因"},{"content":"我們應該打坐，真的是這樣！我們的概念要改，要把重點放在打坐上。一定要打坐！任何不重要的事情要放下來才行","date":"清海無上師以中文講於國際聚會 2009.10.11","url":"http://www.godsdirectcontact.org.tw/ch/news/205/tip_0.htm"},{"content":"我們真的要用功打坐，什麼時候能夠打坐就要打坐，5分鐘也好、2分鐘也要集中；工作的時候能念那個保護的聖句就要念，隨時都要保護自己。","date":"清海無上師以中文講於國際聚會 2009.10.11","url":"http://www.godsdirectcontact.org.tw/ch/news/205/tip_0.htm"},{"content":"有什麼地方不好趕快改，因為現在不改，明天也要改，後天也要改，越拖越麻煩，多利息出來而已；然後那個壞的習慣越來越硬，越來越穩定在那裡，我們越來越難改掉。","date":"清海無上師以中文講於福爾摩沙西湖道場\n一九九六年二月四日","url":"http://www.godsdirectcontact.org.tw/ch/news/56/h-1.htm"},{"content":"每次我們以高雅的方式服務大眾，使他們重新與上帝連結在一起，或是傳播解脫的福音，讓人們脫離苦海，我們就多賺一些上去天堂的頭等艙機票或諸如此類的功德，那是十分幸運的事。並非我們刻意要賺這些功德，這只是一種獎賞。","date":"清海無上師透過網際網路視訊會議以英文對舊金山同修開示20020825","url":"http://edenrules.com/index.php?route=product/product&product_id=883"},{"content":"言論自由不是你想說什麼就說什麼，而是你是否知道你在說什麼。思想自由不是你愛想什麼就想什麼，而是你是否知道你的思想是自由的、正確的。行動自由不是指為所欲為，而是你知道自己在做什麼。","date":"清海無上師（原文為英文）","url":"http://www.godsdirectcontact.org.tw/ch/news/98/d-0.htm"},{"content":"把這個世界變成天堂的方法，就是每個人都與他人分享，人人都更加快樂，到那時候，沒有人會想偷別人的東西，或是傷害別人，或是做其它的壞事，因為每個人都快樂。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/51/e-0.htm"},{"content":"開悟不是說要將情緒完全消滅掉，而是知道怎麼運用情緒。","date":"清海無上師（原文為英文）","url":"http://www.godsdirectcontact.org.tw/ch/news/51/e-0.htm"},{"content":"我們每次打坐，要先感謝上帝，為那些較不幸的人祈禱，然後以歡喜及奉獻的心感念上帝。","date":"清海無上師（原文為英文）","url":"http://www.godsdirectcontact.org.tw/ch/news/51/e-0.htm"},{"content":"我們打坐以後，就知道沒有什麼事是那麼重要；我們只覺得快樂、充滿喜悅。\n如果我們一直奉獻自己，專心敬愛上帝，我們要什麼就有什麼，什麼都不缺。　　\n我們可以自由地表現內在的體會和感受，並付諸行動，只要我們是與宇宙的脈動同步，而且心中時時有上帝，那麼什麼事都會很完滿。\n開悟不是說要將情緒完全消滅掉，而是知道怎麼運用情緒。\n我們每次打坐，要先感謝上帝，為那些較不幸的人祈禱，然後以歡喜及奉獻的心感念上帝。\n真正能讓我們自由的只有真理，如果我們不了解真理，我們就會一直憂慮。\n我們只有在想念上帝、藉著光和音直接接觸上帝的時候，我們才會知道所有的事，那時不必向任何人學習，也不必閱讀書籍，不必看報紙，而我們會深切永恆了解一切。\n最好的事物總是簡單而無條件。\n無條件地付出愛心，就是我們每個人所應遵循的生活之道，不論有沒有印心，不論信不信上帝。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/51/e-0.htm"},{"content":"你為世界做越多好事，自己就越得益; 你為他人帶來更多的快樂，自己就更快樂。","date":"清海無上師以英文開示 與無上師電視台工作人員視訊會議 20121222\n西湖道場1995.7.4","url":""},{"content":"上帝是遍佈一切的愛力，因此每當我們本著愛心做事時，上帝就會幫助我們。","date":"清海無上師（原文為英文）","url":"http://www.godsdirectcontact.org.tw/ch/news/81/"},{"content":"我們唯一能做的，就是做個好榜樣，使其他的人追隨我們的腳步，利益他們自己，然後變成更大的家庭，把地球變成天堂，這是唯一的一件事，也是我們此生或其它輩子所能做的最好的事。","date":"清海無上師以英文講於福爾摩沙\n西湖道場1995.7.4","url":"http://www.godsdirectcontact.org.tw/ch/news/81/"},{"content":"我們用肉體和靈性的力量來美化我們的人生，不管走到哪裡，不論是地獄、地球或天堂，我們全將它美化成天堂，那就是我們的工作，是我們應有的作風，我想那就是聖人的作風。","date":"清海無上師以英文講於福爾摩沙\n西湖道場1995.7.4","url":"http://www.godsdirectcontact.org.tw/ch/news/81/"},{"content":"雖然我們還是必須隨時檢討自己，確定自己不是在追求物質化的精神主義，如果我們修行是為了得到更大的力量，想去控制別人，或從宇宙或別人那裡獲取東西，永遠不知滿足的話，那與修神通或追尋物質的一切沒有兩樣。即使你修的是正道，還是必須經常檢查自己，確信我們不是為個人、為世俗的失與得、為名為利……等等這些東西修行。","date":"清海無上師以英文講於福爾摩沙西湖道場1995.7.11","url":"http://www.godsdirectcontact.org.tw/ch/news/81/"},{"content":"如果我們疼愛這個世界的業障，比疼愛上帝、疼愛我們的萬能智慧多的話，那當然世界還有機會拉我們下去。所以我們思想越擴大，就越有智慧、越有力量，對我們也越有利益。","date":"清海無上師以中文講於福爾摩沙台北 1988.10.18（MP3-CG02）","url":"http://www.godsdirectcontact.org.tw/ch/news/161/ms1.htm"},{"content":"我們祈求的時候，最好祈求師父力量或是上帝力量幫忙整個世界免除痛苦，當然我們的親人也包括在裡面，而且也包括我們自己在內，所以最好的祈求是這樣。","date":"清海無上師以中文講於福爾摩沙台北 1988.10.18（MP3-CG02）","url":"http://www.godsdirectcontact.org.tw/ch/news/161/ms1.htm"},{"content":"真正救我們的命是上帝，真正養我們長大的是上帝，真正疼愛我們的也是上帝，意思說那個最高的力量，也就是我們自己本來的智慧。","date":"清海無上師以中文講於福爾摩沙台北 1988.10.18（MP3-CG02）","url":"http://www.godsdirectcontact.org.tw/ch/news/161/ms1.htm"},{"content":"你必須把時間留給自己，往內靜思、回歸自己的本性，記起自己內在的本質，並發展它，讓自己像個藝術家般閒情逸致、滿懷愛心、沒有壓力，然後你才能給予。如果你不了解快樂，你就無法給予快樂；如果你沒有和平，你就無法給予和平。","date":"","url":"https://www.youtube.com/watch?v=SSBPPadXmUg"},{"content":"為了那一點點愛，我們上天下地探索，只為尋獲那一點點愛，將此愛與眾生分享，無論他們在世上哪個角落。","date":"","url":"https://www.youtube.com/watch?v=SSBPPadXmUg"},{"content":"如果你在師父跟前，注意力卻沒有放在師父身上，也得不到太多恩典；或許會得到一些，但是不多。","date":"清海無上師以英、法文講於法國巴黎 2006.10.22","url":"http://www.godsdirectcontact.org.tw/ch/news/179/ms_34.htm"},{"content":"我們必須每天自省，看看自己是否夠謙卑，這樣才能更進步。","date":"清海無上師以英、法文講於法國巴黎 2006.10.22","url":"http://www.godsdirectcontact.org.tw/ch/news/179/ms_34.htm"},{"content":"我們應該讓自己的生活、生命及認知層面，儘可能充滿深具靈性價值的美好事物，因為我們也可能裝滿各種無意義、不需要又有害的事物，而影響我們的靈性成長。","date":"清海無上師以英、法文講於法國巴黎 2006.10.22","url":"http://www.godsdirectcontact.org.tw/ch/news/179/ms_34.htm"},{"content":"放下所有爭執，誰好，誰壞，不要管，一定要專心修行，拯救自己跟別人。如果一直煩惱別人個性的瑣碎細節，就會沒完沒了。","date":"清海無上師以英文講於歐洲20081214","url":"https://youtu.be/np2cXEytJcA?t=1163"},{"content":"如果現在不修行，以後上去會後悔，看到以前跟你一起打坐的同修，都很快跑上第五界，比方說這樣，而你還坐在這裡，在第二、三界慢慢爬，你會很難過。","date":"清海無上師以英文講於歐洲20081214","url":"https://youtu.be/np2cXEytJcA?t=1286"},{"content":"我們所持的每一個戒律，都要在身、心、靈各方面保持完全乾淨、單純。當然，以前的習慣難免會再冒出來，但是我們可以加以控制，不要按照它的意思去做，不給自己找藉口。","date":"～ 清海無上師以英文講於福爾摩沙西湖道場 1995.10.31（影帶編號＃509）","url":""},{"content":"☆ 當我們微笑時，我們整個生命都跟著一起微笑，而我們的意識層次也會自動提高。所以要多笑，高興的時候要笑，懊惱的時候也要笑；要哭時就哭，不過哭時還是要笑，讓眼淚流淌，你在心裡笑，多多的笑，能笑就笑。","date":"～ 清海無上師以英文講於福爾摩沙西湖道場 1995.10.31（影帶編號＃509）","url":""},{"content":"我們解脫自己那些執著的概念、黑暗的思想和綁住的感情，這樣就叫現世解脫。","date":"清海無上師以中文講於香港1993.10.01(影帶編號381)","url":"甘露法語1-P125"},{"content":"在這個宇宙上，有很多的等級我們要成就，有很多地位我們要獲得。所以修行還少時，沒有什麼可炫耀的。","date":"清海無上師（原文為中文）","url":"http://www.godsdirectcontact.org.tw/ch/news/95/d-0.htm"},{"content":"有時候，如果我們生活覺得不順的話，應該知道我們過去有結逆緣，所以要奮鬥。如果有順緣的話，也應該知道自己過去有做好的事情，所以要珍惜。然後我們要繼續奮鬥到我們心情完全安穩，完全不在意任何事情，不執著在什麼地方，不管世界的任何方面都不會綁住我們時，那時才真正好。","date":"清海無上師（原文為中文）","url":"http://www.godsdirectcontact.org.tw/ch/news/95/d-0.htm"},{"content":"驕傲是我們最麻煩的業障、最大的障礙。","date":"清海無上師（原文為中文）","url":"http://www.godsdirectcontact.org.tw/ch/news/95/d-0.htm"},{"content":"打禪、共修、研究明師的教理，是為了要徹底了解、真正消化，把它變成我們的智慧，並且親自去實行，這樣我們才能充分瞭解它的意義及對我們生活的利益。","date":"清海無上師（原文為英文）","url":"http://www.godsdirectcontact.org.tw/ch/news/95/d-0.htm"},{"content":"不管什麼時候、什麼情況，我們都有師父的力量在內邊，就是我們不用而已。我們向情況屈服、向困難低頭，所以才有麻煩。千萬不要這樣，事情一定有變通的方法，要有耐心。","date":"清海無上師（原文為英文）","url":"http://www.godsdirectcontact.org.tw/ch/news/95/d-0.htm"},{"content":"在這個世界上，如果每個人都把過多的東西，分給其他人，世界一定很和平、很快樂，不會有戰爭、偷盜的事情。","date":"清海無上師（原文為英文）","url":"http://www.godsdirectcontact.org.tw/ch/news/95/d-0.htm"},{"content":"如果我們認為自己很偉大，我們就不偉大了。","date":"清海無上師以英文講於澳洲布里斯本 1993.3.19","url":"http://www.godsdirectcontact.org.tw/ch/news/110/c-ap.htm"},{"content":"要消滅我執，應該與上帝同在；一旦與上帝同在，就沒有我了，就這麼簡單。","date":"清海無上師以英文講於美國加州 1989.5.27","url":"http://www.godsdirectcontact.org.tw/ch/news/110/c-ap.htm"},{"content":"我們處在思想控制一切的世界中，這些先入為主的概念、偏見及所搜集的資料，控制了一切，使我們忘記了本性，使我們忘記了我們並不是那個先入為主的概念。我們不應忘記我們的判斷力，我們必須找出自己本有的智慧。","date":"清海無上師以英文講於美國加州 1989.5.27","url":"http://www.godsdirectcontact.org.tw/ch/news/110/c-ap.htm"},{"content":"安靜不是說什麼也沒有，而是讓那些不必要的心理負擔、偏見、慾望、無意義的想法以及貪求不可得的心平靜下來。平靜是為了能夠服務別人、為了能夠讓真正的智慧顯現出來。","date":"清海無上師以英文講於馬來西亞吉隆坡 1992.2.23","url":"甘露法語"},{"content":"有時候遇到一點麻煩，或一些煩惱，但在那之後，我們會去更高境界，所以別把靈性點數拿去交換些許世上的舒適。你在地球上的生命，你的每次呼吸、每一天、每一年都十分珍貴，要善加利用，等你提升上去便能笑說：「在靈修上我已盡了全力，我能夠到達這裏，全是我努力來的。","date":"","url":""},{"content":"我們有人身時，需要多與天堂聯繫，這樣靈魂才會快樂，才能提昇。當靈魂提昇了，也能夠從高境界汲取靈性養分， 不只是透過肉身，也透過靈魂本身與天堂的連結。","date":"清海無上師以英文講於歐洲國際聚會黃金10年（2013年）7月6日Video-1017","url":"http://edenrules.com/index.php?route=product/product&product_id=1101"},{"content":"我能告訴你的就是要試著儘量無私，要試著儘量去愛。雖然你也許還無法感受到內邊的真愛，只要你常常實踐，就會喚醒真愛，它會漸漸長大，爾後成為你的第二天性，你就是去做，而不假思索，甚至不會覺得：「好，我很有愛心，我很善良、很慈悲。」不，不，你會像吃飯、呼吸一樣自然地去做。","date":"清海無上師與無上師電視台工作人員視訊會議，美國加州洛杉磯\n黃金11年（2014年）5月29日（原文為英文）（DVD ＆ MP4-1049（1,2））","url":""},{"content":"最好的加持，是發展自己的道德、心智，自己加持自己。那樣自己內邊的智慧也會開，了解上帝就在我們內邊，每天與上帝溝通，不用開口就可以得到滿滿加持，多到用不完，還可以分給別人。","date":"清海無上師以英文講於馬來西亞 1992.02.25（影帶編號#219）","url":"http://www.godsdirectcontact.org.tw/ch/news/155/qa2.htm"},{"content":"我們必須再回歸上帝，與祂聯繫，聆聽祂的訊息，這樣我們的生活才能遠離煩惱，永遠平順、快樂，充滿喜悅和智慧。","date":"清海無上師以英文講於希臘雅典 1999.05.20（影帶編號＃653）","url":"http://www.godsdirectcontact.org.tw/ch/news/155/qa4.htm"},{"content":"當我們有能力幫助別人，當上帝賜給我們的超過我們所需要時，我們應該出去和別人分享，因為這正是上帝給我們這麼多的用意。","date":"清海無上師以英文接受南非開普敦SABC電視台訪問 \n1999.12.01 （影帶編號#676）","url":"http://www.godsdirectcontact.org.tw/ch/news/155/qa3.htm"},{"content":"印心的時候為什麼你們看到光？為什麼以後繼續看到光，繼續感到舒服、感覺到有得救，因為師父把那些低等的影響洗掉了，把那些生生世世我們所受到的、錄在裡面的那個低等影響洗掉，然後把我們跟那個最高等的力量連線，從那天我們就不受低等的影響，只有上面的影響而已。","date":"清海無上師以中文講於福爾摩沙山地門禪七 1990.4.1","url":"http://www.godsdirectcontact.org.tw/ch/news/73/f-1.htm#TOC3"},{"content":"我們做事、奉獻，只為了那時候需要，需要我們就做，做完就算了，沒有任何的目的。","date":"清海無上師以中文講於福爾摩沙西湖道場19920412","url":"http://www.godsdirectcontact.org.tw/ch/news/63/b-1.htm#SEC2"},{"content":"我們想要整理自己以後，自然就會幫助別人，那個時候不用想熱心幫助，也會自自然然地幫助別人。","date":"清海無上師以中文講於福爾摩沙西湖道場19920412","url":"http://www.godsdirectcontact.org.tw/ch/news/63/b-1.htm#SEC2"},{"content":"我 們修行的人最好要小心謹慎、多判斷清楚，如果真的不瞭解，最好不要想那麼多，有可能過了幾天以後會瞭解。","date":"清海無上師（原文為中文）","url":"http://www.godsdirectcontact.org.tw/ch/news/102/f-0.htm"},{"content":"「不 怕」的意思是指我不怕我那個怕的程度，我不怕我怕的心，我不怕我那沒勇氣的地方，仍然還是去做。","date":"清海無上師（原文為中文）","url":"http://www.godsdirectcontact.org.tw/ch/news/102/f-0.htm"},{"content":"打坐的時候，如果把我們所有的注意力能夠集中在一個點，而後把任何問題放在它前面，都能馬上得到解決。","date":"清海無上師（原文為中文）","url":"http://www.godsdirectcontact.org.tw/ch/news/102/f-0.htm"},{"content":"必 須在任何情況下，都對自己真實。","date":"(Originally in Chinese)","url":"http://godsdirectcontact.us/sm21/cnews/www/102/"},{"content":"越 高等的修行越簡單。","date":"清海無上師（原文為中文）","url":"http://www.godsdirectcontact.org.tw/ch/news/102/f-0.htm"},{"content":"為 什麼一位明師什麼都會做呢？因為祂隨時都專心，做任何事情，身、口、意都會放在那裡，又同時能千百億化身。","date":"清海無上師（原文為中文）","url":"http://www.godsdirectcontact.org.tw/ch/news/102/f-0.htm"},{"content":"任何人愛別人比愛自己多，那個人一定是聖人、是菩薩，不管修什麼，一定得到很高的果位。愛別人比愛自己多，那個是最大的祕訣。不管是愛別人或是愛動物，可以替別人犧牲，那個就是菩薩的果位就對了。如果我們太不顧別人，顧自己而已，這樣坐不動好幾百年也沒用。","date":"清海無上師以中文講於法國國際聚會20081217(DVD962)","url":"http://edenrules.com/index.php?route=product/product&path=59&product_id=261"},{"content":"最好的懺悔就是把否定的品質停下來，還做相反的，做出肯定的貢獻，這樣比較好，成佛的祕密就在這裡，心比較簡單一點。","date":"清海無上師以中文對長住講於福爾摩沙西湖道場1995.12.3","url":"http://www.godsdirectcontact.org.tw/ch/news/54/c-1.htm"},{"content":"修行越多，應該越能了解人，越應該寬容人，越應該接受別人的意見，接受別人了解的等級，尊重別人思想自由的權力，因為這個宇宙很自在嘛！","date":"清海無上師 (原文為中文)","url":"http://www.godsdirectcontact.org.tw/ch/news/68/g-0.htm"},{"content":"我們應該跟造化一樣寬容。造化可以包容宇宙萬物，我們也應該包容宇宙萬物，才能夠變成無上正等正覺，才能夠變成最高的境界、最高的等級。","date":"清海無上師 (原文為中文)","url":"http://www.godsdirectcontact.org.tw/ch/news/68/g-0.htm"},{"content":"我們心快樂，任何情況都會覺得快樂。","date":"清海無上師 (原文為中文)","url":"http://www.godsdirectcontact.org.tw/ch/news/68/g-0.htm"},{"content":"我們打坐時要儘量忘掉缺點及業障，將注意力集中在純淨的真我，集中在高層次上。","date":"清海無上師 (原文為英文)","url":"http://www.godsdirectcontact.org.tw/ch/news/93/j-0.htm"},{"content":"心裡面要求真理超過要求別的多得多，這樣才說是專心。","date":"清海無上師 (原文為中文)","url":"http://www.godsdirectcontact.org.tw/ch/news/93/j-0.htm"},{"content":"每天我們過一個生活像過最後一天一樣，把事情全部弄好，能夠今天做的不要說我明天做，要馬上做。","date":"清海無上師 (原文為中文)","url":"http://www.godsdirectcontact.org.tw/ch/news/93/j-0.htm"},{"content":"這五戒，不殺生、不偷盜、不妄語、不邪淫、不碰菸酒毒品，只是在保護你而已，保護你的道德、健康以及社會的和平，離聖人還很遠呢，成為聖人有更多的要求。身為人，我們不只要守戒律，不只要遵循愛心的飲食，還要幫助別人。","date":"清海無上師以英文講於歐洲20090921 (DVD876創造人間天堂)","url":"https://www.youtube.com/watch?v=XLkM3LPY2QA&feature=youtu.be&t=5676"},{"content":"有時候在比較困難的情況，人的信心和道心更堅強。","date":"清海無上師 (原文為中文)","url":"http://www.godsdirectcontact.org.tw/ch/news/66/e-0.htm"},{"content":"我們修行因為要改變當地的氣氛，讓它愈來愈有肯定的力量，來控制否定的力量，否定力量本來就有了，如果我們一直順著它的話，那就完了，連我們也被控制住。","date":"清海無上師 (原文為中文)","url":"http://www.godsdirectcontact.org.tw/ch/news/66/e-0.htm"},{"content":"我們心裡面單純肯定，看事情也會肯定、舒服、漂亮。","date":"清海無上師 (原文為中文)","url":"http://www.godsdirectcontact.org.tw/ch/news/66/e-0.htm"},{"content":"修行人追求的不是外表，而是內心的寧靜，唯有超脫在外境之上，放下一切，才能獲得真正的自在。","date":"清海無上師 (原文為中文)","url":"http://www.godsdirectcontact.org.tw/ch/news/66/e-0.htm"},{"content":"好或不好都是不同的看法而已，所以我們不要太在乎外在的美醜，佛心的完美才是最重要的。","date":"清海無上師 (原文為中文)","url":"http://www.godsdirectcontact.org.tw/ch/news/66/e-0.htm"},{"content":"歡喜心本身就是一種修行的果位。","date":"清海無上師 (原文為中文)","url":"http://www.godsdirectcontact.org.tw/ch/news/66/e-0.htm"},{"content":"一點點福報都不要，才有功德，它自然會生「德」出來，那樣才好，我們應該無條件貢獻、無我布施。","date":"清海無上師 (原文為中文)","url":"http://www.godsdirectcontact.org.tw/ch/news/66/e-0.htm"},{"content":"如果我們不儘量用最好的方法去幫別人的忙，以後我們會後悔，會怪自己責任沒盡好；人家怪我們還沒關係，我們怪自己才難受。","date":"清海無上師 (原文為中文)","url":"http://www.godsdirectcontact.org.tw/ch/news/66/e-0.htm"},{"content":"如果還怕什麼，還需要去消滅什麼人，去競爭、抵抗什麼人，表示說我們還怕那個人，還不夠自信，不夠相信佛菩薩的力量，不夠相信這個道，還不夠相信上帝。","date":"清海無上師 (原文為中文)","url":"http://www.godsdirectcontact.org.tw/ch/news/66/e-0.htm"},{"content":"我們本人就代表著愛力、代表著上帝。每次當我們忘記時，就要想辦法再記起來，如此我們才會變得偉大、才能了悟上帝。","date":"清海無上師以英文講於美國洛杉磯國際禪三19981218(DVD642)","url":""},{"content":"上帝就是偉大的愛力，我們發揮的愛力越多，\n就越接近上帝的品質，這就是了悟上帝的真義。","date":"清海無上師以英文講於美國洛杉磯 1998.12.18","url":"http://www.godsdirectcontact.org.tw/ch/news/122/ap.htm"},{"content":"我們本人就代表著上帝的愛力、代表著上帝。\n每次當我們忘記時，就要想辦法再記起來，\n如此我們才會變得偉大、才能了悟上帝。","date":"清海無上師以英文講於美國洛杉磯 1998.12.18","url":"http://www.godsdirectcontact.org.tw/ch/news/122/ap.htm"},{"content":"要保持單純心，期待了悟自我的那一刻來臨，那時我們將知道我們就是上帝，是自由，是最美麗、最有力量的眾生。","date":"清海無上師以英文講於美國洛杉磯 1998.12.18","url":"http://www.godsdirectcontact.org.tw/ch/news/124/mt.htm"},{"content":"不要擔心肉體會遭遇到什麼事，而應該擔心是否能更快、更深一層地開悟。","date":"清海無上師以英文講於美國洛杉磯 1998.12.18","url":"http://www.godsdirectcontact.org.tw/ch/news/124/mt.htm"},{"content":"我要你們寫修行日記，每天反省自己，不是檢討別人。我們從不知道我們進步多少，從不知道自己有多純潔了，所以我們根本不能批判任何人。","date":"清海無上師以英文講於歐洲20081221","url":"https://www.youtube.com/watch?v=WcsxgSy_I3k"},{"content":"我們應該打坐，向上帝祈禱，以了悟真我，再度跟耶穌同一體，與基督合而為一，這才是最美好的聖誕節、最佳的慶祝方式。","date":"清海無上師以英文講於美國華府 1997.12.24","url":"http://www.godsdirectcontact.org.tw/ch/news/118/ms2.htm"},{"content":"業 障是什麼意思呢？障礙嘛！讓我們難過，讓我們做事不對勁，讓我們不舒服，那就叫業障。","date":"清海無上師以中文講於福爾摩沙西湖共修會 1991.12.26","url":"http://www.godsdirectcontact.org.tw/ch/news/58/h-0.htm"},{"content":"我們跟一位老師學習，是為了自己要進步，要當自己的老師，要變成跟他差不多，或是最少可以當自己的老師，不是依賴他。","date":"清海無上師以中文講於福爾摩沙台南共修會 1993.2.21","url":"http://www.godsdirectcontact.org.tw/ch/news/58/h-0.htm"},{"content":"真正的學會是消化得好，能夠應用出來，才說有學，不是背東西，不是模仿師父的行為、外表就好了。","date":"清海無上師以中文講於福爾摩沙台南共修會 1993.2.21","url":"http://www.godsdirectcontact.org.tw/ch/news/58/h-0.htm"},{"content":"當我們愛我們的小孩、愛我們的鄰居、愛我們的同胞，那個時候我們就是代表上帝的品質，我們發揮祂給我們的內在的愛力，將它表達出來。","date":"清海無上師以中文講於福爾摩沙台北 1989.2.28","url":"http://www.godsdirectcontact.org.tw/ch/news/129/ms.htm"},{"content":"我們發揮越多這個愛心，我們跟佛祖、上帝、造化、道就越接近，因為道、上帝、佛祖就是愛力。","date":"清海無上師以中文講於福爾摩沙台北 1989.2.28","url":"http://www.godsdirectcontact.org.tw/ch/news/129/ms.htm"},{"content":"你們要保存自己的信心，要有肯定的想法，任何情況都會好轉。","date":"清海無上師以中文講於印尼泗水共修會 1993.3.2","url":"http://www.godsdirectcontact.org.tw/ch/news/66/p-1.htm"},{"content":"我們在內邊要充滿樂觀，充滿肯定的愛力，然後我們才能夠勝過否定的力量。","date":"清海無上師以中文講於印尼泗水共修會 1993.3.2","url":"http://www.godsdirectcontact.org.tw/ch/news/66/p-1.htm"},{"content":"我們自己要修行好，然後智慧會開展，然後我們會了解很明白，在哪一個情況應該做什麼，不管結果是成功或失敗，我們心很安穩，那個時候我們就得道了！","date":"清海無上師以中文講於印尼泗水共修會 1993.3.2","url":"http://www.godsdirectcontact.org.tw/ch/news/66/p-1.htm"},{"content":"我們生生世世看別人做事，我們也要試看看，試看看以後又碰到別的東西，又想試看看，一天到晚去收集新的材料、新的經驗，忘記那個本人；如果死的時候還沒有通通滿足我們所好奇、要試驗的東西的話，我們還要再回來，所以叫輪迴。","date":"清海無上師","url":"http://www.godsdirectcontact.org.tw/ch/news/12/o-1.htm"},{"content":"越打坐，越跟內在溝通，多看光、多聽聲音，\n我們越開朗、越有充沛的能力及大量的精神，可以服務別人。","date":"清海無上師","url":"http://www.godsdirectcontact.org.tw/ch/news/88/i-0.htm"},{"content":"★我們裡面修行，為了要求真善美，當我們裡面有真善美，我們外表也會表達那些真善美的境界出來，所以我們才儘量照顧我們的四周、照顧我們自己的身體，衣服要整齊、要相當莊嚴、要相當美。不是我們留戀那些，還有不是因為我們說我們不留戀它、不執著它，然後我們就隨便弄髒，隨便弄邋遢。\n　★因為我們在這個世界時間很短，所以我們在一起儘量修改自己，然後修改這個世界。我們修改自己就是修改世界，如果每一個人都自己修改自己，當然世界自然會修改。\n　★工作是要細心，不要讓別的思想或是別的東西干擾。做事要誠懇，為了要把那個工作做好，為了讓人看了高興，不是為了自己，這樣就不會弄錯，做事也會很快，又很完美，秘法就是在這裡。\n　★我們做事應該要檢討自己，是不是真正的無條件貢獻？不然的話，請佛菩薩檢查我們、印證我們自己的內心才行，幫助我們保持自己清廉的精神和單純的心。","date":"清海無上師以中文講於福爾摩沙西湖 1992.04.03","url":"http://www.godsdirectcontact.org.tw/ch/news/88/u-0.htm"},{"content":"★閉關很重要，我們同修為什麼那麼快進步呢？\n就是因為我們常常有閉 關的時間，\n讓你們彌補每天做不了的時刻表。\n★做事不管對不對，\n如果我們做不對的時間或不對的場合也沒用。\n★「死」並不可怕，\n就怕我們死的時候，還沒學會我們的功課。\n★修行的法律就是這樣──\n我們越利益眾生，我們越利益自己。\n★沒有勇氣和怕的精神，\n讓我們墮落生死輪迴好久了。\n★如果我們對自己那個怕的習慣沒有克服的話，\n我們還是要回來學習。\n★這個「怕」，對我們是最可怕的事情，\n我們應該怕我們那個「怕」的精神，\n都是你們自己因為怕，才變成「怕」。\n★我們做事奉獻應該只為了那個時候需要，\n需要我們就做，\n做完就算了，沒有任何目的。\n★身口意淨化，我們身體會清靜，\n我們精神會快樂，\n不論別人做什麼，對我們沒有影響，\n我們感覺到很快樂，\n我們會得到忍辱波羅密。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/88/i-0.htm"},{"content":"開悟的人做事沒有我執、很自然，所以我們靠近他才很舒服、沒有壓力。","date":"～清海無上師","url":""},{"content":"當注意力集中在智慧眼時，各方面都會強化，它是所有脈輪的中心，是我們存在的總部，所以一旦集中在這兒，我們就自由了。","date":"清海無上師以英文講於南非開普敦國際禪三19991202","url":"http://magazine.godsdirectcontact.net/chinese_t/133/qa1.htm"},{"content":"記得的時候，隨時都要把注意力放在智慧眼上，重複念五佛號，這樣可以把我們的氣拉到智慧眼，然後音流就可以從智慧眼的地方提昇靈魂，把我們拉上去。","date":"清海無上師以英文講於哥斯大黎加 1990.12.26","url":"http://www.godsdirectcontact.org.tw/ch/news/92/a-1.htm"},{"content":"★做事要婉轉，因此我們才需要智慧和愛心，\n  不是規則和法律而已，愛心的律法超越一切，\n  所以我只要求你們用愛、單純心和智慧做事。\n（清海無上師講於美國科羅拉多州1993.4.11 原文為英文）\n★謙卑並非來自謙卑的頭銜而是發自內心，\n  只有領悟到我們都是上帝的子女，\n  我們和上帝同一體時，才是真正謙卑的開始。\n★印心是提醒你們有最偉大的財產，\n  你們可以每天使用，\n  而不用依賴任何在世或過去明師，\n  這就是我們這個修行法門的唯一目的，沒有別的。\n（清海無上師講於澳洲布里斯本1993.3.20 原文為英文）","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/109/f-0.htm"},{"content":"我們臨終時的念頭非常重要，如果你全想著痛苦，就會到地獄去，如果你所想的全是師父，和師父在一起時的快樂和喜悅，你就會馬上去涅槃，秘訣在於此。","date":"清海無上師以中文講於福爾摩沙屏東三地門 1992.12.26","url":"http://www.godsdirectcontact.org.tw/ch/news/57/d-0.htm"},{"content":"有時候不工作反而會生病，因為裡面累積了能量沒辦法釋放出來。所以你們不用擔心工作辛苦，你們應該工作以消耗能量。","date":"清海無上師以英文講於新加坡共修會 1994.9.29","url":"http://www.godsdirectcontact.org.tw/ch/news/57/d-0.htm"},{"content":"上帝永遠會原諒我們的。如果祂不會寬恕，祂就不是上帝了。對祂而言，沒好沒壞，也沒有惡，什麼都沒有，只是小孩在學習，在犯錯，從錯誤中學習，透過不同的實驗，試著使自己重新成為真正的上帝。","date":"清海無上師以英文講於美國加州長堤國際禪五 1996.12.28","url":"http://www.godsdirectcontact.org.tw/ch/news/77/e-1.htm"},{"content":"我希望在新的一年，我們所有人都能努力發願做到最好，並效法聖人的典範，報答他們的善心，拯救自己的生命和地球上所有眾生的生命。事實上，這是我們應盡的義務。","date":"清海無上師以英文講於與美國加州洛杉磯「無上師電視台」工作人員暨全球觀眾的全球轉播視訊會議 2011.12.31 （DVD#993）","url":"http://www.godsdirectcontact.org.tw/ch/news/209/ms_26.htm"},{"content":"隨時保持警覺心，做事要獨立、合邏輯、合自己的良心。","date":"清海無上師以中文講於香港19921231(影帶編號304)","url":""},{"content":"我告訴你們的一切，是古老明訓的濃縮精華，使一個修行人逃離一切物質的陷阱，及提昇並超越頭腦的控制力量，才能了悟到有一樣東西，比他的身體這部機器，比他的這部電腦更偉大，就是這樣而已。","date":"清海無上師以英文講於美國德州19931112","url":"http://www.godsdirectcontact.org.tw/ch/news/75/r-1.htm"},{"content":"上帝可以成就一切，但我們必須有足夠的單純心來接受它，以信心的力量來讓它實現。如果我們否認上帝的恩典，這一切也可能被我們阻擋。一切事物早就在了，上帝已經創造了每樣事物，但如果我們不曉得從何處拿，如果我們盲目，如果我們沒有足夠信心的話，它就不會實現。","date":"清海無上師以英文講於美國長堤國際禪 1996.12.28","url":"http://www.godsdirectcontact.org.tw/ch/news/79/o-0.htm"},{"content":"清海無上師以中文講於福爾摩沙西湖 1991.08.18\n我們修行的人，越往內邊越好，內邊是我們善良的品質，是我們至高的智慧，是我們最大的能力；如果我們往外面，我們那個能力、那個定力的智慧會分散。\n清海無上師以中文講於福爾摩沙西湖 1992.01.12（影帶編號＃204）\n不要失去自己的本心、自己個人的風度，為了任何人都不要。這樣我們才原本、才原始、才自然、才會有那種吸引力、才有可愛的地方、才有美的地方，我們模仿誰都不好。\n清海無上師以中文講於福爾摩沙西湖 1991.06.13\n平常我們即使知道過去的錯誤，也沒辦法有力量懺悔。如果我們能夠真正的懺悔，我們業障會消除；不過要懺悔的話，真的應該有修行才能夠懺悔，所以還是要打坐。\n清海無上師以中文講於福爾摩沙西湖 1991.06.28\n修行的人可以逃過那些所謂的因果和業障的氣氛，讓我們輕鬆。所以我們越修行，我們生活越快樂、越順，就是因為我們逃過了這個業障的過程， 它不能抓我們了，因為我們比它高。\n清海無上師以英文講於新加坡 1993.03.8（影帶編號＃327）\n如果我們很聰明，也許能夠躋身進入社會的上層名流，或者在國家、人群中擁有很高的地位；但是，如果我們有智慧的話，即使身處塵世，也可以同時悠遊天國聖境。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/136/ap.htm"},{"content":"我們來這個世界，是為了學習完美，所以什麼品質都需要擁有，而且要知道如何中庸的運用。","date":"清海無上師（原文為中文）","url":"http://www.godsdirectcontact.org.tw/ch/news/73/j-0.htm"},{"content":"天堂就是寧靜、無欲、一切自然滿足的境界，也就是所謂的涅槃。","date":"清海無上師以英文講於新加坡19920303","url":"甘露法語2-P88"},{"content":"修行觀音法門之後，我們只有一種語言，好像大家就變成很簡單溝通這樣子，有同一個理想，同樣那種伺候、侍奉的精神。","date":"清海無上師以中文講於印尼泗水 19920228","url":"甘露法語2-P16"},{"content":"＊ 我們想要整理自己以後，自然就會幫助別人。\n＊ 不管你想要做什麼，只要它是正確的就去做，清楚明白的去做，真實面對自己和自己的感受。 \n＊ 我們改變現在就是改變未來。\n＊ 做事應該從愛心出來才自然。","date":"","url":""},{"content":"這 世界是一棟大房子，裡面有許多房間，因為我們平常生活太忙了，沒有太多機會見面。如果每個人都了解我們都是兄弟姐妹，世界就不會再有分別和戰爭。","date":"清海無上師以英文講於韓國釜山 1993.5.15","url":"http://www.godsdirectcontact.org.tw/ch/news/102/r-1.htm"},{"content":"吃 肉是世界上所有戰爭及痛苦的根源，也是你自己痛苦的根源。不吃肉對地球的和平有幫助，因為我們停止造殺生的「因」，所以不會得到被殺或被傷害的果報。","date":"清海無上師以英文講於加拿大蒙特利爾 1993.4.17","url":"http://www.godsdirectcontact.org.tw/ch/news/102/r-1.htm"},{"content":"戰 爭的起因也是源於無明，人一旦無明就不知道如何停止憎恨、如何停止侵略心和佔有慾，因此一個人的地位越高，所可能帶給人類的危險就越大，所以我們最好先開悟才能以更高的智慧來侍奉整個世界。","date":"清海無上師以英文講於哥斯大黎加 1990.12.16","url":"http://www.godsdirectcontact.org.tw/ch/news/102/r-1.htm"},{"content":"擁有較多的人，就分一些給少的人，這樣大家都快樂、滿足，給的人也很高興，你們試看看。給東西很過癮，我們令人快樂，自己也覺得很舒服，好像有負好責任這樣子。","date":"清海無上師以英文講於泰國佛城 1994.01.02（影帶編號#401）","url":"http://www.godsdirectcontact.org.tw/ch/news/152/ap1.htm"},{"content":"如果想要幫助自己，那就幫助別人，幫助其他兄弟姊妹，幫忙傳播靈性的訊息，那就是幫助自己最好的方法。","date":"清海無上師以英文講於英國舍瑞 2006.01.02","url":"http://magazine.godsdirectcontact.net/chinese_t/169/qa1.htm"},{"content":"有時候我們做好事，會覺得心情很好，感覺到自己做對的事情。因為那時候我們很接近上帝和佛菩薩 的品質，內邊的愛心有發揮出來，所以我們感到快樂。天堂是在那裡，不是等死掉的時候才長兩個翅膀，然後亂飛！（大眾笑）","date":"清海無上師以中文講於福爾摩沙西湖 1991.10.26","url":"http://www.godsdirectcontact.org.tw/ch/news/142/ap.htm"},{"content":"★謙卑並非來自謙卑的頭銜而是發自內心，\n  只有領悟到我們都是上帝的子女，\n  我們和上帝同一體時，才是真正謙卑的開始。\n★印心是提醒你們有最偉大的財產，\n  你們可以每天使用，\n  而不用依賴任何在世或過去明師，\n  這就是我們這個修行法門的唯一目的，沒有別的。","date":"清海無上師講於澳洲布里斯本1993.3.20 原文為英文","url":"甘露法語109"},{"content":"不是光用想的事情就會發生，還必須有強大的後援力量才行。那個力量從哪裡來？從最高的萬能力量來，我們可以透過打坐得到祂，讓自己的力量滿滿。","date":"清海無上師以英文講於美國加州聖荷西1996.03.20（影帶編號#539）","url":"http://www.godsdirectcontact.org.tw/ch/news/158/mt1.htm"},{"content":"我們也必須時時保持思想肯定，並運用打坐的力量，使這些肯定的想法成真。","date":"清海無上師以英文講於美國加州聖荷西1996.03.20（影帶編號#539）","url":"http://www.godsdirectcontact.org.tw/ch/news/158/mt1.htm"},{"content":"我們不知道什麼對我們是最好的，所以最好就是盡力而為並接受任何情況。任何時候都要竭盡所能，這樣你才可以心靈寧靜，而且你也才能知道你的力量和智慧經得起試煉。","date":"清海無上師以英文講於印尼泗水1997.3.19","url":"http://www.godsdirectcontact.org.tw/ch/news/128/ap.htm"},{"content":"真我永遠不變，不論是在什麼情況下，不管祂穿什麼衣服，真我永遠是集中的。如果我們信靠真我，那麼我們就會更平穩、更滿足。當人生的波濤把我們沖來沖去時，我們不會晃得太厲害。","date":"清海無上師以英文講於印尼泗水1997.3.19","url":"http://www.godsdirectcontact.org.tw/ch/news/83/f-1.htm"},{"content":"我們唯有學耐心，等時間到了，情況自己會換改。即使最輝煌的時代，時間到時也會衰亡。而最難受的時候也會有轉機，所以我們要往內邊找自己快樂的本心就對了。","date":"摘錄自福爾摩沙宜蘭監獄講經19890321","url":"http://magazine.godsdirectcontact.net/chinese_t/41/q-1.htm"},{"content":"我認為世界各國的總統或領導人，都應該多努力提醒人們有關修行的方面，而不只是物質的方面，因為修行的方面比較持久，而且提醒人們修行事實上是一件很美的事，因為靈修是我們所有的一切，也是我們唯一永恆的東西。只有透過修行，才能讓世界和平、讓國與國之間和平。如果所有的國家都能更開悟的話，我們彼此之間也會更和平。","date":"清海無上師以英文講於美國佛州小中心 2001.06.06（影帶編號#714）","url":"http://www.godsdirectcontact.org.tw/ch/news/142/ap.htm"},{"content":"我們應養成一種習慣，讓我們每天都想到好的事情；有戒律、有規矩，然後我們打坐的時候自然會想佛，跟祂們溝通。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/56/"},{"content":"神通是我們每到一個地方，把那邊髒的氣氛弄乾淨，這樣子是神通。神通是用我們的手，把沒有用的東西變成花瓶，或是開墾一塊空地成富足的田，改變一塊乾燥的枯地成栽種果樹的園地，這樣子是我們的神通。\n　\n我們的意是天意，所以我們每一個人的念頭很重要，看我們要什麼，全宇宙都會配合。\n...........\n如果有人很自卑、沮喪，來求我們幫忙，\n我們應該幫助他，讓他變成很有精神、有理想、有自信的人，不會再對自己灰心、不用跳樓，這樣子是我們的神通，這個是「無畏布施」，跟觀世音菩薩一樣。\n...................\n　\n..................\n　\n打坐也是工作，那個時候是我們在準備精神，準備糧食、功力，可以明天再出去奮鬥。\n...................\n　\n修行要婉轉才是開悟的人，情況怎麼樣，我們就隨順怎麼樣，這樣才不會得「禪病」！\n...................\n　\n要做什麼就做到成功，全心全意放在那裡才不會浪費時間。\n...................\n　\n修行要進步快，應該忘記自己，做一個最低的人，拿最髒、人家最不喜歡的工作做。\n...................\n　\n被人罵是被人讚歎！\n...................\n　\n要成佛前應該先成人，成一個好的人以後成佛。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/56/"},{"content":"要學習有體諒心，這不是為了他人，而是為了自己，把自己提昇到敏感度更高的意識裡。","date":"～清海無上師以英文講於美國紐澤西道場 1992.06.18（影帶編號#256）","url":"http://www.godsdirectcontact.org.tw/ch/news/170/ap1.htm"},{"content":"時時要保持我們身口意乾淨，這樣會避免當來很多的麻煩和痛苦，因為過去的因果已經滿了，現在不要再吸不好的因緣來，讓我們更受苦。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/56/"},{"content":"如果有人很自卑、沮喪，來求我們幫忙，我們應該幫助他，讓他變成很有精神、有理想、有自信的人，不會再對自己灰心、不用跳樓，這樣子是我們的神通，這個是「無畏布施」，跟觀世音菩薩一樣。","date":"清海無上師","url":"http://magazine.godsdirectcontact.net/chinese_t/56/"},{"content":"☆自古以來，任何的大修行人，或是大君王、大丈夫，都是從耐心訓練出來的，他們不是一朝就功成名就。所以我們有困難的時候，要感激造化、佛祖給我們機會訓練自己的耐心。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/41/m-1.htm"},{"content":"☆我們在哪一種情況中，都要找好的地方、看樂觀的一面，不要挖毛蟲。我們轉換不好的情況，變它成為對我們有利益的方面。\n☆即使我們住在不自由的地方，不過我們心很快樂、很滿足，獲得自己內在快樂的泉源，那我們就是自在的人。\n☆我們做什麼事只要出自內心，知道自己的本質和立場就行了，不應該模仿別人。\n☆當我們把關愛、仁慈、寬容和體諒擴及於別人時，我們就創造了天堂。(原文為英文)\n☆沒什麼事情是真正難的，就看我們要不要改變自己，想不想坦白認識我們哪一個品質是真的好；哪一個品質是騙我們、對我們傷害的，自己要坦白，沒有人能告訴我們。即使我們自己知道，不過如果自己太固執；或是太懶得改；或是愛面子，然後自己不想改、不認錯，這樣才有很多麻煩。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/41/m-1.htm"},{"content":"為何較容易趨向所謂的否定力量？－－在西方用語稱為撒旦－－因為我們懶得檢討自己的思想！","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/45/k-0.htm"},{"content":"我們如果常常寬容別人、原諒別人，即使人家對我們不好，我們還是對他們好，疼愛他們，這就是小孩的心。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/45/k-0.htm"},{"content":"如果我們保有這個小孩的心，不管長多大，我們還是上帝的兒女，不會下地獄，也不會遇到不好的情況，生活會很順利，最少我們的心會永遠快樂，我們會看得開，任何問題和障礙都不會讓我們感到很懊惱，很憂愁，我們會很自在，心無罣礙，這就是小孩的心，並非長大就不能當小孩。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/45/k-0.htm"},{"content":"觀音法門的效果很快，累世的各種業障都能在瞬間燒得精光，我們不可能不成功。修觀音法門的人不可能不成佛，不可能！","date":"清海無上師以悠樂文講於美國加州洛杉磯國際禪三1998.12.17（影帶編號#640）","url":"http://www.godsdirectcontact.org.tw/ch/news/178/mt_0.htm"},{"content":"我們做事要真正的無條件奉獻才好，為了別人而服務，然後我們任何都會得到。","date":"清海無上師以中文講於福爾摩沙屏東來義道場 \n1993.01.03（影帶編號＃305）","url":"http://www.godsdirectcontact.org.tw/ch/news/142/mt.htm"},{"content":"我們不是這個身體，不是那些無聊的、無常的念頭，我們本來就是智慧、愛力，我們很自在。","date":"清海無上師以中文講於福爾摩沙高雄小港機場 1993.1.3","url":"http://www.godsdirectcontact.org.tw/ch/news/130/pw.htm"},{"content":"我的照片是為了提醒你們，我告訴過你們什麼事，提醒你自己有多偉大，以及如何可以越來越偉大，以及你可以上天堂，還有你可以自己解脫並幫助世界，這是我的照片的目的。","date":"清海無上師以英文講於奧地利20120427","url":"https://www.youtube.com/watch?v=jkJM4jNB_Tk&feature=youtu.be&t=3975"},{"content":"我們必須每天都要接收好的、正面的、有建設性的、開悟的與智慧的訊息，然後這些訊息就會從頭腦裡指揮細胞及神經系統來做事。這時所做的事情自然都是好的、和平的、智慧的及有建設性的正面事情，這就是我們拯救世界的方法。","date":"清海無上師以英文講於新加坡1995.1.10","url":"http://magazine.godsdirectcontact.net/chinese_t/44/f-1.htm"},{"content":"地球上有越多的人依天堂的生活方式修行，如此地球的品質才能越提昇，那時我們在此的房子才算安全，否則就稱不上安全。","date":"清海無上師以英文講於新加坡1995.1.10","url":"http://magazine.godsdirectcontact.net/chinese_t/44/f-1.htm"},{"content":"我們從上帝生出來，跟上帝同一體，不管我們輪迴生死多久，東奔西跑，認為自己是外道、內道，我們都還是在道內邊，我們永遠沒有離開道。","date":"清海無上師以中文講於福爾摩沙屏東來義道場1993.10.24","url":"http://www.godsdirectcontact.org.tw/ch/news/67/m-3.htm"},{"content":"即使我們有打坐，每天還是會造一點微細的業障，萬一我們不小心造了新業，我們可以用觀音洗掉它，所以很安全，沒有漏洞讓它發芽。","date":"清海無上師以中文講於福爾摩沙屏東1993.1.24","url":"http://www.godsdirectcontact.org.tw/ch/news/67/m-1.htm"},{"content":"要去天國的最後一條路、最後一個法門，就是觀音法門，要用內在的振動力，或是我們說「佛力」或是「上帝的聲音」，拉我們的靈體上去才行。","date":"清海無上師以中文講於福爾摩沙澎湖 1989.01.26","url":"http://www.godsdirectcontact.org.tw/ch/news/210/pw_34.htm#37"},{"content":"我們人有兩種力量：一種是肯定，一種是否定，肯定就是給我們舒服快樂，也給別人舒服快樂，那種品質我們要時時保存它，並且繼續發展。","date":"清海無上師以中文講於福爾摩沙西湖道場1995.1.29","url":"http://magazine.godsdirectcontact.net/chinese_t/43/c-1.htm"},{"content":"最好我們不要求，一天過一天這樣，每天打坐求我們的信心高強一點，求我們快得到大智慧。不要求別的物質東西，修行的人不會餓死，絕對是這樣！","date":"清海無上師以中文講於福爾摩沙山地門禪七 1990.4.1","url":"http://www.godsdirectcontact.org.tw/ch/news/73/f-1.htm#TOC3"},{"content":"我們修行是為了要加以應用，讓我們生活更舒服。我們修行是在裡面修，但應該把它應用到外面來。當我們看到修行的結果時，自己也會覺得很舒服，知道修行很有用、自己很有進步。","date":"清海無上師以中文講於福爾摩沙來義道場 \n1993.01.31（影帶編號＃317）","url":"http://www.godsdirectcontact.org.tw/ch/news/139/ap.htm"},{"content":"一旦開悟了，我們便會從較高境界的觀點，用更高的智力來看待一切，我們會瞭解沒有一件事的發生是偶然的，也沒有一件事是我們自己做的。","date":"清海無上師以英文講於美國哥倫比亞大學 \n1989.11.03（影帶編號＃102A）","url":"http://www.godsdirectcontact.org.tw/ch/news/139/ap.htm"},{"content":"我們要放下對世界的欲望，而不是放棄這個世界。","date":"清海無上師以英文講於福爾摩沙西湖 1995.06.03","url":"http://www.godsdirectcontact.org.tw/ch/news/139/ap.htm"},{"content":"每當我們厭倦了世界的折磨，厭倦了為求生存而不停掙扎，厭倦了精神上的疲憊，就坐下來觀音一下，我們會感到滿滿的喜悅在靈魂中流轉。","date":"清海無上師以英文講於墨西哥墨西哥市 1998.5.23（影帶編號 #627）","url":"http://magazine.godsdirectcontact.net/chinese-t/143/pw.htm"},{"content":"如果自己要快成道的話，除了應該找一位有經驗的師父以外，我們自己本人還要有很誠懇的道心，很誠懇就可以了。","date":"清海無上師以中文講於福爾摩沙西湖1991.04.09","url":""},{"content":"貪沒有什麼不好，嗔也不是否定的品質，痴也很好，只要我們能正確地使用，把它們用做治病的工具，而不是用來殺人，那麼一切東西都很好；沒有什麼東西是否定的，我們的觀念錯誤才把事情變成否定。","date":"清海無上師以英文講於美國波士頓哈佛大學1991.12.24","url":"http://www.godsdirectcontact.org.tw/ch/news/71/i-1.htm"},{"content":"☆我們對世界死心，我們的靈魂才開始復活。","date":"清海無上師（原文為中文）","url":"http://www.godsdirectcontact.org.tw/ch/news/67/o-0.htm"},{"content":"☆沒有真正的壞人或真正的好人，只是無明而已。","date":"清海無上師（原文為中文）","url":"http://www.godsdirectcontact.org.tw/ch/news/67/o-0.htm"},{"content":"如果持五戒很清楚，不論我們到任何地方都不怕，我們的心很安、很勇敢，這樣子才是。","date":"清海無上師（原文為中文）","url":"http://www.godsdirectcontact.org.tw/ch/news/67/o-0.htm"},{"content":"真我永遠不變，不論是在什麼情況下，不管祂穿什麼衣服，真我永遠是集中的。如果我們信靠真我，那麼我們就會更平穩、更滿足。當人生的波濤把我們沖來沖去時，我們不會晃得太厲害。","date":"清海無上師以英文講於印尼泗水共修會 1997.3.19","url":"http://www.godsdirectcontact.org.tw/ch/news/83/f-1.htm"},{"content":"我們全都可以當個記者。我們提供回饋，把世界各地的好消息傳回無上師電視台！每個人都必須做記者的工作！我們必須為這個網 路貢獻一己之力，這樣才能在這個星球創造更充沛的肯定能量，這非常重要！","date":"清海無上師與英國倫敦小中心的電話會議 \n2007.03.18（原文為英文）","url":"http://www.godsdirectcontact.org.tw/ch/news/183/mt_0.htm"},{"content":"我們是為了加持世界、為了瞭解自己的偉大而來。瞭解自己的偉大後，便與整個宇宙的力量同一體，不論誰和我們接觸，都會得到宇宙力量的加持。越多像我們這樣的人修行，地球就越進步，我們會用修行的功德及智慧默默加持世界，那是我們的目的","date":"清海無上師以英文講於澳洲布里斯本 1993.3.22","url":"http://www.godsdirectcontact.org.tw/ch/news/115/qa1.htm"},{"content":"有任何問題，只要多打坐，以後自己就會得到答案，這是最好的答案。\nAs long as we do more mediation, we will naturally come to know the best answer to ant problem.\n我們做工作應該做到完美，不給人家抱怨、煩惱，那個才好。(p91)\nWe should strive for perfection in whatever we do, so that we don't give others any reason to complain or worry.(p91)\n做什麼都自然誠心，就什麼都會好；完美是在那裡，不是完美在你做的工作上。\nWe can do anything well if we do it naturally and sincerely. Perfection is found in how the job is done, not in the job itself.\n任何的經典、戒律，都有它特別的理由，我們應該看清楚，不可以迷信。如果人家講什麼就聽什麼，不曉得為什麼也深信不疑，這樣就是沒有智慧。\nThere are certain reasons why scriptures were written and precepts were made, and these we should clearly see for ourselves. Do not be superstitious and believe everything people say without truly understanding, because to do so would show that one is without wisdom.\n我們潛在的力量很大，如果修行好，對自己有絕對自信，那任何事情都可能做到。\nThe Powers which lay dormant within us are incredibly great! If we do well in our spiritual practice and have absolute confidence in ourselves then we can accomplish anything.\n成佛不成佛是靠我們的心、靠我們自信的力量，不是「坐」很久就能成佛。\nWhether or not we will attain Buddhahood depends on our hearts and on the power of our self-confidence, not on how long we \"sit\" and meditate.\n打坐的時候可以利益很多眾生，我們的振動力發出去，可以使整個國家亮起來，整個宇宙的下意識提昇。\nWe can benefit many sentient being when we meditate; since our vibrations spread, we brighten the entire country and elevate the subconsciousness of the whole universe.\n如果我們所做的事與宇宙原本的計畫不合，就感到懊惱、不愉快，世俗的人常懊惱就是這個原因。師父常會告訴你們原本的計畫，可是你們不聽，而後即使你們依照自己的想法做了，最後還是要修改，走回原來的路。\nIf what we are doing does not comply with the original plan of the universe, we will feel frustrated and unhappy. This is why worldly people are always frustrated. Master will often tell you the original plan, but you never listen. Even if you do what you think is right, you will eventually have to make a change and go back to the original path.\n你們的品質跟我的品質永遠沒有關係，永遠不會影響我，就像花的香味一樣，你們喜歡的時候，可以多享受它，即使你們不喜歡，花的香味也不會減少。\nYour qualities and mine are never related; I will never be affected. Like the fragrance of the flowers, you can enjoy it freely when you want to, but even if you don't want to, it will not change.\n佛跟魔最大的分別就是──佛都是給，魔都是拿；佔有別人的時間、空間，都是魔的品質。\nThe most significant difference between the Buddha and the devil is -- the Buddha is always giving, while the devil is always taking. It is the quality of the devil to occupy the time and space of other people.\n在出生以前，我們這一生要吃多少、用多少，都已經事先計畫好了，但是用修行的力量就可以超越它。\nHow much food and possessions we have in this lifetime was written before we were born. However, we can be above it with the power derived from spiritual practice.\n我們應該耐心，盡我們最大的能力去做，但是不要急，也不要失望，這樣我們修行才有好處。\nWe will benefit in our spiritual practice only when we are patient and try our best, without being anxious and disappointed.If we can maintain open minds, we will feel that everything is beautiful.Strong faith in the path of the practice is both a blessing power and a great merit.","date":"","url":"自然誠心就是完美"},{"content":"雖然在這個世界，有法律以及因果的存在，但是如果我們跟這個最高的力量，也就是跟我們的本來面目溝通，跟這個永遠存在的力量，大慈大悲、大雄大力的力量溝通，就會和因果絕緣。\nIf we were to communicate with the highest power, get in touch with these eternal compassionate, almighty power which is also our own true selves, we'll free from the laws of this world and the Law of Cause and Effect.","date":"","url":"自然誠心就是完美"},{"content":"我們每天想要修行、想要解脫，這個比得到境界更重要。\nTo want to practice and long for eternal liberation every is more important than to attain any spiritual experience.","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/29/"},{"content":"◆我們給任何人什麼東西，也是盡我們本分而已，把上帝所交給我們的東西，轉給該收到的人。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/58/f-0.htm"},{"content":"◆如果你開悟，你就會快樂；你越快樂，你會越相信開悟，你會越能了解上帝的本質。\n◆世界上有什麼，我們就享受什麼，如果沒有，對我們也沒差別；這就是開悟者的處世之道。\n◆越想開，我們越有智慧、越有力量、越有利益。\n◆快樂的人，什麼都好笑，什麼都好吃。\n◆你們做什麼，並不是說好意就夠了，應該有邏輯、有智慧，才不會做錯。  \n◆做什麼自然，從自性出來，就是我們本人做的。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/58/f-0.htm"},{"content":"我們愈步向善良，愈接近善良的品質，我們就會愈提昇至這種天堂的品質，就愈接近天堂。","date":"清海無上師以英文講於新加坡1992.3.3","url":""},{"content":"情況怎麼樣，我們就那樣活下去，事實上，如果我們不求太多，在哪一種政府的系統下，我們都活得下去。我們可以自己想辦法，不用浪費力量抵抗，我們用那個力量、元氣，想辦法生活就好了！","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/69/e-0.htm"},{"content":"師父要給你們一個發展的好榜樣，在各方面都完全發展；不光要發展你們的道德標準和智慧，而且要在日常生活中應用這些道德標準和智慧，把它表現出來。","date":"清海無上師以中文講於福爾摩沙西湖道場 1995.6.3","url":"http://www.godsdirectcontact.org.tw/ch/news/69/e-0.htm"},{"content":"要做當來明師、當來佛，我們必須擁有至少兩項天賦。第一就是忍耐力；忍耐力是指你忍耐一切別人不能忍耐的事情。第二是觀察力；觀看、觀看、再觀看。","date":"清海無上師以英文講於福爾摩沙西湖道場彩虹園 1996.2.22","url":"http://www.godsdirectcontact.org.tw/ch/news/69/e-0.htm"},{"content":"任何執著的地方，都會綁我們，因為我們的注意力還沒有完全跟物質解開。我們靈魂解脫了，不過頭腦還不解脫的話，我們在這個世界還是會痛苦。","date":"清海無上師以中文講於福爾摩沙屏東來義道場 1993.1.13","url":"http://www.godsdirectcontact.org.tw/ch/news/69/e-0.htm"},{"content":"如果我們每天真的專心，我們的生活可以過得很好，任何情況都可以活下去，只要我們忍辱、找自己的智慧，生活自然會變好，一定會好！不可能不好，如果不好，最少我們自己心安靜、和平、快樂，那就是最好的了！","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/69/e-0.htm"},{"content":"如果我們知道我們的命是自己造的，我們根本不會擔心、不會怕，等時間過了！我們扮演的角色早晚也會自己消滅。","date":"清海無上師以中文講於柬埔寨Raising Center 1996.7.19","url":"http://www.godsdirectcontact.org.tw/ch/news/69/e-0.htm"},{"content":"做任何事情，包括求道，不知道重點的話，隨時都會被拉走，因為自己不穩。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/69/k-0.htm"},{"content":"我們不應該分別什麼工作好，什麼工作不好，一有分別心、一有歡喜心，就麻煩啦！","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/69/k-0.htm"},{"content":"除了打坐，我們沒辦法突破自己的成見。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/69/k-0.htm"},{"content":"任何的苦、喜、怒、哀、樂都是習慣造成，所以我們看透這點！沒有什麼是真的好，沒有什麼是真的苦，都是被習慣綁住而已。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/69/k-0.htm"},{"content":"每一個人都有創造的天賦，人人都能根據他或她自己的能力和藝術趨向，創造一切。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/69/k-0.htm"},{"content":"不要管左管右，心隨時都放內邊，抓它回來，不讓它跑掉，不讓它被旁邊的事物拉走，我們就很簡單定。","date":"清海無上師 （原文為中文）","url":"http://www.godsdirectcontact.org.tw/ch/news/69/k-0.htm"},{"content":"我們每一個人，就算無法離家當和尚或尼姑，在家也應該當和尚、當尼姑，時時刻刻應該要儘量減低對於物質的慾望，應該抑制為了物質享受而追求世俗名利好處的意念。我們繼續工作、做生意，但必須沒有執著。我們以熱誠的精神從事工作，是為了供應給自己﹑家庭和社會的需要，不是要求名博利，使自己生活非常舒適，或是過分奢侈。","date":"清海無上師以英文講於福爾摩沙西湖 1996.2.20","url":"http://magazine.godsdirectcontact.net/chinese_t/107/d-1.htm"},{"content":"謙卑並非來自謙卑的頭銜而是發自內心，只有領悟到我們都是上帝的子女，我們和上帝同一體時，才是謙卑的開始。","date":"清海無上師以英文講於澳洲布里斯本19930320 (影帶編號336)","url":"甘露法語2-P33"},{"content":"我們一天到晚看外面，好壞都看，被外面影響，忘記集中思想在內邊，所以我們做事多數才不成功。成功的秘法就是專心，修行多、集中注意力，我們做事愈通順。","date":"清海無上師以中文講於福爾摩沙西湖道場1992.3.25","url":"http://www.godsdirectcontact.org.tw/ch/news/54/p-1.htm"},{"content":"我們應該發展任何方面的才能，應該將事業照顧好，又同時內邊具有智慧和聖潔，只有這樣我們才能真正完成人生的目的──了悟自我，並且美化世界，無論我們停留在此多麼短暫。","date":"清海無上師以英文講於美國夏威夷檀香山1993.3.27","url":"http://www.smchbooks.com/new-c/book/1993/1993-3-1.htm"},{"content":"時候是我們自己造一座山出來，擋住師父的加持力，我們懷疑師父，或是我們沒有自信，不認為我們值得有人幫我們忙，我們認為自己業障很深，或是認為自己很了不起，靠自己就好了，根本不用找誰救我們。很多理由，讓我們被關在成見裡面，關在那種不能溝通、不同一體的感覺裡。","date":"清海無上師以中文講於福爾摩沙西湖道場19920412","url":"http://www.godsdirectcontact.org.tw/ch/news/63/c-1.htm"},{"content":"最重要的是不要害怕任何東西，因為我們代表真理，任何虛妄之事遲早必須離開，無論如何你一定要相信。\n　開始修行時如果不夠純淨和高雅，常常會碰到醜陋的人或不雅景象，或嚇人的事，無妨無妨，這只是考驗我們是否夠堅強、夠勇敢繼續靈性修行，不要怕。\n　有時佛菩薩也考驗我們，送醜陋的景象來，看看我們的反應如何，是否記得佛？或被魔嚇壞了，對佛失去了信心。\n　你的信心要勝過恐懼，這就是功課，因為佛永遠強過否定力量，所以如果你是與佛同在的話，就不要怕。","date":"清海無上師以英文講於福爾摩沙西湖 1995.7.12","url":"http://www.godsdirectcontact.org.tw/ch/news/78/c-0.htm"},{"content":"只要人們忘記上帝，就會再有戰爭。我們必須真正認識內邊的上帝，與祂溝通，然後我們會了解別人也是上帝。一個上帝不會殺另一個上帝，戰爭就會結束。如果我們不了解這點，我們看別人就只是另一個人，只看見他的個性、習性和他的國家傳統，忘記在他裡面也有上帝，這就是問題所在。","date":"清海無上師以英文講於保加利亞蘇菲亞 1999.05.18（影帶編號#651）","url":"http://magazine.godsdirectcontact.net/chinese-t/143/ht4.htm"},{"content":"如果我們自己不能和解，上帝也無法給予地球和平。我們有力量，我們是上帝在世間的代表，既然生存在這裡，我們就該做好這個等級的事情。唯有我們自己內在和平了，才能帶來和平；唯有看見我們內邊的上帝，才能看見上帝也在別人內邊。","date":"清海無上師以英文講於捷克布拉格 1999.05.28（影帶編號#654）","url":"http://magazine.godsdirectcontact.net/chinese-t/143/ht4.htm"},{"content":"我們應該用善意、愛心、美與道德，來征服他人的心，而非用武器。","date":"清海無上師以英文講於義大利羅馬 1999.05.22（影帶編號#646）","url":"http://magazine.godsdirectcontact.net/chinese-t/143/ht4.htm"},{"content":"當我們自己的主人，戰勝自己的缺點、我執和邪惡的傾向，這才是所有戰爭中最輝煌的勝利。","date":"清海無上師以英文講於西班牙馬德里 1999.05.05（影帶編號#644）","url":"http://magazine.godsdirectcontact.net/chinese-t/143/ht5.htm"},{"content":"越多人認識上帝、直接和上帝連線、變得更快樂，世界就越趨和平，越少戰爭，我們越能把天堂帶到地球上來。","date":"清海無上師以英文講於匈牙利布達佩斯 1999.05.24（影帶編號#652）","url":"http://magazine.godsdirectcontact.net/chinese-t/143/ht5.htm"},{"content":"如果這星球上的每一個人都認識上帝，或者至少有一半的人口…，如果三分之一或者四分之一的人認識上帝，那麼將不會再有戰爭、饑荒或任何的問題，這星球將會變成天堂。在不同的宗教之間，甚至在相同的宗教裡，將不再有紛爭，因為人人都會知道：我們只有一個上帝。","date":"清海無上師以英文講於義大利羅馬 1999.05.22（影帶編號#646）","url":"http://magazine.godsdirectcontact.net/chinese-t/143/ht5.htm"},{"content":"業障不是每次都是罪惡感造出來的，而是習慣。頭腦它騙我們，看到類似的情況，它按個鈕就播放一樣的事情、做一樣的反應。所以我們要想得清楚，有什麼不得意的地方、有什麼不愉快，或是有什麼災難，我們一定要突破，不要再被它拉在那邊，不要被習慣綁住，就是這樣而已，這麼簡單。","date":"清海無上師以中文講於福爾摩沙西湖 1991.6.28","url":"http://magazine.godsdirectcontact.net/chinese-t/143/ap.htm"},{"content":"即使是修行人，若不內省，仍然會很自私，因此我們才要持戒，要記住高雅的理想，那種大愛、神聖的工作和犧牲奉獻。","date":"清海無上師以英文講於英國倫敦19970201","url":"http://www.suprememastertv.tv/tw/bbs/board.php?sfl=wr_content&sop=and&bo_table=aw_tw&search_table=schedule_tw&sst=wr_num&s_target=all&d=sh&stx=%E9%AD%94%E4%BA%A6%E8%83%BD%E6%88%90%E4%BD%9B&btnG=%E6%90%9C%E5%B0%8B"},{"content":"並不是打坐以後，我們就不再有惡念，或不再做壞事。由於習慣你仍然會有惡念，但至少你可以用智慧控制，會知道怎麼做最好、最高雅、最合人性而做出最神聖的抉擇。","date":"清海無上師以英文講於英國倫敦19970201","url":"http://www.suprememastertv.tv/tw/bbs/board.php?sfl=wr_content&sop=and&bo_table=aw_tw&search_table=schedule_tw&sst=wr_num&s_target=all&d=sh&stx=%E9%AD%94%E4%BA%A6%E8%83%BD%E6%88%90%E4%BD%9B&btnG=%E6%90%9C%E5%B0%8B"},{"content":"業障、情況、壓力對人的靈魂傷害很大，我們在這種充滿壓力的社會和氣氛裡奮鬥，一定要戰戰兢兢，否則隨時都可能崩潰，忘記高雅的目標。","date":"清海無上師以英文講於英國倫敦19970201","url":"http://www.suprememastertv.tv/tw/bbs/board.php?sfl=wr_content&sop=and&bo_table=aw_tw&search_table=schedule_tw&sst=wr_num&s_target=all&d=sh&stx=%E9%AD%94%E4%BA%A6%E8%83%BD%E6%88%90%E4%BD%9B&btnG=%E6%90%9C%E5%B0%8B"},{"content":"假如我們工作只是為了個人、為了一個工廠，為了滿足自己、為了賺錢、為了照顧自己的身體和生活而已，那當然利益就只有那麼一點點而已。但是如果我們做這樣的工作，不是為了自己個人的利益，也不是為了賺錢，而是為了很多、很多人的利益的話，當然我們服務的層面就比較廣、功德比較大，所以業障也清付得快。","date":"清海無上師以英文講於哥斯大黎加共修會一九九一年二月二日","url":"http://www.godsdirectcontact.org.tw/ch/news/95/q-1.htm"},{"content":"無論你渴望什麼，你一定會得到，這就是宇宙的法律。不論你要的是好或壞，都一定會得到，只是時間早晚的問題。所以要小心想清楚自己要什麼。","date":"清海無上師以英文講於匈牙利歐禪 20050224","url":"甘露法語2"},{"content":"安靜不是說什麼都空了，而是讓那些不必要的心理負擔、偏見靜下來，讓所有無意義的想法、慾望以及企求不可得的渴望心靜下來。安靜是為了能夠服務別人、能夠擁有聰慧、並讓真知顯現。","date":"清海無上師以英文講於馬來西亞吉隆坡19920223","url":"甘露法語2 P41"},{"content":"要行聖人之道：任何行動和念頭都要像個聖人、感受像個聖人，幫助所有人，為別人著想，散發愛心，不斷嘗試朝那個方向走，訓練自己時時處在這種神聖的情境裡，然後你就會成為一個更好的聖人。","date":"清海無上師以英文講於匈牙利歐禪20050224","url":"http://magazine.godsdirectcontact.net/chinese_t/169/mt1.htm"},{"content":"我們剛剛開始修行的人很急，還沒有修好，打坐也打不下去，然後出去隨便講大話，人家會反感，這樣不是弘法，最重要就是我們把自己身口意淨化好，責任做好，等我們修行好了以後，不講話人家也會跟著跑。做事不管對不對，如果我們做不對的時間、不對的場合也沒用的，智慧是在這裡，如果你很聰明，做什麼都衝，就不好了啦！","date":"清海無上師","url":"http://magazine.godsdirectcontact.net/chinese_t/76/q-2.htm"},{"content":"當你思想高雅或行為無私時，你就和天堂同一體，然後你會添加更多力量至天堂，來戰勝這世界的否定力量。","date":"清海無上師以英文講於法國國際聚會2012.03.26（DVD#998）","url":"http://www.godsdirectcontact.org.tw/ch/news/210/article_0.htm"},{"content":"光和音是內在的元素，能洗淨我們的靈魂和思想，我們的道德在修行光和音之後會更加彰顯。","date":"清海無上師（原文為英文）","url":"http://www.godsdirectcontact.org.tw/ch/news/90/t-0.htm"},{"content":"★你們應該放下的是對名利和權力的執著，而不是名利和權力本身。\n★得到開悟比解釋開悟要簡單多了。\n★如果你做任何事尚未完美無瑕，那就該知道你的愛心還沒完全發展，還沒完全使用你內在愛的力量，那正是衡量我們修行是否進步的方法。\n★此時此地即天堂！無論你去何處，就把那裡變成天堂，如果你快樂，那就是天堂了；如果你不快樂，即使周遭很愉悅、高興，你還是不快樂。\n★為什麼我們不能逃避金錢，為什麼不能鄙視政治地位？因為它們是很好用的工具，是為上帝工作、為改善整個世界工作的好工具。","date":"清海無上師（原文為英文）","url":"http://www.godsdirectcontact.org.tw/ch/news/90/t-0.htm"},{"content":"◆如果你開悟，你就會快樂；你越快樂，你會越相信開悟，你會越能了解上帝的本質。\n◆世界上有什麼，我們就享受什麼，如果沒有，對我們也沒差別；這就是開悟者的處世之道。\n◆我們給任何人什麼東西，也是盡我們本分而已，把上帝所交給我們的東西，轉給該收到的人。\n◆越想開，我們越有智慧、越有力量、越有利益。\n◆快樂的人，什麼都好笑，什麼都好吃。\n◆你們做什麼，並不是說好意就夠了，應該有邏輯、有智慧，才不會做錯。  \n◆做什麼自然，從自性出來，就是我們本人做的。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/58/"},{"content":"☆障礙是為了讓我們更強壯，障礙是為了訓練我們，所以不必害怕，要勇於面對障礙。 \n☆The obstacles are there for us to train ourselves. Never be afraid. Have always the courage to face the obstacles.","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/85/i-0.htm"},{"content":"不論內在或外在，我們都應該作個真、善、美的代表。","date":"清海無上師以英文講於瑞士日內瓦1993.4.21","url":"http://www.smchbooks.com/new-c/book/1993/1993-5-2.htm"},{"content":"一旦我們獲得內在智慧以後，我們甚至不用再談論有關和平、博愛，因為我們就是博愛與和平，不論我們走到哪裡、住在哪裡，這種內在美會自然呈現、散發出來。","date":"清海無上師以英文講於瑞士日內瓦1993.4.21","url":"http://www.smchbooks.com/new-c/book/1993/1993-5-2.htm"},{"content":"一旦和上帝溝通了，你的生命將永遠變改，成為和平的典範、上帝在世間的代表","date":"清海無上師以英文講於紐西蘭奧克蘭 2000.04.27（影帶編號＃686）","url":""},{"content":"你們必須要有偉大靈魂的勇氣去講出真理，不論你是為真理而死，或是因真理而活。","date":"清海無上師以英文講於法國巴黎共修會1995.4.28","url":"http://www.godsdirectcontact.org.tw/ch/news/65/d-1.htm"},{"content":"不論內在或外在，我們都應該作個真、善、美的代表。","date":"清海無上師以英文講於瑞士日內瓦1993.4.21","url":"http://www.smchbooks.com/new-c/book/1993/1993-5-2.htm"},{"content":"印心後，我們會脫胎換骨，充滿朝氣與活力，所有的貪念及慾望都會離我們遠去。我們仍然過著平凡的生活，但不會因目的無法實現而苦惱，也不會為了在這世界上得不到渴望之物而難過。只有在找到真正的泉源時才能減輕這股渴望。","date":"清海無上師以法文講於法國巴黎1993.4.24","url":"http://www.smchbooks.com/new-c/book/1993/1993-5-3.htm"},{"content":"什麼該做、什麼不該做，永遠講不完，善用你的智慧和單純心，隨時以單純心來行事，那才重要。隨時念佛號、祈求內邊指引對錯；有疑問時，就打坐。","date":"清海無上師以英文講於美國科羅拉多州1993.4.11","url":""},{"content":"我太愛這兩位韓國領導人，我愛你們這兩位韓國領袖，我愛韓國人，我很愛你們所有人，祝福兩韓萬事順利，共享永久的和平、繁榮與幸福，上天保佑你們，上帝加持你們，我們全都愛你們，世界愛你們，我愛你們，我希望兩位領導人能獲得諾貝爾和平獎，我自己稍後會頒贈他們「全球優秀領導獎」。","date":"清海無上師與SMTV工作人員慶祝朝鮮半島和平2018 04 28","url":""},{"content":"越多人認識上帝、直接和上帝連線、變得更快樂，世界就越趨和平，越少戰爭，我們越能把天堂帶到地球上來。","date":"清海無上師以英文講於匈牙利布達佩斯 1999.05.24（影帶編號#652）","url":"http://www.godsdirectcontact.org.tw/ch/news/143/ht5.htm"},{"content":"我們和天國溝通之後，生活會更順利，在德、美、智上也會更圓滿。","date":"清海無上師以德文講於德國慕尼黑1993.5.1","url":"http://www.smchbooks.com/ebook/data/chinese-t/C-93LECTURE5-E-S.pd"},{"content":"我們所有的世界最快樂的情況、最快樂的時刻，不會比得上我們在清靜的時候找到自己本人的內心、找到自己本人的、那個跟萬物同一體的力量。","date":"清海無上師以英文講於香港 Tuesday, May 02, 2000","url":""},{"content":"我們來這裡有不同的理由，我們來這裡是為了了悟上帝。雖然每個人的使命不一樣，來的理由不一樣，生活的方式也不一樣，但是我們來這裡唯一的目的就是要認識上帝。","date":"清海無上師以英文講於菲律賓馬尼拉2000.05.03","url":"http://edenrules.com/index.php?route=product/product&product_id=1353"},{"content":"如果你能勸導別人吃素，你就是為他們、為地球做了最好的事。","date":"清海無上師以英文講於摩納哥 2008.05.04","url":"http://www.godsdirectcontact.org.tw/ch/news/199/mt_0.htm"},{"content":"越用你內在的智慧，就越知道自己無所不知。","date":"清海無上師以英文講於韓國釜山19930514（影帶編號#372）","url":"甘露法語2  P24"},{"content":"當我們自己的主人，戰勝自己的缺點、我執和邪惡的傾向，這才是所有戰爭中最輝煌的勝利。","date":"清海無上師以英文講於西班牙馬德里 1999.05.05（影帶編號#644）","url":"http://www.godsdirectcontact.org.tw/ch/news/143/ht5.htm"},{"content":"當尋找上帝的時候，我們應該只專注於上帝，一旦認識了上帝，我們治病的力量會自然散發出來，而不需要用任何手勢或動作來做靈力治療，來告訴別人我們是天才、我們有力量或我們比別人優秀。","date":"清海無上師以英文講於西班牙馬德里 1999.05.05 （影帶編號#644）","url":""},{"content":"我們即使已經得到很好的法門，每天還是要檢討自己，看看自己有沒有進步；沒有進步的地方要趕快改，不然的話，沒有大用。","date":"清海無上師以中文講於福爾摩沙西湖19920509 （影帶編號 #244）","url":"http://www.godsdirectcontact.org.tw/ch/news/148/ms1-2.htm"},{"content":"不管在任何方面要想進步，\n意志力是非常重要的，\n如果你在做得到的時候\n卻貶低自己，凡事屈服，\n為了一些物質的舒適\n犧牲你的高標準，\n這樣你只是傷害到自己，\n這就是我所說「有害的」。","date":"清海無上師以英文講於澳洲雪梨國際禪四1997.05.09","url":""},{"content":"上帝已經為世人和這個星球安排好快速發展的進度表，我們必須隨時更新自己，配合祂的恩典，我們的生活才能跟得上地球進展的腳步。","date":"清海無上師以英文講於波蘭華沙 1999.05.11（影帶編號＃657）","url":"http://www.godsdirectcontact.org.tw/ch/news/145/mt.htm"},{"content":"上帝賦予我們每個人不同個性是有不同的理由，你們都很好，你們是應該要讓自己更好，但並非盲目仿傚他人。","date":"清海無上師以英文講於韓國永同道場國際禪六 2000.05.12","url":"http://www.godsdirectcontact.org.tw/ch/news/118/mt1.htm"},{"content":"我們用自己的成見、宗教信仰、社會的行為模式等等蓋牆壁，使自己和自然的生活方式隔開，所以我們沒辦法成為明師。","date":"清海無上師以英文講於柬埔寨19960514","url":"http://www.godsdirectcontact.org.tw/ch/news/63/p-1.htm"},{"content":"「出家」的目的不是要逃避世界，而是要放下一切，或是想把自己的生命完全奉獻給更崇高的理想，服務更多的群眾，如果情況允許的話，服務全世界","date":"清海無上師以英文講於保加利亞蘇菲亞1999.05.18 （影帶編號#651）","url":""},{"content":"世界上沒有所謂的定命，如果我們能和上帝的恩典相連，一切都可以改變。","date":"清海無上師以英文講於波蘭華沙19990511 (影帶編號#657)","url":"甘露法語 2 P80"},{"content":"越多人認識上帝、直接和上帝連線、變得更快樂，世界就越趨和平，越少戰爭，我們越能把天堂帶到地球上來。","date":"清海無上師以英文講於匈牙利布達佩斯 1999.05.24（影帶編號#652）","url":""},{"content":"耶穌是以聖靈而不是外表的形體來，祂可以到任何一個有足夠知見、能開啟正確的心靈門扉讓祂進來的人裏面，然後我們就變得像耶穌或像天父一樣，那個時刻就是耶穌再度降臨。任何時候我們準備好了，祂都會降臨，祂透過任何明師而來，透過有能力容納祂、接受祂的大力量的人，這位明師也是耶穌；或許髮型不同，也許穿高跟鞋，不過仍是耶穌。","date":"清海無上師以英文講於美國加州 1991.5.19","url":"http://www.godsdirectcontact.org.tw/ch/news/111/ms1-c.htm"},{"content":"我們淨化身、口、意了以後，我們做什麼都對，做什麼都合道，所以才應該修行。","date":"清海無上師以中文講於福爾摩沙台南19880513","url":""},{"content":"我們持不忘語的戒，然後我們講什麼話，對別人會有利益，我們講什麼會成真。","date":"清海無上師以中文講於福爾摩沙桃園19890521(音帶編號CG13)","url":""},{"content":"當我們打坐越多、越往內靜觀上帝時，我們就越脫胎換骨，成為天使、聖人，或無憂無慮的靈魂。\n清海無上師以英文講於瑞典斯德哥爾摩1999.05.31（影帶編號＃655a）\nhttp://www.godsdirectcontact.org.tw/ch/news/150/mt1.htm","date":"清海無上師以英文講於瑞典斯德哥爾摩1999.05.31（影帶編號＃655a）","url":"http://www.godsdirectcontact.org.tw/ch/news/150/mt1.htm"},{"content":"為了獲得重生、回歸赤子之心，我們要回復整個過程：每天要訓練自己、放鬆自己，專注在上帝。","date":"清海無上師以英文講於瑞典斯德哥爾摩1999.05.31（影帶編號＃655a）","url":"http://www.godsdirectcontact.org.tw/ch/news/150/mt1.htm"},{"content":"並不是開悟以後就什麼都不用做，那就變成無用佛了！我要提醒你們，越開悟工作就越多，開悟的目的就是要幫助弱小、幫助需要你的人。","date":"清海無上師（原文為英文）","url":"http://www.godsdirectcontact.org.tw/ch/news/94/k-0.htm"},{"content":"師父要給你們一個發展的好榜樣，在各方面都完全發展；不光要發展你們的道德標準和智慧，而且要在日常生活中應用這些道德標準和智慧，把它表現出來。","date":"清海無上師以英文對外國同修開示於福爾摩沙西湖道場1995.6.3","url":"http://www.godsdirectcontact.org.tw/ch/news/48/c-1.htm"},{"content":"宇宙間的手足之情，猶如一個廣大美好的通訊網，我們都是其中一部分，只要網域中的任何一部分出問題，就會影響全網的運作，造成缺陷與延誤。因此，我們必須把出問題的地方修理好，一切就會安然無事。","date":"清海無上師以英文講於福爾摩沙西湖共修會1995.6.5","url":"http://www.godsdirectcontact.org.tw/ch/news/47/b-1.htm"},{"content":"這個世界的挑戰，就是要我們時時走在上帝的道上，時時遵循良心的戒律，我們因此而能超越各種差異與各種讚譽、責難，而成為高貴的人。","date":"清海無上師以英文講於福爾摩沙西湖共修會1995.6.5","url":"http://www.godsdirectcontact.org.tw/ch/news/47/b-1.htm"},{"content":"天國並非是一個閃爍著金、銀、鑽石、紅寶石各種寶石光芒的宮殿，它是純潔、愛力、友善、慈悲與祥和之心，那才是天國。如果我們在內邊帶著這個天國，那麼無論我們走到那裡，都會感覺到置身天堂之中。","date":"清海無上師以英文講於福爾摩沙西湖共修會1995.6.5","url":"http://www.godsdirectcontact.org.tw/ch/news/47/b-1.htm"},{"content":"如果我們對自己真的很坦白、想改進、想訓練我們對他人苦難與歡樂的敏感度，以及我們自己的純潔與完善，那麼我們必須要時時保持警覺，要很注意！否則很容易的，一天就過去了、兩天過去了、三天、一輩子都過去了，我們還沈在自我的壞習慣中，而沒有進入一個更高的意識層次，無法了解靈性生活更深一層的含意。","date":"清海無上師以英文講於福爾摩沙西湖共修會1995.6.5","url":"http://www.godsdirectcontact.org.tw/ch/news/47/b-1.htm"},{"content":"我們往內找上帝、找內在的天國，讓上帝教導我們、改變我們，讓上帝依照我們的期許，引導我們往更好的方向邁進，過一個更適合上帝兒女的生活。","date":"清海無上師以英文講於英國倫敦 1999.06.09（DVD#662）","url":"http://www.godsdirectcontact.org.tw/ch/news/173/ms_30.htm"},{"content":"開悟是根治這個世界各種病症的唯一方法，上帝之愛是解決世間所有紛爭的唯一藥方。","date":"清海無上師以英文講於斯洛維尼亞 1999.05.26（#660）","url":"甘露法語2 P59"},{"content":"我們做事的動機，應該是因為我們喜歡做，喜歡跟大眾分享好的東西，讓別人和我們一樣快樂。當我們獲得利益時，也想把這個利益分享給大眾，我們的動機應該這麼單純","date":"清海無上師以英文講於美國佛羅里達小中心 \n2001.06.06（影帶編號#714）","url":"http://www.godsdirectcontact.org.tw/ch/news/156/mt1.htm"},{"content":"慈悲心不是能學的，而是從修行當中自然生出來的，從真正的慚愧心出來的。佛菩薩加持才能讓我們改比較快，如果我們自己不願意改，不誠心誠意求佛菩薩給我們這個慈悲心、愛力的話，就改不掉。","date":"清海無上師以中文講於宜蘭1988.6.20","url":"http://www.godsdirectcontact.org.tw/ch/news/14/e-1.htm"},{"content":"看眾生苦，我們才苦；如果沒有苦心，沒有同情心，即使修好久好久，還離道很遠。","date":"清海無上師以中文講於宜蘭1988.6.20","url":"http://www.godsdirectcontact.org.tw/ch/news/14/e-1.htm"},{"content":"唯有當我們有絕對的信心和誠心時，我們才能真正瞭解明師，並達到更高等級，回歸輝煌偉大的本我。\n清海無上師以英文講於福爾摩沙20190205\nhttp://suprememastertv.com/ch1/download/p.php?f=0537-BMD-20190205-SM-LNY-Lecture-New-Land-P2-o2-2m","date":"清海無上師以英文講於福爾摩沙20190205","url":"http://suprememastertv.com/ch1/download/p.php?f=0537-BMD-20190205-SM-LNY-Lecture-New-Land-P2-o2-2m"},{"content":"時時保有這個信心，不要失去它，這是你除了聖號以外，最好的保護。\n好，因為它會給你很大比率的保護。因為你享有來自師父的保護，如果你對你的師父很有信心，你就能享有這份保護。","date":"清海無上師以英文講於福爾摩沙2018.07.05","url":"時時保有這個信心，不要失去它，這是你除了聖號以外，最好的保護。"},{"content":"我們工作是賺功德，洗我們自己的業障，讓我們學習當佛菩薩，這是給我們學習的功課，我們應該感激有這個機會學習，哪裡還驕慢什麼！驕慢心一出來，魔就跑來考驗了！","date":"清海無上師以中文講於福爾摩沙台北 1989.5.2 （影帶編號＃76）","url":"http://www.godsdirectcontact.org.tw/ch/news/134/mt.htm"},{"content":"單純的心就是：我們不想人家壞事，也不詛咒人家，我們做善良的事，幫助、安慰人家，我們能做什麼，就儘量做，我們不隨便懷疑別人。","date":"清海無上師以中文講於福爾摩沙台北 1989.5.2 （影帶編號＃76）","url":"http://www.godsdirectcontact.org.tw/ch/news/134/mt2.htm"},{"content":"通往開悟之路只有一條，那就是正路；人的生活方式只有一種，那就是美德的生活；做人的方式只有一種，那就是高尚。","date":"清海無上師（原文為英文）","url":"http://magazine.godsdirectcontact.net/chinese_t/89/b-0.htm"},{"content":"造化可以包容宇宙萬物，我們也應該包容宇宙萬物，才能夠變成無上正等正覺，才能夠變成最高的境界，最高的等級。","date":"清海無上師以中文講於福爾摩沙1987.7.5","url":"http://www.godsdirectcontact.org.tw/ch/news/67/i-1.htm"},{"content":"當我們做的事是好的、高貴的、正確的、修行的，我們就不該害怕。","date":"清海無上師","url":"http://www.godsdirectcontact.org.tw/ch/news/90/t-0.htm"},{"content":"任何的工作，如果是幫大眾或師父做的，就是佛的工作；如果因為任何理由而違背了這個原則，就是魔的工作，很簡單。","date":"清海無上師","url":"http://www.godsdirectcontact.org.tw/ch/news/84/f-1.htm"},{"content":"印心、共修、吃素、持戒都是一種助力而已，不是終極的目標，只是到達目的地的方法而已。你們內心必須渴望上帝勝過一切，然後這些方法便會對你們有幫助。如果你們不要上帝，即使吃素一千年、打坐兩千年、印心三千次，還是得不到利益，這些都只是外在儀式而已。","date":"清海無上師以英文講於英國倫敦共修會 1998.3.10（影帶編號＃631）","url":"http://www.godsdirectcontact.org.tw/ch/news/135/mt2.htm"},{"content":"即使你修觀音法門，你持戒、你打坐，但是你的頭腦不單純，沒有擺脫物質的慾望，那就不好。","date":"清海無上師 以英文對外國同修開示於福爾摩沙西湖道場1995.7.11","url":"http://www.godsdirectcontact.org.tw/ch/news/49/v-1.htm"},{"content":"不是因為我們犯戒，就會有人傷害我們，而是我們降低了自己的等級，日後有一天還是得拉自己起來。","date":"清海無上師 以悠樂文講於美國洛杉磯小中心1997.7.13","url":"http://www.godsdirectcontact.org.tw/ch/news/87/b-1.htm"},{"content":"我們應該知道我們的上帝品質和佛的品質，應該依照佛和上帝的標準來生活，才可以回來，才可以控制自己，才可以做主人、做老師。","date":"清海無上師 以悠樂文講於美國洛杉磯小中心1997.7.13","url":"http://www.godsdirectcontact.org.tw/ch/news/87/b-1.htm"},{"content":"如果我們想再回到廣泛了知一切的狀態，那就要修觀音法門，再度認識一切；什麼時候我們修上去越高，我們越了解我們實際上是一切- - - 「萬物同一體」。","date":"清海無上師以悠樂文講於美國加州洛杉磯 1997.7.19","url":"http://www.godsdirectcontact.org.tw/ch/news/92/c-1.htm"},{"content":"我們需要回歸高貴的真我，變成很好、很有愛心及同情心又有智慧的眾生，我們需要成為那樣子的人，而當我們做越多我們的功課時，我們就能越快變成那樣的眾生，就是這樣。","date":"清海無上師以英文開示於福爾摩沙西湖道場 一九九五年七月十三日","url":"http://www.godsdirectcontact.org.tw/ch/pearl_wisdom/qa/6-27.htm"},{"content":"在任何情況下，我們都必須盡力照顧好自己，得到最好的結果，但不要佔人家的便宜，或是把自己的成功建立在他人的痛苦犧牲上。","date":"清海無上師以英文講於柬埔寨 Raising Center 1996.7.19","url":"http://www.godsdirectcontact.org.tw/ch/news/153/mt1.htm"},{"content":"並不是我們改變這個世界，而我們的心裡安寧，世界就和我們無關，對我們不會有影響。","date":"清海無上師","url":"http://www.godsdirectcontact.org.tw/ch/news/91/o-0.htm"},{"content":"隨時把注意力放在球道上是很重要的，只有這樣才能讓自己很快進步。","date":"清海無上師以英文講於馬來西亞19920227 (影帶編號220)","url":"甘露法語2   P104"},{"content":"我們能原諒別人，自己也很自在，不管我們是窮或是富有，有高的地位或是地位低下，不管我們住在那個地方，跟誰住在一起，我們都心無罣礙。","date":"清海無上師以中文講於福爾摩沙西湖道場1990.7.23","url":"http://magazine.godsdirectcontact.net/chinese_t/76/e-1.htm"},{"content":"隨時要省時間、省元氣，為了要專心往內邊找佛性，隨時都注意在智慧中心、佛的中心，不然沒人能幫助我們的。","date":"清海無上師以中文講於柬埔寨Raising Center 1996.7.24","url":"http://www.godsdirectcontact.org.tw/ch/news/68/h-1.htm"},{"content":"在生活中，儘量營造友善、祥和、融洽跟平順的氣氛，同時持守五戒，思想單純，想法肯定。這樣意念如果成真的話，我們會比較舒服。\n清海無上師以英文講於柬埔寨金邊1996.07.23","date":"","url":""},{"content":"因為你們是上帝，所以要做好、高雅，這樣才能達到你想要的目標。\n清海無上師以英文講於柬埔寨金邊1996.07.23","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/97/h-1.htm"},{"content":"我們來這裡不是來期待每個人都像佛、天使、或是像我們那麼好，我們的目的只是來將自己好的一面表現出來，而不期待任何回報。\n清海無上師以英文講於柬埔寨金邊 1996.07.26","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/97/a-1.htm"},{"content":"如果我們真的不執著任何世上的財產、名譽、虛名，那麼任何東西都會到我們這裡來。可是一旦我們被這世上的東西所奴役，我們就會永遠追在它後面跑，疲於奔命、耗盡心力，各種問題都找上門來了，還不一定得到任何東西。\n清海無上師以英文講於福爾摩沙西湖道場 1995.07.12（影帶編號#489）","date":"","url":""},{"content":"我們修行必須虔誠，而非貪婪，不是像那種執著物質的修行人。\n清海無上師以英文講於福爾摩沙西湖道場 1995.07.12（影帶編號#489）","date":"","url":""},{"content":"我們需要更努力修行，以便有更多的影響力，散發更多高尚的氣氛給這個世界和眾生。逐漸的或許有越來越多的人會來跟隨我們。戰爭會越來越少。這是唯一的解決之道。\n清海無上師","date":"","url":"https://www.youtube.com/watch?v=hD_GDqsA9sA"},{"content":"我希望你們主動積極，越來越好，幫助他人，總是先為他人著想。當然這並不容易，但要訓練自己盡力而為，任何利益他人的事，要盡力督促自己去做。\n清海無上師以英文講於歐洲 20130729","date":"","url":""},{"content":"我們隨時都要保持身口意乾淨，不要亂想、偏向那些黑暗的思想，等一下很麻煩。\n清海無上師以中文講於福爾摩沙西湖 1991.8.1","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/97/c-2.htm"},{"content":"人家可以不完美，但我們的看法應該時時刻刻都完美才行，不然的話，我們傷害自己。","date":"清海無上師以中文講於福爾摩莎西湖禪七19890729","url":"http://www.godsdirectcontact.org.tw/ch/news/61/l-1.htm"},{"content":"我們修行是為了要加以應用，讓我們生活更舒服。我們修行是在裡面修，但應該把它應用到外面來。當我們看到修行的結果時，自己也會覺得很舒服，知道修行很有用、自己很有進步。 清海無上師以中文講於福爾摩沙來義道場1993.01.31（影帶編號＃317）","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/139/ap.htm"},{"content":"愛也必須付出；付出越多，我們越能體認它的偉大，越能了解生命中最重要的就是愛。 清海無上師以英文講於紐約1999.8.4","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/127/pw.htm#1"},{"content":"最好、最單純的心自然會吸引宇宙中最好的、最純潔的東西，而且收穫比我們要求的還多。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/89/b-0.htm"},{"content":"要求道，最重要的規矩是：不要批評人，而且「心」應該開朗，這是很重要的事。","date":"清海無上師","url":"http://www.godsdirectcontact.org.tw/ch/news/62/g-0.htm"},{"content":"如果我們自己躲在道裡面，防備清楚的話，任何的業障都不能佔領、也不能靠近我們磁場。","date":"清海無上師以中文講於福爾摩沙西湖道場19910807","url":"http://magazine.godsdirectcontact.net/chinese_t/60/b-1.htm"},{"content":"世界上的任何東西都不是我們的，即使我們做了什麼好事，也不是我們做的，造化事先都已經安排好了。","date":"清海無上師以中文講於福爾摩沙西湖 1991.07.21（影帶編號＃183）","url":""},{"content":"修行的人有很多高等的境界可以去，這些境界可以滿足我們內心的任何渴望，讓我們精神好舒服、好快樂。 清海無上師以中文講於福爾摩沙西湖 1991.07.21","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/155/ms1-3.htm"},{"content":"要展現自己完美的風範，成為美好的修行人，值得別人讚賞與尊重。\n清海無上師以英文開示 2002.08.04","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/157/tip1.htm"},{"content":"修行越多，我們越懂怎麼處理我們的事情，我們越知道自己裡面豐富的材料，我們越知道在哪一個場合拿出來應用。","date":"清海無上師以中文講於福爾摩沙西湖19910616(影帶編號#176)","url":""},{"content":"我們誠心要修改自己，我們會離道越來越近。","date":"清海無上師","url":"http://magazine.godsdirectcontact.net/chinese_t/89/b-0.htm"},{"content":"謙卑的人很接近佛菩薩，\n心單純就跟道比較接近；\n我們越驕慢，離道越遠。","date":"清海無上師以中文講於福爾摩沙西湖1989.8.13","url":"http://www.godsdirectcontact.org.tw/ch/news/95/f-1.htm"},{"content":"我們走到哪裡，我們就代表和平、代表天國；我們就是天使，我們就是佛。","date":"清海無上師以英文講於美國德州奧斯汀共修會1994.8.14\nhttp://magazine.godsdirectcontact.net/chinese_t/43/g-1.htm#SEC2","url":"http://magazine.godsdirectcontact.net/chinese_t/43/g-1.htm#SEC2"},{"content":"我們有心的話就有佛；有心是什麼呢？誠心、謙卑心，以及百分之百相信最高佛力的信心。 清海無上師","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/54/i-1.htm"},{"content":"別人一罵我們就受不了，表示說那個時候我們心還有罣礙，還執著那個甜的地方。","date":"清海無上師以中文講於福爾摩沙宜蘭禪七 1988.8.12-18 （MP3-2）","url":"http://www.godsdirectcontact.org.tw/ch/news/130/ms2-2.htm"},{"content":"做什麼因為需要做就做，做為了要侍奉別人，不是為了競爭感情，就不會失去我們的智慧。","date":"（清海無上師講於巴西1989.11.19 原文為中文）","url":""},{"content":"我們偶爾集合起來打坐、多充電，然後我們充滿光亮、充滿愛力，我們回家才能夠利益社會、利益國家、利益親戚朋友。","date":"清海無上師以中文講於\n福爾摩沙苗栗西湖禪七 1989.7.29-8.6","url":"http://www.godsdirectcontact.org.tw/ch/news/105/b-1.htm"},{"content":"每天把自己分內的工作做好，這也是一種打坐；每天好好對待別人，將心比心，這樣也是打坐；每天幫助貧困的人，愛心關懷遭受痛苦的人，這樣也是打坐。這些都會增加我們的修行成果。","date":"清海無上師透過網際網路視訊會議以英文對德國漢堡同修開示 2002.10.06","url":"http://www.godsdirectcontact.org.tw/ch/news/161/qa4.htm#qa10"},{"content":"那些一天到晚抱怨、可憐自己的人，都是只想到自己這個小小的人，忘記內邊萬能的力量。","date":"清海無上師以中文講於福爾摩沙宜蘭禪七 1988.8.12-18 （MP3-2）","url":"http://www.godsdirectcontact.org.tw/ch/news/130/ms2-2.htm"},{"content":"我們必須永遠做對的事，上帝會知道；但我們做事要有無我的態度，很自然的做，不要有目的，這才是完美的。\n~ 清海無上師 ~","date":"http://www.godsdirectcontact.org.tw/ch/news/82/b-0.htm","url":"http://www.godsdirectcontact.org.tw/ch/news/82/b-0.htm"},{"content":"當你可以帶著笑容時，何必擺出懊惱的樣子？這不用花錢，而且也是一種布施，將快樂和輕鬆的氣氛帶給大家，那比金錢、食糧還要重要。","date":"清海無上師（原文為英文）","url":"http://www.godsdirectcontact.org.tw/ch/news/94/k-0.htm"},{"content":"我們如果不儘量改變自己的話，即使有加持力也沒有很多用處，就變成一種物質的福報而已。","date":"清海無上師（原文為中文）","url":"http://www.godsdirectcontact.org.tw/ch/news/94/k-0.htm"},{"content":"我們有時候幻想很多，認為生活很充裕我們才安心、才快樂、才可以修行，事實並非如此！當我們快樂、我們安心時，我們在什麼情況都可以修行，這不是富有的關係。","date":"清海無上師（原文為中文）","url":"http://www.godsdirectcontact.org.tw/ch/news/94/k-0.htm"},{"content":"修行是很微細的事，就像剃刀邊緣。天堂和人間的界線就像剃刀刀鋒那麼微細，起心動念稍有偏差，再加上行為稍有背離，等級就掉了。","date":"清海無上師以英文開示與無上師電視臺工作人員的電話會議 2018.08.29","url":"https://www.youtube.com/watch?v=POpFllECxdU&feature=youtu.be&t=10952"},{"content":"只要想法肯定，生活簡單健康，你們會是自己最好的醫生。","date":"清海無上師以英文開示於新加坡共修會1994.09.29 （影帶編號#446）","url":"http://www.godsdirectcontact.org.tw/ch/news/144/7-1.htm"},{"content":"我們對眾生付出越多仁慈愛心與保護，我們在世上就越偉大，\n我們內心會感覺更提昇，同時在天堂的等級也會越高","date":"清海無上師以英文講於美國華盛頓特區視訊會議 2009.11.08","url":"http://www.godsdirectcontact.org.tw/ch/news/207/ap_82.htm"},{"content":"如果我們知道上帝是在我們內邊，或是知道佛在心，那我們會活得更快樂，我們的身體和心智會更堅強、更健康。","date":"清海無上師以英文講於美國加州柏克萊大學1989.10.13","url":"http://www.godsdirectcontact.org.tw/ch/news/51/i-1.htm"},{"content":"我們在順利、輕鬆的時候更要當心，不要變得理所當然，失去謙卑心、慚愧心，然後就懈怠下來，沒辦法進步。","date":"清海無上師(原文為英文)","url":"http://www.godsdirectcontact.org.tw/ch/news/52/f-0.htm"},{"content":"生活平均是道，心平常是道，我們不應該貪求什麼，我們貪快成佛，這也是一種貪望，做什麼都應該平均才好。","date":"清海無上師以中文講於福爾摩沙西湖道場19901019","url":"http://www.godsdirectcontact.org.tw/ch/news/131/st.htm"},{"content":"我們要先照顧好自己的心，看自己有沒有單純，有沒有高雅的理想，自己的貪嗔癡有沒有控制好，對別人有沒有足夠的愛心和耐心，有沒有寬容、諒解和慷慨的心，能不能包容別人弄錯的地方？","date":"清海無上師以中文講於福爾摩沙西湖道場19901019","url":"http://www.godsdirectcontact.org.tw/ch/news/131/st.htm"},{"content":"我們如果用功修行的話，那佛菩薩一定會幫忙，因為佛菩薩很有慈悲心，看到我們那麼用功要回家，哪裡不幫我們忙一點點，除了我們不用功，佛菩薩還是上帝才不幫我們忙。我們用功，一定有幫忙很多。","date":"清海無上師以中文講於福爾摩沙高雄19881019","url":"http://edenrules.com/index.php?route=product/product&product_id=203"},{"content":"死不是不好的東西，就怕我們死的時候，還沒有學會我們的功課。","date":"清海無上師以中文講於福爾摩沙高雄19941023~25","url":"http://edenrules.com/index.php?route=product/product&product_id=440%20%20%2001483%20%E5%91%A8%E6%9B%B8%E7%9A%84%E9%82%A3%E5%80%8B%E7%A6%AA"},{"content":"我們那些壞的品質也是一種執著心，如果我們能放下的話，我們馬上就解脫了。所以才說：「放下屠刀，立地成佛。」不是屠刀而已，任何會綁我們在這裡的都一樣。所以你們想回家的話，自己好好修行。","date":"清海無上師以中文講於福爾摩沙高雄19941025","url":"http://edenrules.com/index.php?route=product/product&product_id=440"},{"content":"人類是全宇宙中最偉大的眾生，比天使還偉大；當我們擁有美德並且開悟以後，天使會在我們身邊、保護我們和替我們服務。","date":"清海無上師（原文為英文）","url":"http://www.godsdirectcontact.org.tw/ch/news/79/e-0.htm"},{"content":"應該修觀音法門，把我們頭腦的成見──那種無形的垃圾洗乾淨，然後任何東西進去都是清淨的國土，都是甘露水，不然的話，即使我們很努力做很多事，都是為了我執，都是為了名利做。\n～清海無上師以中文講於福爾摩沙台南 1988.5.13～","date":"","url":"http://classic.godsdirectcontact.org.tw/ch/news/115/ap.htm"},{"content":"為了要讓自己解脫，我們必須再度認識自古以來所有明師教理的真義，這個真義就是：「上帝、佛、阿拉是永遠慈悲的，而且我們是這最高力量的兒女，無論在這一生或來生，無論在任何方面，我們都永遠會被祂寵愛、寬恕及幫助。」\n清海無上師以英文講於南非開普敦　1999.11.27","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/127/ms-1.htm"},{"content":"要謹記是這一點，記得自己就是上帝、就是佛。這個身體不是你，習性也不是你，不好的個性也不是你，永遠記得這點，然後尊重自己、做正確的事、保持專注。\n清海無上師以英文講於福爾摩沙西湖1995.12.24","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/94/r-2.htm"},{"content":"我教你們要做好人，這樣你們才能幫助他人。你們就像是光束一樣，向外擴散到各個地方，為那些我接觸不到的人帶來快樂、好消息以及準確與有用的資訊","date":"清海無上師以英文講於墨西哥坎昆20101211","url":"http://edenrules.com/index.php?route=product/product&product_id=482"},{"content":"我們做什麼，平均就好了，\n不要太偏向什麼地方。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/89/b-0.htm"},{"content":"我們從付出和給別人的愛心就會感到滿足，\n而不是在那邊等待別人的愛。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/89/b-0.htm"},{"content":"看一切都是上帝的恩典，那麼每件事都成為喜悅之源而不是苦惱了。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/89/b-0.htm"},{"content":"我們心如果善良的話，就簡單跟萬物同一體，簡單跟佛接觸。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/140/"},{"content":"我們修行的人要進步最好是要每天分析，每天要檢討自己、警告自己，看那裡我們有缺點，那裡我們不合邏輯，那個地方我處理不對，我一定不會再做這個樣子，要檢討自己為什麼這樣處理不對，要謹慎哦！要提醒自己啊！","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/89/b-0.htm"},{"content":"你可以愛別人，但是別人不一定會愛你，所以最好就是愛他們但不求回報。\n　   「彌勒」意思是快樂與愛力，彌勒佛就是愛力佛，帶給人們愛力和快樂，任何人能做到這樣，都可以算是彌勒佛。你自己應該當彌勒佛，把愛力、快樂帶給大眾，才算是紳士、大丈夫。","date":"清海無上師（原文為英文）","url":"http://www.godsdirectcontact.org.tw/ch/news/94/k-0.htm"},{"content":"要騙自己或是騙人是很簡單，自己真的要修行很認真、很坦白則不容易。","date":"清海無上師（原文為中文）","url":"http://www.godsdirectcontact.org.tw/ch/news/94/k-0.htm"},{"content":"我們吃東西得到的能量，或打坐得到的加持力，我們也必須讓它發揮出來，而且每天、每天更新，不然我們不會長大。","date":"清海無上師以英文講於美國紐澤西共修會1992.6.24","url":"http://www.godsdirectcontact.org.tw/ch/news/54/d-2.htm"},{"content":"不要被障礙、苦難打敗，也許今天我們不懂得怎麼反應，比較驚嚇一點，所以被打敗，那明天再繼續，有一天會好。\n沒有真實的體驗，宗教就沒有多大用處。\n帶人們回天堂是如此困難。因為人們有太多先入為主的思想、成見、無知。\n當我們開悟的時候，我們會創造一個新的天堂；當我們做壞事或犯罪的時候，我們會創造一個新的地獄。不要認為地獄早已存在，等著你掉進去；不！天堂和地獄都是我們自己創造的。","date":"清海無上師(原文為英文)","url":"http://www.godsdirectcontact.org.tw/ch/news/52/f-0.htm"},{"content":"我們在順利、輕鬆的時候更要當心，不要變得理所當然，失去謙卑心、慚愧心，然後就懈怠下來，沒辦法進步。","date":"清海無上師(原文為英文)","url":"http://www.godsdirectcontact.org.tw/ch/news/52/f-0.htm"},{"content":"我們修行的人要進步最好是要每天分析，每天要檢討自己、警告自己，看那裡我們有缺點，那裡我們不合邏輯，那個地方我處理不對，我一定不會再做這個樣子，要檢討自己為什麼這樣處理不對，要謹慎哦！要提醒自己啊！","date":"清海無上師(原文為中文)","url":"http://www.godsdirectcontact.org.tw/ch/news/89/b-0.htm"},{"content":"師父永久在你們身邊，你們繼續努力，誠心做好人，一定師父會帶你們去新造出來的那個天堂。那邊比任何的天堂都輝煌美麗、快樂。","date":"~清海無上師與弟子電話開示20190127~","url":""},{"content":"我們在這個世界要做好榜樣，不管是救濟，不管是修行，不管是朋友的感情或是師徒的關係，我們都要做好的榜樣。","date":"清海無上師以中文講於福爾摩沙西湖道場1995.1.29","url":"http://magazine.godsdirectcontact.net/chinese_t/43/c-1.htm"},{"content":"我們越想到上帝，我們越輕鬆，想跟沒想一樣，因跟祂融化在一起了 。那個時候才叫做行、住、坐、臥都是禪。","date":"清海無上師以中文講於福爾摩沙屏東共修會 1993.1.31","url":"http://www.godsdirectcontact.org.tw/ch/news/58/h-0.htm"},{"content":"每天我們過一個生活像過最後一天一樣，把事情全部弄好，能夠今天做的不要說我明天做，要馬上做。（原文為中文）","date":"清海無上師(原文為中文)","url":"http://www.godsdirectcontact.org.tw/ch/news/93/j-0.htm"},{"content":"愈愛生命，就愈能給予生命；愈能擴展自己，然後使自己變得偉大。為什麼佛陀祂無所不在，因為祂愛所有眾生，認同一切眾生，所以祂成為如來。如來的意思就是不來也不去，祂哪裡也沒去，不過，祂無所不在，懂嗎？因為祂把自己擴展開來，祂不扼殺生命，反而給予生命，使生命得以延續下去，因此，就得到生命，有因就有果。","date":"清海無上師以英文講於美國紐約 1990.2.3","url":"http://www.godsdirectcontact.org.tw/ch/news/78/c-0.htm"},{"content":"不要找藉口寵壞自己的身體太多，我們愈享受，愈產生一種「個人的我」存在的想法，愈產生這種概念，我們愈墮落生死輪迴。\nDo not find excuses to spoil your physical body. The more we indulge ourselves, the more we develop a kind of \"individual self\" sentiment. The more we develop this sentiment, the easier it is for us to sink into the cycle of birth and death.","date":"清海無上師","url":"http://www.godsdirectcontact.org.tw/ch/news/34/c-1.htm"},{"content":"最好、最單純的心自然會吸引宇 宙中最好的、最 純潔的東西，而 且收穫比我們要 求的還多。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/115/ap.htm"},{"content":"我們淨化身、口、意了以後，我們做什麼都對，做什麼都合道，所以才應該修行。","date":"清海無上師以中文講於福爾摩沙台南 1988.5.13","url":"http://www.godsdirectcontact.org.tw/ch/news/115/ap.htm"},{"content":"應該修觀音法門，把我們頭腦的成見──那種無形的垃圾洗乾淨，然後任何東西進去都是清淨的國土，都是甘露水，不然的話，即使我們很努力做很多事，都是為了我執，都是為了名利做。","date":"清海無上師以中文講於福爾摩沙台南 1988.5.13","url":"http://www.godsdirectcontact.org.tw/ch/news/115/ap.htm"},{"content":"幫助別人就是幫助自己，所以我們應該時時刻刻淨化意念，送出無條件的愛心和善意，而不求任何回報，這是最好的方法。\nTo help others is to help ourselves. We should try to purify our mind at all times, give our love and kindness unconditionally, and not expect anything in return. This is the best way.","date":"清海無上師","url":"http://www.godsdirectcontact.org.tw/ch/news/34/c-1.htm"},{"content":"時時都要無條件奉獻，千萬別濫用職位或特權為自己獲取任何東西或情感等等。那是我執作祟，魔王在騙你而已。\nYou do your best. And just always have to be unconditional, OK? Never take advantage or your privilege to gain anything for yourself emotionally or any otherwise. It’s just ego, just Maya cheating.\nTeleconference with Supreme Master Ching Hai and Supreme Master television staff (all vegans)","date":"清海無上師以英文和無上師電視台工作人員電話會議20180705","url":"http://suprememastertv.com/ch1/v/59283734528.html"},{"content":"我們隨時都要靠自己，真正要坦白、要修行，為了真的要解脫這個苦海，為了要多了解宇宙的情況。\nWe should, at all times, rely on ourselves, be truly frank, and practice, for the \nsake of being liberated from \"this sea of misery\" for the sake of enriching our knowledge of the universe.","date":"清海無上師","url":"http://www.godsdirectcontact.org.tw/ch/news/34/c-1.htm"},{"content":"真正尊重自己的人，也很尊重其他的人。他知道自己的價值在那裡，也知道人家的價值在那裡，那種人很好、很自信，但是不自滿。\nHe who truly respects himself will also respect others. He knows his own worthiness, just as he does others. This kind of person is fine, very confident, and never complacent.","date":"清海無上師","url":"http://www.godsdirectcontact.org.tw/ch/news/34/c-1.htm"},{"content":"我們自己造煩惱，所以每天痛苦，我們把學習的功課變成我們的刑罰，才那麼痛苦。師父教你們一個很簡單脫離苦海的方法－把痛苦的情況變成我們的功課，就像在學校學習一樣。\nWe create worries ourselves, that's why we are miserable every day. We turn lessons into punishments, that's why we are so unhappy. Master will show you a simple way to liberated from the \"sea of misery\" treat miseries as lessons, just like studying at school.","date":"清海無上師","url":"http://www.godsdirectcontact.org.tw/ch/news/34/c-1.htm"},{"content":"擁有什麼並不重要，能否知足才重要，任何情況都能滿足，就不會有問題。(p111)\nPossession is not important, contentedness is. Be contented in any situation, and problems will be kept away.(p111)\n忍辱是什麼呢？就是不管怎麼樣，都認清是自己的因果，不是別人的錯。(p108)\nWhat is meant by \"enduring insults\"? It means to be able to see clearly, in whatever situation, that it is our own karma, and not other's fault.(p108)\n一個人的好壞是看他的目的和他的心，不是看他的行動。(p109)\nWhether a person is good or bad should only be judged by his purpose \nand intention, and not his actions.(p109)\n公理很好，不過愛力才是最好。(p110)\nJustice is good, but love is the best.(p110)","date":"清海無上師","url":"http://www.godsdirectcontact.org.tw/ch/news/34/c-1.htm"},{"content":"用堅強的意志、維持好習慣，與高尚的人士在一起， 可以改掉許多壞習慣。\n清海無上師（原文為英文）","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/64/r-0.htm"},{"content":"如果你想成佛，如果你想再度認識自己高雅的品質，那就沒有其它選擇，只能自己持戒清楚，回到這條高雅的路上，因為你已經走離了這條路。\n清海無上師以英文講於柬埔寨Raising Center1996.7.19","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/67/i-2.htm"},{"content":"失去靈性力量比失去一千世肉身更糟，很難再找回靈性。找到明師已經千難萬難。如果失去靈性力量，甚至更慘，就會找不到別的明師。\n清海無上師以英文講於福爾摩沙20181226","date":"","url":"https://www.youtube.com/watch?v=OmRIozAy4xs&feature=youtu.be&t=1334"},{"content":"你們打坐時，智識要正直，時時默念五聖號，心無掛礙，不要想得到什麼，不要想趕快開悟，不要想獲得名利，也不要想出名，或成為明師。一無所求，只求解脫，只求了悟佛性，想成佛。\n清海無上師以英文講於福爾摩沙20181225","date":"","url":"http://suprememastertv.com/ch1/v/62831327466.html"},{"content":"我們需要回歸高貴的真我，變成很好、很有愛心及同情心又有智慧的眾生，我們需要成為那樣子的人，而當我們做越多我們的功課時，我們就能越快變成那樣的眾生，就是這樣。\n清海無上師以英文對外國同修開示於福爾摩沙西湖道場1995.7.13","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/49/p-1.htm"},{"content":"做世人的好榜樣\n清海無上師以中、英文講於福爾摩沙台北禪七 \n1994.05.23 （影帶編號#428）（MP3-CR15）\n我們應該修行，為社會做一個好的榜樣。我們不能怪社會那麼亂、怪別人那麼壞，而應該怪自己還沒有做一個好的榜樣。我們先做好了以後，別人就會跟隨，不要等別人而我們要先自己做。所以中國人才說：修 身、齊家，然後才能治國、平天下。真正的如是！","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/181/ap_2.htm"},{"content":"如果我們真的不執著任何世上的財產、名譽、虛名，那麼任何東西都會到我們這裡來。可是一旦我們被這世上的東西所奴役，我們就會永遠追在它後面跑，疲於奔命、耗盡心力，各種問題都找上門來了，還不一定得到任何東西。\n清海無上師以英文講於福爾摩沙西湖道場 1995.07.12（影帶編號#489）","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/172/mt_3.html"},{"content":"我們要相信上帝的力量，天天加強對上帝愛力的信心，以後我們就會越來越堅強。\n清海無上師以中文講於日本 2000.07.10","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/138/ap.htm"},{"content":"做任何利益上帝兒女的事，天堂都會給你很多點數；做任何傷害上帝兒女的事，就會被扣點；不只是有業障而已，還會被扣點，減損功德又造業障，然後等級就降低。\n清海無上師以中文講於國際聚會 2009.07.18","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/207/tip_30.htm"},{"content":"我們時時都要精進，任何時候有否定的感覺或想法，要馬上驅除。\n~清海無上師~","date":"清海無上師以英文透過網際網路視訊會議對美國休士頓同修開示 \n2002.07.28（影帶編號#745）","url":"http://www.godsdirectcontact.org.tw/ch/news/152/qa3.htm"},{"content":"上帝一直都在一旁守候，師父的力量也一直都在幫助你，只要打開心扉去接受，要相信師父的力量一直在幫助你。融入那股力量，與祂合而為一。\n清海無上師以英文透過網際網路視訊會議對美國洛杉磯同修開示 2002.07.21（影帶編號#745）","date":"","url":""},{"content":"如果我們修行好一點，我們裡面會跟師父很容易溝通，做事很順，我們的想法會跟師父想的一模一樣，這樣我會很高興，你們也會覺得很輕鬆、快樂！\n清海無上師 以中文講於柬埔寨 Raising Center 1996.7.19","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/69/a-1.htm"},{"content":"如果我們想要時時生活在天堂的境界，我們的行為就必須像天堂的眾生一般，這樣才能吸引天堂的加持過來。\n清海無上師以英文講於美國洛杉磯共修會 1997.07.08","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/168/mt1.htm"},{"content":"如果你們時時做好事，就會有越來越多的好事發生；好事越多，壞事就越不可能發生在你們身上，那時候好的能量會形成厚厚的圍牆包圍著你們，你們連想要做壞都很難。\n清海無上師以英文講於美國洛杉磯共修會 1997.07.08","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/168/mt1.htm"},{"content":"光和音是唯一可以保護我們自己的方法，也是上帝在我們來到這個世界前賦予我們唯一的利器，使我們記得上帝的國度，同時也可以化解所有阻礙我們回天國的困境和障礙。\n清海無上師以英文講於柬埔賽19960730","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/144/n-1.htm"},{"content":"我們疼愛別人並不是為了慈悲心、博愛，不需要講那種大話。我們疼愛別人，是因為自己想要舒服、想要快樂。我們愈送給別人愛心，人家愈愛我們。大家相親相愛的話，那好舒服啊！\n清海無上師以中文講於福爾摩沙西湖 1989年8月","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/61/c-1.htm"},{"content":"打坐就是要加滿我們的油箱，把聰明、智慧裝進去，這樣我們才知道怎麼做事。","date":"～清海無上師（原文為英文）","url":"http://www.godsdirectcontact.org.tw/ch/news/97/g-0.htm"},{"content":"我們只要繼續修行，就會越來越放下這些物質的東西，成為越來越高雅的人。","date":"清海無上師以中文開示於全球網路視訊會議 2002.08.03","url":"http://www.godsdirectcontact.org.tw/ch/news/137/mt.htm"},{"content":"不管誰讚嘆我們或侮辱我們，對我們來說根本沒什麼重要，主要就是我們認識自己，知道自己的品質，這才是最快樂的福報。","date":"清海無上師以中文開示於全球網路視訊會議 2002.08.03","url":"http://www.godsdirectcontact.org.tw/ch/news/137/mt.htm"},{"content":"每次無條件的幫助別人，或其他眾生，自己就會獲得提昇，靈魂會得到提昇，高貴品質會增加，你本身的愛力會發展。任何無條件的愛永遠澤被你自己、家人和世界。","date":"清海無上師以英文講於香港2019.07.28","url":"https://www.youtube.com/watch?v=yc54xckun_c"},{"content":"應改變否定的思考與表達習慣。想法和言論要時時肯定，即使這麼做沒效， 也不會損失什麼。 至少旁人聽到肯定的事會開心。何必說一些否定的事， 就算沒發生也不要說。所以我們應時時只說好事， 並希望它會成真，不管它是否成真， 生活還是得繼續，以肯定方式過生活，就會很開心。","date":"清海無上師以英文講於新地20190804","url":""},{"content":"幫助別人就是幫助自己，所以我們應該時時刻刻淨化意念，送出無條件的愛心和善意，而不求任何回報，這是最好的方法。\n~ 清海無上師 ~","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/34/c-1.htm"},{"content":"我們應該提昇到聖人的等級，要做到這樣，我們必須擁有慈悲心、愛心及諒解心，還要隨時無我奉獻。","date":"~ 清海無上師","url":"http://www.godsdirectcontact.org.tw/ch/news/115/ap.htm"},{"content":"你們吃飯的時候，要供養所謂的所有的明師。三代的明師，過去、現在、未來。如果沒有供養的話，就欠債很多。供養的話，就OK，可以吃。不過吃素的人而已啦。吃肉的人，供養沒用啊，因為明師他們不會吃肉的。\n清海無上師以中文開示於福爾摩莎新地2019.03.10\nhttps://www.youtube.com/watch?v=MWrQTLQbWyg&feature=youtu.be&t=1639","date":"","url":"https://www.youtube.com/watch?v=MWrQTLQbWyg&feature=youtu.be&t=1639"},{"content":"堅強才能夠出家，外面誘惑很多，漂亮女孩子，好看的男生，多數的人可以走來走去環遊世界，何必出家那麼辛苦呢？他真的有理想，要出家，他要解脫生死。所以你們要尊重他，要幫助他保持他那個乾淨的磁場。\n清海無上師以中文開示於福爾摩沙新地2019.03.10\nhttp://suprememastertv.com/ch1/v/67876482415.html","date":"","url":"http://suprememastertv.com/ch1/v/67876482415.html"},{"content":"人身難得，要打坐、要修行，沒有別的更重要。你不知道明天死不死，趕快，簡單生活，簡單化的生活。\n清海無上師以中文開示於福爾摩沙新地2019.03.10\nhttp://suprememastertv.com/ch1/v/68079605836.html","date":"","url":"http://suprememastertv.com/ch1/v/68079605836.html"},{"content":"不論我們去哪裡，都要帶給其他人快樂、平靜與和諧，那時我們就創造了天堂。\n清海無上師以英文講於美國德州奧斯汀共修會1994.8.14\nhttp://magazine.godsdirectcontact.net/chinese_t/43/g-1.htm","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/43/g-1.htm"},{"content":"我們修行的人要進步最好是要每天分析，每天要檢討自己、警告自己，看那裡我們有缺點，那裡我們不合邏輯，那個地方我處理不對，我一定不會再做這個樣子，要檢討自己為什麼這樣處理不對，要謹慎哦！要提醒自己啊！","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/89/b-0.htm"},{"content":"要記住，目光要遠大，要想到全世界，想到廣博的愛，像上帝一般思考，至少像上帝的子女般思考，絕對不要只為自己想","date":"清海無上師以英文講於墨西哥坎昆20101211","url":"http://edenrules.com/index.php?route=product/product&product_id=482"},{"content":"你們一直都有師父在一起，我永遠在你們心中，我希望你們成為女的上帝、男的上帝，因為你們本來如是！","date":"清海無上師以英文講於墨西哥坎昆20101211","url":"http://www.smchbooks.com/new-c/dvd/dvd953.htm"},{"content":"多打坐，好嗎?認為不重要的事就放下，在家和在社會上，只做絕對必要的事，你們就會看到更多境界，比我能告訴你們的還多。\n清海無上師以英文講於福爾摩沙新地2019/8/18","date":"清海無上師以英文講於福爾摩沙新地2019/8/18","url":"https://www.youtube.com/watch?v=6CkLT-mXUys&feature=youtu.be&t=850"},{"content":"你們要盡本分，最好的本分就是傳揚真理和純素主義，幫助世界獲得和平，以及幫助動物不再受苦，但不包括他們生命必經的自然現象。","date":"清海無上師以英文講於福爾摩沙新地2019/8/18","url":"https://www.youtube.com/watch?v=6CkLT-mXUys&feature=youtu.be&t=1205"},{"content":"我們必須這麼做，一心一意志在了悟自我。暫且不談幫助其他眾生那類的事，先了悟自己，先知道自己是誰。\n清海無上師以英文開示於福爾摩沙新地20190818\nhttps://www.youtube.com/watch?v=6CkLT-mXUys&feature=youtu.be&t=1144","date":"清海無上師以英文講於福爾摩沙新地2019/8/18","url":"https://www.youtube.com/watch?v=6CkLT-mXUys&feature=youtu.be&t=850"},{"content":"你們應該把握時間，把握當人的寶貴一生，了悟自己的真我。如果想要更多內在體驗，想進一步了悟，就必須為此而努力。別讓周遭的任何幻境，誘惑你們、讓你們分心，干擾或障礙你們。","date":"清海無上師以英文講於福爾摩沙新地2019/8/18","url":"https://www.youtube.com/watch?v=6CkLT-mXUys&feature=youtu.be&t=850"},{"content":"最好是別轉生到這個世界，我勸你們最好不要。要儘快「回家」，遠離這所監獄，別再回來。你們如果循規蹈矩，我就保證你們不會回來。","date":"清海無上師以英文講於福爾摩沙新地2019/8/18","url":"https://www.youtube.com/watch?v=6CkLT-mXUys&feature=youtu.be&t=850"},{"content":"上帝一直都在，只是我們太過度心急了，有時是煩惱太多。要有耐心！這就是你們生命過程中必須要突破的困難，是你們命中注定的任務──經歷重重難關，這也是你們賺取天國加持的方法。","date":"清海無上師以英文講於英國倫敦禪四 1997.8.24","url":"http://www.godsdirectcontact.org.tw/ch/news/127/mt2.htm"},{"content":"只要持戒，盡量打坐，持純素、當好人，至少不傷害任何人，那樣就安全了。師父的力量，會處裡剩下的部分。\n清海無上師以英文講於福爾摩沙20181228","date":"","url":""},{"content":"我們如果誠心，那份決心和誠心會淨化我們自己，我們周遭和周圍磁場就沒有藩籬，佛可以很容易加持並提升我們。\nIt’s just because if we are sincere, we will purify ourselves with that determination and sincerity. And then we have no border around us, around our magnetic field, so the Buddha can easily bless us and help us to uplift. the Buddhas or the Saints.","date":"清海無上師以英文開示於福爾摩沙新地20190825","url":"https://youtu.be/_isn6S5-sOI?t=575"},{"content":"如果我們為了一些高雅目標，不帶絲毫低等動機，誠心向他們懇求，他們永遠都會回應。因此，陷入絕境時，儘管祈求吧！向在世或過去諸佛祈求，他們都會幫忙，你永遠不孤單。\nIf we pray to Them earnestly, sincerely, without any low motive, for a noble purpose, They always respond. So, in any situation when you’re really desperate, just pray. Pray to the living Buddhas or the past Buddhas, They all will help. You are never alone.\n清海無上師以英文開示於福爾摩沙新地20190825","date":"清海無上師以英文開示於福爾摩沙新地20190825","url":"https://www.youtube.com/watch?v=_isn6S5-sOI&feature=youtu.be&t=693"},{"content":"努力也算是一種成功，因為表示未曾離開過道，還是在求道路上，成功與否，天堂會幫忙，努力不懈已經是最好的，因為我們在這個世界，只能努力而已。甚至在歡愉的時刻，仍記得自己的目的是開悟。\n清海無上師以英文開示於福爾摩沙新地20190825","date":"","url":"https://www.youtube.com/watch?v=_isn6S5-sOI&feature=youtu.be&t=833"},{"content":"我們必須保護地球、樹木、海洋、河流，不只是為了自己和後代的子子孫孫，也因為我們現在學習更慈悲、更有愛心地善待所有眾生。\n清海無上師以英文開示於福爾摩沙新地20181228","date":"","url":"https://www.youtube.com/watch?v=uMmBUG99-Yo&feature=youtu.be&t=1950"},{"content":"我們內邊有佛的力量，我們內邊有天堂，我們越發展這股力量，就會記起越多，我們已經擁有這股力量，只要透過打坐，就會記起更多，就能加持世界更多和平。\n清海無上師以英文開示於福爾摩沙新地20181228","date":"","url":"https://youtu.be/uMmBUG99-Yo?t=1640"},{"content":"請常存感恩的心，我們越心懷感激，就越得到加持；越記得這些高貴眾生的慈愛，我們也會越充滿慈愛。\n清海無上師以英文講於南非開普敦國際禪三1999.11.29","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/150/pw4.htm"},{"content":"要多謙卑心，隨時還是要禱告，祈求十方三世明師幫忙，讓我們快點突破。","date":"","url":""},{"content":"只有內邊開悟還不夠好。誰會在意你成佛與否？如果你沒有愛心助人，擴展你的良知或智慧，在每件小事上幫助別人。\n~清海無上師以英文講於法國20150921~","date":"","url":"http://suprememastertv.com/ch1/v/76282443802.html"},{"content":"你們真的是上帝跟佛的兒女，任何情況都要忍耐，只要記得修行。","date":"清海無上師以悠樂文講於歐洲20081214","url":"https://youtu.be/np2cXEytJcA?t=1199"},{"content":"放下所有爭執，誰好，誰壞，不要管，一定要專心修行，拯救自己跟別人。如果一直煩惱別人個性的瑣碎細節，就會沒完沒了。人類的我執很大，人人都有我執，不可能全部砍掉，我們修行人仍然有我執，但比沒修行的人少很多。","date":"清海無上師以悠樂文講於歐洲20081214","url":"https://www.youtube.com/watch?v=np2cXEytJcA&feature=youtu.be&t=1162"},{"content":"謹守道德，不要生氣任何人，一切都是我們的因果和世界的共業。如果是我們的業障就要忍耐，並感謝上帝和佛菩薩給我們機會清付債務","date":"清海無上師以悠樂文講於歐洲20081214","url":"http://edenrules.com/index.php?route=product/product&filter_name=%E9%96%BB%E7%BE%85%E7%8E%8B%E5%AF%A9%E5%88%A4%E7%9A%84%E6%95%85%E4%BA%8B&filter_description=true&filter_category_id=0&product_id=128"},{"content":"我們決心修行，發揮愛心、原諒、寬容、智慧，也就是了悟自性。","date":"清海無上師以悠樂文講於歐洲20081214","url":"http://edenrules.com/index.php?route=product/product&filter_name=%E9%96%BB%E7%BE%85%E7%8E%8B%E5%AF%A9%E5%88%A4%E7%9A%84%E6%95%85%E4%BA%8B&filter_description=true&filter_category_id=0&product_id=128"},{"content":"我們有觀音法門，有師父指引我們，她隨時在我們身邊。不管你們有沒有看到我，我一直都在你們身邊。","date":"清海無上師以悠樂文講於歐洲20081214","url":"http://edenrules.com/index.php?route=product/product&filter_name=%E9%96%BB%E7%BE%85%E7%8E%8B%E5%AF%A9%E5%88%A4%E7%9A%84%E6%95%85%E4%BA%8B&filter_description=true&filter_category_id=0&product_id=128"},{"content":"不管什麼情況都要忍耐，要有耐心，多修行以後情況自然會改變。情況通常會改變，我們的業障會改。所以今天跟明天會不一樣，什麼都不要擔心。","date":"清海無上師以悠樂文講於歐洲20081214","url":"http://edenrules.com/index.php?route=product/product&filter_name=%E9%96%BB%E7%BE%85%E7%8E%8B%E5%AF%A9%E5%88%A4%E7%9A%84%E6%95%85%E4%BA%8B&filter_description=true&filter_category_id=0&product_id=128"},{"content":"何事都是修行，當我們把每件事、每件工作都做好，就是打坐、就是修行，那就是對上帝、對宇宙的貢獻，同時也是學習經驗，不只是打坐而已。","date":"清海無上師（原文為英文）","url":"http://www.godsdirectcontact.org.tw/ch/news/82/b-0.htm"},{"content":"從現在起，必須自己負責，要控制自己的否定習性，這些仍殘存在人人內邊。我們有否定和肯定面向，從現在起要多用肯定面，凡是否定事物，必須知道那不是自己，如果有錯念，要馬上糾正自己：「不，這不是我！這不是我，這不是我，我不要那樣。」要擺脫否定事物，可以向天神祈求，祂們能夠幫助你。\n清海無上師以英文講於福爾摩沙新地2019.11.24","date":"Spoken by Supreme Master Ching Hai, Tainan, Formosa\nMay 13, 1988\n(Originally in Chinese)","url":"https://suprememastertv.com/ch1/v/78600366442.html"},{"content":"我們幫忙人家修行，就是幫忙我們附近的氣氛和平，讓我們自己修行也好。我們即使不修行那麼多，但是大家都和平、有很安穩的和諧氣氛，那我們的修行也會進步很快。 清海無上師以中文講於福爾摩沙台南 1987.12.2","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/96/d-2.htm"},{"content":"你們打坐的時候，試著去忘掉你的知識、頭腦、呼吸和身體的感受，只要打坐就好，要記得那最重要的一點。 ~ 清海無上師 ~","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/82/b-0.htm"},{"content":"要了脫生死只有一條路：跟佛菩薩一樣的品質，才收到他們的加持力。","date":"清海無上師 (原文為中文)","url":"http://magazine.godsdirectcontact.net/chinese_t/76/c-0.htm"},{"content":"高等眾生不一定都住在天堂，當你內心有愛、很單純、有同情心，內心很平靜時，你就是高等眾生了。","date":"清海無上師","url":"http://www.godsdirectcontact.org.tw/ch/news/82/content.htm"},{"content":"☆任何不好的習慣要儘量砍掉；任何你覺得對你好的 ，比較理想、高貴的，要盡力去實現──盡你的能力、你的時間、你的誠心和努力，去實踐它。\n☆Whatever undesirable habits, you try to cut down; and whatever you think it's good for you -- more ideal, more noble -- then you try to fulfill in your capacity, in your time, in your own sincerity and endeavor.","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/85/"},{"content":"☆我們的抉擇決定了我們的高雅或卑下，如果我們不和自己奮鬥、不努力改善自己的思想、概念、工作或行為，那我們會一直停留在以前的等級。 \n☆Our choices make us noble or lowly. If we do not struggle within ourselves and try to better our thinking, our ideal, our work or our actions, then we will always remain at the same level as before.","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/85/"},{"content":"上帝就是偉大的愛力，我們發揮這種愛力越多，也就越接近上帝的品質，這就是了悟上帝的真義。\n清海無上師以英文講於美國洛杉磯1998.12.18（DVD#642）\nhttp://www.godsdirectcontact.org.tw/ch/news/181/ap_2.htm","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/181/ap_2.htm"},{"content":"要長生不老有一個方法，師父可以告訴你們，什麼世界可以長生，因為那些世界永遠不會被破壞，我們才能夠長生。我們要超三界，要離開這個無常的世界，要得到長生不老的話，應該修長生不老的法門，應該找到，走到這個長生不老的世界，我們的夢才變成真的。","date":"清海無上師以中文講於福爾摩沙台南19880707","url":"https://www.youtube.com/watch?v=Lt6nHSyjE70&feature=youtu.be&t=410"},{"content":"只要好好修，每天打坐兩個半小時，智慧自然就會展現。到時我們自己會了悟，我們就是自己的明師，只要修這個法門就一定會了悟。\n清海無上師以悠樂文講於美國加州洛杉磯國際禪三1998.12.17","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/178/mt_0.htm"},{"content":"清海無上師（原文為中文）\n☆並非看到境界才是天堂。我們自己得到善良的心、單純的心，貪、瞋、痴忽然間不見，慾望也沒有，智慧又開，那個就是天堂！","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/85/"},{"content":"時時讓自己的身口意都保持肯定，盡力這樣做，以保護自己，那你就能為自己創造一個可以活動的美好之家，不論你到哪裡，都帶著光、好的能量和好的振動力。\n清海無上師以英文講於美國洛杉磯國際禪三 1998.12.16-18","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/132/qa4.htm"},{"content":"不要讓那些幻想的快樂騙我們，讓我們迷路，應該每天往前走在真理的路上。","date":"(Originally in Chinese)","url":"http://www.godsdirectcontact.org.tw/ch/news/89/b-0.htm"},{"content":"我們有很多心懷好意的人，真的很多。但是光有好意還不夠！我們必須有智慧；必須集中精神。修行絕對不能有我執。應該時時渴望更精進學習。\n清海無上師以英文講於福爾摩沙20191215","date":"","url":"https://suprememastertv.com/ch1/v/80683275339.html"},{"content":"修觀音法門的人生活滿足適意，因為他們別無所求，修行愈多，欲望會愈少，修行愈多，祈求也愈少。先找到內在的天國，然後一切將隨之降臨。\n清海無上師以英文講於泰國清邁邦萱曉大飯店19941204","date":"","url":"http://www.godsdirectcontact.org.tw/ch/pearl_wisdom/qa/10-10.htm"},{"content":"你們打坐時，智識要正直，時時默念五聖號，心無掛礙，不要想得到什麼，不要想趕快開悟，不要想獲得名利，也不要想出名，或成為明師，一無所求，只求解脫，只求了悟佛性。\n清海無上師以英文講於福爾摩沙20181225","date":"","url":"http://suprememastertv.com/ch1/v/62831327466.html"},{"content":"我們偶爾集合起來打坐、多充電，然後我們充滿光亮、充滿愛力，我們回家才能夠利益社會、利益國家、利益親戚朋友。\n清海無上師以中文講於福爾摩沙苗栗西湖禪七 1989.7.29-8.6","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/105/b-1.htm"},{"content":"我們本人就代表著上帝的愛力、代表著上帝。每次當我們忘記時，就要想辦法再記起來，如此我們才會變得偉大、才能了悟上帝。 ～清海無上師以英文講於美國洛杉磯 1998.12.18","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/122/ap.htm"},{"content":"外表不一定能夠表達我們內邊的境界，最重要的是我們知道我們的心有沒有動搖、有沒有乾淨，這才重要。 \n Outer appearances do not necessarily reflect our inner level; it is most important to know whether our mind is pure and not wavering.","date":"清海無上師（原文為英文）","url":"http://magazine.godsdirectcontact.net/chinese_t/86/"},{"content":"如果你們無條件佈施，是出於愛心、想幫忙，為了要帶給他人快樂，你們的能量會無比美好，別人甚至覺得更舒服，你們的光會閃亮耀眼。 清海無上師以英文講於法國20150824","date":"","url":"https://suprememastertv.com/ch1/v/63378432776.html"},{"content":"想要幫師父或任何人之前，你一定要打坐好，而且要瞭解上帝的教理，先把自己變成一個很有價值、有效率的工具，再為這世界提供幫助。\n~ 清海無上師 ~\nhttp://www.godsdirectcontact.org.tw/ch/news/82/b-0.htm","date":"清海無上師（原文為英文）","url":"http://www.godsdirectcontact.org.tw/ch/news/82/b-0.htm"},{"content":"只要我們沒有放棄肉食的習慣，我們就是在傷害地球，而且最終還會傷害到自己和後代子孫，因此我們大家都應該棄葷茹素，越快越好！\n清海無上師以英文講於德國杜塞道夫杜易斯堡歐洲禪三 2006.12.31","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/183/ms_12.htm"},{"content":"做每一件事都是一種奉獻，沒有一件工作是卑下的，也沒有骯髒的工作。沒有一件事不值得你關心，因為這些事構成整個宇宙，而宇宙的每一小部分都屬於 整體，我們照顧一部分也就是照顧整體。","date":"清海無上師（原文為英文）","url":"http://www.godsdirectcontact.org.tw/ch/news/90/t-0.htm"},{"content":"★我們想超越普通人的生活，進一步成為一個聖人，利益整個宇宙，那才是做一個堂堂正正的君子的涵意，也是唯一的目的。 \n We want to step beyond human life to become a saintly being, beneficial to the whole universe, That is the meaning of being a righteous person. That's the only purpose.","date":"清海無上師（原文為英文）","url":"http://magazine.godsdirectcontact.net/chinese_t/86/"},{"content":"我們對自己有信心，對明師的力量有信心，就沒有任何困難無法克服。\n~ 清海無上師 ~\nhttp://magazine.godsdirectcontact.net/chinese_t/86/e-0.htm","date":"","url":"There's nothing we cannot solve with faith in ourselves or in the Master power."},{"content":"要有絕對的信心和誠心，唯有當我們有絕對的信心和誠心時，才能真正瞭解明師，並達到更高等級，回歸輝煌偉大的本我。","date":"清海無上師以英文講於福爾摩沙新地2019.02.05","url":"https://suprememastertv.com/ch1/v/54656447428.html"},{"content":"我們的思想應該肯定、樂觀、勇敢一點，就會變
