<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清海無上師甘露法語播放器</title>
<style>
:root {
  --fg:#eef7f6;
  --muted:rgba(240,248,248,.82);
  --card:rgba(255,255,255,.16);
  --card2:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.22);
  --shadow:0 18px 60px rgba(0,0,0,.28);
}
* { box-sizing:border-box; }
html,body {
  margin:0; padding:0; height:100%; overflow:hidden;
  font-family:"Noto Serif TC","Microsoft JhengHei",serif;
  color:var(--fg);
}
html {
  background: radial-gradient(circle at center, rgba(120,160,140,0.28), rgba(0,0,0,0.88));
}
body {
  background: transparent;
}
body {
  display:grid; place-items:center;
}
.shell {
  position:relative;
  width:min(92vw,430px);
  aspect-ratio:9/16;
  border-radius:30px;
  overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.45);
  background:#0c1113 center/cover no-repeat;
}
.bg {
  position:absolute; inset:0;
  background:center/cover no-repeat;
  transition:opacity 1.6s ease;
}
#bgA{opacity:1} #bgB{opacity:0}
.mist {
  position:absolute; inset:0;
  background:
    radial-gradient(circle at top right, rgba(255,230,185,.20), transparent 28%),
    radial-gradient(circle at left bottom, rgba(180,255,230,.12), transparent 25%),
    linear-gradient(to bottom, rgba(15,22,24,.08), rgba(6,14,17,.36));
  backdrop-filter: blur(2px);
}
.topbar {
  position:absolute; left:16px; right:16px; top:16px; z-index:5;
  display:flex; justify-content:space-between; align-items:flex-start;
}
.datetime {
  min-width:132px; padding:10px 14px;
  border-radius:18px; background:var(--card2); border:1px solid var(--line);
  backdrop-filter: blur(10px); box-shadow:var(--shadow);
  font-size:12px; line-height:1.5; letter-spacing:.4px; text-decoration:none !important; color:var(--fg) !important;
}
.datetime .line1{font-size:13px; font-weight:600}
.iconbar {display:flex; gap:10px}
.icon-btn {
  width:38px; height:38px; border:none; border-radius:50%;
  background:var(--card2); border:1px solid var(--line);
  backdrop-filter: blur(10px); color:var(--fg);
  display:grid; place-items:center; cursor:pointer;
  box-shadow:var(--shadow);
}
.icon-btn svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.title-wrap {
  position:absolute; top:72px; left:50%; transform:translateX(-50%); z-index:4;
  width:84%; text-align:center;
}
.lotus-mark {
  width:64px; height:24px; margin:0 auto 8px; opacity:.96;
}
.title {
  font-size:19px; letter-spacing:3px; font-weight:700;
  text-shadow:0 2px 12px rgba(0,0,0,.18);
}
.search-wrap {
  position:absolute; top:150px; left:50%; transform:translateX(-50%);
  width:82%; z-index:6;
}
.search-box {
  width:100%; display:flex; align-items:center; gap:10px;
  padding:12px 16px;
  border-radius:26px; border:1px solid var(--line); background:rgba(255,255,255,.18);
  backdrop-filter: blur(12px); box-shadow:var(--shadow);
}
.search-box input {
  flex:1; border:none; outline:none; background:transparent;
  color:var(--fg); font-size:15px;
}
.search-box input::placeholder { color:rgba(240,248,248,.78); }
.search-box svg { width:18px; height:18px; stroke:rgba(240,248,248,.84); fill:none; stroke-width:1.8 }
.search-panel {
  display:none;
  margin-top:10px; max-height:228px; overflow:auto;
  border-radius:18px; border:1px solid var(--line);
  background:rgba(8,22,28,.58); backdrop-filter: blur(16px);
  box-shadow:var(--shadow); padding:8px 0;
}
.search-panel::-webkit-scrollbar{display:none}
.section-label {
  padding:8px 14px 4px; font-size:12px; color:rgba(245,251,251,.72);
}
.search-item {
  padding:10px 14px; cursor:pointer; border-top:1px solid rgba(255,255,255,.06);
}
.search-item:hover { background:rgba(255,255,255,.08); }
.search-item .meta {
  font-size:11px; color:rgba(245,251,251,.62); margin-top:4px;
}
.quote-card {
  position:absolute; top:205px; left:50%; transform:translateX(-50%);
  width:84%; height:360px;
  padding:22px 22px 54px; border-radius:28px;
  background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.20);
  backdrop-filter: blur(14px); box-shadow:var(--shadow); z-index:4;
  display:flex; flex-direction:column;
}
.decor-line {
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin-bottom:12px; opacity:.78;
}
.decor-line::before, .decor-line::after {
  content:""; display:block; width:88px; height:1px; background:rgba(255,255,255,.25);
}
.decor-lotus { width:16px; height:16px; opacity:.95; }
.quote-text {
  flex:1; min-height:0; overflow:auto; scrollbar-width:none;
  text-align:center; white-space:pre-wrap;
  font-size:clamp(16px, 3.15vw, 18px); line-height:1.9;
  text-shadow:0 1px 4px rgba(0,0,0,.12);
  opacity:1; transition:opacity 1.6s ease;
}
.quote-text::-webkit-scrollbar{display:none}
.source {
  margin-top:16px; text-align:center; display:block;
  font-size:12px; color:rgba(246,252,252,.92); text-decoration:none;
  line-height:1.5;
}
.source.disabled { pointer-events:none; opacity:.72; }
.next-btn { display:none !important; }
.next-btn svg { width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.player {
  position:absolute; left:14px; right:14px; bottom:28px; z-index:5;
  padding:10px 12px 8px; border-radius:22px;
  background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.18);
  backdrop-filter: blur(16px); box-shadow:var(--shadow);
}
.player-top { display:flex; gap:10px; align-items:flex-start; }
.cover-col { width:66px; flex:0 0 66px; display:flex; flex-direction:column; align-items:center; gap:6px; }
.cover {
  width:58px; height:58px; border-radius:12px; object-fit:cover;
  flex:0 0 auto; box-shadow:0 8px 24px rgba(0,0,0,.2);
}
.player-source {
  font-size:10px; line-height:1.28; color:var(--fg); text-decoration:none; text-align:center; opacity:.92;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.song-area { flex:1; min-width:0; }
.song-title { font-size:14px; font-weight:700; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.song-meta { margin-top:2px; font-size:11px; color:rgba(240,248,248,.75); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.progress-wrap { margin-top:8px; }
.progress {
  width:100%; appearance:none; height:3px; border-radius:999px; background:rgba(255,255,255,.28); outline:none;
}
.progress::-webkit-slider-thumb, .volume-slider::-webkit-slider-thumb {
  appearance:none; width:12px; height:12px; border-radius:50%; background:#fff; box-shadow:0 2px 10px rgba(0,0,0,.25);
}
.time-row {
  display:flex; justify-content:space-between; margin-top:3px;
  font-size:10px; color:rgba(240,248,248,.72);
}
.controls {
  margin-top:6px; display:flex; align-items:center; justify-content:center; gap:12px;
}
.control-btn {
  border:none; background:none; color:var(--fg); cursor:pointer; padding:0; display:grid; place-items:center;
}
.control-btn svg { width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.play-btn {
  width:46px; height:46px; border-radius:50%;
  background:rgba(255,255,255,.22); border:1px solid rgba(255,255,255,.28);
  box-shadow:0 8px 24px rgba(0,0,0,.16);
}
.repeat-text{
  font-size:17px; font-weight:700; line-height:1;
}
.next-small {
  position:absolute; right:14px; bottom:14px; z-index:6;
  width:28px; height:28px; border-radius:50%; border:none;
  background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.20);
  backdrop-filter: blur(10px); color:var(--fg); display:grid; place-items:center; cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,.16);
}
.next-small svg { width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.volume-hint {
  position:absolute; right:18px; bottom:110px; z-index:8; display:none;
  padding:8px 10px; border-radius:12px;
  background:rgba(6,20,24,.78); border:1px solid rgba(255,255,255,.16); backdrop-filter: blur(14px);
  font-size:11px; text-align:center; white-space:nowrap;
}
.toast {
  position:absolute; left:50%; transform:translateX(-50%);
  bottom:176px; z-index:7; display:none;
  max-width:80%; padding:10px 14px; border-radius:16px;
  background:rgba(6,20,24,.74); border:1px solid rgba(255,255,255,.16); backdrop-filter: blur(14px);
  font-size:12px; text-align:center;
}

/* ===== 手機播放器收合與音量修正 ===== */
.restore-player-btn{
  display:none;
  width:44px;
  height:44px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.18);
  color:var(--fg);
  cursor:pointer;
  align-items:center;
  justify-content:center;
  font-size:18px;
  box-shadow:0 8px 20px rgba(0,0,0,.18);
}
#miniPlayerBtn svg{ width:18px; height:18px; }
.player{
  transition:width .25s ease, height .25s ease, padding .25s ease, border-radius .25s ease, right .25s ease, bottom .25s ease;
}
.player.minimized{
  left:14px;
  right:auto;
  bottom:18px;
  width:44px;
  height:44px;
  padding:0;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:visible;
}
.player.minimized .player-top,
.player.minimized .volume-hint{
  display:none !important;
}
.player.minimized .restore-player-btn{
  display:flex;
}
@media (max-width: 640px){
  .player.minimized{
    left:12px;
    right:auto;
    bottom:16px;
  }
  .volume-hint{
    right:12px;
    bottom:118px;
    font-size:10px;
  }
}


/* ===== 背景模糊鋪滿 ===== */
html::before {
  content: "";
  position: fixed;
  inset: 0;
  background: url("BG/bg1.png") center center / cover no-repeat;
  filter: blur(20px) brightness(0.9);
  transform: scale(1.08);
  z-index: -2;
}

html::after {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.08);
  z-index: -1;
}

html, body {
  background: transparent !important;
}


/* ===== 外圍背景同步模糊 ===== */
#outerBlurBg{
  position: fixed;
  inset: 0;
  background: url("BG/bg1.png") center center / cover no-repeat;
  filter: blur(20px) brightness(0.92);
  transform: scale(1.08);
  z-index: -3;
  transition: background-image .8s ease, opacity .8s ease;
}
html::before,
html::after{
  content:none !important;
}
body::before{
  content:"";
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.08);
  z-index: -2;
  pointer-events:none;
}
html, body {
  background: transparent !important;
}

</style>
</head>
<body>
<div id="outerBlurBg"></div>
<div class="shell" id="app">
  <div id="bgA" class="bg"></div>
  <div id="bgB" class="bg"></div>
  <div class="mist"></div>

  <div class="topbar">
    <a class="datetime" id="datetime" href="https://www.cwa.gov.tw/V8/C/W/Town/Town.html?TID=1000502" target="_blank" rel="noopener noreferrer"></a>
    <div class="iconbar">
      <button class="icon-btn" id="bgBtn" title="更換背景" aria-label="更換背景">
        <svg viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M4 7l4.5 4.5 3-3 6.5 6.5"/><path d="M16 5h.01"/></svg>
      </button>
      <button class="icon-btn" id="tvBtn" title="無上師電視台" aria-label="無上師電視台">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 20h8"/></svg>
      </button>
      <button class="icon-btn" id="adminBtn" title="後台登入" aria-label="後台登入">
        <svg viewBox="0 0 24 24"><path d="M15 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="3.5"/><path d="M18 8v6"/><path d="M15 11h6"/></svg>
      </button>
    </div>
  </div>

  <div class="title-wrap">
    <svg class="lotus-mark" viewBox="0 0 120 48">
      <path d="M60 43c8-10 8-18 0-28-8 10-8 18 0 28Z" fill="none" stroke="rgba(245,251,251,.9)" stroke-width="2"/>
      <path d="M60 43c16-6 20-18 10-32-16 4-21 15-10 32Z" fill="none" stroke="rgba(245,251,251,.8)" stroke-width="2"/>
      <path d="M60 43c-16-6-20-18-10-32 16 4 21 15 10 32Z" fill="none" stroke="rgba(245,251,251,.8)" stroke-width="2"/>
    </svg>
    <div class="title">清海無上師甘露法語</div>
  </div>

  <div class="search-wrap">
    <div class="search-box">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="searchInput" type="text" placeholder="搜尋法語或音樂…">
    </div>
    <div id="searchPanel" class="search-panel"></div>
  </div>

  <div class="quote-card">
    <div class="decor-line">
      <svg class="decor-lotus" viewBox="0 0 24 24">
        <path d="M12 20c3-4 3-7 0-11-3 4-3 7 0 11Z" fill="none" stroke="rgba(245,251,251,.8)" stroke-width="1.4"/>
        <path d="M12 20c6-2 7-7 4-12-5 2-7 5-4 12Z" fill="none" stroke="rgba(245,251,251,.8)" stroke-width="1.4"/>
        <path d="M12 20c-6-2-7-7-4-12 5 2 7 5 4 12Z" fill="none" stroke="rgba(245,251,251,.8)" stroke-width="1.4"/>
      </svg>
    </div>
    <div class="quote-text" id="quoteText">載入中…</div>
    <a id="sourceLink" class="source disabled" href="#" target="_blank" rel="noopener noreferrer"></a>
    <button id="nextQuoteSmall" class="next-small" aria-label="換一句"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0 2 5.5"/><path d="M20 4v7h-7"/></svg></button>
  </div>

  <button class="next-btn" id="nextQuoteBtn" aria-label="換一句">
    <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0 2 5.5"/><path d="M20 4v7h-7"/></svg>
  </button>

  <div class="toast" id="toast"></div>

  <div class="player" id="player">
    <button id="restorePlayerBtn" class="restore-player-btn" aria-label="展開播放器">♫</button>
    <div class="player-top">
      <div class="cover-col">
        <img class="cover" id="cover" alt="cover">
        <a class="player-source" href="https://edenrules.com/index.php?route=common/home&rum=676125" target="_blank" rel="noopener noreferrer"><span>音樂來源</span><span>伊甸園</span></a>
      </div>
      <div class="song-area">
        <div class="song-title" id="songTitle">尚未播放</div>
        <div class="song-meta" id="songMeta">請點播放</div>
        <div class="progress-wrap">
          <input class="progress" type="range" id="progressBar" min="0" max="100" value="0">
          <div class="time-row"><span id="currentTime">00:00</span><span id="durationTime">00:00</span></div>
        </div>
        <div class="controls">
          <button class="control-btn" id="repeatBtn" aria-label="循環模式"><span class="repeat-text" id="repeatText">1</span></button>
          <button class="control-btn" id="prevBtn" aria-label="上一首">
            <svg viewBox="0 0 24 24"><path d="M11 19L2 12l9-7v14Z"/><path d="M22 19 13 12l9-7v14Z"/></svg>
          </button>
          <button class="control-btn play-btn" id="playBtn" aria-label="播放暫停">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7Z"/></svg>
          </button>
          <button class="control-btn" id="nextBtn" aria-label="下一首">
            <svg viewBox="0 0 24 24"><path d="m13 19 9-7-9-7v14Z"/><path d="M2 19 11 12 2 5v14Z"/></svg>
          </button>
          <button class="control-btn" id="muteBtn" aria-label="音量調整">
            <svg id="muteIcon" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M18.5 8.5a5 5 0 0 1 0 7"/><path d="M15.5 11a2 2 0 0 1 0 2"/></svg>
          </button>
          <button class="control-btn" id="miniPlayerBtn" aria-label="縮小播放器">
            <svg viewBox="0 0 24 24"><path d="M6 12h12"/><path d="M12 6v12"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div id="volumeHint" class="volume-hint">點喇叭切換音量，長按可靜音</div>
  </div>

<script>
const QUOTES = [{"content":"完美的人，他知道自己的優點和缺點，他把缺點壓下來，放在一邊或是妥善控制，需要的時候才拿出來用；優點他就繼續發展，為了利益別人、利益自己，那才是完美的人。","date":"","url":""},{"content":"在還沒達到這個完全由內在感應來溝通的等級之前，我們必須多忍耐，彼此多包容，大家要互相疼愛，這才是最重要的。也許我們偶爾會不高興或生氣對方，但是愛永遠勝過一切，我們終究會和好如初，重新團圓。","date":"DVD745","url":"http://edenrules.com/index.php?route=product/product&filter_name=745&filter_category_id=0&product_id=880"},{"content":"如果一定要講話，就談上帝或談些有益的事情，才能在空氣中產生肯定的振動力，為世界的和諧、為你們自己靈性的提昇、也為你們的鄰居們做一份貢獻。","date":"清海無上師以英文講於福爾摩沙西湖 1995.06.06（影帶編號#478）","url":""},{"content":"上帝給我很多東西，並非要讓我多吃多睡，而是要讓我分享出去。就像我們在城裡建大水塔，並不是為了把水保留在那裡，而是為了將水資源分享給城裡所有的居民。","date":"DVD676","url":""},{"content":"你們修行好，講一句話，會給別人很大的福報，看他一眼，會給他很多因緣，結佛緣，這樣子是你們的神通。","date":"","url":""},{"content":"如果任何情況、任何的關係會提醒我們隨時修行，提醒我們自己有佛性在裡面，那就是好的關係、好的愛情、好的感情。如果我們跟什麼人有關係以後，我們卻愈來 愈忘記上帝，只會愈來愈記得那個人，忘記佛、忘記修行，那我們就知道那個關係不好。好的關係要保留，不好的關係我們要改變它，或是把它中斷。","date":"","url":""},{"content":"如果我們曉得我們在母親的肚子裡如何地掙扎，如何地懺悔前世的罪過；如果我們曉得出生之前如何地答應上帝，自己將好好利用這一世完全地侍奉祂，那麼我們就不會浪費一分一秒去想其它的事，會利用所有的時間竭盡所能地去了悟上帝。","date":"清海無上師以英文講於哥斯大黎加1991.5.29","url":""},{"content":"我們能夠也應該成為愛的榜樣，要樂善好施、關懷他人、給予和平，這樣別人想到我們時，記起我們的名字時，就會感受到快樂、愛、慰藉，甚至高雅，他們的好品質也會閃耀出來。","date":"DVD999真愛","url":""},{"content":"我們不應該成為別人身口意的負擔或痛苦的根源，我們必須成為靈感、高雅與愛的泉源。","date":"DVD999真愛","url":""},{"content":"無論是在你們所處的社會裡，或是工作的地方，你們都必須成為一個光的中心。這些地方是你們根的所在，你們必須從這裡開始發展，就像一顆非常、非常、非常巨大的樹木一樣，向四面八方伸枝發展，好讓人們可以得到庇蔭。","date":"清海無上師以英文講於美國加州長堤國際禪五19961228","url":"http://www.godsdirectcontact.org.tw/ch/news/77/e-1.htm"},{"content":"無論是走路、睡覺、談話、坐著、躺著時，都要把注意力集中在智慧中心，那樣的話你們修行會更快進步，那時你們自己會感受得到；而你越進步，你就會越受到鼓舞，從而會更努力地修行。","date":"清海無上師以英文講於福爾摩沙西湖1995.06.05(#478)","url":""},{"content":"我們要有體諒心，這不是為了他人，而是為了自己，將自己的意識提昇到更敏銳的等級。不能一直停留在粗糙的等級，粗魯地對待別人的感情及周圍的事物。","date":"清海無上師以英文講於美國紐澤西道場 1992.6.18","url":"http://www.godsdirectcontact.org.tw/ch/news/120/index.htm"},{"content":"上帝一直都在，只是我們太過度心急了，有時是煩惱太多。要有耐心！這就是你們生命過程中必須要突破的困難，是你們命中注定的任務──經歷重重難關，這也是你們賺取天國加持的方法。","date":"清海無上師以英文講於英國倫敦禪四 1997.8.24","url":"http://www.godsdirectcontact.org.tw/ch/news/127/index.htm"},{"content":"我們先教訓好自己，把名利心關起來，把任何骯髒的思想統統洗乾淨，然後才能夠洗別人。","date":"清海無上師以中文講於福爾摩沙台北 1989.5.2 （影帶編號＃76）","url":"http://www.godsdirectcontact.org.tw/ch/news/134/"},{"content":"如果我們有愛心，在別人需要時幫助他們，即使真的因此而收到業障也沒關係，一點關係都沒有，因為我們應該為彼此犧牲，應該一起生活在愛中，而不要去管業障。","date":"清海無上師以英文講於新加坡共修會 1994.09.28（影帶編號#446）","url":"師父開示"},{"content":"上帝一直在我們身邊，十方明師一直保護著我們，我們真正的並非孤獨地在這世界做事。上帝一直在我們身邊，十方明師一直保護著我們，我們真正的並非孤獨地在這世界做事。我們每個人都有天使守護著，雖然看不見，但化身師父也一直守護著我們。","date":"清海無上師以英文講於新加坡共修會 1994.09.28（影帶編號#446）","url":"http://www.godsdirectcontact.org.tw/ch/news/171/"},{"content":"如果你領悟到自己誰都不是，不需要真的考慮到這個「我」，那麼你就會一直體認到那個大我。但是當你總是想著這個小我，那其實只是肉體而已，你就會被卡在小我那邊，而無法進步，無法長大。","date":"清海無上師以德、英文講於德國杜塞道夫杜易斯堡 2006.12.17","url":"http://www.godsdirectcontact.org.tw/ch/news/185/"},{"content":"如果你現在不做好事，如果你這輩子不努力達成你對自己的完美期待，就算你是我的弟子，也必須再回來，因為你不會接受自己不完美，因為你本是完美。","date":"DVD896清海無上師以英文講於法國聚會 2009.03.08","url":"http://tw.myblog.yahoo.com/divine-love/article?mid=1578"},{"content":"光是打坐並不夠，你必須經歷許多情況才能長大。","date":"DVD866清海無上師以英文講於國際聚會 2008.12.06","url":"http://tw.myblog.yahoo.com/divine-love/article?mid=2807&prev=2810&next=2806&l=f&fid=40"},{"content":"我們身口意乾淨的話，不僅是保護自己而已，也是保護對方和身邊的人。","date":"清海無上師以中文講於福爾摩沙西湖道場\n1991.9.29","url":"http://www.godsdirectcontact.org.tw/ch/news/56/index.htm"},{"content":"所謂出家的人，就是他們可以完全放下世人很重視、很需求、很抓緊的那些東西，他們不會捨不得，也不會在那裡邊走邊哭得很厲害，他們已經很明白了，真正的要放下。","date":"清海無上師以中文講於福爾摩沙西湖 1992.10.10 （影帶編號＃278）","url":"http://www.godsdirectcontact.org.tw/ch/news/140/index2.htm"},{"content":"我們就像一個空的器皿，裡面裝滿了上帝的智慧與愛力，只有在我們空無一物的時候，上帝才能為我們注滿智慧與愛力。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/17/"},{"content":"天使確實存在，眾神確實存在，你越純淨就有越多天使保護您。","date":"Lecture by Supreme Master Ching Hai Climate Change Village\nDecember 11, 2010 - Cancún, Mexico","url":""},{"content":"我們修行的人，應該時時集中精神修行的。不管是在痛苦的時候，或是快樂的情況，我們應該時時都為了上帝忘了自己，忘記世界的誘惑。","date":"清海無上師以中文講於福爾摩沙屏東共修會 1993.1.31","url":"http://www.godsdirectcontact.org.tw/ch/news/58/index.htm"},{"content":"如果你心想好事，等於每天提醒自己這種正面的事，那麼一定會發生好事。","date":"2008.10.29, 2009.01.22\nDVD927","url":""},{"content":"我們應該跟造化一樣寬容。造化可以包容宇宙萬物，我們也應該包容宇宙萬物，才能夠變成無上正等正覺，才能夠變成最高的境界、最高的等級。","date":"清海無上師以中文講於","url":"http://www.godsdirectcontact.org.tw/ch/news/68/index.htm"},{"content":"如果我們知道我們的命是自己造的，我們根本不會擔心、不會怕，等時間過了！我們扮演的角色早晚也會自己消滅。","date":"清海無上師以中文講於柬埔寨Raising Center 1996.7.19","url":"http://www.godsdirectcontact.org.tw/ch/news/69/index.htm"},{"content":"不要管左管右，心隨時都放內邊，抓它回來，不讓它跑掉，不讓它被旁邊的事物拉走，我們就很簡單定。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/69/index.htm"},{"content":"任何的苦、喜、怒、哀、樂都是習慣造成，所以我們看透這點！沒有什麼是真的好，沒有什麼是真的苦，都是被習慣綁住而已。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/69/index.htm"},{"content":"藉由想師父，一切好品質就會加諸於你。","date":"清海無上師以英文講於法國巴黎共修會 1993.4.25","url":"http://www.godsdirectcontact.org.tw/ch/news/70/index.htm"},{"content":"我們靈魂解脫了，不過頭腦還不解脫的話，我們在這個世界還是會痛苦。","date":"清海無上師以中文講於福爾摩沙屏東來義道場 1993.1.13","url":"http://www.godsdirectcontact.org.tw/ch/news/69/index.htm"},{"content":"想要幫師父或任何人之前，你一定要打坐好，\n而且要瞭解上帝的教理，\n先把自己變成一個很有價值、有效率的工具，\n再為這世界提供幫助。","date":"","url":"82期"},{"content":"我們都會犯錯，但最要緊的是採反向措施導正。","date":"清海無上師以英文講於墨西哥市2011.06.04  (DVD951轉危為安：全宇宙都在加持我們)","url":""},{"content":"請在生命中的每一秒意識到，並感恩宇宙賜予我們的大量加持，這樣我們就能收到並分享他們。","date":"清海無上師以英文講於墨西哥市2011.06.04  (DVD952轉危為安：全宇宙都在加持我們)","url":""},{"content":"記得在打坐當中，一定要一直記得上帝，不管因為甚麼，感覺到焦慮或害怕，就求上帝保護你、加持你。","date":"清海無上師以英文講於墨西哥市2011.06.04(DVD951轉危為安：全宇宙都在加持我們)","url":"http://www.suprememastertv.com/tw/worldvegan/"},{"content":"要超越波浪，才能進入中央的清淨大海，\n那時就不會再有任何波浪、任何障礙。","date":"","url":"83期"},{"content":"真理不是固定不變的涅槃或是天國，\n而是永無止境的成長過程。","date":"","url":"82期"},{"content":"應該找到自己內邊的愛力以後，才能夠真正的愛人。","date":"清海無上師以中文講於福爾摩沙高雄1990.1.10(影帶編號109)","url":"甘露法語"},{"content":"如果你思想肯定但你的心智不夠堅強，不足以投資心力來控制思想，那麼即使你想，也只是想而已，只不過是短暫的念頭，沒有一點效用。所以我們還是必須打坐，必須強化意志力，這樣才能集中，一旦注意力集中，我們可以將力量專注在任何我們想要的方向或目的上，如此會很有力量。","date":"清海無上師以英文講於美國洛杉磯共修會1996.3.15","url":"82期"},{"content":"沒愛心，打坐有甚麼用?\n應該要想到別人的情況\n不能都是想自己的\n我們修行的人\n不能想自己那麼多了","date":"清海無上師以英文講於法國 國際研討會2008.12.17 (DVD962沒有愛心就無法成為聖人)","url":""},{"content":"我們想要整理自己以後，自然就會幫助別人。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/73/index.htm"},{"content":"「死」並不可怕，就怕我們死的時候，還沒學會我們的功課。","date":"","url":"88期"},{"content":"如果我們太不顧別人，就顧自己而已，修幾年，屁股爛掉也沒用。你這樣坐不動好幾百年也沒用","date":"清海無上師以英文講於法國 國際研討會2008.12.17 (DVD962沒有愛心就無法成為聖人)","url":""},{"content":"我們修行的重點就是要瞭解自己，不是要鄰居瞭解你，也不是要師父瞭解你。師父不會在乎，鄰居也不會在乎，做不做得到都是自己的事情。","date":"","url":"95期"},{"content":"經由每天的打坐，來自上帝強大善良的力量，\n會沖淡甚至完全消化任何傷害我們心靈的訊息。","date":"","url":"82期"},{"content":"外表不一定能夠表達我們內邊的境界，最重要的是我們知道我們的心有沒有動搖、有沒有乾淨，這才重要。","date":"","url":""},{"content":"如果我們善良\n就是對社會的一種好的服務\n就已經在無形中做好的工作\n因此打坐會更有效果\n因為此時的你\n目的在跟上帝同一體","date":"清海無上師以英文講於法國 國際研討會2012.3.24 (DVD996改變天堂與地球)","url":""},{"content":"成為高貴的眾生是我們唯一的選擇，無論多麼艱難，也要勇往直前，無論目的多高、多麼遙遠，也要奮力向上。我們必須一次又一次地努力嘗試，直到在我們內邊只存在好的品質為止，直到我們的內邊只認識上帝的天國，別的什麼都沒有為止。","date":"清海無上師以英文講於福爾摩沙西湖 1995.06.05","url":"86期"},{"content":"打坐是一種方法，讓我們練習隨時自我控制的藝術。","date":"","url":"87期"},{"content":"我們誠心要修改自己，我們會離道越來越近。","date":"","url":"89期"},{"content":"不管我們有沒有師父的加持，有時候我們必須能消化的了，就像我們是值得的一樣，也不是因為值得加持，不過如果我們不夠乾淨，就沒辦法消化，就浪費掉了。","date":"清海無上師以英文講於法國蒙頓 2012.3.28","url":"DVD1000"},{"content":"不要因為你做了什麼而自傲，我們做甚麼是出於愛心，不是因為:「好，我做得到」，不是那樣的態度，永遠都要謙卑。","date":"清海無上師以英文講於法國蒙頓 2012.3.28","url":"DVD1000"},{"content":"永遠都要禱告，做任何事都要心懷感激，甚至於呼吸時，感激我們所吸的空氣，永遠都要謙卑，一直記得上帝。不要有任何驕傲或傲慢，不管吃甚麼東西時，內心永遠都要存著慈悲。","date":"清海無上師以英文講於法國蒙頓 2012.3.28","url":"DVD1000"},{"content":"看一切都是上帝的恩典，那麼每件事都成為喜悅之源而不是苦惱了。","date":"(Originally in English)","url":"89期"},{"content":"在切割東西時，你們永遠都要保持仁慈愛心，甚至在切蔬菜水果時也一樣，好嗎?","date":"清海無上師以英文講於法國蒙頓 2012.3.28","url":"DVD1000"},{"content":"無論我們幫助別人什麼，也是幫助我們自己的。","date":"清海無上師以英文講於法國蒙頓 2012.3.28","url":"DVD1000"},{"content":"對自己要有信心、有自信，尊重自己，讓自己成為榮耀這個地球最高雅、最堅強、最好、最值得的眾生之一。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/80/index.htm"},{"content":"替我孝順你們父母，我也愛他們，因為他們很好。父母是我們在世間最好的朋友，他們是最好的。","date":"DVD936中秋佳餚倍思親20080914開示","url":""},{"content":"我們的身體受靈體和精神的影響，如果我們的靈體和精神很充沛，吃足夠靈體的食糧，那我們的身體就會改變，愈變愈漂亮。","date":"清海無上師以中文講於日本 1994.9.8","url":"90期"},{"content":"思想很重要，不要跟著你們的情慾或你們的思想走，你們要互相提醒：「戒律從思想開始；純潔從思想開始。」","date":"清海無上師以英文講於福爾摩沙西湖1995.10.29","url":"101期"},{"content":"我們從付出和給別人的愛心就會感到滿足，而不是在那邊等待別人的愛。","date":"","url":"89期"},{"content":"修行的法律就是這樣──\n我們越利益眾生，我們越利益自己。","date":"","url":"88期"},{"content":"對整個宇宙而言，我們像是一本翻開的書，所以要小心，每當動什麼惡念的時候，最好馬上砍斷，否則真的很不好意思。","date":"清海無上師以英文講於泰國共修會1994.9.10","url":"40期"},{"content":"我們的抉擇決定了我們的高雅或卑下，如果我們不和自己奮鬥、不努力改善自己的思想、概念、工作或行為，那我們會一直停留在以前的等級。","date":"","url":"85期"},{"content":"高雅和無私的想法與行動，總會帶來好的結果。即使你們無法清楚或明顯地看到，但它確實有用，懂嗎?每次你們思想高雅，行為高雅或無私時，都會有不可思議的結果，有形和無形方面都是，它會影響整個世界。","date":"清海無上師以英文講於法國蒙頓2012.03.26","url":"DVD998走在奇蹟的道上"},{"content":"越相信明師力量，越相信天堂，你就越擁有祂，有些人障礙自己，所以才沒得到。否則天堂不會略過任何人。","date":"清海無上師以英文講於法國蒙頓2012.03.26","url":"DVD998"},{"content":"你們帶著信心與愛心到處去，就這樣發光，這樣照亮各地，而且你所到之處，人們會無形地受到加持，他們的生活就會改變。","date":"清海無上師以英文講於法國蒙頓2012.03.26","url":"DVD998"},{"content":"只因為我們把自己的生活弄複雜了，所以才沒辦法和宇宙同一體，上帝也沒辦法和我們溝通。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/72/index.htm"},{"content":"不要讓那些幻想的快樂騙我們，\n讓我們迷路，應該每天往前走在真理的路上。","date":"","url":"89期"},{"content":"為什麼離道很遠呢？因為我們靠世界！如果我們不靠世界，我們不會驕慢，我們靠錢、靠權力、靠聰明、靠地位，這個是靠世界、靠無常。道不是世界、無常的那些東西，所以我們越靠這邊，我們離那邊越遠。","date":"","url":"95期"},{"content":"只有領悟到我們都是上帝的子女，\n  我們和上帝同一體時，才是真正謙卑的開始。","date":"（清海無上師講於澳洲布里斯本1993.3.20 原文為英文）","url":"109期"},{"content":"工作是要細心，不要讓別的思想或是別的東西干擾。做事要誠懇，為了要把那個工作做好，為了讓人看了高興，不是為了自己，這樣就不會弄錯，做事也會很快，又很完美，秘法就是在這裡。","date":"清海無上師以中文講於福爾摩沙西湖 1992.04.03","url":"88期"},{"content":"當你把意念放在智慧眼時，就表示你已專注在靈性的智慧和開悟中心，如果你記得這樣做，當然會散發靈性的氣氛，對方也自然會獲得利益。","date":"清海無上師以英文講於美國佛州小中心 2001.06.09（DVD719）","url":"140期"},{"content":"我們想到別人有利益，我們就會忘記自己的恐懼，這是長養勇氣最好的辦法。","date":"","url":"99期"},{"content":"我們真的要誠心修行哦！時間不多。你看天氣都變改，人也變來變去，沒有一個人能夠永久存在的。","date":"清海無上師以英文講於美國加州洛杉磯2011.12.31, 2012.01.02","url":"92期"},{"content":"要為了高雅理想、和平的崇高目標和無條件的愛繼續奮鬥，即使失敗了，請再接再厲直到成功為止，你們遲早會成功的！","date":"清海無上師以英文講於美國加州洛杉磯2011.12.31, 2012.01.02","url":""},{"content":"每當我們記得任何有關靈性中心、內在真我的事情，身旁的人都會得到利益。","date":"","url":"140期"},{"content":"我們有力量，我們是上帝在世間的代表，既然生存在這裡，我們就該做好這個等級的事情。","date":"清海無上師以英文講於捷克布拉格 1999.05.28（影帶編號#654）","url":"143期"},{"content":"我們必須深層打坐，才能領悟我們內在擁有的靈性光輝與寶藏。它生生世世潛藏在那裡，沒被使用或只使用一點點。","date":"清海無上師以英文講於美國加州洛杉磯2011.12.31, 2012.01.02","url":""},{"content":"即使我不再看你們，你們都在我心裡，在我的打坐裡，在我的禱告裡。愛你們！","date":"清海無上師以英文講於美國加州洛杉磯2011.12.31, 2012.01.02","url":""},{"content":"我們在這個世界，污染程度太高了，破壞力很強，我們隨時都會被傷害的，即使我們吃素、善良，還是被影響。所以只有打坐、念聖號、注意力集中，才能夠保護自己。","date":"清海無上師以中文講於國際聚會 2009.10.11","url":"http://www.godsdirectcontact.org.tw/ch/news/205/tip_0.htm"},{"content":"內在師父永遠帶領著你，你只要安靜下來試著連結，然後你就會感覺到知道要做甚麼事才對，或至少不會做錯。","date":"清海無上師以英文講於國際聚會 2012.03.25","url":""},{"content":"只要平常心、有智慧、永遠無條件奉獻，像太陽、月亮、天空一樣，寬大、崇高、無限，那麼你就會成為那樣。","date":"清海無上師以英文講於墨西哥坎昆 2010.12.09 （DVD#923）","url":"http://www.godsdirectcontact.org.tw/ch/news/209/index2.htm"},{"content":"謙卑的意思就是沒有我執；沒有我執表示更多神性會流露出來，內邊的神性更彰顯，比例高過我執。因此你跟良善、跟神性就越接近，並獲得越多加持。","date":"清海無上師以英文講於墨西哥坎昆 2010.12.09 （DVD#923）","url":"http://www.godsdirectcontact.org.tw/ch/news/209/index2.htm"},{"content":"有時候當我們信心堅強時，我們能接受任何情況。因為我們有信心時，上帝和佛祖也愛我們，就會為我們改變處境","date":"清海無上師以悠文講於國際聚會 2012.03.25","url":""},{"content":"記住自己是光，不可沉溺在物質的身體裡面。","date":"","url":"83期"},{"content":"事情的發生，重要的不是它怎麼發生或發生了什麼事，而是我們對這件事的反應。這些事件是為了讓我們反省自己，看看自己有沒有進步，然後才知道自己成長了多少、等級在哪裡。","date":"清海無上師以英文講於美國加州長堤1996.12.29(DVD571)","url":"http://www.godsdirectcontact.org.tw/ch/news/146/index2.htm"},{"content":"在我們徹悟一切以前，最好不要歸咎、責備，或是批評任何事物。因為上帝有無上的智慧，祂創造的每一樣東西都有其用意，只是我們不知道罷了！","date":"","url":"92期"},{"content":"永遠都要懂得表達，要有愛心、關懷心、真誠，還要誠實，這就是愛之道。","date":"清海無上師以英文講於法國蒙頓 2012.3.28","url":"DVD1000"},{"content":"我們不要認為成佛以後就結束了，只是成佛了以後學習比較簡單、比較方便，不會像以前這麼辛苦而已。","date":"清海無上師以中文講於福爾摩沙西湖 1992.05.9（影帶編號#244）","url":"http://www.godsdirectcontact.org.tw/ch/news/148/index2.htm"},{"content":"不管我們付出什麼，以後都會回到自己身上。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/142/index2.htm"},{"content":"每當我們一生氣出來或產生批評心，我們的心就變窄了，沒辦法容納全部。","date":"清海無上師以中文講於香港1993.6.26","url":"http://www.godsdirectcontact.org.tw/ch/news/146/index2.htm"},{"content":"解脫不是指開悟以後就不會再受苦，而是我們夠強壯可以受得了痛苦，而且不會執著快樂，然後才可以超越這無常世界的變幻，進而瞭解真理。","date":"清海無上師以英文講於泰國 1993.06.12","url":"http://www.godsdirectcontact.org.tw/ch/news/88/u-0.htm"},{"content":"我們信任上帝、信任上天或信靠師父的力量，無論如何都接受的話，那麼到後來，即使壞的情況，也會轉變成好的。或者有時候，我們把它當作是去更好地方的跳板，因為我們通過考驗了。或者也許因為我們如此精進修行而感動了上天。","date":"清海無上師以英文講於國際聚會 2012.03.25","url":"DVD997  接納一切、相信上天"},{"content":"你們最好不要管那些無聊的小事，世界的事情知道越少越好，不要管太多。我們應該超越、飛上去，這樣才能夠清靜修行、才能夠開悟，打坐才有結果，然後才有鼓勵心。","date":"清海無上師以中文講於香港1993.6.26","url":"http://www.godsdirectcontact.org.tw/ch/news/146/index2.htm"},{"content":"愛不怕負擔，愛只懂得犧牲。","date":"哥斯大黎加1991.2.9 (原文為英文)","url":"http://www.godsdirectcontact.org.tw/ch/news/105/index.htm"},{"content":"上帝照顧每個生命的所有細節，這是我們快樂和滿足的原因，這也是世上的悲傷及苦難無法影響我們的原因，因為我們已經知道真理，知道這唯一而且鐵定的真理－－上帝照顧一切！","date":"清海無上師以英文講於德國慕尼黑1995.08.18","url":"90期"},{"content":"我們應該找回我們的權力，找回我們的榮耀，找回我們原有的一切，因為整個宇宙都是我們的！","date":"清海無上師以英文講於葡萄牙里斯本1999.05.07","url":"http://www.godsdirectcontact.org.tw/ch/news/149/index2.htm"},{"content":"要使你自己成為你所嚮往的那種人，而不是去要求別人像你所希望的那樣，自己要以身作則。","date":"清海無上師以英文講於美國加州長堤國際禪五 1996.12.28 （影帶編號 #573）","url":"http://www.godsdirectcontact.org.tw/ch/news/131/index.htm"},{"content":"不是打坐本身在保護你，而是你自己內在被喚醒的力量在保護你，是認識「自己就是上帝」的這個悟性在保護你。","date":"清海無上師以英文講於荷蘭阿姆斯特丹1999.5.9(#647)","url":"http://www.godsdirectcontact.org.tw/ch/news/148/index2.htm"},{"content":"如果不能擁有自己喜愛的，就喜愛自己擁有的，這樣人生才會快樂。","date":"清海無上師以英文講於美國華府國際禪四 1997.12.25 （影帶編號＃610）","url":"http://www.godsdirectcontact.org.tw/ch/news/151/mt1.htm"},{"content":"自然地做事，不要有任何的期待。不要只是做而已，而是要用智慧做，無條件地做，若無其事般自然地做！","date":"清海無上師以英文講於美國佛羅里達小中心 2001.06.06（DVD714）","url":"http://www.godsdirectcontact.org.tw/ch/news/153/ap1.htm"},{"content":"我們幫助別人太多、打坐太少的話，也不行，因為不平均，然後我們耐心沒有了、愛心沒有了。我們做事沒有愛心的話，就沒有任何用。不管做什麼還是需要愛心，愛心才感動上帝、佛菩薩，感動裏面的人心，才能透過我們的工作感化人、傳上帝的愛力給他們。然後，透過我們的愛心貢獻，世界的人會一步一步提高他們的等級。","date":"清海無上師以中文講於巴西1989.11.13","url":"112期"},{"content":"我們裡面有光，它會發出來，讓人家感覺到好舒服、感覺到很尊重，這個是我們自然的威儀、自然莊嚴的衣服。","date":"原文為中文","url":"(News No.)92期"},{"content":"日","date":"","url":""},{"content":"如果我們死了，就死了，有什麼關係，是嗎?最重要的是我們要如何活著，而我們活得很好，自從印心那天起就活得很好，是或不是?","date":"清海無上師以英文講於法國蒙頓 2012.3.22","url":"DVD994獨處並不孤單"},{"content":"愛不是給子女想要的東西，愛是做對他好的事情，告訴他一切他應效法的好事情。","date":"清海無上師以英文講於法國 2012.3.22","url":"DVD994獨處並不孤單"},{"content":"你們要教導自己做得比一般人更好，做別人所做不到的事，只要這些事利益人類並利益自己就去做；忍別人所不能忍，為了利益別人並增強你的判斷力和智慧。","date":"清海無上師以英文講於美國加州洛杉磯共修會 1996.3.13（影帶編號#536）","url":"http://www.godsdirectcontact.org.tw/ch/news/155/index2.htm"},{"content":"我只是一個嚮導，如果你選擇追隨我，那很好；如果你選擇犯錯或以你的方式做事，或想試試看會變怎樣也沒關係，有何不可呢？因為如果我一直告訴你一切，你就不再有人生了。","date":"清海無上師以英文講於法國 2012.3.22","url":"DVD994獨處並不孤單"},{"content":"我們每個人都應該傳播上帝的訊息，傳播愛、忍辱和慈悲的福音給別人，要時常彼此互相提醒。","date":"清海無上師\n以英文講於馬來西亞 \n1989.10.2 （影帶編號＃100）","url":"http://www.godsdirectcontact.org.tw/ch/news/129/index.htm"},{"content":"唯有我們自己內在和平了，才能帶來和平；唯有看見我們內邊的上帝，才能看見上帝也在別人內邊。","date":"清海無上師以英文講於捷克布拉格 1999.05.28（影帶編號#654）","url":"http://www.godsdirectcontact.org.tw/ch/news/143/index2.htm"},{"content":"要當師父徒弟的話，先當自己的老師，要教育自己、要教訓自己，要知道哪一個好就做，哪一個壞，不管怎麼樣也不能做，好的事情，不管怎麼樣都要做……","date":"清海無上師以中文講於法國 2009.01.15","url":"DVD936做好因會得好果"},{"content":"要多做好事，要多修煉自己，不然等一下，就後悔來不及了","date":"清海無上師以中文講於法國 2009.01.15","url":"DVD936做好因會得好果"},{"content":"我們給人家傷心、給人家生氣，也是一種暴力的","date":"清海無上師以中文講於法國 2009.01.15","url":"DVD936做好因會得好果"},{"content":"用意志力操縱自己的命運，讓自己隨時走在正路上，不走別的路，儘量避開邪道，走正道。這就是儘可能減少業障的方法，這樣不僅幫助自己，當然也幫助了師父。","date":"清海無上師以英文講於美國加州洛杉磯1997.7.5~6 (#587)","url":"http://www.godsdirectcontact.org.tw/ch/news/150/index2.htm"},{"content":"吵鬧到別人，不考慮到別人，不想到別人那種感覺，就是有惡心","date":"清海無上師以中文講於法國 2009.01.15","url":"DVD936做好因會得好果"},{"content":"生命中有許多種的選擇，我們必須要聽自己最高的直覺。","date":"","url":"87期"},{"content":"我們越是往內，越是不必用語言就可以了解事情。","date":"Spoken by Supreme Master Ching Hai (Originally in English)","url":"http://www.godsdirectcontact.org.tw/ch/news/103/index.htm"},{"content":"不是光用想的事情就會發生，還必須有強大的後援力量才行。那個力量從哪裡來？從最高的萬能力量來，我們可以透過打坐得到祂，讓自己的力量滿滿。","date":"清海無上師以英文講於美國加州聖荷西1996.03.20（影帶編號#539）","url":"http://www.godsdirectcontact.org.tw/ch/news/158/ap2.htm"},{"content":"我們如果從天國、從高境界的角度來看，就會將所有的情況視為磨練的機會，藉以鍛鍊自己各種不同的能力與內在力量。","date":"清海無上師透過網際網路視訊會議以英文對加拿大多倫多同修開示2002.08.04（影帶編號#746）","url":"http://www.godsdirectcontact.org.tw/ch/news/159/ap4.htm"},{"content":"我們要選擇什麼東西，真的要考慮很清楚，\n如果裡面已經知道不對，最好不要為了面子、為了習慣，\n或為了任何短暫、方便的看法，而破壞很強的當來！","date":"","url":""},{"content":"障礙和煩惱是要你去克服的，但上帝會成就結果，你必須總是盡最大能力，而不要期待任何事情，這才是最好的期待方式。","date":"清海無上師以英文講於印尼泗水1997.3.19","url":"90期"},{"content":"我們住在這個世界，但是對世界不執著；我們像以前一樣地做事情，不過內心完全不留戀，這就是早日「回家」的祕訣。","date":"清海無上師透過網際網路視訊會議以英文對韓國同修開示 2002.08.24（影帶編號#748）","url":"http://www.godsdirectcontact.org.tw/ch/news/158/ap4.htm"},{"content":"學習教理和打坐修行，兩者相輔相成，所以兩方面都要精進，否則只是盲目的信仰，不知道自己為什麼要修。","date":"清海無上師以英文講於馬來西亞 1992.02.27（影帶編號#220）","url":"http://www.godsdirectcontact.org.tw/ch/news/157/ms1.htm"},{"content":"一切唯心造，一切都是我們頭腦造成，\n有時我們看到一些行為後認為他們做得不對，\n但其實是我們的想法不對。","date":"清海無上師以悠文講於法國2008.9.10（DVD965）","url":"DVD965趙州禪師的智慧"},{"content":"靈魂還放不下那些習慣和欲望，所以那些人才必須回來學習，直到他們了解這些事情不可以執著、這些東西原本就不屬於他們的為止。","date":"清海無上師透過網際網路視訊會議以英文對加拿大多倫多同修開示2002.08.04（DVD746）","url":"http://www.godsdirectcontact.org.tw/ch/news/159/ap4.htm"},{"content":"我們做什麼都是上帝安排，如果我們真正的了解到這個程度還好，不過多數的人因為不了解，所以認為是自己做的才這麼糟糕，自己才擔業障！","date":"清海無上師以中文講於日本 1991.10.01","url":"http://www.godsdirectcontact.org.tw/ch/news/152/mt2.htm"},{"content":"事實上我們是一體的，無論我們互相為對方做了什麼，都像是為自己做的一樣，因為我們彼此相愛，這就是生命的真諦。","date":"清海無上師以英文講於馬來西亞吉隆坡 2000.4.30","url":"http://www.godsdirectcontact.org.tw/ch/news/127/index.htm"},{"content":"我們要相信上帝的力量，天天加強對上帝愛力的信心，以後我們就會越來越堅強。","date":"清海無上師以中文講於日本 2000.07.10\n（影帶編號＃706）","url":"http://www.godsdirectcontact.org.tw/ch/news/138/index2.htm"},{"content":"有一點障礙才好，我們才有奮鬥的那種必要，然後我們意志力才越來越強，我們那種要求道的心才堅固。","date":"","url":"96期"},{"content":"分享一些好新聞，快樂的消息和正面事情就好，讓這小中心永遠保持令人提昇的氛圍。","date":"清海無上師以英文講於法國 2012.03.31","url":"DVD1003時時記得上帝"},{"content":"篩選過程一直都在進行，所以我們一直都去與我們相配的地方。","date":"清海無上師以英文講於法國 2012.03.31","url":"DVD1003時時記得上帝"},{"content":"解脫是指從所有困擾你的事物中解脫，從所有不好、不高尚、不美的事物中解脫，從所有綁人、令人窒息、有罪惡感以及讓人背離上帝的事物中解脫，從所有使人慾火中燒的激情和衝動的慾望中解脫。","date":"清海無上師以英文講於印度普納共修會1997年11月23日","url":"92期"},{"content":"要時時記得聖號，這樣你才會更與上帝同在，較少受到周圍氣氛的影響，或受到周遭環境的否定影響。","date":"清海無上師以英文講於法國 2012.03.31","url":"DVD1003時時記得上帝"},{"content":"任何事情只要對別人有利益，只要我們良心認為是正確的事，我們都會去做，不會期待任何回報。","date":"清海無上師以英文講於福爾摩沙西湖 1995.06.06（影帶編號#478）","url":"http://www.godsdirectcontact.org.tw/ch/news/159/ap4.htm"},{"content":"並非我們不能犯錯，而應該曉得自己錯了，然後儘量彌補。並非我們不能生氣，但如果知道自己不對，就要彌補錯誤，事後要更有愛心，或是向對方道歉、對他們好一點，這樣才能消除我們個性缺點對別人造成的影響。","date":"清海無上師以英文講於美國佛州小中心1999.02.14（影帶編號#633上集）","url":"http://www.godsdirectcontact.org.tw/ch/news/159/ap4.htm"},{"content":"地球得以被拯救是由於上蒼的恩典，這並不表示其他每件事情我們都值得，除非我們全部都改變自己的生活方式。","date":"清海無上師以英文講於法國 2012.03.31","url":"DVD1003時時記得上帝"},{"content":"世界上的任何東西都不是我們的，即使我們做了什麼好事，也不是我們做的，造化事先都已經安排好了。所以才說，當我們跟上帝同一體、跟萬物同一體了以後，就沒有個人的「我」了，因為我們知道一切都是上帝安排。","date":"清海無上師以中文講於福爾摩沙西湖 1991.07.21（影帶編號＃183）","url":"http://www.godsdirectcontact.org.tw/ch/news/155/index2.htm"},{"content":"每天把自己分內的工作做好，這也是一種打坐；每天好好對待別人，將心比心，這樣也是打坐；每天幫助貧困的人，愛心關懷遭受痛苦的人，這樣也是打坐。這些都會增加我們的修行成果。","date":"清海無上師透過網際網路視訊會議以英文對德國漢堡同修開示 2002.10.06","url":"http://www.godsdirectcontact.org.tw/ch/news/161/index2.htm"},{"content":"上帝只會給我們慰藉。如果此刻祂給我們悲傷，是為了提醒我們世事無常，為了提醒我們必須返回上帝安全的堡壘——天國。","date":"清海無上師以英文講於哥斯大黎加 1989.6.8","url":"96期"},{"content":"懂得關愛別人的人，上帝就在他們心中；侍奉上帝的子女，就是侍奉上帝。","date":"哥斯大黎加1991.2.4(原文為英文)","url":"http://www.godsdirectcontact.org.tw/ch/news/105/index.htm"},{"content":"不管我們在修行路上達到哪一個階段、哪一個意識等級，永遠都有更多的快樂和法喜在前面等著我們。","date":"清海無上師以英文講於美國華府國際禪四 1997.12.24（DVD#604）","url":"http://www.godsdirectcontact.org.tw/ch/news/161/index2.htm"},{"content":"不要用凡人的眼睛批評我或批評任何明師，這對你很不好，這是非常糟糕的。","date":"清海無上師以英文講於法國 2012.04.02","url":"DVD1004 節約能源，簡單生活"},{"content":"我們應試著更往內邊、更專注於和內在神聖力量靈性上的連結，請求上天的寬恕，要更慈悲、謙卑，心存感激上帝的仁愛，要為世界行更多的善。","date":"清海無上師以英文視訊和SMTV美國洛杉磯2012.12.22","url":"DVD1011"},{"content":"我們應試著更往內邊、更專注於和內在神聖力量靈性上的連結，請求上天的寬恕，要更慈悲、謙卑，心存感激上帝的仁愛，要為世界行更多的善。你為世界行善越多，自己就得到越多的善；你為他人帶來更多的快樂，自己也會得到更多的快樂。不要把行善當作是自己的工作，不是那樣的，為他人付出自己小小的一份心力，你會得到數以千倍的功德做為回報。我們現在擁有時間，這星球也依然存在，在有時間的時候，更應朝人類本質的靈性面去想，並且與之聯繫，而不要太沉溺於物質的享受、貪婪等瞬間即逝的事情上。我們要多看的是，內邊恆久、真正的喜悅和快樂。只要我們往內與之聯繫，天國一直都在那裏。","date":"清海無上師以英文視訊和SMTV美國洛杉磯2012.12.22","url":"DVD1011"},{"content":"我們的真我與上帝之間，事實上從未被任何東西隔開過，是我們的注意力和想法讓我們感覺和上帝隔開。","date":"清海無上師以英文講於南非開普敦 1999.12.01（DVD676）","url":"http://www.godsdirectcontact.org.tw/ch/news/156/ms1.htm"},{"content":"有時候你碰到一些人，他們是過去世的敵人，他們有時會讓你感到難受和生氣，而你責備你自己，所以我才說不要總是責怪自己，這可能是另一個人造成你的麻煩，造成你的壞心情或怎樣，不是總是因為你的緣故，好嗎?","date":"清海無上師以英文講於法國 2012.04.02","url":"DVD1004 節約能源，簡單生活"},{"content":"….你在默念五佛號時，自然就會散發出最高等的愛力了。…...默念五佛號是一種最高的祈禱。……...我只是如如不動，讓上帝去運轉整個宇宙，由祂來散發慈悲愛力，我並沒有做任何事。……你只要不斷地默念五佛號、打坐，其他事就會自然運轉。","date":"清海無上師以英文講於美國洛杉磯國際禪三 \n1998.12.17（影帶編號#641）","url":"http://www.godsdirectcontact.org.tw/ch/news/162/index2.htm"},{"content":"在這個世界上，沒有比修行達到「和上帝同一體」的境界更重要的事了。","date":"清海無上師以英文講於美國華府國際禪四 1997.12.24（DVD#604）","url":"http://www.godsdirectcontact.org.tw/ch/news/161/index2.htm"},{"content":"我們修行的人如果想要進步，最好要多反省自己，看我們哪裡有缺點，做事哪裡不合邏輯，每天要分析、要檢討自己。","date":"清海無上師以中文講於福爾摩沙西湖 1992.04.25（影帶編號#243）","url":"http://www.godsdirectcontact.org.tw/ch/news/145/index2.htm"},{"content":"做每一件事都是一種奉獻，沒有一件工作是卑下的，也沒有骯髒的工作。沒有一件事不值得你關心，因為這些事構成整個宇宙，而宇宙的每一小部分都屬於 整體，我們照顧一部分也就是照顧整體。","date":"","url":"90期"},{"content":"安靜不是說什麼也沒有，而是讓那些不必要的心理負擔、偏見、慾望、無意義的想法以及貪求不可得的心平靜下來。\n     平靜是為了能夠服務別人、\n     為了能夠讓真正的智慧顯現出來。","date":"清海無上師以英文講於馬來西亞吉隆坡 1992.2.23","url":"110期"},{"content":"我們誠心會有效，障礙就會越來越少，成功越來越多。","date":"清海無上師以中文講於法國 2012.03.31","url":"DVD1003時時記得上帝"},{"content":"我們要當自己的主人，戰勝自己的缺點、我執和那些否定的傾向，這才是一種最輝煌的勝利。","date":"清海無上師以英文講於西班牙馬德里 1999.5.5 （DVD644）","url":"http://www.godsdirectcontact.org.tw/ch/news/152/mt2.htm"},{"content":"你們要節省時間，不需要的事就不做，必須做的事就快快做。一秒鐘是你的生命，半秒鐘也是你的生命，要好好打坐，加入整個宇宙的聖人團體，不能落後！","date":"清海無上師以英文講於匈牙利歐禪 2005.02.23-24","url":"http://www.godsdirectcontact.org.tw/ch/news/163/index2.htm"},{"content":"就算你無法好好專注，你只是無法看到體驗，但師父的力量永遠和你一起，只是你的頭腦看不到，就只是如此，好嗎？","date":"清海無上師以英文講於法國 2012.03.30","url":"DVD1002 多打坐以了悟我們拯救地球的力量"},{"content":"幫師父使命一釐一分，給人家機會修行，給別人機會回頭是岸，就是多放一塊磚頭在我們回天國的路。因為我們在做這些工作時，我們不會忘記佛菩薩，我們不會忘記最高理想，我們不會忘記師父，當然會記得師父的道理，會記得自己所要得到的目的，所以我們時時不離開道。","date":"","url":"9期"},{"content":"中國人很多書、很多經典、很多教理，要實行，要做，不是念念就夠了","date":"清海無上師以中文講於法國 2009.01.15","url":"DVD936做好因會得好果"},{"content":"請試著忘記世俗的問題，試著多專注於內邊正面能量和真實的東西。","date":"清海無上師以英文講於法國 2012.03.30","url":"DVD1002 多打坐以了悟我們拯救地球的力量"},{"content":"不管現在發生什麼事，在宇宙的倉庫裡也同時發生著許多其他可能的結果。打坐時，我們可以窺見這些不同的結果，甚至挑一個自己想要的，並拒絕不想要的結果。","date":"清海無上師以英文講於斯洛維尼亞 流布里雅那1999.05.26（影帶編號#660）","url":"http://www.godsdirectcontact.org.tw/ch/news/165/qa2.htm"},{"content":"總是想肯定的事，只是想而已，就會改變你們的生活型態和運氣。所以儘量保持肯定，這樣可以避免很多意外和疾病。","date":"清海無上師以英文開示於新加坡共修會1994.09.29 （影帶編號#446）","url":"http://www.godsdirectcontact.org.tw/ch/news/144/index2.htm"},{"content":"無論何時，能夠的話，就釋放自己一下，我在你們的心中才能有一點空位，我們就能說悄悄話。若你們的心全滿了，我甚至無法進入，你們甚至對我也沒興趣。心已經那麼小，又沒興趣，那我就無法幫你們太多。","date":"清海無上師以英文講於法國 2008.08.31(DVD966)","url":"達到臨界量以拯救地球"},{"content":"我們在天堂所作的特別選擇，變成似乎是我們生命中的障礙或負擔。但是事實上，上帝的加持會以許多不同的方式和表象呈現出來。","date":"清海無上師以英文講於美國洛杉磯國際禪三 \n1998.12.17（影帶編號#641）","url":"http://www.godsdirectcontact.org.tw/ch/news/162/qa3.htm"},{"content":"做事要婉轉，因此我們才需要智慧和愛心，\n不是規則和法律而已，愛心的律法超越一切，\n所以我只要求你們用愛、單純心和智慧做事。","date":"（清海無上師講於美國科羅拉多州1993.4.11 原文為英文）","url":"甘露法語 109期"},{"content":"管你自己的事就好，你會快些進步。要提醒自己注意聽右邊或智慧眼的聲音，而不是管別人的事。","date":"清海無上師以英文講於法國 2008.08.31(DVD966)","url":"達到臨界量以拯救地球"},{"content":"愛我們的敵人就是愛我們自己，因為愛敵人就是為自己帶來和平。","date":"清海無上師以英文講於墨西哥墨西哥市 1998.5.23","url":"http://www.godsdirectcontact.org.tw/ch/news/126/index.htm"},{"content":"我們每個人與親戚、朋友和鄰居所組成的小世界也很重要。所以只要我們每個人都好好照顧我們的小世界，那麼大世界也會隨之和平。","date":"清海無上師以英文與德文講於德國慕尼黑1995.08.18（影帶編號#566）","url":"http://www.godsdirectcontact.org.tw/ch/news/165/index2.htm"},{"content":"重要的是你越保持清醒，你得到的修行點數就越多。即使只是保持清醒，心想要打坐，你的思緒在整個國家到處亂跑，但儘管如此，你仍然清醒，仍在打坐，在你的心裡你有意願，這樣你也賺到很多功德。只要在夜裡保持清醒，那就是最大加持力來臨之時。如果你更加清醒，那就表示你的靈魂還在這裡，知道嗎?沒有離開。可接受加持力進入靈魂裡，懂嗎?如果靈魂在其他地方，也許在另一個世界，或只是沒意識到，那加持力就比較少。因為當你睡覺時，靈魂會跑出去。","date":"清海無上師以英文講於法國 2012.03.29(DVD1001)","url":"合力拯救地球—愛的成功故事"},{"content":"聖號非常非常重要，很有力量……聖號很重要，即使你們在地獄，如果你們記得聖號，你們即得赦免，記得嗎?是。因為這是一種很強大的能量，五界教主的名號…在五界內，他們是國王，所以任何人聽到他們的聖號，他們真的會拜下去，然後沒有人能碰你們。這是一種真正的保護力，不只是物質生命而已，而是在地獄、天堂、任何地方，無論你們去到什麼宇宙。請勿視為理所當然而不珍惜。因為也許你們簡單得到，我並不總是大力宣傳像他們在電視上做的手法。所以你們認為沒什麼，並非如此!……這是千百萬年的一次機會，千百萬輩子！請千萬要珍惜。","date":"清海無上師以英文講於法國 2012.03.29(DVD1001)","url":"合力拯救地球—愛的成功故事"},{"content":"只要做好你們份內的工作，少一點掙扎，就會多一點和平。美國哲學家愛默生曾說過：「讓上帝去治理這個宇宙，重擔將會從你的肩上卸下。」這就是我的座右銘。","date":"清海無上師以英文 講於美國洛杉磯\n國際禪三 1998.12.18 \n（影帶編號＃642）","url":"http://www.godsdirectcontact.org.tw/ch/news/129/index.htm"},{"content":"你們沒有責任要為世界或為我做任何事。當然，能做很好，我為你們感到驕傲；但若你不想做，也當然是你的權利。……我喜歡為他人服務，所以我當然喜歡做事的人。但這不是強制的責任，我只希望你可以成為你想成為的人，越高貴越好。但你有權利慢慢成長或快速進步。","date":"清海無上師以英文講於法國 2012.03.29(DVD1001)","url":"合力拯救地球—愛的成功故事"},{"content":"我們想念上帝，表示我們完全順服上帝的旨意，讓上帝來管理宇宙，那時候我們會感覺沒有負擔。","date":"清海無上師以英文\n講於福爾摩沙西湖 1991.9.25\n（影帶編號＃152）","url":"http://www.godsdirectcontact.org.tw/ch/news/129/index.htm"},{"content":"要看世界是泡影、是夢想，還在那裡計較什麼東西！競爭什麼名利！辯白什麼冤枉的情況！","date":"清海無上師以中文講於福爾摩沙台北 1989.2.28 \n（影帶編號＃50）","url":"http://www.godsdirectcontact.org.tw/ch/news/129/index.htm"},{"content":"我們打坐就是最好的救病方法，可以救我們精神的病、業障的病和身體的病，什麼都會好。","date":"清海無上師以中文講於福爾摩沙西湖1991.6.30","url":"http://www.godsdirectcontact.org.tw/ch/news/133/index.htm"},{"content":"上帝已經為世人和這個星球安排好快速發展的進度表，我們必須隨時更新自己，配合祂的恩典，我們的生活才能跟得上地球進展的腳步。","date":"清海無上師以英文講於波蘭華沙 1999.05.11（影帶編號＃657）","url":"http://www.godsdirectcontact.org.tw/ch/news/145/index2.htm"},{"content":"你越感恩，越能看到事情的肯定面，也就越能得到肯定的結果。我們對上帝越感恩，就會得到越多的恩賜，形成一種良性循環。","date":"清海無上師以英文講於美國洛杉磯國際禪三 \n1998.12.17（影帶編號#641）","url":"http://www.godsdirectcontact.org.tw/ch/news/162/index2.htm"},{"content":"修行不是盤腿，用眼睛念佛而已。「天下本無事」是給上帝、佛祖或是給最高等的人講的，我們還是要福慧雙修，才能夠了解這句話。","date":"","url":"9期"},{"content":"如果我們真正追求真理就不會在乎任何環境，會突破任何情況。","date":"Originally In English","url":"101期"},{"content":"如果你們時時做好事，就會有越來越多的好事發生；好事越多，壞事就越不可能發生在你們身上，那時候好的能量會形成厚厚的圍牆包圍著你們，你們連想要做壞都很難。","date":"清海無上師\n以英文講於美國洛杉磯共修會 1997.07.08（DVD#588）","url":"http://www.godsdirectcontact.org.tw/ch/news/168/"},{"content":"我們修行人不是說吃素，不是說不殺生，不是說放生就好了，小事情、大事情，要考慮到別人，因為我們修行有智慧嘛，要保護別人，聽懂嗎？","date":"清海無上師以中文講於法國 2009.01.15","url":"DVD936做好因會得好果"},{"content":"表現和善還不夠，你必須要與和善、慈悲、愛力融為一體，那時這些品質就是你，除了愛，你別無其他了，那時你才是真正的聖人。","date":"清海無上師以英文講於匈牙利歐禪 2005.02.24","url":"http://www.godsdirectcontact.org.tw/ch/news/169/"},{"content":"上帝的旨意有好幾個，我們自己可以選，不然如果什麼都是命中注定的的話，就太無聊了一點，我們可以改變，改變成好是可以的。","date":"清海無上師以中文講於柬埔寨1996.3.27","url":"101期"},{"content":"靈修成就才是人生最應該追求的事，應該擺在第一位，比財產、名譽、聲望、政治前途更重要。","date":"清海無上師以英文講於美國華府國際禪四 \n1997.12.23（DVD #604）","url":"http://www.godsdirectcontact.org.tw/ch/news/159/"},{"content":"你打坐越多，無我貢獻越多，越放棄世俗欲望，就會增強你的修行，讓你快快進步。","date":"清海無上師視訊會議\n美國加州洛杉磯\n2011.1.1（DVD 916）","url":"916 新年新希望：如何更接近上帝"},{"content":"即使我們處境順遂，也要時時提醒自己：永遠把上帝擺在第一位，上帝就是我們的真我。","date":"清海無上師以英文講於美國華府國際禪四 \n1997.12.23（DVD #604）","url":"http://www.godsdirectcontact.org.tw/ch/news/160/index2.htm"},{"content":"一旦我們被這世上的東西所奴役，我們就會永遠追在它後面跑，疲於奔命、耗盡心力，各種問題都找上門來了，還不一定得到任何東西。","date":"清海無上師以英文講於福爾摩沙西湖道場 1995.07.12（影帶編號#489","url":"師父的話"},{"content":"要獲得別人尊敬，必須先要具有贏得別人尊敬的態度，自己如果能自重，別人自然會尊敬你。","date":"清海無上師以中文講於福爾摩沙台北1986.09.24","url":"http://www.godsdirectcontact.org.tw/ch/news/170/st1.htm"},{"content":"你們要當我的眼睛、我的耳朵、我的手，及傳遞加持的管道，代表我的愛和我的言行，讓世人看見你們就如同看到我，並且效法你們。這就是我們加持世界的方式，所以我們才要修行。","date":"清海無上師以英文講於英國倫敦 2005.12.31","url":"http://www.godsdirectcontact.org.tw/ch/news/170/qa2.htm"},{"content":"愈為人著想，就愈能擴展我們自己，使自己擴展到跟萬物同一體，我們就成佛了","date":"清海無上師以英文講於美國紐約 1990.2.3","url":"78期"},{"content":"越覺得挫折時，越要多打坐，這樣才能承受所有的壓力與挫折，這是唯一的解決之道。","date":"清海無上師透過網際網路視訊會議以英文對韓國同修開示 2002.08.24（影帶編號#748）","url":"http://www.godsdirectcontact.org.tw/ch/news/158/ap4.htm"},{"content":"我們不要怕苦，就怕我們沒有耐心忍受苦。我們應該祈求佛菩薩、祈求上帝，讓我們有多耐心。","date":"清海無上師以中文講於福爾摩沙西湖禪四 1988.09.24-27 （MP3-3）","url":"http://www.godsdirectcontact.com/chinese/jian/teaching/145/1.html#"},{"content":"我們也可以跟著世界的人一起喜、怒、哀、樂，不過我們好像一個旁觀者，站在旁邊看另外一個人喜、怒、哀、樂，而不是我們自己","date":"清海無上師以中文講於福爾摩沙西湖禪四 1988.09.24-27 （MP3-3）","url":"http://www.godsdirectcontact.com/chinese/jian/teaching/145/1.html#"},{"content":"大家還是要努力修行，把我們善良的振動力，傳播到各地角落，這樣子有可能還會幫助一些人，不然我們只依靠組織方面或是錢財方面，就是暫時而已，也說不定能幫助他們。","date":"清海無上師以中文講於福爾摩沙苗栗西湖 1991.6.30","url":"http://www.godsdirectcontact.org.tw/ch/news/105/b-1.htm"},{"content":"我們都是上帝的兒女，不應該責怪自己有罪，不應該看不起自己。該發生的事就會發生，假如我們不喜歡所發生的事，那就改變它。","date":"清海無上師以英文講於英國倫敦 1999.06.09（DVD#662","url":">>"},{"content":"天堂就是在聖人裡面","date":"清海無上師以中文講於法國 2009.07.16(DVD969)","url":""},{"content":"你們必須要修行好才能獲得加持，不然就算你就坐在靈性加持線中間，對你也不會有太大影響。","date":"清海無上師以英文講於法國 2012.04.6(DVD1006)","url":""},{"content":"你們要常常想到如何去服務全體人類，如何去幫助那些不幸的人，這才是真正的聖人之道。","date":"清海無上師以英文講於匈牙利歐禪 2005.02.24","url":"http://www.godsdirectcontact.org.tw/ch/news/169/"},{"content":"我們如果想要領導別人，就必須先領導自己走出黑暗。","date":"清海無上師以英文講於美國華府國際禪四\n1997.12.23 （ DVD#604）","url":"http://www.godsdirectcontact.org.tw/ch/news/159/"},{"content":"我們的生活應該要幫助其他人認識天國、認識那個長養我們的生命、長養整個宇宙的偉大聖靈，了解到如果沒有祂，我們只不過是一個沒有用的空殼而已","date":"清海無上師以英文講於美國德州休士頓\n1993.11.13（影帶編號#393）","url":"http://www.godsdirectcontact.org.tw/ch/news/174/"},{"content":"我們應該專注於我們這一生究竟要成就什麼，將心思放在我們所擁有的，而不要去管我們沒有什麼。","date":"清海無上師以英文講於美國洛杉磯國際禪三 \n1998.12.17（影帶編號#641）","url":"http://www.godsdirectcontact.org.tw/ch/news/162/qa3.htm"},{"content":"當你抱怨太多或過度自憐自艾時，會讓自己變得渺小、失去尊嚴。","date":"清海無上師以英文講於韓國永同道場國際禪六 2000.05.12（DVD#701）","url":"http://www.godsdirectcontact.org.tw/ch/news/158/tip2.htm"},{"content":"我們裡面心單純肯定，看事情就會很肯定、很舒服、很漂亮；我們心不單純、心否定的話，看什麼都不好。","date":"清海無上師以中文講於福爾摩沙西湖道場\n1994.06.05（影帶編號#434）","url":"http://www.godsdirectcontact.org.tw/ch/news/173/"},{"content":"並不是因為光很漂亮，我們才要看，因為聲音好聽，我們才應該聽，不是、不是！而是因為祂所包含的慈悲、博愛是一種藥療，可以治我們的自私、驕慢、不善良的病。如果沒有這種高等的藥療，我們貪、瞋、癡的病沒辦法治療。","date":"清海無上師以中文講於福爾摩沙西湖禪四 1988.09.24-27 （MP3-3）","url":"http://www.godsdirectcontact.com/chinese/jian/teaching/145/1.html#"},{"content":"教理本身並不重要，重要的是教理的實踐，因為你們不斷實踐這些教理，我們才能成為一體，才能夠如此互愛、互信。","date":"清海無上師以英文講於美國佛州1999.09.25（影帶編號#704）","url":"http://www.godsdirectcontact.org.tw/ch/news/163/index2.htm"},{"content":"我們要讓整個生活都成為打坐，這樣整個人生就變成一個不斷開悟的過程。重要的不是開悟本身，而是開悟的過程，那是十分美好的。","date":"清海無上師透過網際網路視訊會議以英文對德國漢堡同修開示 2002.10.06","url":">>"},{"content":"我們下來這世界之前，我們誓願要做這個、做那個，不過在路上也會有障礙，這樣我們才知道自己的能力有多少、有多強壯、決心有多大，所以沒有什麼魔，不必擔心！","date":"清海無上師以英文講於美國華府國際禪四 1997.12.25","url":"http://www.godsdirectcontact.org.tw/ch/news/120/index.htm"},{"content":"想別人壞的品質，就代表沉重的能量，不要一直想，不然就會跟著掉下去。","date":"DVD916新年新希望：如何更接近上帝2011.01.01英文開示","url":""},{"content":"「抱歉」只要說一次，隨時隨地做得更好才是最好的道歉方式。","date":"","url":"http://godsdirectcontact.us/sm21/cnews/www/097/"},{"content":"當你感恩時，你的態度就改變了，你變得謙卑，然後你的振動力也會改變，等級提昇。等級越高，你能吸收越多的加持力。","date":"清海無上師以英文講於墨西哥坎昆 2010.12.16 （DVD#923）","url":"http://www.godsdirectcontact.org.tw/ch/news/209/"},{"content":"光是上帝的愛就足以讓我們覺得很快樂，這就是我們生活的目的--尋找這份愛，然後我們就會感到滿足。","date":"清海無上師以英文與德文講於德國慕尼黑1995.08.18（影帶編號#566）","url":"http://www.godsdirectcontact.org.tw/ch/news/165/index2.htm"},{"content":"要在地球上做上帝的化身，走路像上帝，做事像上帝，說話像上帝；做任何對他人有益的，說任何對他人有益的，想任何對他人及自己有益的，不要用各種有損自己尊嚴的低等級的身口意沾污你自己，要記住，你們都是大丈夫。","date":"清海無上師以英文講於德國柏林1993.5.5","url":"師父的話"},{"content":"明師是一個能夠馴服自己的錯誤而從中學習的人，發願要每天越來越好，就好像天才要靠不斷努力工作來維持，明師也是一樣，明師就是主宰你自己，沒有別的。","date":"清海無上師以英文講於美國加州洛杉磯共修會 1996.3.13（影帶編號#536）","url":"http://www.godsdirectcontact.org.tw/ch/news/155/index2.htm"},{"content":"我們必須進入內邊的天國，才能了解祂的工作，才會知道祂所安排的宇宙計畫，那時我們會明白事情的緣由。一切事情的發生，都是為了讓我們獲得最大的利益。","date":"清海無上師以英文講於以色列特拉維夫 1999.11.21（DVD#671）","url":"http://www.godsdirectcontact.org.tw/eng/news/176"},{"content":"謙卑的意思就是沒有我執；沒有我執表示更多神性會流露出來，內邊的神性更彰顯，比例高過我執。因此你跟良善、跟神性就越接近，並獲得越多加持。","date":"清海無上師以英文講於墨西哥坎昆 2010.12.16 （DVD#923）","url":"http://www.godsdirectcontact.org.tw/eng/news/209/"},{"content":"要學習有體諒心，這不是為了他人，而是為了自己，把自己提昇到敏感度更高的意識裡。","date":"清海無上師以英文講於美國紐澤西道場 1992.06.18（影帶編號#256）","url":"http://www.godsdirectcontact.org.tw/ch/news/170/ap1.htm"},{"content":"我們做什麼都為別人，不想自己那麼多，能為別人做什麼就馬上做，毫不考慮，那就是聖人的品質。","date":"清海無上師以中文講於泰國曼谷 1996.04.02（影帶編號#542）","url":"http://www.godsdirectcontact.org.tw/ch/news/170/ap1.htm"},{"content":"修行人不是只顧自己去天國，而是要把天國帶到我們住過、走過的每個地方，這樣做才是最好的。","date":"清海無上師以英文開示2012.12.22(實踐人類真正標準的生活)","url":""},{"content":"任何時候我們一起驕慢心，或認為自己是特別的，我們的等級就會掉得很快。","date":"清海無上師以英文講於匈牙利歐禪 2005.02.24","url":"http://www.godsdirectcontact.org.tw/ch/news/175/"},{"content":"如果一個徒弟等級不高的話，就不可能了解他的師父有多偉大，因為兩個人等級不同。","date":"清海無上師早期開示於福爾摩沙台北1985.08.03 （原文為英、中文）CD_CE01","url":"http://www.godsdirectcontact.org.tw/ch/news/168/"},{"content":"我們應該隨時幫助那些需要我們幫忙的人，不論是在心理上或精神上、在物質上或靈修上都應該幫助他人，不過能接受多少就要看他們自己了。","date":"清海無上師以英文講於美國洛杉磯1998.6.7(DVD626)","url":""},{"content":"忘了寄","date":"","url":""},{"content":"如果我們內邊真的很誠心、很謙卑、完全信靠師父的力量，沒有我執，那麼我們將無所不能，許許多多的人都可以受我們影響。","date":"清海無上師以英文講於美國佛州 2001.06.06\n（影帶編號#714）","url":"http://www.godsdirectcontact.org.tw/ch/news/168"},{"content":"我們要勇敢、要當一個很轟烈的人物，不能每次都頭低低，向環境投降，或投降在我們小小的障礙裡。","date":"清海無上師以中文講於香港天山道場 1993.10.1 習慣高等振動力","url":"97期"},{"content":"我們得到這些加持卻每天都浪費掉了，因為我們做不對的事而且不記得。我們必須記得，至少每天要意識到加持並且感謝他們。即使你不知道也要清醒地感受，每天去感受自己是被加持和被保護的，並感謝加持你的任何人。","date":"清海無上師以英文講於墨西哥坎昆 2010.12.5 （DVD#918）","url":""},{"content":"我們不應該老是煩惱自己的缺陷而意志消沈。應該發掘自己的優點、發揮自己的才華，體察生活中上帝賜予的光明面，然後激勵、振奮自己。","date":"清海無上師以英文講於法國巴黎1997.01.26（影帶編號#629）","url":"http://www.godsdirectcontact.org.tw/ch/news/151/index2.htm"},{"content":"隨時把注意力放在求道上是很重要的，只有這樣才能讓自己很快進步。","date":"清海無上師以英文講於馬來西亞 1992.02.27 （影帶編號#220）","url":"http://www.godsdirectcontact.org.tw/ch/news/175/"},{"content":"服務他人時得到的加持，永遠比為自己做要加倍多。","date":"清海無上師以英文講於墨西哥坎昆 2010.12.5 （DVD#918）","url":"頂尖環保英雄會"},{"content":"不要期待任何事就不會有麻煩，開悟是我們唯一要期待的。","date":"Spoken by Supreme Master Ching Hai (Originally in English)","url":"http://godsdirectcontact.us/sm21/cnews/www/103/"},{"content":"修觀音法門的人不可能不成佛，不可能！","date":"清海無上師以悠樂文講於美國加州洛杉磯國際禪三1998.12.17\n（影帶編號#640）","url":"師父的話"},{"content":"愛是表現關愛，愛是關心彼此的感覺和需要，互相照顧，才會快樂，才會感覺被愛，覺得被需要，才有相互陪伴的安全感。才能感到彼此之間的互信。這是婚姻或感情關係存在的目的。是ㄚ，所以任何時候都不要遲疑地表現愛意，只要一個擁抱，或輕吻一下臉頰或只說句\"我想你\"或送塊巧克力當驚喜等等。永遠都要讓你的伴侶覺得被愛，這很重要。即使如今你已經知道或發現那是你的仇敵，沒關係，繼續做，反敗為勝。","date":"清海無上師以英文講於法國20120407(DVD1007-2提昇世界)","url":""},{"content":"因為我們是贏家，不是輸家。我們可以戰勝任何事!戰勝仇敵，愛我們的仇敵。","date":"清海無上師以英文講於法國20120407(DVD1007-2提昇世界)","url":""},{"content":"如果能完全臣服於師父的力量，百分之百相信師父，就會進步很快。","date":"清海無上師以中文講於福爾摩沙西湖道場1988.10.29（MP3-CG03）","url":"http://www.godsdirectcontact.org.tw/ch/news/175/"},{"content":"不管什麼理由，如果過去世曾彼此為敵，在這一世，既然已經遇到彼此，就要試著去愛更多，要有耐心和愛心，好嗎?","date":"清海無上師以英文講於法國20120407(DVD1007-2提昇世界)","url":""},{"content":"一切都要看我們的意念和內心，如果我們沒辦法控制自己的心，到哪裡情況都是一樣亂。","date":"清海無上師以英文講於美國佛州小中心 \n2001.06.12~16（影帶編號#724）","url":"http://www.godsdirectcontact.org.tw/ch/news/159/mt1.htm"},{"content":"每當你想批評別人，就祈禱讓自己不要批評，如果已經批評了，就祈求原諒，並且不要重蹈覆轍。然後親自向對方道歉，或在心裡向對方道歉，至少內心懺悔。","date":"DVD916新年新希望：如何更接近上帝2011.01.01英文開示","url":""},{"content":"有時候我們得跟別人分享傷痛，不只是喜悅，還有悲傷，意思是真正的苦楚，不是那些只想引起注意的無聊的人。那就不一樣。","date":"清海無上師以英文講於法國20120407(DVD1007-3提昇世界)","url":""},{"content":"重點不是你花了多少時間在打坐上面，而是看你的專注力有多少。","date":"清海無上師透過網際網路視訊會議以英文對德國漢堡同修開示 2002.10.06","url":">>"},{"content":"沒有受苦的人，很難感同身受。口頭上說了解，但只是頭腦這樣想。只有當我們本身受到影響時，我們才會真的體會。","date":"清海無上師以英文講於法國20120407(DVD1007-3提昇世界)","url":""},{"content":"試著多犧牲一點，好嗎？如果你能犧牲...多一點犧牲。在外面如果看到某人很痛苦，你會很想貢獻點什麼，去幫助那個人，不是嗎？","date":"清海無上師以英文講於法國20120407(DVD1007-3提昇世界)","url":""},{"content":"我們生來就已經有加持力了，不需要再貪求什麼。只要打坐、做高雅的工作，那就是對自己莫大的加持了。","date":"清海無上師以英文講於墨西哥坎昆 2010.12.09 （DVD#923）","url":"師父的話"},{"content":"任何時候我們還有這種批評的看法、還有那種驕慢的概念的話，就一定找不到自己本性，即使一位明師在我們面前，我們也看不到。","date":"清海無上師以中文講於福爾摩沙西湖 1995.1.1","url":"http://godsdirectcontact.us/sm21/cnews/www/111/"},{"content":"如果我們具有某些形式的破壞性品質，我們可能在過去世，對某人做了不對的事，那就要試著去修正。","date":"清海無上師以英文講於法國20120407(DVD1007-2提昇世界)","url":""},{"content":"為什麼佛陀祂無所不在，因為祂愛所有眾生，認同一切眾生，所以祂成為如來。","date":"清海無上師以英文講於美國紐約 1990.2.3","url":"http://godsdirectcontact.us/sm21/cnews/www/078/c-0.htm"},{"content":"不是每次去哪裡都馬上去找舒服的事情做，即使耽誤到我們修行的時間也不管。任何的時間我們能打坐的話，那是最寶貝、最有利益的。","date":"清海無上師以中文講於福爾摩沙宜蘭 \n1988.8.16（MP3-2）","url":"http://www.godsdirectcontact.org.tw/ch/news/130/index.htm"},{"content":"否定的力量只是為了提醒我們回歸天國，以避開所有這些痛苦跟否定的影響。有時碰到災難，我們反而會更誠心向上帝禱告。","date":"清海無上師以英文講於荷蘭阿姆斯特丹\n1999.05.09 （影帶編號#647）","url":">>"},{"content":"你對世上的任何事物都不再留戀，真正無欲無求，那才是真正的打坐，其他都只是練習而已，不斷的練習再練習。","date":"清海無上師以英、法文講於法國巴黎 2006.10.22","url":"師父開示"},{"content":"愛眾生就是利益自己；傷害眾生就是傷害自己。","date":"清海無上師以英講於墨西哥坎昆 2010.12.11(DVD920)","url":""},{"content":"如果你們修行還不穩定，就算因為上帝的恩典而被提昇，還是會很快又掉下來。如果你修行很穩固，即使入世工作也不會掉。","date":"清海無上師以英、法文講於法國巴黎 2006.10.22","url":"師父開示"},{"content":"我們需要的是力量，不是我執。","date":"清海無上師以英文講於美國佛州小中心 2001.12.23\n（DVD#725）","url":"師父的話  http://www.godsdirectcontact.org.tw/ch/news/180/"},{"content":"我們只要對人、對其他國家、對政府、對任何事都保持肯定，把肯定的一面發揮出來，這樣事情就會變好，情況一定會改變。","date":"清海無上師以英文講於泰國特別聚會 2006.11.28","url":"師父開示"},{"content":"有一天我們會拋下這一切\n只有你們和我    相愛在天國!","date":"法國20080901","url":"CD-M037晚安寶貝"},{"content":"愛不是嘴巴說說而已，愛一定是發自內心並用行動表現出來。","date":"清海無上師以英文開示2011.08.27(DVD999真愛)","url":""},{"content":"我們先做好了以後，別人就會跟隨，不要等別人而我們要先自己做。","date":"清海無上師以中、英文講於福爾摩沙台北禪七 \n1994.05.23 （影帶編號#428）（MP3-CR15）","url":"http://www.godsdirectcontact.org.tw/ch/news/181/"},{"content":"每次我們憎恨鄰居時，我們的開悟等級就會掉下來一點；每次我們對別人有負面的想法，也會失掉一部分自己的本性，失掉一些應有的光亮和天國喜悅。","date":"清海無上師以英文講於福爾摩沙西湖道場 1995.11.01（影帶編號#510）","url":"http://www.godsdirectcontact.org.tw/ch/news/182/"},{"content":"你們如果真的要做什麼大事，就要準備吃苦，準備容量任何的人的缺點。","date":"","url":"http://godsdirectcontact.us/sm21/cnews/www/087/"},{"content":"每當我們專注於這個物質世界的任何事物時，就會在那一刻忘記上帝。所以我們與上帝分開的程度，取決於我們享樂的心有多重，物質的心有多重。當我們注意物質世界的任何東西，那一刻就會忘記上帝，讓自己跟上帝分開，看享受的程度如何，你有多留戀，不然上帝不會在乎我們擁有什麼、我們吃什麼、喝什麼。","date":"清海無上師以英文開示2011.01.01(DVD916新年新希望：如何更接近上帝)","url":""},{"content":"訓練自己做一個正正當當的人。我們不要為了擁有世界上任何短暫的東西而出賣自己的靈魂。","date":"清海無上師以中文講於泰國特別聚會 2006.11.26 (DVD774)","url":"http://www.godsdirectcontact.org.tw/ch/news/182/"},{"content":"即使形體上我們沒在一起，但在心理上、靈性上和感情上，我們卻很近、很近，日日夜夜在一起，但願你們也有同感！","date":"清海無上師與英國倫敦小中心的電話會議 \n2007.03.18（原文為英文）","url":""},{"content":"還不認識自己的時候，別人稍微罵一點就會痛心，人家恨我們，我們也會恨他，因為還不認識所有眾生都是佛，還達不到這個平等心，還做不到不分別心。所以應該修行，修到什麼時侯，我們的心不動，看所有眾生，就如同看自己一樣，這樣才算是真正了解自己。","date":"清海無上師以中文講於福爾摩沙台北 1986.12.01","url":"http://www.godsdirectcontact.org.tw/ch/news/172/st_36.html"},{"content":"我們要快樂、肯定、充滿自信，每當你自以為自己等級很低時，就把那個想法丟掉；每當你覺得意志消沈、垂頭喪氣時，就把那種感覺丟掉。","date":"清海無上師以英文講於美國洛杉磯國際禪三 1998.12.16-18 \n（錄影帶編號：#639）","url":"http://www.godsdirectcontact.org.tw/ch/news/132/index.htm"},{"content":"你們精進打坐、時常參加共修，或是傳播天國的福音給需要的人知道，這也是一種無條件的愛。","date":"清海無上師透過網際網路視訊會議以英文對芬蘭赫爾辛基同修開示 2003.02.16","url":"<<"},{"content":"你們隨時都要儘量保持無私，至少要訓練自己，這樣有一天就會變成真的，變成自動的反應。","date":"清海無上師以英文講於奧地利 2007.05.27","url":"http://www.godsdirectcontact.org.tw/ch/news/187/"},{"content":"你付出越多，你就越有愛心，就是這樣。","date":"清海無上師以英文講於奧地利 2007.05.27","url":"http://www.godsdirectcontact.org.tw/ch/news/187/"},{"content":"我們必須盡全力做個正義的人，如此一來，無論做什麼，都將無所畏懼。","date":"清海無上師以英文講於美國華府國際禪四1997.12.24","url":"http://www.godsdirectcontact.org.tw/ch/news/103/"},{"content":"要儘可能時時保持思想肯定、有愛心，最起碼只要你一記得，就要控制自己的仇恨心和怒氣。","date":"清海無上師以英文講於英國倫敦 1999.06.09（DVD#662","url":">>"},{"content":"每當我們有慈愛的念頭，就會在其他某個世界創造天堂；每當我們起憎恨心，就會在連我們自己都不知道的角落創造出痛苦的地獄。因此，我們必須了悟上帝，這樣才能純粹地創造幸福快樂；我們所創造的一切，將來都會加倍回到我們身上。","date":"清海無上師以英文講於希臘雅典 1999.05.20 （影帶編號#653）","url":">>"},{"content":"挑戰愈大，我們靈性的領悟及成長也愈大。","date":"","url":"http://godsdirectcontact.us/sm21/cnews/www/099/"},{"content":"我們過度執著物質的舒適，被太多的應該或不應該以及世俗的是是非非所綁，我們就會忘記從所有的這些束縛中解脫出來。","date":"清海無上師以英文講於美國華府國際禪四1997.12.24","url":"職業與修行"},{"content":"如果我們自己改進，其他人也會跟進的。","date":"清海無上師以英文講於法國20120407(DVD1007-2提昇世界)","url":""},{"content":"要努力讓自己像個天堂眾生：無私、無私、無私！總是想到哪些事對別人有益，然後就去做。","date":"清海無上師對英國舍瑞小中心的電話開示 \n2007.07.01（原文為英文）","url":"http://godsdirectcontact.us/sm21/cnews/www/189/"},{"content":"盡力保持肯定的心態，最好的方法就是默念佛號，不要去想什麼心態，什麼都不用想！","date":"清海無上師以英文講於西班牙馬拉加國際禪四 2006.10.01","url":"問答精選"},{"content":"真的做了一點好事的話，就要感謝上帝給你機會成為更好的人，獲得一點好人的品質。","date":"清海無上師以英文對英國舍瑞小中心的電話開示 2007.07.01","url":"http://godsdirectcontact.us/sm21/cnews/www/190/"},{"content":"我們不論傷害誰，不管是什麼，都要以靈性功德分攤。","date":"清海無上師以英文講於墨西哥坎昆 2010.12.5 （DVD#918）","url":""},{"content":"你們必須為無為，並且時時記得上帝，記得一切都是上帝做的。","date":"清海無上師以英文對英國舍瑞小中心的電話開示 2007.07.01","url":"http://godsdirectcontact.us/sm21/cnews/www/190/"},{"content":"偶爾放下一切，大家合起來閉關幾天，是非常、非常重大的事情，特別對那些還沒有完全開悟的人來說，是最重大的事情。","date":"清海無上師以中文講於福爾摩沙屏東三地門禪七 1990.04.01 MP3-CR08","url":"http://www.godsdirectcontact.org.tw/ch/news/185/"},{"content":"如果你被痛苦所打動，你就會很想奉獻心力做點事，你的愛心也會真正覺醒，這時高貴品質就會開始萌芽，並日益增長。","date":"清海無上師以英文講於法國巴黎歐洲禪三 2007.08.22","url":"http://godsdirectcontact.us/sm21/cnews/www/191/"},{"content":"我們的佛性非常偉大、沒有極限，我們每天要發展祂、認識祂，不是開悟一點點就高興了，這樣絕對不夠！","date":"清海無上師以中文講於香港1993.6.26#379","url":"http://www.godsdirectcontact.org.tw/ch/news/146/index2.htm"},{"content":"當禪師們說：「天下本無事」，他們的意思是指不用我執做事。無我、無條件地做事，那才是禪師所言真意。","date":"清海無上師以英文對英國舍瑞小中心的電話開示 2007.07.01","url":"http://godsdirectcontact.us/sm21/cnews/www/190/"},{"content":"「觀音法門」是只給全心全意渴求真理的人修的，而神通、宇宙力量及其他靈力則是給那些追求這類目標的人修的。就像你去晉見國王，然後國王允許你從他的寶藏中，帶走任何你想要的東西，結果你迷失在那些鑽石、紅寶石、桌椅古董裡面。","date":"清海無上師以英文講於福爾摩沙西湖道場 1996.02.21（影帶編號#528）","url":"http://www.godsdirectcontact.org.tw/ch/news/154"},{"content":"明白了以後，我們拜石頭也是佛；不明白，拜佛也是石頭。","date":"清海無上師以中文講於台南 1989.03.02(孔子也是修行人)","url":""},{"content":"修行的人就是為了要解脫，解脫自己的慾望、自己的名利心、自己那種競爭的心態","date":"清海無上師以中文講於福爾摩沙屏東來義道場 1993.01.03（影帶編號＃305）","url":"清海無上師以中文講於福爾摩沙屏東來義道場 1993.01.03"},{"content":"成為自己的老師是最難的一件事，要達到這個目的，一定要有上帝的大力量、宇宙的智慧，那是我們與生俱有的。","date":"清海無上師以英文講於美國加州舊金山 1993.11.27\n（影帶編號＃397)","url":"http://www.godsdirectcontact.org.tw/ch/news/160/index2.htm"},{"content":"當你無私時，表示說你那時的我執也最小，那麼神聖的力量就可以很容易操控你的方向。","date":"清海無上師以英文講於法國國際聚會 2009.02.08","url":"http://www.godsdirectcontact.org.tw/ch/news/207/"},{"content":"任何人有多愛力、越有多愛力，我們越說他是佛菩薩的。","date":"清海無上師以中文講於澎湖 1989.03.06(觀音法門就是愛力的法門)","url":""},{"content":"我們修觀音法門的目的，就是要達到那個內邊的「博愛」的力量。然後我們可以任何人、任何眾生、任何草木，我們都可以疼愛的。真正的像愛我們自己一樣，愛一朵花、愛一個草木，跟疼愛自己的手一樣，不忍心斷的，那個時候就我們成佛了。","date":"清海無上師以中文講於澎湖 1989.03.06(觀音法門就是愛力的法門)","url":"http://www.youtube.com/watch?v=fqm_XJYxCqA"},{"content":"我們必須做的每件事，都要做得盡善盡美，而且儘可能默默、謙虛地做，不需要炫耀，不需要告訴別人，不用憑空誇大。","date":"清海無上師以英文講於法國聚會 2009.03.08","url":"http://www.godsdirectcontact.org.tw/ch/news/203/"},{"content":"我們這個愛力，是不可思議的力量，任何眾生要求我們甚麼，他自然會被我們的愛力救他的，那個是真正的愛力，那個是真正的觀音菩薩。","date":"清海無上師以中文講於澎湖 1989.03.06(觀音法門就是愛力的法門)","url":""},{"content":"我們必須清廉。因為我們如果不清廉，那就跟外面那些收受賄賂或是利用職務圖利自己的人一樣，沒什麼不同，我們只是坐在那裡浪費時間。","date":"清海無上師以英文講於法國聚會 2009.03.08","url":"http://www.godsdirectcontact.org.tw/ch/news/203/"},{"content":"如果我們真的沒有業障，而別人罵我們的話，我們也可以練習耐心、忍辱和謙卑心。","date":"清海無上師以英文講於福爾摩沙台北禪七 1994.05.23 \n（影帶編號#428）（MP3-CR15）","url":"http://www.godsdirectcontact.org.tw/ch/news/154/index3.htm"},{"content":"因為你很好，他們才會相信。不光是我們說了什麼，而是我們所展現的，那才決定別人信或不信。","date":"清海無上師以英文講於法國聚會2012.04.07(DVD1007(1/5)提昇世界（五集之一）)","url":""},{"content":"我們生生世世都有犯錯，所以要原諒別人的錯誤，這是很合邏輯的事。","date":"清海無上師以中文講於澎湖 1989.03.06(戒、定、慧)","url":""},{"content":"你們要學快一點，不要綁自己在那種小小的、沒有用的、沒有價值的角落裡。","date":"清海無上師以中文講於香港1993.6.26#379","url":"http://www.godsdirectcontact.org.tw/ch/news/146/index2.htm"},{"content":"不是說開悟後就無事可做、沒有人需要救度，不是這樣。意思是說開悟以後，你拯救眾生的靈魂，卻不感覺自己有做什麼。","date":"清海無上師以英文對英國舍瑞小中心的電話開示 2007.07.01","url":"http://godsdirectcontact.us/sm21/cnews/www/190/"},{"content":"每次你做什麼事，若有低等的動機，你就罵自己，去打坐，用高貴的意念重新來過，就這樣訓練自己。","date":"清海無上師以英文對英國舍瑞小中心的電話開示 2007.07.01","url":"http://godsdirectcontact.us/sm21/cnews/www/190/"},{"content":"修到那種程度，沒有任何東西對你有什麼意思，只有師父而已。那個時候才快快變成師父，因為跟祂同一體了。師父是代表萬物、代表那個「道」。","date":"清海無上師以中文講於福爾摩沙台北","url":"file:///C:/Documents%20and%20Settings/User/My%20Documents/Downloads/c211-eLetter/c211-eLetter.html#N25"},{"content":"老天有眼嘛，我們對誰有好處、有幫助，天堂會記錄下來；我們幫助動物，天堂也會記錄下來。","date":"清海無上師透過視訊會議以中文開示於福爾摩沙《今生有你--我的狗寶貝》 新書發表會2007.10.25","url":"http://godsdirectcontact.us/sm21/cnews/www/192/"},{"content":"雖然我們的定命是應該這樣做，不過我們做得快樂或是做得痛苦，則都是自己造出來的。因為自己太緊、太放不開，所以才會想不通、做事不愉快。痛苦本來只有一點點，我們卻把它放大好幾百倍，都是因為自己太緊了！","date":"清海無上師以中文講於福爾摩沙三地門禪七 \n1992.12.23（影帶編號＃293）","url":"http://www.godsdirectcontact.org.tw/ch/news/139/index2.htm"},{"content":"戰勝仇敵，愛我們的仇敵。","date":"清海無上師以英文講於法國20120407(DVD1007-2提昇世界)","url":""},{"content":"送人最好的禮物，就是喚醒他們更高等的意識層次","date":"清海無上師以英文講於奧地利克拉根福 2007.05.29","url":"http://godsdirectcontact.us/sm21/cnews/www/188/ms_44.htm"},{"content":"修行是一種行動，要求我們具有克服困難的態度，不屈服於惡劣的環境。","date":"清海無上師（原文為中文）","url":"http://godsdirectcontact.us/sm21/cnews/www/097/"},{"content":"我們修行最重要的就是得到自己的力量，不只靠師父的力量，而是最後應該知道師父的力量也是你們的力量","date":"19930302印尼泗水共修(CD-CG37道長養整個宇宙)","url":""},{"content":"千萬不要為自己做的任何事感到驕傲，因為我們在這裡真的什麼也不是。如果沒有天堂的加持，沒有印心的恩典，我們做的任何事都只是罪業...","date":"清海無上師以英文講於法國2012.03.23(DVD995和平愛心的食物)","url":"http://edenrules.com/index.php?route=product/product&product_id=863"},{"content":"有的時候，我們生出來在一種比較壓迫的情況，因為上帝要給我們學習無畏的精神，要學習勇敢的功課。如果我們順其情況的話，那我們那個功課還沒學會，然後對我們不利而已，並非對宇宙有什麼改變。","date":"19930303印尼泗水共修(CD-CG37逆境中道心更堅強)","url":""},{"content":"如果你真的愛我，就要精進打坐。","date":"清海無上師以英文講於SMC2013.07.","url":""},{"content":"我們生命的每一天、每一分鐘都要做好事，隨時隨地這樣，想好事、做好事、做好人，這就是我們的本分。","date":"清海無上師以英文對英國舍瑞小中心的電話開示 2007.07.01","url":"師父開示"},{"content":"如果你渴望靈性而且相信上帝，就會像我告訴你們的，我們處處都受到加持。此刻、睡覺、清醒時，甚至發生意外時，隨時都受到加持。","date":"清海無上師以英文講於墨西哥坎昆 2010.12.5 （DVD#918頂尖環保英雄會）","url":""},{"content":"當我們與真我更有聯繫時，更多的美與善會自然流露，因為那就是我們。我們就是真、善、美。","date":"清海無上師以英文講於美國加州洛杉磯《天藝》英文版新書發表視訊會議 2008.12.12（DVD#852）","url":"file:///C:/Documents%20and%20Settings/User/My%20Documents/Downloads/c211-eLetter/c211-eLetter.html#N25"},{"content":"你愛一位明師，他的品質會送給你，他的加持力會送給你，你們越來越聰明，越來越輕鬆，越來越有智慧。","date":"News No.)19期","url":""},{"content":"我們打坐的時候要誠心誠意好像是最後一次打坐，或像是明天或是過五分鐘就要往生一般，如果有這種心態，打坐就會有結果。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/19/"},{"content":"我們修行的人有很多騙自己的陷阱，外面的人騙我們或是魔鬼騙我們，我們還可以預防。自己騙自己，就不簡單預防。比方說：我們的個性或是我們的習慣，有很多地方不對，我們也不曉得。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/19/"},{"content":"我們下來的時候，都自己選一些功課，選一個品質，然後自己又跟那個品質奮鬥。","date":"清海無上師以中文講於福爾摩沙西湖19941023~25(CD-CG39周書的那個禪)","url":"http://edenrules.com/index.php?route=product/product&product_id=440"},{"content":"我們要放下對世界的欲望，而不是放棄這個世界","date":"清海無上師以英文講於福爾摩沙西湖 1995.06.03","url":"http://www.godsdirectcontact.org.tw/ch/news/139/index2.htm"},{"content":"當我們用「我執」做事時，會消耗我們的內在力量，因為這時候我們是用有限的能源做事。我們修習觀音法門，就是開始學習信靠最高的力量。","date":"清海無上師以英文講於新加坡 1993.03.08\n（影帶編號＃327）","url":"甘露法語"},{"content":"我們如果傷害別人，就如同傷害我們自己一樣，因為我們都是同一體的。","date":"清海無上師以英文講於法國2012.4.7（DVD1007-4&5）","url":""},{"content":"我們如果執著我們那個貪嗔癡、名利心，還有兇惡的品質，就上不去看那個宇宙的大王。","date":"清海無上師以中文講於福爾摩沙西湖19941023~25(CD-CG39周書的那個禪)","url":"http://edenrules.com/index.php?route=product/product&product_id=440"},{"content":"我們無法避免因果業障，在我們這一生。但至少當我們走時，會去高的、充滿喜悅的地方。那才重要。","date":"（DVD1007-4&5）","url":"http://edenrules.com/index.php?route=product/product&path=59&product_id=861"},{"content":"我們不能靠這個世界的愛力，和世界的權力、財產。不安全，都是很無常。","date":"清海無上師以中文講於福爾摩沙西湖 1989.12.30 ~ 31(MP3-CL29佛心的外衣＆悠樂基山的修行故事)","url":""},{"content":"修行不夠、定力不夠、沒檢討自己，就簡單被風波拉走。","date":"清海無上師以中文講於福爾摩沙西湖 1989.12.30 ~ 31(MP3-CL29佛心的外衣＆悠樂基山的修行故事)","url":""},{"content":"工作就是我們鍛鍊自己耐心的時候","date":"清海無上師以中文講於福爾摩沙西湖 1989.12.30 ~ 31(MP3-CL29佛心的外衣＆悠樂基山的修行故事)","url":""},{"content":"必須心存和善，不管你說了什麼，都代表你心裡在想什麼。","date":"清海無上師以英文講於奧地利2012.4.~28（DVD1009-1）","url":""},{"content":"你們是應該認真修行的，不是說認真看境界。是認真修行是你們的本分，給不給就是師父的本分。…….沒有看到光，有聲音就好了；沒有聲音的話，有師父就好了。","date":"清海無上師以中文講於福爾摩沙西湖 1989.12.30 ~ 31(MP3-CL29佛心的外衣＆悠樂基山的修行故事)","url":""},{"content":"若有人以任何方式指正你，那對你真的很好。你從錯誤中學習，就會變得越來越好。","date":"清海無上師以英文講於國際聚會2008.12.06","url":"http://www4.remembergod.org/cnews/c206.htm#N2"},{"content":"有時間的時候，應該多想到我們靈性方面的本質，並且與它溝通，不要太過沉溺於物質的享受和貪求其他無常的事情。","date":"清海無上師以英文與SMTV視訊2012.12.22","url":"新聞雜誌211期P19"},{"content":"我們修行愈多，更需要有警覺心，不然我們會簡單掉在一固定的角落裡！如果我們掉在那裡的話，我們就不能學到別的角落，所以不能沈在某個境界。也因此金剛經才說：「應無所住，而生其心」。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/19/"},{"content":"任何世界的材料不管是愛情、財產或是地位、學問，都不是障礙。是我們自己障礙自己，因為我們看重它們，給它們力量綁住、控制我們。如果沒有給它們力量，我們就可以用它們，可以控制它們，利用它們利益別人、利益自己。","date":"清海無上師 以中文講於福爾摩沙屏東來義道場  1993.1.3","url":"http://www.godsdirectcontact.com/chinese/jian/teaching/70/1.html#SEC6"},{"content":"我們可以回歸上帝的力量，我們裡面有上帝，我們都是小小的上帝，整體人類加在一起就是很大的上帝。","date":"清海無上師以英講於墨西哥坎昆 2010.12.11(DVD920)","url":""},{"content":"修行應該有愛心才算進步，不是每天打坐很多才算進步，不是啦！我們要多有愛心，多原諒別人；不管境界怎麼樣。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/19/"},{"content":"如果人們內心只有良善，只邀請良善，那麼魔王就無法進入。","date":"清海無上師以英文講於奧地利2012.4.27~28（DVD1009-1）","url":""},{"content":"任何的喜、怒、哀、樂都是習慣造成，所以我們要看得通，要看透這些幻象，了解到沒有什麼真的好，也沒有什麼真的苦，都是被自己的習慣綁住罷了。","date":"清海無上師以中文講於福爾摩沙屏東三地門禪七 1990.04.01 （MP3-CR08）","url":"http://www.godsdirectcontact.org.tw/ch/news/175/"},{"content":"只有當你看到天國的美麗和榮耀時，才可能忘掉貪求世界名利的野心。","date":"清海無上師以英文講於巴西 1989.6.18","url":"http://www.godsdirectcontact.org.tw/ch/pearl_wisdom/qa/3-28.htm"},{"content":"我們不依靠工作、名氣和聲望來度日。我們倚靠上帝，倚靠我們內邊的安寧與清白的良知。","date":"清海無上師以英文講於美國華府國際禪四1997.12.23","url":"職業與修行"},{"content":"我們對自己隨時都要誠實，這就是持戒的目的，這樣我們才會越來越單純，對自己、對別人都更真誠，生活各方面也才會圓滿。","date":"清海無上師以英文講於福爾摩沙西湖國際禪七\n1995.10.30（影帶編號＃508）","url":"http://www.godsdirectcontact.org.tw/ch/news/142/index2.htm"},{"content":"平常我們即使知道過去的錯誤，也沒辦法有力量懺悔。如果我們能夠真正的懺悔，我們業障會消除；不過要懺悔的話，真的應該有修行才能夠懺悔，所以還是要打坐。","date":"清海無上師以中文講於福爾摩沙西湖 1991.06.28","url":"http://www.godsdirectcontact.org.tw/ch/news/136/index.htm"},{"content":"如果我們生氣或是還需要別人的陪伴，每一次配合我們的意見和心情的話，我們還是在我執裡面的！因為這個我執讓我們感覺跟別人隔開，因為隔開才要它改！","date":"清海無上師以中文講於福爾摩沙西湖 1989.12.30 ~ 31(MP3-CL29佛心的外衣＆悠樂基山的修行故事)","url":""},{"content":"想哭就哭，想笑就笑，但要瞭解哭和笑都不是你自己，只是為了認知事物以及存在這世界而體驗它們，否則你不會存在，這世界也不會存在。","date":"清海無上師以英文講於福爾摩沙屏東三地門 1992.12.21","url":"http://www.godsdirectcontact.org.tw/ch/news/117/sl2.htm"},{"content":"我們一直接觸外在的世界、眾人的思想、各種成見以及許多沒有用的東西，而沒有和我們真正的主人、真正的自我聯繫，所以才有麻煩。","date":"清海無上師以英文講於福爾摩沙屏東三地門 1992.12.21","url":"http://www.godsdirectcontact.org.tw/ch/news/117/sl2.htm"},{"content":"你以為是自己在打坐、吃素、持戒，其實都是師父做的，是裏面師父在找師父，並不是你。","date":"清海無上師以英文講於福爾摩沙屏東三地門 1992.12.26","url":"http://www.godsdirectcontact.org.tw/ch/news/117/sl3.htm"},{"content":"我們心平氣和，就不會敵視任何情況或個人","date":"清海無上師以英文講於美國華府國際禪四1997.12.24","url":"稟持公理正義"},{"content":"上帝可以成就一切，但我們必須有足夠的單純心來接受它，以信心的力量來讓它實現。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/79/index.htm"},{"content":"如果一個人迷喪在世俗的感情裡，愛世界的人比愛上帝多的話，當然他的等級還不高，因為他還沈在世界裡。","date":"清海無上師以中文講於福爾摩沙西湖 1992.10.10 （影帶編號＃278）","url":"http://godsdirectcontact.us/sm21/cnews/www/140/ms.htm"},{"content":"修行人不是只顧自己去天國，而是要把天國帶到我們住過、走過的每個地方，這樣做才是最好的。」","date":"清海無上師與美國加州洛杉磯視訊會議20121222（DVD1011）","url":""},{"content":"如果錢是用在好的用途上，那麼錢的主人在靈性方面會得到利益；","date":"清海無上師以英文講於奧地利克拉根福 2007.05.29","url":"http://godsdirectcontact.us/sm21/cnews/www/188/"},{"content":"要永遠保持專注，否則很容易一天、二天、三天、\n整個輩子在自我幻覺和壞習慣中就過去了，\n而不能進入更高的意識層次，\n不能了解靈體生活的甚深意義。","date":"清海無上師以英文講於福爾摩沙西湖 1995.6.6","url":"http://godsdirectcontact.us/sm21/cnews/www/111/"},{"content":"不要向別人宣傳水晶可以治療疾病什麼的，因為還有比水晶更偉大的力量，而且要儘量提醒人們這個更永恆、更具有療效的力量。","date":"清海無上師以英文講於美國洛杉磯國際禪三 1998.12.16-18 \n（錄影帶編號：#639）","url":"http://www.godsdirectcontact.org.tw/ch/news/132/qa4.htm"},{"content":"要勸一個人修行，不是用口講而已，我們自己本人也要修好，然後我們講的話才有那種擁護的力量。","date":"清海無上師以中文講於福爾摩沙西湖 1992.05.10（影帶編號#245b）","url":"http://www.godsdirectcontact.org.tw/ch/news/150/ms1.htm"},{"content":"打坐前，要很誠心努力地祈禱，以幫助你平靜下來並集中精神。","date":"清海無上師以英文講於法國蒙頓 2012.3.28","url":"DVD1000"},{"content":"如果我告訴你們：『請出去試著告知大眾，試著讓人們茹素』是因為我也要你們行善。不僅為了人們，也為了你們自己","date":"清海無上師以英文講於法國 2008.08.31(DVD966)","url":"達到臨界量以拯救地球"},{"content":"大多數人在日常生活中也迷散在自己所喜愛的事物上，忘了那是幻象，忘了那面魔鏡。","date":"清海無上師以英文講於美國夏威夷 1993.10.22","url":"http://www.godsdirectcontact.org.tw/ch/news/117/sl1.htm"},{"content":"我們的一點點智慧可以發展、也可以消滅。如果我們跟善知識、跟有智慧的朋友在一起，我們的智慧會越來越亮、越來越發展。","date":"清海無上師以中文講於福爾摩沙西湖1990.6.24","url":"甘露法語"},{"content":"師父保證解脫了，我們修道德幹什麼呢？還是有用！因為我們會影響到別人。萬一，以後上帝需要我們做王、做大官、做什麼領導大眾那種地位的時候，或是做明師的時候，我們福德圓滿，跟著我們的人或在我們手下的人，也會託我們的福報，安詳快樂。","date":"清海無上師以中文\n講於福爾摩沙西湖禪二 \n1992.09.27-28\n（MP3-CR14）","url":"http://www.godsdirectcontact.org.tw/eng/news/159/index2.htm"},{"content":"即使是世俗的知識，也早就存在我們內邊，只要我們打開大門，所有的東西都會清清楚楚地在那裡。…...在宇宙形成眾生以前，所有萬物就都已經被種下智慧的種子。而現在我們試圖從一個角落去學習每件事物，這其實只是在浪費時間罷了！…...所有口頭的教導或講經只是我的教理中的一小部分，佔百分之三十而已，有百分之七十的教理則是經由靜默、打坐或睡眠當中得到。…不管什麼情況，你們都應該接受，然後從中去學習，…..","date":"清海無上師以英文講於美國華盛頓州西雅圖1993.04.08","url":"師父開示"},{"content":"你的心要很單純，來道場才有幫助，如果來的動機不單純的話，就算你到了上帝面前也不會有感覺，因為你的心還執著於外相，即使上帝就在你面前，你也得不到利益。","date":"清海無上師以英文講於美國佛州小中心 \n2001.06.12~16（影帶編號#724）","url":"http://www.godsdirectcontact.org.tw/ch/news/159/mt1.htm"},{"content":"我們那個天命怎麼樣，我們就跟著這樣子做是最好的。","date":"清海無上師以中文講於歐洲2008.09.09","url":"DVD975珍惜師徒共聚的時光"},{"content":"我們現在已經知道路了，有一些人在外面迷路，我們要儘量指導他，他聽不聽是他的事，我們知道還是要講。","date":"清海無上師以中文講於歐洲2008.09.09","url":"DVD975珍惜師徒共聚的時光"},{"content":"上帝放我們哪裡，就是那邊就是我們的負責任的地方就對了。","date":"清海無上師以中文講於歐洲2008.09.09","url":"DVD975珍惜師徒共聚的時光"},{"content":"這個愛力，它無所不在嘛！你帶著，到處都會聞到，會有受到影響，所以世界越來越好。","date":"清海無上師以中文講於歐洲2008.09.09","url":"DVD975珍惜師徒共聚的時光"},{"content":"我要你們努力以得到涅槃，是因為要你們知道你們不需要涅槃，但只要你們仍然覺得需要，就繼續努力。","date":"清海無上師以英文講於福爾摩沙屏東三地門 1992.12.21","url":"http://www.godsdirectcontact.org.tw/ch/news/117/sl2.htm"},{"content":"我們越愛護眾生我們的生活越高雅，我們越接近這個真理、這個道。","date":"清海無上師以中文講於福爾摩沙西湖1990.1.13","url":"何以一位明師的話最難遵從(MP3下載)"},{"content":"這個兩個半小時打坐，才是真正的工作。幫助整個宇宙，幫助整個世界，幫助整個社會，幫助我們的祖宗，死掉的祖宗，以前的祖宗，以後的祖宗，我們親戚朋友，任何人我們疼愛的人都有幫助。","date":"清海無上師以中文講於福爾摩沙西湖1990.1.13","url":"何以一位明師的話最難遵從(MP3下載)"},{"content":"如果我們為了世俗的技能而摒棄自己的真知，那真是太可惜了！那只會增長我們的我執，讓我們與自己的真知，與那個無所不知、無處不在、永遠不會做錯的本性更隔開。","date":"清海無上師以英文講於法國巴黎歐洲禪三 2007.08.22","url":"http://godsdirectcontact.us/sm21/cnews/www/191/"},{"content":"很多人修行，多是證阿羅漢或是菩薩而已，證佛果比較難證，因為我執沒辦法砍掉。","date":"清海無上師以中文講於福爾摩沙西湖1990.1.13","url":"何以一位明師的話最難遵從(MP3下載)"},{"content":"心如果善良的話，就簡單跟萬物同一體，簡單跟佛接觸。","date":"清海無上師以中文講於福爾摩沙西湖\n1992.10.10 （影帶編號＃278）","url":"http://godsdirectcontact.us/sm21/cnews/www/140/"},{"content":"在通往天堂的途中，好好享受周遭許多賞心樂事，不要去想過去和未來，只要活在當下就行了。","date":"清海無上師透過網際網路視訊會議以英文對德國漢堡同修開示 2002.10.06","url":"https://www.godsdirectcontact.org.tw/ch/news/161/qa4.htm"},{"content":"傳播好消息、傳播好的教理，傳播好的意識、善良美德和道德標準；任何對人類和地球有益的事，你們就儘量利用空閒的時間去做。","date":"清海無上師以英文對英國舍瑞小中心的電話開示 2007.07.01","url":"http://godsdirectcontact.us/sm21/cnews/www/190/"},{"content":"你們如果幫助別人多的話，你們自己會有福報，會有進步。不過我們不要為了那個福報，不是為了進步才出去。然後這樣就不怕成功失敗。我們做，為了愛心嘛。","date":"清海無上師以中文講於美國 2002.12.25","url":"DVD767明師的角色"},{"content":"修行以後，不可以為了自己一個人，照顧自己的身體、照顧自己的快樂的境界，而忘記別人痛苦，所以即使不喜歡也要出去。因為我們修行的目的，就是為了別人，才是真正高等的理想，不是為我們自己。我們能得到什麼好東西，趕快去分享給大家，這樣才是真正修行的目的。","date":"清海無上師以中文講於\n福爾摩沙花蓮1989. 3.22","url":"http://godsdirectcontact.us/sm21/cnews/www/106/"},{"content":"我們原本就已經有專注的能力，唯一需要做的事就是改變我們注意力的焦點。與其想這些金錢、名聲，以及世俗短暫的快樂等無常的事物，不如轉而想念上帝，然後我們就什麼都會有。","date":"清海無上師以英文與德文講於德國慕尼黑1995.08.18（影帶編號#566）","url":"http://www.godsdirectcontact.org.tw/ch/news/165/index2.htm"},{"content":"對待別人好或是對待別的眾生好的，就是對待我們好的。","date":"清海無上師以中文講於福爾摩沙西湖1990.1.13","url":"何以一位明師的話最難遵從(MP3下載)"},{"content":"如果我們內心真正對自己坦白，\n想要進步、想要訓練自己去感受別人的痛苦和快樂、\n想真正保持純潔和良好的狀態，\n我們就必須一直很警醒。","date":"清海無上師以英文講於福爾摩沙西湖 1995.6.6","url":"http://godsdirectcontact.us/sm21/cnews/www/111/"},{"content":"我執是最遭糕的敵人，有時會讓我們陷入大麻煩，但我們還感覺自傲，越陷越深無法自拔，還自以為可以掌控全局。但並沒有，是我執在控制我們，讓我們走錯方向，先傷害自己，再傷害與我們我執相關或接觸的其他人。","date":"清海無上師以英文講於法國2009.01.24(DVD977擇善公主的故事)","url":""},{"content":"為什麼我們的世界那麼苦？因為我們要了解人家的苦心，我們心量才擴大。心越擴大我們越偉大，我們越變成跟萬物同一體。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/19/"},{"content":"如果我們還有隔開的感覺，還是只想我們自己而已，我們就沒辦法跟萬物同一體。","date":"修行的警覺心","url":"http://www.godsdirectcontact.org.tw/ch/news/19/"},{"content":"工作本身就是一種加持，當你們為上帝及大眾工作時，功德會依你們幫助的人數而倍增，並加到你們靈性發展的寶庫裡。","date":"清海無上師以英文講於南非開普敦 1999.11.29","url":"http://www.godsdirectcontact.org.tw/ch/news/127/index.htm"},{"content":"把所學的教理付諸實行，把我們靈修所獲得的智慧和力量加以運用，把修行進步而發展的慈悲心發揮出來。","date":"清海無上師以英文講於美國佛州小中心 2001.12.23\n（影帶編號#725）","url":"師父的話"},{"content":"好，那就不要抱怨，時時都要和善待人，並儘量接受情況。如果可以的話，在當下或稍後用圓融正面的方式盡力去改善情況，要不然就接受它。","date":"清海無上師以英文講於西班牙馬拉加國際禪四 2006.10.01","url":"問答精選"},{"content":"我們每天都要致力於追求上帝、修行、真理、榮耀及美好的事物，不能永遠沉淪在這個物質世界裡，享受物質舒適，過著物質化的生活，因為這些都不是我們，包括這個身體也不是。","date":"清海無上師以英文講於美國華府國際禪四 \n1997.12.23（DVD #604）","url":"師父的話"},{"content":"在生活中我們要確實多多付出愛心，凡事三思而後行，有任何否定的念頭，就立刻斷掉，這樣也是為世界和平盡一份心力。","date":"清海無上師以英文講於捷克布拉格 1999.5.28","url":"http://www.godsdirectcontact.org.tw/ch/news/127/index.htm"},{"content":"時時都要無私，永遠無條件奉獻。不管任何情況，絕不要想為自己謀利，這樣你獲得的反而會比你期望的更多。","date":"清海無上師以英文講於墨西哥坎昆 2010.12.09 （DVD#923）","url":"師父的話"},{"content":"因為我們也是上帝的一部分，我們擁有創造的力量，每當我們的思想正確，充滿愛心和仁慈時，我們就會創造更美好的氣氛，而我們所處的環境也會越變越好。","date":"清海無上師以英文講於捷克布拉格 1999.5.28","url":"http://www.godsdirectcontact.org.tw/ch/news/127/qa1.htm"},{"content":"一個人也可以產生很大的改變。如果你真正相信自己的美意、相信自己所做的事是對的，你就會影響別人","date":"清海無上師以英文講於新加坡共修會 1994.09.28（影帶編號#446）","url":"師父開示"},{"content":"身體代價有時並不是最糟糕的，身體有時殘缺，但還不是最糟糕的事，如果我們心智與對真理的了解不完整，，那才更糟糕。","date":"清海無上師以英文講於歐洲2008.08.30（DVD979）","url":"詳細介紹"},{"content":"時時讓自己的身口意都保持肯定，盡力這樣做，以保護自己，那你就能為自己創造一個可以活動的美好之家，不論你到哪裡，都帶著光、好的能量和好的振動力","date":"清海無上師以英文講於美國洛杉磯國際禪三 1998.12.16-18 \n（錄影帶編號：#639）","url":"http://www.godsdirectcontact.org.tw/ch/news/132/qa5.htm"},{"content":"有時業障太大，就必須清付，但清付後就能去比較高的境界；如果不清付，會去較低的境界","date":"清海無上師以英文講於歐洲2008.08.30（DVD979）","url":"詳細介紹"},{"content":"無論做什麼都要考慮到對方，這樣才能了解對方的立場而感同身受。","date":"清海無上師以英文講於英國舍瑞 2006.01.08","url":"http://www.godsdirectcontact.org.tw/ch/news/170/"},{"content":"如果我們在不如意、不順遂的情況下，還能發揮仁慈心、扶危濟困的話，這才是真正的慷慨善行。如果只在幸運、富有、舒適的情況下，才布施助人的話，那就沒有什麼稀奇了。若是我們處境窘迫，或甚至面臨考驗磨難時，還能夠樂善好施，上帝會知道我們真的是祂摯愛的子女，我們把祂的愛帶來人間。","date":"清海無上師以英文講於菲律賓馬尼拉 2000.05.03（DVD691）","url":"https://www.godsdirectcontact.org.tw/ch/news/155/ap1.htm"},{"content":"當我們的智慧開啟之後，我們每天變得越來越有智慧、越來越有愛心，我們會自動自發地想要幫助周遭的人，因為別人的痛苦我們會感同身受，所以我們希望把快樂帶給每個與我們接觸的人。","date":"清海無上師以英文講於匈牙利布達佩斯1999.05.24（影帶編號#652）","url":"甘露法語"},{"content":"當我們打坐或想念上帝的時候，我們的思想神聖純潔、一無所求，只有神聖的振動力和強烈的加持力時，就不會產生任何不好的東西。當這樣神聖有力的加持力和思想產生，環繞在我們四周和所處的環境時，等級自然就提昇了。","date":"清海無上師以英文講於福爾摩沙西湖 1991.9.25\n（影帶編號＃152） 為生命上彩P125","url":"http://www.godsdirectcontact.org.tw/ch/news/129/index.htm"},{"content":"共修的時候力量是很大，即使我們等級很爛，來共修一會兒還是會很高，因為被拉上來。如果我們等級高、沒有來共修，過了一會兒也會很爛，因為我們世界都是互相靠、互相有關係，沒有人孤單一個而能夠做什麼事。修行也是一樣，如果我們認為自己一個人能夠修行得成，這是錯誤，表示說還不懂、等級還是不高。","date":"清海無上師以中文講於福爾摩沙苗栗西湖 1990.2.18","url":"http://www.godsdirectcontact.org.tw/ch/news/105/index.htm"},{"content":"我們必須想想如何能過個值得在地球上生存的生活，如何能真正決定讓自己的日子過得更好，如何能回報天堂的慈悲。不是只會一直要求天堂為我們做什麼，而是要問自己能夠為這世界、為別人以及為我們自己做什麼，這才是應該做的事。","date":"清海無上師與美國加州洛杉磯視訊會議20121222（DVD1011）","url":"DVD1011"},{"content":"我們應該要替別人著想，這就是我們的目標，就是我們生活的目的，隨時隨地都替他人著想。愈為人著想，就愈能擴展我們自己，使自己擴展到跟萬物同一體，我們就成佛了。愈替自己著想的人，心胸就越狹窄。","date":"清海無上師以英文講於美國紐約 1990.2.3","url":"http://godsdirectcontact.us/sm21/cnews/www/078/c-0.htm"},{"content":"我們有時候在生活裡面碰到一些不愉快的情況，像身體受到傷害或病苦等，我們應該知道那個時候是上帝、造化或佛祖提醒我們，要我們往內邊找永恒的境界。","date":"清海無上師以中文講於福爾摩沙台北1993.02.28","url":"師父講故事"},{"content":"你們的思考方式要改變、對待自己的方式要改變，看待打坐的態度也要跟著改變，你們要把打坐視為生命中最重要的事！ …….","date":"清海無上師以英文講於匈牙利歐禪 2005.02.23-24","url":"http://www.godsdirectcontact.org.tw/ch/news/163/index2.htm"},{"content":"要互相寬恕，上帝就會寬恕我們。彼此握手言和，和平將遍植人間。","date":"清海無上師以英文與美國加州視訊會議2011.04.10","url":"http://smchbooks.com/new-c/dvd/dvd952.htm"},{"content":"不要被否定力量愚弄，它想控制我們的心智並從中挑起仇恨，好讓戰爭開始並永遠繼續下去。不要陷入瘋狂中，那會將我們的靈魂囚禁在黑暗的境界裡。無論如何，我們殺生就永遠不能上天堂。走出戰爭，摒棄殘忍，摒棄所有不是愛與善良的品質。如果你是英雄，就能為自己、為整個世界做到這點。","date":"清海無上師以英文與美國加州視訊會議2011.04.10","url":"http://smchbooks.com/new-c/dvd/dvd952.htm"},{"content":"我們死後還有天堂可去，不是只有這個暫時的世界。要確保我們在這裡的所為，能領我們上天堂。否則，我們將後悔莫及。","date":"清海無上師以英文與美國加州視訊會議2011.04.10","url":"http://smchbooks.com/new-c/dvd/dvd952.htm"},{"content":"世界有很多人，每個人都有不同的工作。修行的人是專門加持靈魂與精神的。所以我們修觀音法門，就是要種這些精神食物，因為世界需要，這是我們修行人的責任。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/19/"},{"content":"有的時候我們會遇到考驗，不論是被師父或同修考驗，或是外面的情況考驗，都是考驗，那時候我們認為不順利，必須好忍耐、好忍耐才活下去，忍耐過了以後，我們才進步好快！","date":"清海無上師以中文\n講於福爾摩沙台北 1989.2.28 \n（影帶編號＃50）","url":"http://www.godsdirectcontact.org.tw/eng/news/129/ms.htm"},{"content":"當你心煩的時候，障礙就來了，否定力量自然會聚集在那裡。","date":"清海無上師以中文講於美國佛州小中心 2001.12.30（影帶編號#732）","url":"師父開示"},{"content":"我們要選擇什麼東西，真的要考慮很清楚，如果裡面已經知道不對，最好不要為了面子、為了習慣，或為了任何短暫、方便的看法，而破壞很強的當來！","date":"~Spoken By Supreme Master Ching Hai\n(Originally In Chinese)","url":"http://www.godsdirectcontact.org.tw/ch/news/94/"},{"content":"你們能夠祝福別人，那最好，不能的話，就把嘴巴閉起來。不是說因為怕死、怕什麼災難，而是我們為什麼要把四周的氣氛弄髒呢？我們自己也要活在裡面啊！","date":"清海無上師以中文講於美國佛州小中心 2001.12.30（影帶編號#732）","url":"師父開示"},{"content":"應該找到自己內邊的愛力了以後，才能夠真正的愛人。我們沒有一個人不想愛人的，真正的在我們很深裡面的心，很喜歡對人好，很喜歡愛人，就是做不到，因為我們跟那個人業障、因果很深…","date":"MP3下載-萬物的根源19900110清海無上師以中文講於福爾摩沙高雄19900110","url":"http://edenrules.com/index.php?route=product/product&product_id=308"},{"content":"我們生氣的時候，我們很簡單忘記那個人也是佛的，所以那個時候我們等級掉下來很低，所以我們功德，那個時候沒有啊~難得我們才能跑上去，又掉下來啦~就很不簡單又爬上去.","date":"MP3下載-萬物的根源19900110清海無上師以中文講於福爾摩沙高雄19900110","url":"https://www.youtube.com/watch?v=Jl-_kqS_f38"},{"content":"我們的意念最好時時刻刻都集中在最高的力量那邊，應該強烈地想念祂，想要回去最高的境界，不要停留在其他的境界，這樣我們就會造出來一種很好、很強烈的氣氛給自己用。","date":"清海無上師以中文講於福爾摩沙台南1988.10.13（MP3-CG02）","url":"http://www.godsdirectcontact.org.tw/eng/news/166/index2.htm"},{"content":"我們不要怕利益別人會傷害到我們自己；因為我們這個道是菩薩道，我們這個路是明師的路。","date":"清海無上師以中文講於福爾摩沙台南1989.3.16","url":"http://www.godsdirectcontact.org.tw/ch/news/105/content.htm"},{"content":"要堅強不屈，要多給別人，而不是向別人拿，這才是聖人之道。","date":"清海無上師以英文講於美國洛杉磯 1993.10.29（影帶編號#388）","url":"師父開示"},{"content":"我們從一出生就住在這個世界上，欠世界實在太多了，至少在物質方面是這樣。現在我們長大成人，能獨立自主了，就要回報一些恩惠。","date":"清海無上師以英文講於美國洛杉磯 1993.10.29\n　\n　\n　\n　\n　\n清海無上師以英文講於美國洛杉磯 1993.10.29（影帶編號#388）","url":"http://www.godsdirectcontact.org.tw/ch/news/158/ms1.htm"},{"content":"我們必須先了解自己有多偉大，然後才能愛自己。一旦了悟到我們所做的每件事情都是上帝的旨意，就不會認為是自己做了這些事情而感到自責，因為我們不是那個做的人。","date":"清海無上師以英文講於美國科羅拉多州波特城 1991.03.09\n（影帶編號#159）","url":"https://www.godsdirectcontact.org.tw/ch/news/158/qk1.htm"},{"content":"我們應該學習忍辱，如果我們的同修、家人、師父、老師、朋友責罵我們，我們都不能忍的話，等一下去度幾千百萬眾生怎麼忍呢？","date":"清海無上師以中文\n講於福爾摩沙台北 1989.2.28\n（影帶編號＃50）","url":"http://www.godsdirectcontact.org.tw/ch/news/129/ms.htm"},{"content":"我們不要讓自己的意念老是停留在病苦上，連想都不要去想。不要去想那些痛苦的情況，不要注意那些不屬於我們靈魂的角落，應該把注意力集中在當下，集中在你所擁有的福報，集中在你身邊美好愉快的事物上。如果你一直注意那些負面的東西，就會忘了眼前美好的事物。","date":"清海無上師以英文講於韓國永同道場國際禪六 2000.05.12（DVD#701）","url":"http://www.godsdirectcontact.org.tw/ch/news/158/tip2.htm"},{"content":"我們不僅在靈性上幫助淨化世界的氣氛，而且在經濟、物質和許多方面，也對世界有所貢獻。我們必須各方面都發展，才能成為完美的眾生。","date":"清海無上師以英文講於美國洛杉磯 1993.10.29","url":"http://www.godsdirectcontact.org.tw/ch/news/158/ms1.htm"},{"content":"我們的內心，天生都有一股對所有動物的偉大愛力，因此，如果我們吃肉，潛意識裡會有罪惡感，這種罪惡感會造成疾病和各種不舒服的感覺，以及生活上的不快樂。所以我們建議，如果你想找到真正快樂的生活、真正自由、無憂無慮的生活，就不應該吃眾生的肉。","date":"清海無上師以英文講於日本東京 1993.05.22（影帶編號#375）","url":"http://www.godsdirectcontact.org.tw/ch/news/162/qa5.htm"},{"content":"犯多少錯都沒關係，都可以原諒，不過要從中記取教訓，不要重蹈覆轍，這就是智慧，就是學習的方式。","date":"清海無上師以英文講於美國華府國際禪四 1997.12.25 （影帶編號＃610）","url":"http://www.godsdirectcontact.org.tw/ch/news/151/mt1.htm"},{"content":"最好是你們整天二十四小時都與我同在，意思是說你有在打坐，你很善良，對別人很好，而且記得上帝，就是這樣。那就是我們同在的方法，我們朝同一個方向看。","date":"清海無上師以英文講於匈牙利歐禪 2005.02.23-24","url":"http://www.godsdirectcontact.org.tw/ch/news/163/index2.htm"},{"content":"我們越浪費，我們業障越多。因為人家種東西、做東西什麼都很辛苦、很辛苦、流淚流汗做的。我們如果太浪費超過我們福報的話，那些剩下來的人家的業障、功勞和痛苦，我們要賠的。","date":"","url":""},{"content":"我們本人根本不輪迴！真正輪迴的只是我們的執著心--執著於那些收集來的好或壞的資料，這種執著心會促使我們一再地尋求另一個工具，來滿足前世未完成的渴望。","date":"清海無上師以英文講於美國加州舊金山 1993.11.27\n（影帶編號＃397)","url":"http://www.godsdirectcontact.org.tw/ch/news/160/index2.htm"},{"content":"就是我們要找我們內在那個愛心出來，以後我們什麼人都能容納的，什麼人也都可以原諒的，這個就是修觀音法門找出來這個佛性，佛性就是愛力，就是愛心，就是上帝，上帝就是愛力。就是我們自己最原本的那個愛心，這個人初生、性本善那個。我們找到了以後我們才能愛人哪","date":"MP3下載-萬物的根源19900110清海無上師以中文講於福爾摩沙高雄19900110","url":"https://www.youtube.com/watch?v=Jl-_kqS_f38"},{"content":"如果我們開了天眼、智慧眼，我們便知道自己的確和所有眾生有關聯，那時我們會對自己的行為非常小心謹慎。","date":"清海無上師以英文講於美國紐約哥倫比亞大學 \n1989.11.03（影帶編號#102A）","url":"http://www.godsdirectcontact.org.tw/ch/news/166/index2.htm"},{"content":"我們師徒有相同的理想，真是太好了！我喜歡和那些言行高雅、思想層次高等的人在一起，這是很大的福報。","date":"清海無上師以英文講於美國紐約 1999.08.04（影帶編號#664）","url":"師父開示"},{"content":"你們所謂的徒弟，應更精進修行。不光是外表整天打坐，重要的是內在，要更誠心、渴望，因為人生短暫。","date":"清海無上師以英文講於法國聚會 2013.06.30(DVD1014)","url":"http://suprememastertv.com/"},{"content":"我們不管隔壁、不管師父、不管任何人的好壞，才能夠精進打坐。如果有任何的垃圾在心裡面的話，我們就會被卡住、被障礙。","date":"清海無上師以中文講於香港1993.6.26#379","url":"http://www.godsdirectcontact.org.tw/ch/news/146/index2.htm"},{"content":"你在默念五佛號時，自然就會散發出最高等的愛力了。","date":"清海無上師以英文講於美國洛杉磯國際禪三 \n1998.12.17（影帶編號#641）","url":"問答精選"},{"content":"你們如果真正的修行好，百病都消了!如果修不好，來這邊看我也沒用!","date":"清海無上師以中文講於美國 2002.12.25","url":"DVD767明師的角色"},{"content":"修行的人謙卑第一","date":"清海無上師以中文講於歐洲2008.09.09","url":"975 珍惜師徒共聚的時光"},{"content":"跟師父學不是印心就夠了，讓那些準同修要準備精神，不是來印心完然後就五代超生這樣子，還是要打坐，就靠你們修行努力怎麼樣，你們的五代才會更有利益。","date":"清海無上師以中文講於福爾摩沙西湖19910623(MP3-00984印心前開示---造化的好工具)","url":"http://edenrules.com/index.php?route=product/product&product_id=850"},{"content":"神通不能勝過福報，不能超過修行的道德和力量。","date":"清海無上師以中文講於福爾摩沙西湖19910623(MP3-00984印心前開示---造化的好工具)","url":"http://edenrules.com/index.php?route=product/product&product_id=850"},{"content":"即使我們遇到什麼不如意的情況，我們都要活下去，要考驗自己，我們越忍受，越沒有這個忍受的心，我們就知道自己的等級越高","date":"清海無上師以中文\n講於福爾摩沙台北 1989.2.28\n（影帶編號＃50）","url":"http://www.godsdirectcontact.org.tw/ch/news/129/ms.htm"},{"content":"你們聊天跟師父聊天不一樣嘛~師父聊天的時候不是聊天的，有加持力，聊天是一個藉口，做任何都是一個藉口給那個人有機會接近，然後默默加持他。你們聊天的話，兩個都倒下去了…","date":"清海無上師以中文講於福爾摩沙西湖19910623(MP3-00984印心前開示
