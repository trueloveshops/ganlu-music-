成習慣。","date":"清海無上師以中文講於福爾摩沙台南19890112","url":"http://www.godsdirectcontact.org.tw/ch/news/97/j-1.htm"},{"content":"以所有力量、功德等等換取留在天界或人間，對我們根本不安全，都不永久。所以最好是我們修行，比方像即刻開悟，從此就高枕無憂。\n清海無上師以英文講於法國20150813\nhttps://youtu.be/IHf3HmG_-Zs?t=1348","date":"","url":"https://youtu.be/IHf3HmG_-Zs?t=1348"},{"content":"看眾生苦，我們才苦；如果沒有苦心，沒有同情心，即使修好久好久，還離道很遠。\n清海無上師以中文講於宜蘭1988.6.20","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/14/e-1.htm"},{"content":"有一種自由，如果我們得到了，就不會被人家誘惑而失去，別人也沒有辦法來毀壞它，這種精神的自由只有修行的人才可以得到。得到這種精神自由以後，即使我們的身體被關或被刑罰怎樣，我們的精神都不會被影響。","date":"清海無上師","url":"http://magazine.godsdirectcontact.net/chinese_t/41/m-1.htm"},{"content":"觀音法門不是師父用語言所能講明，祂不是指那個五佛號，也不是師父教你們做什麼動作，而是一種從高等級的世界傳下來的無形電波，那個才是觀音法門，所以這個法門沒有法門，而是一種愛力。","date":"清海無上師","url":"http://magazine.godsdirectcontact.net/chinese_t/07/b-1.htm"},{"content":"我們所修的觀音法門是可以治百病的，不過身、口、意必須一起修，任何一方面落後都無法進步。","date":"清海無上師以中文講於福爾摩沙新店19860822","url":"http://www.godsdirectcontact.org.tw/ch/news/88/a-1.htm"},{"content":"要試著把注意力集中在苦樂之間的平衡狀態，然後才能成為自己真正的主人。","date":"清海無上師（原文為英文）","url":"http://www.godsdirectcontact.org.tw/ch/news/82/b-0.htm"},{"content":"當你內心告訴你那是好事，而且做了又會讓別人快樂時，就放手去做，不要擔心業障。\n清海無上師以英文講於美國加州洛杉磯禪三 1998.12.16\nhttp://www.godsdirectcontact.org.tw/ch/news/137/qa1.htm","date":"清海無上師以英文講於美國加州洛杉磯禪三 1998.12.16","url":"http://www.godsdirectcontact.org.tw/ch/news/137/qa1.htm"},{"content":"上帝如果給我們缺點，也會同時給我們優點。所以你如果認為自己哪裡有缺陷，就應該儘量去發掘上帝給你的長處，來平衡自己的生活，該給的上帝都有給我們。我們不應該老是煩惱自己的缺陷而意志消沈。應該發掘自己的優點、發揮自己的才華，體察生活中上帝賜予的光明面，然後激勵、振奮自己。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/151/ap1.htm"},{"content":"我們修行的肯定力量會化解一些世界的災難，雖然我們還是看到有災難，看起來好像沒有什麼幫助，不過如果不修行的話，會有更多災難，而讓整個地球早就被消滅掉了。\n清海無上師以中文講於福爾摩沙西湖道場1995.1.2","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/96/c-4.htm"},{"content":"你必須把時間留給自己往內靜思，回歸自己的本性、記起自己內在的本質，並發展祂。\n~ 清海無上師 ~","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/100/d-1.htm"},{"content":"在新年快樂的氣氛中，我們不應忘記那些比較不幸的人。我們用愛心、貢獻的精神和關懷別人的精神美化這個世界，讓我們世界愈來愈有意思、愈來愈漂亮。","date":"清海無上師以中、英文講於泰國曼谷 1994.1.1","url":"http://www.godsdirectcontact.org.tw/ch/news/119/ms2.htm"},{"content":"藉由改吃素食，我們現在就能救自己。吃素是慈悲又很有愛心的行動，我們以愛心對待其他眾生，上天就會慈悲對待我們，因果法律總是很精確的。","date":"清海無上師以英文講於泰國巴吞塔尼視訊會議 2008.10.11","url":"http://www.godsdirectcontact.org.tw/ch/news/201/ap_66.htm"},{"content":"我們的心、頭腦要先乾淨、單純，不是有神通、有修行的力量就好了，我們先身口意乾淨，才能夠有力量。如果先有力量，但身口意還沒乾淨、戒律不清楚，這樣會做壞。","date":"清海無上師以中文講於福爾摩沙西湖 1994.12.31","url":"http://www.godsdirectcontact.org.tw/ch/news/88/u-0.htm"},{"content":"每天精進打坐修行，讓你的生活充滿更多上帝的力量和光亮，那些欲望自然會離開你。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/174/qa_55.htm"},{"content":"若你相信一位明師，而且教理是好的，你也有天堂的好體驗，那就跟隨那位明師，別讓你的頭腦騙你，別讓你的眼睛騙你，別讓你的耳朵混淆你。","date":"清海無上師以英文講於福爾摩沙20190205","url":"http://suprememastertv.com/ch1/download/p.php?f=0537-BMD-20190205-SM-LNY-Lecture-New-Land-P2-o2-2m"},{"content":"不管什麼時候、什麼情況，我們都有師父的力量在內邊，就是我們不用而已。我們向情況屈服、向困難低頭，所以才有麻煩。千萬不要這樣，事情一定有變通的方法，要有耐心。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/95/d-0.htm"},{"content":"在這個宇宙上，有很多的等級我們要成就，有很多地位我們要獲得。所以修行還少時，沒有什麼可炫耀的。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/95/d-0.htm"},{"content":"我們學佛法，一定要成佛的，我們要變成最好、最完美的人。","date":"清海無上師 以中文講於福爾摩沙 1989.2.13","url":"http://magazine.godsdirectcontact.net/chinese_t/76/j-1.htm"},{"content":"如果你們有財富、健康，有美滿幸福的家庭，那真的很幸運。但是要善用它，用在對自己有利的地方，而不要執著。","date":"","url":"https://suprememastertv.com/ch1/v/71862322673.html"},{"content":"光和音是內在的元素，能洗淨我們的靈魂和思想，我們的道德在修行光和音之後會更加彰顯。","date":"清海無上師（原文為英文）","url":"http://www.godsdirectcontact.org.tw/ch/news/90/t-0.htm"},{"content":"只有當我們轉向內求去找內在上帝國度，並得到明師益友的協助，我們才可以真正地脫離魔王控制的牢獄，讓自己重獲自由。","date":"清海無上師以英文開示於香港2019.07.28","url":"https://www.youtube.com/watch?v=ECasHetdXlg&feature=youtu.be&t=1370"},{"content":"這個世界真的不值得我們留戀什麼，所以要趕快修行，每一剎那、每一分鐘都很寶貝！因為我們不曉得自己還剩下多少時間可以修行，就像飛機一樣，燃料有限。比方說，一架飛機從這座機場飛到紐約該加多少燃料，都有一定的數量，如果你不飛到紐約那裡，而只是浪費燃料在機場上空飛來飛去，表演給人看的話，等一下燃料用完了，飛機就掉下去了！","date":"清海無上師以中文講於福爾摩沙西湖禪四 1988.09.24-27 （MR3-CR03）","url":"http://www.godsdirectcontact.org.tw/ch/news/175/ap_59.htm"},{"content":"隨時都要謙卑心，隨時都不能認為我們已經了不起了，才能夠進步，我執是最大的那個難關。","date":"清海無上師以中文講於福爾摩沙新地20190317","url":"https://suprememastertv.com/ch1/v/70466801463.html"},{"content":"為了擁有真正和永恆的快樂，我們必須要有一定的生活方式，那是君子及聖賢所過的生活，他們是依照宇宙的和諧生活，而非按照不止息的頭腦意見來生活。","date":"清海無上師美國洛杉磯講經開示1993.4.3","url":"http://magazine.godsdirectcontact.net/chinese_t/46/c-1.htm"},{"content":"與自己的本性同在時，會感到平和、有智慧，會變的平靜、有愛心、滿足，不只和佛陀與上帝在一起覺得自在快樂，和所有眾生在一起也會覺得自在快樂。","date":"清海無上師以英文開示於福爾摩沙新地20190901","url":"https://suprememastertv.com/ch1/v/95767874856.html"},{"content":"我們應該好好修行，即使已經到第五界，也請記得遵守五戒。因為五戒不僅保護你，也保護其他眾生。","date":"清海無上師以英文開示於福爾摩沙新地20190901","url":"https://suprememastertv.com/ch1/v/95767874856.html"},{"content":"最重要的是好好照顧內邊的純淨。內邊如果純淨，就可以克服許多疾病，克服許多障礙、問題。也會克服許多業障。","date":"清海無上師以英文開示於福爾摩沙新地道場2019/7/7","url":"https://suprememastertv.com/ch1/v/107066033301.html"},{"content":"謝謝你們當好的修行人，那樣很有幫助，幫助世界很多。你們幫助世界，就是在幫助我。","date":"清海無上師以英文講於福爾摩沙西湖20171119","url":""},{"content":"經由每天的打坐，來自上帝強大善良的力量，會沖淡甚至完全消化任何傷害我們心靈的訊息。\nWith the goodness and the powerful energy from God, through meditation each day, we will be able to dilute or maybe digest completely any information that is harmful to our minds and our souls. (Originally In English)","date":"","url":"http://www.godsdirectcontact.org.tw/gb/news/82/index.html"},{"content":"真理不是固定不變的涅槃或是天國，而是永無止盡的成長過程。（原文為英文）\nThe Truth is not a fixed nirvana or Kingdom of God, it is a forever growing process. (Originally In English)","date":"","url":"http://www.godsdirectcontact.org.tw/gb/news/82/index.html"},{"content":"任何事都是修行，當我們把每件事、每件工作都做好，就是打坐、就是修行，那就是對上帝、對宇宙的貢獻，同時也是學習經驗，不只是打坐而已。\nEverything we do is practicing. Every work we do well that is practicing, that is meditation, and that is contributing to God and to the universe. That is also a learning experience, not just meditation. (Originally In English)","date":"","url":"http://www.godsdirectcontact.org.tw/gb/news/82/index.html"},{"content":"你們打坐的時候，試著去忘掉你的知識、頭腦、呼吸和身體的感受，只要打坐就好，要記得那最重要的一點。（原文為英文） \nWhen you meditate, you try to forget your knowing, your mind, your knowledge, your breath, your physical sensation and just be. Remember what's most important. (Originally In English)","date":"","url":"http://www.godsdirectcontact.org.tw/gb/news/82/index.html"},{"content":"要試著把注意力集中在苦樂之間的平衡狀態，然後才能成為自己真正的主人。（原文為英文）\nTry to concentrate on the state of balance between pain and pleasure, therefore get back the mastership for yourself. (Originally In English)","date":"","url":"http://www.godsdirectcontact.org.tw/gb/news/82/index.html"},{"content":"真理不是固定不變的涅槃或是天國，\n而是永無止境的成長過程。","date":"清海無上師（原文為英文）","url":"http://www.godsdirectcontact.org.tw/ch/news/82/b-0.htm"},{"content":"經由每天的打坐，來自上帝強大善良的力量，\n會沖淡甚至完全消化任何傷害我們心靈的訊息。","date":"清海無上師（原文為英文）","url":"http://www.godsdirectcontact.org.tw/ch/news/82/b-0.htm"},{"content":"無論我們講什麼，講好事或壞事，都會相應地發出一種振動，它會反過來影響我們。 \n Whatever we speak will give a vibration; and accordingly what we say, good or bad, will affect upon us again.","date":"清海無上師（原文為英文）","url":"http://magazine.godsdirectcontact.net/chinese_t/86/"},{"content":"完美的人，他知道自己的優點和缺點，他把缺點壓下來，放在一邊或是妥善控制，需要的時候才拿出來用；優點他就繼續發展，為了利益別人、利益自己，那才是完美的人。\n A perfect person knows his good points and shortcomings. He subdues the shortcomings, puts them aside or controls them properly, to be used only when necessary. The good points he will continue to develop, to benefit others and himself. Such is a perfect person.","date":"清海無上師（原文為英文）","url":"http://magazine.godsdirectcontact.net/chinese_t/86/"},{"content":"如果一定要講話，就談上帝或談些有益的事情，才能在空氣中產生肯定的振動力，為世界的和諧、為你們自己靈性的提昇、也為你們的鄰居們做一份貢獻。 \n If you have to talk then talk about God, something beneficial, something that vibrates positively in the air and contributes to the harmony of the world as well as to your spiritual progress and those of your neighbors.","date":"清海無上師（原文為英文）","url":"http://magazine.godsdirectcontact.net/chinese_t/86/"},{"content":"愛是宇宙最高的法律，任何東西都能被愛洗淨，所以當你用愛心和仁慈的態度做任何事時，就不用擔心業障。","date":"","url":"NEWS48"}];

const bgA = document.getElementById('bgA');
const bgB = document.getElementById('bgB');
const datetimeEl = document.getElementById('datetime');
const quoteText = document.getElementById('quoteText');
const sourceLink = document.getElementById('sourceLink');
const searchInput = document.getElementById('searchInput');
const searchPanel = document.getElementById('searchPanel');
const cover = document.getElementById('cover');
const songTitle = document.getElementById('songTitle');
const songMeta = document.getElementById('songMeta');
const progressBar = document.getElementById('progressBar');
const currentTimeEl = document.getElementById('currentTime');
const durationTimeEl = document.getElementById('durationTime');
const toast = document.getElementById('toast');
const audio = new Audio();
audio.preload = 'metadata';
audio.volume = Number(localStorage.getItem('ganlu_last_volume') || 1);
audio.muted = audio.volume === 0;

let currentQuoteIndex = 0;
let currentTrackIndex = Number(localStorage.getItem('ganlu_track_index') || 0);
if (!Number.isFinite(currentTrackIndex) || currentTrackIndex < 0 || currentTrackIndex >= TRACKS.length) currentTrackIndex = 0;
let repeatMode = localStorage.getItem('ganlu_repeat_mode') || 'single';
let bgIndex = Number(localStorage.getItem('ganlu_bg_index') || 0) % BACKGROUNDS.length;
let bgFront = true;

function showToast(msg) {
  toast.textContent = msg;
  toast.style.display = 'block';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.style.display = 'none', 1800);
}

function setBackground(index) {
  bgIndex = (index + BACKGROUNDS.length) % BACKGROUNDS.length;
  localStorage.setItem('ganlu_bg_index', bgIndex);
  const nextBg = BACKGROUNDS[bgIndex];

  const img = new Image();
  img.onload = () => {
    if (bgFront) {
      bgB.style.backgroundImage = `url(${nextBg})`;
      bgB.style.opacity = '1';
      bgA.style.opacity = '0';
    } else {
      bgA.style.backgroundImage = `url(${nextBg})`;
      bgA.style.opacity = '1';
      bgB.style.opacity = '0';
    }
    bgFront = !bgFront;
  };
  img.onerror = () => {
    console.warn('背景載入失敗：', nextBg);
  };
  img.src = nextBg;
}
setBackground(bgIndex);

// 外部 BG 圖包自動接管：如果同層 BG/ 有 bg1.png ~ bg21.png，就優先使用它們；否則保留原本內建背景。
const EXTERNAL_BG_LIST = Array.from({ length: 21 }, (_, i) => `BG/bg${i + 1}.png`);
const THEME_GROUPS = [
  { name: '禪風詩意', start: 0, end: 7, speed: 10000 },
  { name: '浪漫戀愛', start: 7, end: 14, speed: 7000 },
  { name: '活力充沛', start: 14, end: 21, speed: 5000 }
];

let externalBackgrounds = [];
let currentThemeIndex = -1;
let currentBgSpeed = 8000;
let bgPressTimer = null;
let bgLongPressTriggered = false;

function preloadExternalImage(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = src;
  });
}

function restartBackgroundTimer() {
  clearInterval(window._ganluBgTimer);
  window._ganluBgTimer = setInterval(() => {
    setBackground(bgIndex + 1);
    renderTrack();
  }, currentBgSpeed);
}

function useBackgroundList(list, resetIndex = true) {
  if (!list || !list.length) return;
  BACKGROUNDS.splice(0, BACKGROUNDS.length, ...list);
  if (resetIndex) {
    bgIndex = 0;
    bgFront = true;
    localStorage.setItem('ganlu_bg_index', '0');
    bgA.style.backgroundImage = `url(${BACKGROUNDS[0]})`;
    bgA.style.opacity = '1';
    bgB.style.opacity = '0';
  } else {
    setBackground(bgIndex);
  }
  renderTrack();
}

function applyThemeByIndex(index) {
  if (externalBackgrounds.length < 21) {
    showToast('需放入 bg1 到 bg21');
    return;
  }
  currentThemeIndex = (index + THEME_GROUPS.length) % THEME_GROUPS.length;
  const theme = THEME_GROUPS[currentThemeIndex];
  const group = externalBackgrounds.slice(theme.start, theme.end);
  if (!group.length) return;
  currentBgSpeed = theme.speed;
  useBackgroundList(group, true);
  restartBackgroundTimer();
  localStorage.setItem('ganlu_theme_index', String(currentThemeIndex));
  showToast(`主題：${theme.name}`);
}

async function enableExternalBackgrounds() {
  const valid = [];
  for (const src of EXTERNAL_BG_LIST) {
    const ok = await preloadExternalImage(src);
    if (ok) valid.push(src);
  }

  externalBackgrounds = valid.slice();

  if (valid.length) {
    const savedThemeIndex = Number(localStorage.getItem('ganlu_theme_index') || -1);
    if (valid.length >= 21 && savedThemeIndex >= 0 && savedThemeIndex < THEME_GROUPS.length) {
      currentThemeIndex = savedThemeIndex - 1;
      applyThemeByIndex(savedThemeIndex);
    } else {
      currentBgSpeed = 8000;
      useBackgroundList(valid, true);
      restartBackgroundTimer();
    }
  } else {
    currentBgSpeed = 8000;
    restartBackgroundTimer();
  }
}

window.addEventListener('load', async () => {
  await enableExternalBackgrounds();
});

const bgBtn = document.getElementById('bgBtn');

bgBtn.addEventListener('mousedown', () => {
  bgLongPressTriggered = false;
  bgPressTimer = setTimeout(() => {
    bgLongPressTriggered = true;
    applyThemeByIndex(currentThemeIndex + 1);
  }, 800);
});

bgBtn.addEventListener('mouseup', () => clearTimeout(bgPressTimer));
bgBtn.addEventListener('mouseleave', () => clearTimeout(bgPressTimer));

bgBtn.addEventListener('click', (e) => {
  if (bgLongPressTriggered) {
    e.preventDefault();
    bgLongPressTriggered = false;
    return;
  }
  setBackground(bgIndex + 1);
  renderTrack();
});

document.getElementById('tvBtn').onclick = () => window.open('https://suprememastertv.com/ch1/max/', '_blank');
document.getElementById('adminBtn').onclick = () => window.open('admin.html', '_blank');

function updateDateTime() {
  const now = new Date();
  const days = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  const y = now.getFullYear();
  const m = String(now.getMonth()+1).padStart(2,'0');
  const d = String(now.getDate()).padStart(2,'0');
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  datetimeEl.innerHTML = `<div class="line1">${y}.${m}.${d} ${hh}:${mm}</div><div>${days[now.getDay()]}</div>`;
}
updateDateTime();
setInterval(updateDateTime, 1000);

function dailyQuoteIndex() {
  const start = new Date(2026,0,1);
  const today = new Date();
  const todayOnly = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const diff = Math.floor((todayOnly - start)/86400000);
  return ((diff % QUOTES.length) + QUOTES.length) % QUOTES.length;
}
currentQuoteIndex = dailyQuoteIndex();

function renderQuote() {
  const item = QUOTES[currentQuoteIndex] || {content:'',date:'',url:''};

  clearTimeout(renderQuote._timer);
  quoteText.style.opacity = '0';

  renderQuote._timer = setTimeout(() => {
    quoteText.textContent = item.content || '';
    quoteText.scrollTop = 0;
    quoteText.style.opacity = '1';
  }, 80);

  sourceLink.textContent = item.date || '';
  if (item.url && item.url.trim()) {
    sourceLink.href = item.url.trim();
    sourceLink.classList.remove('disabled');
  } else {
    sourceLink.removeAttribute('href');
    sourceLink.classList.add('disabled');
  }
}
renderQuote();

function goNextQuote() {
  currentQuoteIndex = (currentQuoteIndex + 1) % QUOTES.length;
  renderQuote();
  setBackground(bgIndex + 1);
  renderTrack();
}
document.getElementById('nextQuoteBtn').onclick = goNextQuote;
document.getElementById('nextQuoteSmall').onclick = goNextQuote;

function formatTime(sec) {
  if (!isFinite(sec) || sec < 0) return '00:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function trackCover() {
  return BACKGROUNDS[bgIndex];
}

function renderTrack() {
  const track = TRACKS[currentTrackIndex];
  if (!track) return;
  songTitle.textContent = track.display || track.title;
  songMeta.textContent = track.category || '';
  cover.src = trackCover();
  localStorage.setItem('ganlu_track_index', String(currentTrackIndex));
}

function loadTrack(index) {
  if (!TRACKS.length) return;
  currentTrackIndex = (index + TRACKS.length) % TRACKS.length;
  const track = TRACKS[currentTrackIndex];
  audio.src = track.file;
  renderTrack();
}

function updatePlayIcon() {
  const playIcon = document.getElementById('playIcon');
  playIcon.innerHTML = audio.paused
    ? '<path d="M8 5v14l11-7Z"/>'
    : '<path d="M9 5h2v14H9z"/><path d="M13 5h2v14h-2z"/>';
}

function updateMuteIcon() {
  const muteIcon = document.getElementById('muteIcon');
  muteIcon.innerHTML = audio.muted
    ? '<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m17 9 4 6"/><path d="m21 9-4 6"/>'
    : '<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M18.5 8.5a5 5 0 0 1 0 7"/><path d="M15.5 11a2 2 0 0 1 0 2"/>';
}

function updateVolumeIcon() {
  const volumeIcon = document.getElementById('volumeIcon');
  if (!volumeIcon) return;
  if (audio.muted || audio.volume === 0) {
    volumeIcon.innerHTML = '<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m17 9 4 6"/><path d="m21 9-4 6"/>';
  } else if (audio.volume < 0.5) {
    volumeIcon.innerHTML = '<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 11a2 2 0 0 1 0 2"/>';
  } else {
    volumeIcon.innerHTML = '<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M18.5 8.5a5 5 0 0 1 0 7"/><path d="M15.5 11a2 2 0 0 1 0 2"/>';
  }
}

function updateRepeatIcon() {
  const btn = document.getElementById('repeatBtn');
  const repeatText = document.getElementById('repeatText');
  btn.style.opacity = '1';
  btn.title = repeatMode === 'single' ? '單曲循環' : '全部循環';
  repeatText.textContent = repeatMode === 'single' ? '1' : '∞';
  localStorage.setItem('ganlu_repeat_mode', repeatMode);
}

async function togglePlay() {
  try {
    if (!audio.src) loadTrack(currentTrackIndex);
    if (audio.paused) {
      await audio.play();
    } else {
      audio.pause();
    }
    updatePlayIcon();
  } catch (e) {
    showToast('首次通常需手動按播放');
  }
}

function nextTrack() {
  loadTrack((currentTrackIndex + 1) % TRACKS.length);
  audio.play().catch(()=>showToast('請手動按播放'));
  updatePlayIcon();
}

function prevTrack() {
  loadTrack((currentTrackIndex - 1 + TRACKS.length) % TRACKS.length);
  audio.play().catch(()=>showToast('請手動按播放'));
  updatePlayIcon();
}

let lastVolume = Number(localStorage.getItem('ganlu_last_volume') || 1);
if (!Number.isFinite(lastVolume) || lastVolume <= 0 || lastVolume > 1) lastVolume = 1;

function showVolumeHint() {
  const hint = document.getElementById('volumeHint');
  if (!hint) return;
  hint.style.display = 'block';
  clearTimeout(showVolumeHint._t);
  showVolumeHint._t = setTimeout(() => hint.style.display = 'none', 1600);
}

function applyVolume(v) {
  const next = Math.max(0, Math.min(1, Number(v)));
  audio.volume = next;
  audio.muted = next === 0;
  if (next > 0) lastVolume = next;
  localStorage.setItem('ganlu_last_volume', String(lastVolume));
  updateMuteIcon();
  updateVolumeIcon();
}

function toggleMute() {
  showVolumeHint();
  if (audio.muted || audio.volume === 0) {
    applyVolume(lastVolume || 1);
  } else {
    lastVolume = audio.volume || 1;
    applyVolume(0);
  }
}

function toggleRepeat() {
  repeatMode = repeatMode === 'single' ? 'all' : 'single';
  updateRepeatIcon();
  showToast(repeatMode === 'single' ? '單曲循環' : '全部循環');
}

document.getElementById('playBtn').onclick = togglePlay;
document.getElementById('nextBtn').onclick = nextTrack;
document.getElementById('prevBtn').onclick = prevTrack;
const muteBtnEl = document.getElementById('muteBtn');
const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
function cycleVolumeMobile() {
  const levels = [0, 0.33, 0.66, 1];
  const current = audio.muted ? 0 : Math.round(audio.volume * 100) / 100;
  let next = levels.find(v => v > current + 0.01);
  if (next === undefined) next = 0;
  applyVolume(next);
  showVolumeHint();
}
muteBtnEl.onclick = isTouchDevice ? cycleVolumeMobile : toggleMute;
document.getElementById('repeatBtn').onclick = toggleRepeat;

if (!isTouchDevice) {
  muteBtnEl.addEventListener('wheel', (e) => {
    e.preventDefault();
    showVolumeHint();
    const step = e.deltaY < 0 ? 0.05 : -0.05;
    const base = audio.muted ? (lastVolume || 0.5) : audio.volume;
    applyVolume(base + step);
  }, { passive:false });
}


audio.addEventListener('loadedmetadata', () => {
  durationTimeEl.textContent = formatTime(audio.duration);
  progressBar.value = 0;
});
audio.addEventListener('timeupdate', () => {
  currentTimeEl.textContent = formatTime(audio.currentTime);
  if (audio.duration) progressBar.value = audio.currentTime / audio.duration * 100;
});
audio.addEventListener('play', updatePlayIcon);
audio.addEventListener('pause', updatePlayIcon);
audio.addEventListener('ended', () => {
  if (repeatMode === 'single') {
    audio.currentTime = 0;
    audio.play().catch(()=>showToast('請手動按播放'));
  } else {
    nextTrack();
  }
});
audio.addEventListener('error', () => {
  showToast('找不到音樂檔，請確認 music 資料夾結構');
});
progressBar.addEventListener('input', () => {
  if (audio.duration) audio.currentTime = progressBar.value / 100 * audio.duration;
});

function selectQuote(index) {
  currentQuoteIndex = index;
  renderQuote();
  searchPanel.style.display = 'none';
  searchInput.value = '';
}

function playTrackByIndex(index) {
  loadTrack(index);
  audio.play().catch(()=>showToast('請手動按播放'));
  updatePlayIcon();
  searchPanel.style.display = 'none';
  searchInput.value = '';
}

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  if (!q) {
    searchPanel.style.display = 'none';
    searchPanel.innerHTML = '';
    return;
  }
  const qr = [];
  QUOTES.forEach((item, idx) => {
    if ((item.content || '').includes(q) || (item.date || '').includes(q)) qr.push([idx,item]);
  });
  const tr = [];
  TRACKS.forEach((item, idx) => {
    if ((item.display || '').includes(q) || (item.category || '').includes(q) || (item.title || '').includes(q)) tr.push([idx,item]);
  });
  let html = '';
  if (qr.length) {
    html += '<div class="section-label">法語</div>';
    qr.slice(0,6).forEach(([idx,item]) => {
      const short = item.content.length > 34 ? item.content.slice(0,34) + '…' : item.content;
      html += `<div class="search-item" onclick="selectQuote(${idx})"><div>${short}</div><div class="meta">${item.date || ''}</div></div>`;
    });
  }
  if (tr.length) {
    html += '<div class="section-label">音樂</div>';
    tr.slice(0,8).forEach(([idx,item]) => {
      html += `<div class="search-item" onclick="playTrackByIndex(${idx})"><div>${item.display}</div><div class="meta">${item.category}</div></div>`;
    });
  }
  if (!html) html = '<div class="search-item">找不到結果</div>';
  searchPanel.innerHTML = html;
  searchPanel.style.display = 'block';
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrap')) searchPanel.style.display = 'none';
});

loadTrack(currentTrackIndex);
updatePlayIcon();
updateMuteIcon();
updateVolumeIcon();
updateRepeatIcon();
audio.play().then(updatePlayIcon).catch(()=>showToast('首次通常需手動按播放'));

/* ===== 播放器縮成小音樂符號 ===== */
const playerEl = document.getElementById('player');
const miniPlayerBtn = document.getElementById('miniPlayerBtn');
const restorePlayerBtn = document.getElementById('restorePlayerBtn');

function setPlayerMinimized(minimized) {
  if (!playerEl) return;
  playerEl.classList.toggle('minimized', minimized);
}

if (miniPlayerBtn && restorePlayerBtn && playerEl) {
  miniPlayerBtn.addEventListener('click', () => setPlayerMinimized(true));
  restorePlayerBtn.addEventListener('click', () => setPlayerMinimized(false));
}


/* ===== 外圍模糊背景跟內部 BG 同步 ===== */
window.addEventListener('load', () => {
  const outerBlurBg = document.getElementById('outerBlurBg');
  const bgA = document.getElementById('bgA');
  const bgB = document.getElementById('bgB');
  if (!outerBlurBg || !bgA) return;

  function syncOuterBg() {
    const currentBg = (bgA.style.backgroundImage && bgA.style.backgroundImage !== 'none')
      ? bgA.style.backgroundImage
      : (bgB && bgB.style.backgroundImage ? bgB.style.backgroundImage : '');
    if (currentBg) outerBlurBg.style.backgroundImage = currentBg;
  }

  syncOuterBg();
  setInterval(syncOuterBg, 300);
});

</script>
</body>
