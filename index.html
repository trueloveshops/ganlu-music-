<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ganlu Music</title>
  <style>
    :root {
      --fallback-bg: #dfefff;
      --panel-bg: rgba(24, 45, 54, 0.42);
      --panel-bg-strong: rgba(24, 45, 54, 0.72);
      --line: rgba(255, 255, 255, 0.18);
      --text: #f8fbff;
      --text-soft: rgba(248, 251, 255, 0.86);
      --text-dim: rgba(248, 251, 255, 0.64);
      --chip: rgba(255, 255, 255, 0.12);
      --chip-active-bg: #dfefff;
      --chip-active-text: #2e5361;
      --shadow: 0 14px 40px rgba(0, 0, 0, 0.12);
      --radius: 24px;
      --radius-sm: 999px;
      --content-max: 860px;
      --results-height: min(58vh, 580px);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--text);
      background: var(--fallback-bg);
    }

    body {
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 18% 12%, rgba(255,255,255,0.24), transparent 26%),
        radial-gradient(circle at 82% 16%, rgba(255,255,255,0.18), transparent 22%),
        linear-gradient(180deg, rgba(219,239,255,0.92), rgba(197,221,202,0.92));
      z-index: -2;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1800&q=80');
      background-size: cover;
      background-position: center;
      opacity: 0.24;
      filter: saturate(0.95) blur(1px);
      z-index: -1;
    }

    .app {
      width: min(100%, calc(var(--content-max) + 32px));
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .hero {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .title {
      font-size: clamp(26px, 4.8vw, 42px);
      line-height: 1.12;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-shadow: 0 2px 10px rgba(0,0,0,0.08);
      margin: 0;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-soft);
      margin: 0;
    }

    .search-panel {
      position: sticky;
      top: 10px;
      z-index: 30;
      backdrop-filter: blur(10px);
      background: rgba(223, 239, 255, 0.14);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 12px;
      margin-bottom: 16px;
    }

    .search-box {
      position: relative;
      width: 100%;
    }

    #searchInput {
      width: 100%;
      min-height: 52px;
      border: 1px solid rgba(255,255,255,0.42);
      background: rgba(255,255,255,0.72);
      color: #1f3944;
      border-radius: 18px;
      padding: 12px 132px 12px 16px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    #searchInput::placeholder { color: rgba(31,57,68,0.55); }

    #searchInput:focus {
      border-color: rgba(91, 136, 162, 0.55);
      box-shadow: 0 0 0 4px rgba(223,239,255,0.35);
      background: rgba(255,255,255,0.82);
    }

    .search-action-buttons {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      display: none;
      align-items: center;
      gap: 4px;
      z-index: 2;
    }

    .search-action-buttons.show { display: flex; }

    .search-action-buttons button {
      border: none;
      border-radius: var(--radius-sm);
      padding: 6px 8px;
      min-height: 30px;
      white-space: nowrap;
      font-size: 12px;
      line-height: 1;
      background: rgba(223,239,255,0.94);
      color: #385865;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
      touch-action: manipulation;
    }

    .search-action-buttons button:hover { transform: translateY(-1px); }

    .search-action-buttons button.active {
      background: var(--chip-active-bg);
      color: var(--chip-active-text);
      font-weight: 700;
    }

    .summary-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      min-height: 22px;
    }

    .summary-text {
      font-size: 13px;
      color: var(--text-soft);
      letter-spacing: 0.04em;
    }

    .results-card {
      position: relative;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      overflow: hidden;
      box-shadow: var(--shadow);
      min-height: 420px;
    }

    .results-card-header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-bg-strong);
      min-height: 52px;
    }

    .pager-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pager-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--chip);
      color: var(--text);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease, opacity 0.15s ease;
    }

    .pager-btn:hover:not(:disabled) {
      background: rgba(255,255,255,0.18);
      transform: translateY(-1px);
    }

    .pager-btn:disabled {
      opacity: 0.36;
      cursor: default;
    }

    .results-scroll {
      max-height: var(--results-height);
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-padding-top: 0;
      padding: 12px;
    }

    .results-scroll::-webkit-scrollbar { width: 10px; }
    .results-scroll::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.18);
      border-radius: 999px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    .results-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .result-item {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 12px;
      padding: 12px;
      border-radius: 18px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .thumb {
      width: 92px;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      overflow: hidden;
      background: rgba(255,255,255,0.1);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
      position: relative;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb--quote {
      display: grid;
      place-items: center;
      color: rgba(255,255,255,0.82);
      font-size: 28px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04)),
        radial-gradient(circle at 30% 20%, rgba(223,239,255,0.28), transparent 35%);
    }

    .result-main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .result-title {
      font-size: 15px;
      line-height: 1.55;
      color: var(--text);
      margin: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .result-subtitle {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-dim);
      margin: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .results-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px 14px;
      border-top: 1px solid var(--line);
      color: var(--text-soft);
      font-size: 13px;
      letter-spacing: 0.06em;
      min-height: 46px;
    }

    .empty {
      min-height: 300px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
      color: var(--text-soft);
      line-height: 1.8;
    }

    .hint {
      font-size: 13px;
      color: var(--text-dim);
    }

    @media (max-width: 640px) {
      .app { padding-inline: 12px; }
      .search-panel { padding: 10px; border-radius: 18px; }
      #searchInput {
        min-height: 48px;
        font-size: 16px;
        padding-right: 122px;
      }
      .search-action-buttons { right: 6px; gap: 3px; }
      .search-action-buttons button {
        font-size: 12px;
        padding: 6px 7px;
        min-height: 28px;
      }
      .results-card { border-radius: 20px; }
      .results-scroll { max-height: min(56vh, 540px); padding: 10px; }
      .result-item { grid-template-columns: 80px 1fr; gap: 10px; padding: 10px; }
      .thumb { width: 80px; border-radius: 14px; }
      .result-title { font-size: 14px; }
      .result-subtitle { font-size: 12px; }
      .results-footer { font-size: 12px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <h1 class="title">甘露法語 · 音樂播放器</h1>
      <p class="subtitle">天空藍 fallback、搜尋不卡頓、結果區簡潔穩定。</p>
    </section>

    <section class="search-panel">
      <div class="search-box">
        <input
          id="searchInput"
          type="text"
          placeholder="搜尋音樂 / 搜尋法語"
          autocomplete="off"
          oninput="handleSearchInput()"
        />
        <div id="searchActionButtons" class="search-action-buttons">
          <button id="musicSearchBtn" type="button" onclick="submitSearch('music')">搜音樂</button>
          <button id="quoteSearchBtn" type="button" onclick="submitSearch('quote')">搜法語</button>
        </div>
      </div>
    </section>

    <div class="summary-bar">
      <div id="summaryText" class="summary-text">請輸入關鍵字後，選擇搜音樂或搜法語。</div>
    </div>

    <section class="results-card">
      <div class="results-card-header">
        <div class="pager-controls">
          <button id="prevBtn" class="pager-btn" type="button" onclick="prevPage()" aria-label="上一頁">‹</button>
          <button id="nextBtn" class="pager-btn" type="button" onclick="nextPage()" aria-label="下一頁">›</button>
        </div>
      </div>

      <div id="resultsScroll" class="results-scroll">
        <div id="resultsList" class="results-list"></div>
      </div>

      <div id="resultsFooter" class="results-footer">1 / 1　共0筆</div>
    </section>
  </main>

  <script>
    // ===== 資料區：請把這兩個陣列換成你的正式資料 =====
    const musicData = Array.from({ length: 66 }, (_, i) => ({
      id: `music-${i + 1}`,
      title: `甘露音樂示例 ${i + 1}`,
      subtitle: `清海無上師弘法音樂示例敘述 ${1988 + (i % 20)}.${String((i % 12) + 1).padStart(2, '0')}.${String((i % 28) + 1).padStart(2, '0')}`,
      tags: ['MP3', '播放器'],
      thumb: `https://picsum.photos/seed/ganlu-music-${i + 1}/300/300`
    }));

    const quoteData = Array.from({ length: 66 }, (_, i) => ({
      id: `quote-${i + 1}`,
      title: i % 2 === 0
        ? '我們的人生也是一樣，每個人有多少時間、多少呼吸，都已經定好了，我們有...'
        : '任何的回修，無論他修行進步快或慢，如果他把這個世界擺在次要，把「道」...'
      ,
      subtitle: `清海無上師以中文講於福爾摩沙西湖禪園 ${1988 + (i % 20)}.${String((i % 12) + 1).padStart(2, '0')}.${String((i % 28) + 1).padStart(2, '0')}（MP3）`,
      tags: ['法語', '講經'],
      thumb: ''
    }));

    // ===== 狀態區 =====
    let currentMode = 'quote';
    let currentKeyword = '';
    let currentPage = 1;
    const pageSize = 20;
    let activeResults = quoteData.slice();

    const els = {
      input: document.getElementById('searchInput'),
      buttons: document.getElementById('searchActionButtons'),
      musicBtn: document.getElementById('musicSearchBtn'),
      quoteBtn: document.getElementById('quoteSearchBtn'),
      summary: document.getElementById('summaryText'),
      list: document.getElementById('resultsList'),
      footer: document.getElementById('resultsFooter'),
      prev: document.getElementById('prevBtn'),
      next: document.getElementById('nextBtn'),
      scroll: document.getElementById('resultsScroll')
    };

    function normalizeText(text) {
      return String(text || '').toLowerCase();
    }

    function getSourceData(mode) {
      return mode === 'music' ? musicData : quoteData;
    }

    function updateSearchButtonsVisibility() {
      const hasValue = els.input.value.trim().length > 0;
      els.buttons.classList.toggle('show', hasValue);
    }

    function updateActiveButton() {
      els.musicBtn.classList.toggle('active', currentMode === 'music');
      els.quoteBtn.classList.toggle('active', currentMode === 'quote');
    }

    function handleSearchInput() {
      updateSearchButtonsVisibility();

      const keyword = els.input.value.trim();
      if (!keyword) {
        currentKeyword = '';
        activeResults = getSourceData(currentMode).slice();
        currentPage = 1;
        render();
      }
    }

    function filterData(mode, keyword) {
      const list = getSourceData(mode);
      const q = normalizeText(keyword);
      if (!q) return list.slice();

      return list.filter(item => {
        return [item.title, item.subtitle, ...(item.tags || [])]
          .some(field => normalizeText(field).includes(q));
      });
    }

    function submitSearch(mode) {
      const keyword = els.input.value.trim();
      currentMode = mode;
      currentKeyword = keyword;
      currentPage = 1;
      activeResults = filterData(mode, keyword);
      updateActiveButton();
      updateSearchButtonsVisibility();
      render(true);
    }

    function getTotalPages() {
      return Math.max(1, Math.ceil(activeResults.length / pageSize));
    }

    function prevPage() {
      if (currentPage <= 1) return;
      currentPage -= 1;
      render(true);
    }

    function nextPage() {
      const totalPages = getTotalPages();
      if (currentPage >= totalPages) return;
      currentPage += 1;
      render(true);
    }

    function buildItem(item) {
      const thumbHtml = currentMode === 'music'
        ? `<div class="thumb"><img loading="lazy" src="${item.thumb || `https://picsum.photos/seed/${encodeURIComponent(item.id)}/300/300`}" alt="${escapeHtml(item.title)}"></div>`
        : `<div class="thumb thumb--quote">✦</div>`;

      return `
        <article class="result-item">
          ${thumbHtml}
          <div class="result-main">
            <p class="result-title">${escapeHtml(item.title)}</p>
            <p class="result-subtitle">${escapeHtml(item.subtitle || '')}</p>
          </div>
        </article>
      `;
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function updateSummary(totalPages) {
      const label = currentMode === 'music' ? '音樂' : '法語';
      if (!currentKeyword) {
        els.summary.textContent = `目前瀏覽全部${label}資料。每頁 ${pageSize} 筆。`;
        return;
      }
      els.summary.textContent = `「${currentKeyword}」搜尋完成。`;
    }

    function render(scrollTop = false) {
      const totalPages = getTotalPages();
      if (currentPage > totalPages) currentPage = totalPages;

      const start = (currentPage - 1) * pageSize;
      const end = start + pageSize;
      const pageItems = activeResults.slice(start, end);

      updateSummary(totalPages);
      els.prev.disabled = currentPage <= 1;
      els.next.disabled = currentPage >= totalPages;
      els.footer.textContent = `${currentPage} / ${totalPages}　共${activeResults.length}筆`;

      if (!pageItems.length) {
        els.list.innerHTML = `
          <div class="empty">
            <div>
              <div>找不到符合的結果。</div>
              <div class="hint">請換個關鍵字，或切換搜音樂 / 搜法語。</div>
            </div>
          </div>
        `;
      } else {
        els.list.innerHTML = pageItems.map(buildItem).join('');
      }

      if (scrollTop) {
        els.scroll.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    els.input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitSearch(currentMode);
      }
    });

    // 初始化
    updateActiveButton();
    activeResults = getSourceData(currentMode).slice();
    render();
  </script>
</body>
</html>
