nt":"我不是需要你們做事，我只要你們了解自己，才能夠整理自己，才能夠謙卑下來。我們想要整理自己了以後，自然會幫助別人，那個時候不用想熱心幫助，也會自自然然地幫助別人。","date":"清海無上師以中文講於褔爾摩沙西湖道場  1992.4.12","url":"http://www.godsdirectcontact.org.tw/ch/news/72/k-0.htm"},{"content":"帶著我執是很糟的一件事，對大家都不好，不是只有對你自己而已，它真的是修行進步的絆腳石，也是周圍所有人腳上的芒刺，它會導致許多損害、製造許多麻煩。","date":"清海無上師以英文講於歐洲 July 2, 2013(DVD1015隨時散播愛)","url":"詳細介紹"},{"content":"如果這世界想要變更好，人們就必須自己先變更好，人們必須先從自己做起。","date":"清海無上師以英文講於歐洲 July 2, 2013(DVD1015隨時散播愛)","url":"詳細介紹"},{"content":"我們內在有破壞的品質，破壞的傾向視個人情況而定，但是盡量抑制它、控制它，否則，你就一直帶著破壞的品質，這是很大的否定力量。","date":"清海無上師以英文講於美國紐澤西 0624-25, 1992.","url":""},{"content":"只要檢查你的我執，然後一切就會和平。","date":"清海無上師以英文講於歐洲 January 4, 2009 (DVD889放下我執戰勝自己)","url":""},{"content":"恐懼來自我執。有一點點的我執，就有恐懼。沒有我執，就無所畏懼，因為我們不怕有所失。是\"我執\"在告訴你，你有聲望、你是明師，你不該做這個，你應該做那個，大家都景仰你，你不可以讓人失望。","date":"清海無上師於1991年5月14日在美國科羅拉多州的英文開示(快樂過一生（三集之一）)","url":"http://suprememastertv.com/bbs/tb.php/download_tw/6726"},{"content":"我們做佛的事，就是我們是佛的。那個時候我們是佛的，我們跟佛做一樣的行動，要成佛是這樣子，並不是說等去涅槃才成佛了。佛是甚麼呢?一種看法、一種了解、一種智慧，一種高等的理想。我們不是等到去涅槃才有，我們要成佛的話，現在趕快改變我們的生活，我們做跟佛一樣，我們就是佛。我們本來就有佛性了，如果我們做跟佛一樣，我們又內邊有開悟，外面又有佛菩薩的行動，我們就是佛菩薩啦~","date":"清海無上師以中文在福爾摩沙台北開示19881118","url":"https://www.youtube.com/watch?v=_tQfmy_vPfU"},{"content":"我尚未印心，也想要印心。我吃蛋，但是那些蛋是來自放養的雞，沒有被餵荷爾蒙，那些蛋是沒有受精的，這樣仍然違法不吃蛋的戒律嗎?  仍然不能吃蛋嗎?","date":"清海無上師於1991年5月14日在美國科羅拉多州的英文開示快樂過一生 (2/3)","url":""},{"content":"如果我們自己本人不控制自己的心的話，不誠心對自己，不嚴格檢討的話，我們一定會走火入魔。……我們不走真道就是走魔路。我們如果修行了以後，還想那個招集人…..","date":"清海無上師以中文講於福爾摩沙西湖19910714，MP3下載:00991明師難為","url":""},{"content":"只要保持自己純淨、虔誠、對自己誠實，那你就不會掉進任何陷阱、任何麻煩裡面，也沒有任何人可以騙得了你，就算是魔王本人來也不行","date":"清海無上師以英文講於福爾摩沙1996.2.20","url":"http://www.godsdirectcontact.org.tw/ch/news/71/o-1.htm"},{"content":"唯有當我們將注意力分散到別的和天國無關的事上，東家長、西家短，想著否定的事情，我們才感受不到天堂的境界。","date":"清海無上師 以英文講於柬埔寨 Raising Center 1996.7.28","url":"http://www.godsdirectcontact.org.tw/ch/news/70/c-1.htm"},{"content":"我們要突破我們自己那個習慣，生生世世忌妒、攻擊人、批評人、做壞事、羨慕人那習慣，現在不要再做那些無聊的嘛~已經做好了，做生生世世。現在做別事啊…..每次做一樣的事情太無聊，所以….","date":"清海無上師以中文講於福爾摩沙西湖19910714，MP3下載:00991明師難為","url":""},{"content":"如果有時候你們有甚麼障礙，無形或是有形，不管是忌妒心或是那個阿修羅的感情，或是貪嗔疵，或是甚麼無形的障礙，都要多行修行而已，沒別的方法。","date":"清海無上師以中文講於福爾摩沙西湖19910714，MP3下載:00991明師難為","url":""},{"content":"如果我們遵守戒律，我們對鄰居友好、愛我們的敵人等，那麼世界就會和平、就會成為一個好的住所，我們的地球也會更長壽。如果世界和平，我們的生活也會受到影響，我們會感覺非常和平。","date":"清海無上師以英文講於美國紐約哥倫比亞大學 \n1989.11.03（影帶編號#102A）","url":"http://www.godsdirectcontact.org.tw/ch/news/166/index2.htm"},{"content":"要小心吃的東西，才不會污染自己，否則我們的細胞和頭腦會產生混淆，到頭來會障礙自己靈修的進步。","date":"清海無上師以英文講於美國洛杉磯\n1997.7.5","url":"師父的話"},{"content":"上帝什麼都知道，只要時時尋求上帝，祂自然會照顧一切。","date":"清海無上師以英文開示於歐洲20130706(DVD1017)","url":"http://suprememastertv.com/tw/2013-EU-Gathering/"},{"content":"你們選擇自己想要扮演的角色，做自己最渴望做的事情，這才是我們在這個世界上唯一該做的。不過要記得這場遊戲的最主要目的，是要我們再次認得自己，認識那個真正的自己，而不是此刻那個虛幻的你。我們要認識自己真正純潔無暇、榮耀輝煌的靈魂，在我們下來這個世界以前的「真我」。","date":"清海無上師 以英文講於柬埔寨 Raising Center\n（未經刪改的原版）1996.7.28","url":"http://www.godsdirectcontact.org.tw/ch/news/70/c-1.htm"},{"content":"不管是甚麼敵人，主會照顧一切，主會讓他們消失。你會成功的，你會存活，你會被讚揚，你會富足。","date":"清海無上師以英文講於歐洲\n2008.12.26（DVD887上帝照顧一切）","url":"http://edenrules.com/index.php?route=product/product&filter_name=887&product_id=552"},{"content":"既然上帝無所不在，那麼上帝的品質，像是愛的品質一定也無所不在，可是在最深的地獄，還有諸事不如意時，上帝愛的品質又在那裡呢？","date":"清海無上師以英文講於澳洲雪梨1997.5.10","url":"另一種形式的愛"},{"content":"這個世界真的不值得我們留戀什麼，所以要趕快修行，每一剎那、每一分鐘都很寶貝！","date":"清海無上師以中文講於福爾摩沙西湖禪四 1988.09.24-27 （MR3-CR03）","url":"http://www.godsdirectcontact.org.tw/ch/news/175/"},{"content":"做事要完全基於無條件的愛心。全心全意追求更高的靈性！一心一意想念上帝！","date":"師父給同修的信20060406","url":"http://www.godsdirectcontact.org.tw/ch/news/166/index2.htm"},{"content":"我們不需要改變職業，也不需要改變自己的社會地位和財產，只要改變自己的缺點就好，然後我們工作會更好，財產會更多，才華也會更加發展。","date":"清海無上師以中文講於福爾摩沙西湖 1992.05.10（影帶編號#245b）","url":"http://www.godsdirectcontact.org.tw/ch/news/150/ms1.htm"},{"content":"只要多打坐，處處都會很美，你也會很美。","date":"清海無上師以英文講於歐洲 2008.08.20和21（DVD868）","url":"868 睿智的聖者--納斯魯丁與魯米寓言詩作"},{"content":"每個人必須學習從內心渴望認識自己、認識上帝，那時天國就會來臨，明師就會來幫助他。\n清海無上師以英文講於加拿大蒙特利爾1993.4.17","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/57/i-1.htm"},{"content":"藉由每天靜坐、想念上帝，試著喚醒自己內在萬能的愛力，來修養內心的和平，這就是修觀音法門的目的。","date":"清海無上師以英文講於福爾摩沙西湖道場1992.4.10（影帶編號#240）","url":"http://www.godsdirectcontact.org.tw/ch/news/152/mt1.htm"},{"content":"大家儘量把這個世界當成自己暫時的極樂，四周都是佛菩薩，既然他們不了解自己是佛菩薩的話，我們還是尊重，對待他們像對待我們自己一樣，嚴格不過包容，疼愛不過不執著，然後我們身口意會更輕鬆，這樣修行很自然會得道。","date":"清海無上師以中文講於福爾摩沙西湖1991.04.09","url":"http://www.godsdirectcontact.org.tw/ch/news/90/g-1.htm"},{"content":"愛你的鄰居和敵人是很容易的，\n一旦你集中在你的內邊，\n愛力就會流露出來，\n然後你就會忘記憤怒，\n你會認為那只是小事一樁。","date":"","url":"84期"},{"content":"我們過度執著物質的舒適，被太多的應該或不應該以及世俗的是是非非所綁，我們就會忘記從所有的這些束縛中解脫出來。","date":"","url":""},{"content":"如果你們觀察很清楚，任何的情況都是教育我們的功課。","date":"清海無上師以中文講於福爾摩沙台南1990.3.16","url":"http://www.godsdirectcontact.org.tw/ch/news/78/a-1.htm"},{"content":"我們修行以後，不是要改變世界的情況，而是要改變我們的智慧，改變我們的概念跟想法，把本來你覺得不好的情況，用你的智慧把不好改變成好。","date":"清海無上師","url":"http://www.godsdirectcontact.org.tw/ch/news/39/"},{"content":"做任何事都要上帝加持才行，我們越明白這一點，就越謙卑，越感激上帝，我執才越減少。","date":"清海無上師","url":"http://www.godsdirectcontact.org.tw/ch/news/39/"},{"content":"靈魂存在肉體之外、在物質的界限之外，融入於靈性世界之中，所以你才能聽到聲音及看到光，那時你同時存在於兩個境界中--靈性的境界和物質的境界。","date":"清海無上師 以英文講於英國倫敦1997.8.26","url":"教理選粹"},{"content":"我們不要怕利益別人會傷害到我們自己；因為我們這個道是菩薩道，我們這個路是明師的路。","date":"","url":""},{"content":"一切唯心造！我們要生活快樂的話，自己要造出來快樂的氣氛。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/84/content.htm"},{"content":"我們內在的光比百千萬億的太陽還要亮","date":"清海無上師以中文講於福爾摩沙彰化 19890428","url":"http://edenrules.com/index.php?route=product/product&product_id=298"},{"content":"不修觀音法門很難出三界，因為要出三界有另外一個條件，不是戒律就足夠，戒律是到第一個世界，上面還有力量。","date":"清海無上師以中文講於福爾摩沙西湖19920524(MP3-金財比丘/大光明國王)","url":""},{"content":"如果我們是一個很好的工具，那佛菩薩的加持力，透過我們會轉到世界外面去，會利益任何我們隔壁、朋友、親戚、五代六代、七、八、九、十代，讓他們有福報，讓他們有解脫的機會。如果我們自己修行不好，障礙那個佛菩薩的力量……","date":"清海無上師以中文講於福爾摩沙西湖19910623(MP3-00984印心前開示---造化的好工具)","url":"http://edenrules.com/index.php?route=product/product&product_id=850"},{"content":"我們自己本人還是要用功修行，然後佛菩薩的加持力，才經過我們那種乾乾淨淨的那種親情，會加持我們的親戚朋友和世界。","date":"清海無上師以中文講於福爾摩沙西湖19910623(MP3-00984印心前開示---造化的好工具)","url":"http://edenrules.com/index.php?route=product/product&product_id=850"},{"content":"我們就是有佛性，不過我們目前的佛性都被那個鬼魔的品質蓋起來，所以才一天到晚計計較較，是是非非，管這個人、那個人好壞，自己好壞不管。爭爭鬥鬥在外面，為了一點錢，為了一點衣服，為了一點名利，互相殘殺互相壓迫互相傷害。...我們要照顧自己就好，我們要把我們那個鬼魔的品質砍掉，然後用佛菩薩的品質替代！","date":"清海無上師以中文講於福爾摩沙西湖19910623(MP3-00984印心前開示---造化的好工具)","url":"http://edenrules.com/index.php?route=product/product&product_id=850"},{"content":"如果我們那個爭鬥的精神放不下，那個表示說我們那個等級還不高。","date":"清海無上師以中文講於福爾摩沙西湖19910623(MP3-00984印心前開示---造化的好工具)","url":"http://edenrules.com/index.php?route=product/product&product_id=850"},{"content":"你的信心要勝過恐懼，這就是功課，因為佛永遠強過否定力量，所以如果你是與佛同在的話，就不要怕。","date":"清海無上師（原文為英文） \nSpoken By Supreme Master Ching Hai \n(Originally In English)","url":"http://www.godsdirectcontact.org.tw/ch/news/81/index.htm"},{"content":"我們越幫助別人，我們生活越舒服。","date":"清海無上師以中文講於美國 2002.12.25","url":"DVD767明師的角色"},{"content":"我們想念上帝，表示我們完全順服上帝的旨意，讓上帝來管理宇宙，那時候我們會感覺沒有負擔。","date":"","url":""},{"content":"人類真正標準的生活，那就是愛、慈悲，萬物和平共存。","date":"清海無上師與美國加州洛杉磯視訊會議20121222（DVD1011）","url":"DVD1011"},{"content":"任何被強迫的事都不好，都違反天堂的律法。","date":"清海無上師以英文講於奧地利2012.4.27~28（DVD1009-1）","url":""},{"content":"我們必須想想如何能過個值得在地球上生存的生活，如何能真正決定讓自己的日子過得更好，如何能回報天堂的慈悲。不是只會一直要求天堂為我們做什麼，而是要問自己能夠為這世界、為別人以及為我們自己做什麼，這才是應該做的事。","date":"","url":""},{"content":"什麼是婚姻? 夫婦相敬如賓，互相擁護、互相幫忙;不是互相阻擋、互相毀謗。","date":"清海無上師以中文講於福爾摩沙西湖 1989.12.30 ~ 31(MP3-CL29佛心的外衣＆悠樂基山的修行故事)","url":"http://edenrules.com/index.php?route=product/product&product_id=284"},{"content":"我們人都知道我們業障很深，做錯的事情很多，如果沒有做什麼好的事情補償的話，我們自己會受不了自己。所以佛教裡面才說，我們如果做好事，布施、持戒等，就我們那個業障會消除。這是因為我們感覺到我們有補償。","date":"清海無上師以中文講於福爾摩沙西湖 1989.12.30 ~ 31(MP3-CL29佛心的外衣＆悠樂基山的修行故事)","url":"http://edenrules.com/index.php?route=product/product&product_id=284"},{"content":"如果這個真我能一直了解自己只是所有感覺和思想的旁觀者，真我就絕不會被這些感覺和概念綁住，而會永遠自由自在。當往生時，會很清楚自己不是那些感覺、束縛、環境以及概念，然後就解脫了，重回到那個完整的生命之河，而不會陷在思想、感覺、喜愛及憎恨的角落裏。","date":"清海無上師以英文講於福爾摩沙屏東三地門 1992.12.21","url":"http://www.godsdirectcontact.org.tw/ch/news/117/sl2.htm"},{"content":"有時候在比較困難的情況，人的信心、道心更堅強，所以我們不應該認為這些事情對我們不好。","date":"19930303印尼泗水共修(CD-CG37逆境中道心更堅強)","url":""},{"content":"我們供養時，最好不要心有所求，\n我們做善事，但不要祈求有福報，\n純粹只因別人需要，我們就給，這樣就好。","date":"清海無上師以英文講於歐洲20150826","url":"https://www.youtube.com/watch?v=WJL7_VSulgg&feature=youtu.be&t=2831"},{"content":"事實上整個宇宙大安排整個角落不同的東西，我們根本也不能做什麼事","date":"19930303印尼泗水共修(CD-CG37逆境中道心更堅強)","url":""},{"content":"我們都有佛心，佛心就是這個愛力。","date":"清海無上師以中文講於澎湖 1989.03.06(觀音法門就是愛力的法門)","url":""},{"content":"這個時代跟古代不一樣，不能在秘密神神修行，躲起來在一個山洞，自己享受自己的所謂的個人的單純的境界，不管別人汙染的地方。…我們修行的人真的要像水一樣，跑到骯髒的地方，洗乾淨骯髒的地方，像太陽一樣，照耀到黑暗的地方，把它亮起來。","date":"清海無上師以中文講於澎湖 1989.03.06(戒、定、慧)","url":""},{"content":"愛是開悟的泉源。","date":"清海無上師以英文講於法國國際聚會 2009.02.08","url":"http://www.godsdirectcontact.org.tw/ch/news/207/"},{"content":"超三界的人才是真正的出家的人，不論他剃度不剃度，不論他穿這個衣服或是穿牛仔褲。","date":"","url":""},{"content":"有時候痛苦使我們更能理解別人。","date":"清海無上師以英文講於法國20120407(DVD1007-3提昇世界)","url":""},{"content":"我們游在加持裡，走在加持裡，放眼四處都是加持。請去感受，才能獲得更多加持，生活更平靜，為你自己和我們大家做出更好的決定。請保持覺知……","date":"清海無上師以英文講於墨西哥坎昆 2010.12.5 （DVD#918）","url":""},{"content":"同修：....我剛才在想借由《真愛》音樂劇，分享您的愛情故事，是否就相當於師父本人結婚同樣能幫助人類？\n \n師父：...是的，那齣音樂劇也能在某方面有幫助，因為它能打動人們的心，就像打動你的心一樣，人們感受到這是真實的事情，所以就能夠更接納靈性的加持，及靈性的聯繫，這有幫助，每件事都有幫助。","date":"清海無上師以英文開示2012.12.22(實踐人類真正標準的生活-1)","url":"http://www.suprememastertv.com/tw/xmas2012/"},{"content":"D計畫是地球全面和平，沒有人再殺人或殺動物，","date":"清海無上師以英文開示2011.01.01(DVD916新年新希望：如何更接近上帝)","url":""},{"content":"打坐之前，儘量用能夠感動內心的方式，向上帝、內在師父、內在真我、佛菩薩，或是我們覺得最親近的聖人祈求：「請幫助我，讓我記得自己是誰，讓我一天比一天更開悟。」","date":"清海無上師以英文講於美國華府國際禪四 \n1997.12.23（DVD #604）","url":"http://www.godsdirectcontact.org.tw/ch/news/160/index2.htm"},{"content":"你們修行好了，才有得到那個加持力，修行不好，沒用。","date":"清海無上師以中文講於法國 2012.04.6(DVD1006)","url":""},{"content":"如果持五戒很清楚，不論我們到任何地方都不怕，我們的心很安、很勇敢，這樣子才是心無罣礙。","date":"清海無上師（原文為中文）","url":"http://www.godsdirectcontact.org.tw/ch/news/67/o-0.htm"},{"content":"沒有真正的壞人或真正的好人，只是無明而已。","date":"清海無上師（原文為中文）","url":"http://www.godsdirectcontact.org.tw/ch/news/67/o-0.htm"},{"content":"我們對世界死心，我們的靈魂才開始復活。","date":"清海無上師（原文為中文）","url":"http://www.godsdirectcontact.org.tw/ch/news/67/o-0.htm"},{"content":"「打坐、功德、行善……。功德，意思是說種善因，累積功德或行善，幫助鄰居，這才是有益於這個世界。當然這會幫助你們，你們會更快達到第五界。但當你們到第五界時，你們什麼都不需要。」","date":"清海無上師以英文講於法國 2008.08.31(DVD966)","url":"達到臨界量以拯救地球"},{"content":"不用擔心工作辛苦；你們應該工作消耗能量，因為我們體內有七個「能量中心」可以從宇宙吸取能量。它們就像蓄電池一樣，宇宙力量會自動對它們充電，因此我們才能夠一直運轉這部「人身機器」。而且當我們打坐時，這個力量會更加充足。我們釋放越多，這個力量就進來越多，源源不斷，所以不用擔心。","date":"清海無上師以英文講於新加坡共修會 1994.09.28（影帶編號#446）","url":"http://www.godsdirectcontact.org.tw/ch/news/171/ms1.htm"},{"content":"時時想法肯定，即使只是想而已，就足以改變你們的生活型態、日子和命運。所以要時時保持肯定，這樣就可以避免很多意外和疾病。","date":"清海無上師以英文講於新加坡共修會 1994.09.28（影帶編號#446）","url":"http://www.godsdirectcontact.org.tw/ch/news/171/ms1.htm"},{"content":"我們可以經歷任何事，而仍然可以活得下來！因為如果我們的精神夠堅強，有高雅的目的和崇高的理想，只要我們專注於我們的理想，我們會忘掉其他任何事物，真的是這樣子。","date":"清海無上師以英文講於美國加州長堤1996.12.28","url":"甘露法語"},{"content":"我們必須一再學習，要堅定重新開始，好嗎？假如今天失敗了，打坐不很好，那明天就更努力一些，要不斷為更堅定的意志力而奮鬥，靈性才會進步，而成為天堂中較堅強、更有智慧的人。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/49/"},{"content":"我們修行的人應該知道，信心是萬法功德之母。…信心是什麼呢?不是說我們相信上帝就好，不是說我相信師父就好，完全相信!沒一個角落不相信。任何行動他都知道，他都會處理。才是相信，懂嗎?還有任何的抱怨的心，就不相信了。還有怪某某人對我們不好而已，那個還不是相信上帝，聽懂不懂?表示說我們認為我們師父不知道那個人對我們不好，為什麼不處理他?懂不懂?他知道，不過我們因果是這樣子，我們的命是這樣子，或是我們時間還沒有到，等時間到了，他會整理。懂嗎?….我們盡量做我們的最好，成功、失敗給佛菩薩決定，懂不懂?成功也好，失敗也是對我們好她才這樣安排。聽懂嗎?如果我們有這種心的話，我們離佛很近喔~聽懂嗎?所以我們每天相信佛，或是相信一位代表佛、明師的意思，或是相信上帝的話，每天想他，任何的東西都託付給他，...我們想而以會越來越像，.....信心，完全送給佛菩薩照顧，我們不抱怨、不要求，修越多越沒有要求什麼，也不求好，苦，也不求快舒服，痛也不求快好恢復..沒有求任何東西，什麼情況都滿足，那個時候我們可以知道我們離佛很近囉。不用看我們境界，懂嗎?滿足心平常心道，OK!平常的心是佛菩薩....","date":"清海無上師以中文福爾摩沙","url":""},{"content":"天堂的光能驅除我們靈魂中百千萬億年以來所有的黑暗。","date":"清海無上師以英文講於美國夏威夷\n1993.3.27 （影帶編號＃341）","url":"http://www.godsdirectcontact.org.tw/ch/news/129/index.htm"},{"content":"我並不要求你們改變原有的宗教信仰、職業或生活方式，只要求你們了悟真理，因為所有宗教的內在奧義就是這個真理。","date":"清海無上師以英文講於美國夏威夷\n1993.3.27 （影帶編號＃341）","url":"http://www.godsdirectcontact.org.tw/ch/news/129/index.htm"},{"content":"我們的思想應該肯定一點、樂觀一點、勇敢一點，就會變成習慣，一切唯心造。","date":"清海無上師以中文講於福爾摩沙台南 1989.1.12","url":"http://www.godsdirectcontact.org.tw/ch/Master/ap-2.htm"},{"content":"做老師就是要成為自己的老師，並非做別人的老師，做自己的老師才難，做別人的老師太簡單。","date":"","url":"http://godsdirectcontact.com/chinese/jian/teaching/87/1.html"},{"content":"我們修行的人，如果還怕什麼、還喜歡什麼、還需要什麼， 那個時候我們還不能完全百分之百真實。","date":"清海無上師以中文講於福爾摩沙西湖 1988.11.26","url":"http://www.godsdirectcontact.org.tw/ch/Master/ap-2.htm"},{"content":"我們修行越好，感覺到自己越敏感，就自然會持戒，那個時候不用講戒、定、慧，自然有戒、有定、有慧，那才是真正的戒、定、慧。","date":"清海無上師以中文講於福爾摩沙台南1988.10.13（MP3-CG02）","url":""},{"content":"我們學不是為了讓人家知道，我們學是為了讓自己知道，然後才能默默地加持世界，以我們內邊的榮耀和愛力去加持。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/49/"},{"content":"地球漸入佳境，整個星球會像這樣(指像在蒙頓時的美好氛圍)而且更好。","date":"清海無上師以英文講於法國 2012.03.30","url":"DVD1002 多打坐以了悟我們拯救地球的力量"},{"content":"有人讚嘆我們、誘惑我們的時候，如果我們高興起來、驕慢起來，這個很危險。我們每一次要馬上想想看，剛剛我做這個事情有沒有我執、有沒有高興起來、有沒有驕慢心出來，每天要檢討。","date":"清海無上師以中文講於福爾摩沙花蓮①1989.4.11","url":"甘露法語"},{"content":"聖號是很有力量，即使你在地獄，只要記得聖號也可以脫身，所以千萬要記得。","date":"清海無上師以英文講於法國 2012.03.31","url":"DVD1003時時記得上帝"},{"content":"現在整個地球的潛意識比較高了。我們只需耐心等待，繼續打坐，默念聖號，加持所在之處，然後會越來越好。","date":"清海無上師以英文講於法國 2012.03.31","url":"DVD1003時時記得上帝"},{"content":"有比因果更高的法律存在，那就是慈悲、寬恕的法律，直接由上帝而來的法律。","date":"清海無上師以英文講於美國哈佛大學 1989.10.28","url":"http://www.godsdirectcontact.org.tw/ch/news/55/i-1.htm"},{"content":"讓人家生氣也是一種暴力","date":"清海無上師以中文講於法國 2009.01.15","url":"DVD936做好因會得好果"},{"content":"教理本身並不重要，重要的是教理的實踐，因為你們不斷實踐這些教理，我們才能成為一體，才能夠如此互愛、互信。","date":"清海無上師以英文講於美國佛州1999.09.25（影帶編號#704）","url":"http://www.godsdirectcontact.org.tw/ch/news/163/mt1.htm"},{"content":"打坐是有幫助的，我們平衡了世界的振動力，同時也提昇了世人的意識。","date":"清海無上師以英文講於法國 2012.3.22","url":"DVD994獨處並不孤單"},{"content":"你要做什麼就做，是你自己的人生。你有權利跌倒和再站起來；你有權利弄錯和恢復；你有權利感到難過，然後再回歸快樂；你有權利體驗這物質世界的人生。","date":"清海無上師以英文講於法國 2012.3.22","url":"DVD994獨處並不孤單"},{"content":"開悟只是個開始，對於那些真正想知道生命奇跡，想認識宇宙和內心真愛的人，旅程還會繼續前進，並充滿奇跡和美妙的發現","date":"清海無上師以英文講於美國加州洛杉磯2011.12.31, 2012.01.02","url":"DVD993"},{"content":"「記得師父」就是記得師父的教理、美德及愛心，把師父的愛力、智慧及一切的良善品質牢記深心，並分享給任何需要的人。","date":"清海無上師(原文為英文)","url":"http://www.godsdirectcontact.org.tw/ch/news/46/"},{"content":"真正的保護是，只要你時時做有道德和正直的事，那麼道德、正直也會時時眷顧你。","date":"清海無上師(原文為英文)","url":"http://www.godsdirectcontact.org.tw/ch/news/46/"},{"content":"必須有一個肯定的心態，必須快樂，必須克服所有障礙，不管情況如何。","date":"清海無上師以英文講於法國蒙頓2012.03.26","url":"DVD998"},{"content":"聖號會讓你平靜下來，取代讓人困惑的思緒來保護你。","date":"清海無上師以英文講於法國蒙頓2012.03.28","url":"DVD1000"},{"content":"欺騙別人內邊的佛性是很大的罪過，我們不能這樣做，所以對人一定要誠實，絕對不要說謊。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/142/index2.htm"},{"content":"我們有力量，我們是上帝在世間的代表，既然生存在這裡，我們就該做好這個等級的事情。","date":"","url":""},{"content":"出不出家無所謂嘛！主要就是自己能夠修行進步，身心快樂自在，然後也幫助別人享受這種境界，那才是我們的目標。","date":"清海無上師以中文講於泰國曼谷國際禪六 1999.12.27\n（影帶編號＃682）","url":"http://www.godsdirectcontact.org.tw/ch/news/140/index2.htm"},{"content":"並不是我們沒有痛苦、快樂，只是我們不管它而已，所以我們才自在!","date":"清海無上師以中文講於福爾摩沙花蓮1988.11.4(音帶編號CG4)","url":"甘露法語"},{"content":"只要我們想某人不好，我們就喪失部分的真我；我們會失去一些光、失去一些原本屬於我們的天堂之快樂。","date":"清海無上師以英文講於福爾摩沙西湖道場1995.12.25","url":"甘露法語"},{"content":"上帝創造了明與暗、善與惡，好讓我們去了解、去體認、去鍛鍊我們的智慧以選擇正道。","date":"清海無上師以英文講於印度普納1997.11.22","url":"91期"},{"content":"愈愛生命，就愈能給予生命；愈能擴展自己，然後使自己變得偉大。","date":"清海無上師以英文講於美國紐約 1990.2.3","url":"78期"},{"content":"你的信心要勝過恐懼，這就是功課，因為佛永遠強過否定力量，所以如果你是與佛同在的話，就不要怕。","date":"清海無上師以英文講於福爾摩沙西湖 1995.7.12","url":"78期"},{"content":"還有，把「念聖號」寫在每個地方，這樣每次你看到時就會記得念，而不是只有打坐時才念。這樣你打坐時就會習慣念聖號。不要等到打坐時才念聖號，整\n天都要念。","date":"清海無上師以英文講於法國蒙頓 2012.3.28","url":"DVD1000"},{"content":"最重要的是不要害怕任何東西，因為我們代表真理，任何虛妄之事遲早必須離開，無論如何你一定要相信。","date":"清海無上師以英文講於福爾摩沙西湖 1995.7.12","url":"78期"},{"content":"我們在生活上真正想要成功的話，我們應該從內邊開始。就像我們澆花，水要澆到根部，而不是只澆在葉子上面而已。","date":"","url":""},{"content":"我們來這個世界，是為了學習完美，所以什麼品質都需要擁有，而且要知道如何中庸的運用。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/73/index.htm"},{"content":"沒有愛心的話\n做不到什麼佛了\n頂多是小等級而已","date":"清海無上師以英文講於法國 國際研討會2008.12.17 (DVD962沒有愛心就無法成為聖人)","url":""},{"content":"任何人愛別的\n比愛我自己多的話\n那個人一定是聖人\n是菩薩的","date":"清海無上師以英文講於法國 國際研討會2008.12.17 (DVD962沒有愛心就無法成為聖人)","url":""},{"content":"師父是你真正的朋友和同伴，通過各種世界，走過生與死，同甘共苦經歷一切，我們有牢不可破的長久友誼。","date":"清海無上師以英文、法文講於法國巴黎共修會 1993.4.25","url":"http://www.godsdirectcontact.org.tw/ch/news/74/index.htm"},{"content":"愛心是很重要，因為上帝就是愛心嘛，就是我們如果有愛心就跟上帝同一體的。","date":"清海無上師以英文講於法國 國際研討會2008.12.17 (DVD962沒有愛心就無法成為聖人)","url":""},{"content":"一旦我們和佛土或天國的教理直接溝通以後，我們的生活就永遠改變了！因為我們開始進入各種等級的佛菩薩、聖人的黃金國度，學習金碧輝煌的教理。","date":"","url":"99期"},{"content":"我們能分享什麼就開始分享，然後我們可以感受到內在的微細變化，我們的意識裡會注入更多的愛力，這就是一個起步。","date":"","url":"100期"},{"content":"我們來到這裡是為了學習成長，也為了學習使用我們無限的愛力和創造力，來使我們所處的任何世界變得更好！」","date":"","url":"100期"},{"content":"如果每個人處理事情都看情況處理，不管柔、不管剛、不管兇、不管甜，都是從心裏處理，很誠心、很坦白，沒有任何的複雜的概念的話，世界就好了！","date":"(Originally in Chinese)","url":"101期"},{"content":"我們的身體就是生生世世慾望造出來的，所以那個很強烈的慾望一直重複、一直重複，造成一種很永固的習慣，沒辦法改變，所以說被業障綁。業障是這種生生世世好壞的習慣，好壞都綁人。","date":"中文開示","url":"101期"},{"content":"愛是無條件，愛是感同身受。","date":"以中文講於日本2000.07.15(dvd708)","url":""},{"content":"人類是全宇宙中最偉大的眾生，比天使還偉大；\n當我們擁有美德並且開悟以後，\n天使會在我們身邊、保護我們和替我們服務。","date":"（原文為英文）","url":"http://www.godsdirectcontact.org.tw/ch/news/79/index.htm"},{"content":"智慧是世界上所有學問知識的源頭，\n上帝是所有愛力的泉源－－包括世俗的愛、\n父母的愛或是男女之愛。\n當我們找到這個愛力以後，所有的渴望都滿足了。","date":"Originally In English","url":"http://www.godsdirectcontact.org.tw/ch/news/79/index.htm"},{"content":"我們應該提昇到聖人的等級，要做到這樣， \n我們必須擁有慈悲心、愛心及諒解心， \n還要隨時無我奉獻。","date":"柬埔寨金邊1996.5.14 (原文為英文)","url":"http://www.godsdirectcontact.org.tw/ch/news/105/index.htm"},{"content":"將自己好的一面表現出來，不僅是我們的目標和職責，對自己也有好處，我們要時刻都表現我們好的一面，而這更是我們應該發展的部分。如果我們要重回天國，要和上帝同一體，要變得像上帝那樣，那我們的唯一抉擇就是要常常保持善良和高雅的風範，而不要管別人的表現，不要管他們選擇如何出現在我們生活中。","date":"清海無上師以英文講於柬埔寨金邊 1996.07.26","url":"http://www.godsdirectcontact.org.tw/ch/news/97/a-1.htm"},{"content":"我們如果還要求什麼，心還執著在哪一個地方，會被魔王利用，如果我們什麼都不怕，什麼都不要求，有什麼就好什麼，沒有什麼也好，就不會有任何陷阱，不怕任何風波。","date":"清海無上師（原文為中文）","url":"http://magazine.godsdirectcontact.net/chinese_t/60/"},{"content":"改變自己以後，我們還是有業障，但是跟沒有一樣，因為我們力量很大，耐心很強，我們道心很堅固，沒有人可以動。","date":"清海無上師（原文為中文）","url":"http://magazine.godsdirectcontact.net/chinese_t/60/"},{"content":"我們去那裡都儘量把自己變成大眾，也不是應該失去自己個人的口味，而是失去我執、抱怨心、不合作的心態和驕慢的看法，我們就會快樂。","date":"清海無上師（原文為中文）","url":"http://magazine.godsdirectcontact.net/chinese_t/60/"},{"content":"如果我們看到一個人精神很開朗，我們可以知道他智慧比較大、我慢比較小、度量很大，表示說他跟聖人、佛菩薩的果位比較接近。","date":"清海無上師（原文為中文）","url":"http://magazine.godsdirectcontact.net/chinese_t/60/"},{"content":"如果我們真正的要求，真正的有勇氣，真正的渴望，誠心要求，十方佛菩薩會幫助。","date":"清海無上師（原文為中文）","url":"http://magazine.godsdirectcontact.net/chinese_t/60/"},{"content":"眾生太驕傲了，\n驕傲是我們最麻煩的業障，最大的障礙。","date":"清海無上師（原文為中文）","url":"http://magazine.godsdirectcontact.net/chinese_t/62/"},{"content":"要求道，最重要的規矩是：\n不要批評人，而且「心」應該開朗，這是很重要的事。","date":"清海無上師（原文為中文）","url":"http://magazine.godsdirectcontact.net/chinese_t/62/"},{"content":"人是高貴的，因為我們能修行，\n能成佛，能找到佛性，\n找到我們裡面的上帝，看到我們內在的天國，\n這樣才可以說，人是最高貴的。","date":"清海無上師（原文為中文）","url":"http://magazine.godsdirectcontact.net/chinese_t/62/"},{"content":"我們誠心的時候，我執減少，\n無明的牆壁會裂開，\n我們會看到很多不同的境界。","date":"清海無上師（原文為中文）","url":"http://magazine.godsdirectcontact.net/chinese_t/62/"},{"content":"永遠不要責怪人家，應該責怪自己，\n不管任何事情發生在我們身上，\n都是我們自己業力造成的。","date":"清海無上師（原文為中文）","url":"http://magazine.godsdirectcontact.net/chinese_t/62/"},{"content":"把心放在智慧眼處，\n它會很快樂，會了解很多東西，\n可以幫忙我們快點超三界。","date":"清海無上師（原文為中文）","url":"http://magazine.godsdirectcontact.net/chinese_t/62/"},{"content":"我們對眾生付出越多","date":"","url":""},{"content":"我們處在思想控制一切的世界中，\n這些先入為主的概念、偏見及所搜集的資料\n控制了一切，使我們忘記了本性，\n使我們忘記了我們並不是那個先入為主的概念。\n我們不應忘記我們的判斷力，\n我們必須找出自己本有的智慧。","date":"清海無上師以英文講於美國加州 1989.5.27","url":""},{"content":"我們持不妄語的戒，\n然後我們講什麼話對別人會有利益，\n我們講什麼會成真。","date":"清海無上師以中文講於福爾摩沙台南1989.5.21","url":"112期"},{"content":"即使你有犧牲奉獻的精神，如果你太便宜賣給人家，人家不珍惜，對他們不好。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/25/index.htm"},{"content":"我們不是要當王就當王，要當明師就當明師，應該有足夠的福德，才能夠分配給自己的徒弟、自己的人民或是自己的部下。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/25/index.htm"},{"content":"我們應該淨化我們的身、口、意，以便能消化佛菩薩高等的加持力","date":"清海無上師以中文講於 福爾摩沙台南 1988.5.13","url":"http://www.godsdirectcontact.org.tw/ch/news/121/index.htm"},{"content":"上帝就是偉大的愛力，我們發揮的愛力越多，\n就越接近上帝的品質，這就是了悟上帝的真義。","date":"清海無上師以英文講於美國洛杉磯 1998.12.18","url":"http://www.godsdirectcontact.org.tw/ch/news/122/index.htm"},{"content":"「原諒」比「責罰」來得容易多了，因為你不用再去想那件事，而且那個人也會快樂，不會再給你壓力。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/33/d-1.htm"},{"content":"雖然在這個世界，有法律以及因果的存在，但是如果我們跟這個最高的力量，也就是跟我們的本來面目溝通，跟這個永遠存在的力量，大慈大悲、大雄大力的力量溝通，就會和因果絕緣。","date":"清海無上師","url":"http://magazine.godsdirectcontact.net/chinese_t/29/"},{"content":"我們必須一直保持肯定的能量。因為即使只是想法肯定而已，如果你看得到你的身體，你會知道你四周的「氣」、你的外貌和你內在的能量，都隨著你每一個肯定的思想而變改，你內在的能量會變得更滿溢、更健康。","date":"清海無上師以英文講於新加坡共修會1994.9.29","url":"http://www.godsdirectcontact.org.tw/ch/news/128/index.htm"},{"content":"婚姻是一種伴侶關係，目的是為了增益雙方的生活、支持彼此的理想，讓夫妻兩人都能夠過一個更高雅的生活。","date":"清海無上師以英文講於哥斯大黎加 1990.12.16\n（影帶編號 #141）","url":"http://www.godsdirectcontact.org.tw/ch/news/131/index.htm"},{"content":"越談論肯定的事，圍繞你的能量層就越厚，然後光會吸引光，它會從四面八方吸引更多好的能量，所以無論你到哪裡，都會帶著這個所謂的「能量包」或「能量罩」。","date":"清海無上師以英文講於美國洛杉磯國際禪三 1998.12.16-18 \n（錄影帶編號：#639）","url":"http://www.godsdirectcontact.org.tw/ch/news/132/qa5.htm"},{"content":"你臨終時想什麼，以後就會得到什麼，所以等這些人服滿「死亡」的刑期後，還會再到這個世界，因為人很難放下自己已經習慣的事物。","date":"清海無上師以英文講於福爾摩沙西湖道場 1996.02.21（影帶編號#528）","url":"http://www.godsdirectcontact.org.tw/ch/news/154/ms1-2.htm"},{"content":"修行的人有很多高等的境界可以去，這些境界可以滿足我們內心的任何渴望，讓我們精神好舒服、好快樂。","date":"","url":""},{"content":"任何時候我們都想「愛」、想「愛力」，時時保持肯定的想法，師父力量自然會處理一切。","date":"清海無上師以中文講於日本 2000.07.10\n（影帶編號＃706）","url":"http://www.godsdirectcontact.org.tw/ch/news/138/index2.htm"},{"content":"我們把河裡的水汲取來，貯存在蓄水池裡，然後分送給整個村莊、整個城鎮。我們的生活也應該像蓄水池一樣：我們擁有，是為了要分享出去，我們只是其中一個管道而已。","date":"清海無上師以英文講於福爾摩沙台北國際禪七 \n1994.05.23（影帶編號#428）","url":"http://www.godsdirectcontact.org.tw/ch/news/150/index2.htm"},{"content":"打坐很重要，教理也很重要，每天一定要多看、多聽師父的教理。","date":"清海無上師以英文講於美國華府國際禪四 1997.12.25 （影帶編號＃610）","url":"http://www.godsdirectcontact.org.tw/ch/news/151/mt1.htm"},{"content":"每次遇到問題，或是發現自己有不好的習慣，就應該看看明師的教理，對頭腦會有很大的馴服作用。每天一定要多看、多聽好的教理和高雅的經典，不是只有光打坐而已，否則，我們不了解為什麼打坐。如果不了解打坐的目的，打坐效果不會好。因為沒有渴望心，頭腦不夠清靜，所以沒辦法入定，也得不到真正的智慧。","date":"清海無上師以英文講於美國華府國際禪四 1997.12.25 （影帶編號＃610）","url":"http://www.godsdirectcontact.org.tw/ch/news/151/mt1.htm"},{"content":"只有開悟才能驅除無明，只有上帝的愛力才能化解仇恨，只有真正互相友愛才能化解人類彼此的衝突和歧見。請幫助我將上帝的愛遍傳整個世界，和我一起在靜默中祈求了悟上帝，將祂的愛和天國帶到這個星球。","date":"清海無上師以英文講於西班牙馬德里 1999.5.5 （DVD644）","url":"http://www.godsdirectcontact.org.tw/ch/news/152/mt2.htm"},{"content":"擁有較多的人，就分一些給少的人，這樣大家都快樂、滿足，給的人也很高興，你們試看看。給東西很過癮，我們令人快樂，自己也覺得很舒服，好像有負好責任這樣子。","date":"清海無上師以英文講於泰國佛城 1994.01.02（影帶編號#401）","url":"http://www.godsdirectcontact.org.tw/ch/news/152/ap1.htm"},{"content":"你很正面肯定，所以就會招來肯定的事情。你知道，事情就會像這樣找上你。而有些人看起來很憂愁，所以不論他們如何努力都無法有多少進展","date":"","url":"DVD1005人間天堂的來臨將比我們預想的早 http://edenrules.com/index.php?route=product/product&product_id=69"},{"content":"要去探望你們父母親，當他們在世時好好對待他們。不僅是父母親而已，要及時愛你的親友、認識的人、鄰居，甚至愛你的敵人。","date":"","url":"DVD1005人間天堂的來臨將比我們預想的早"},{"content":"要有耐心，接受並感恩所有事情。","date":"","url":"DVD997接納一切、相信上天"},{"content":"在這個世界上，你們目睹苦難，目睹痛苦和悲傷，然後慈悲心油然而生，你們就是透過這種方式賺更多功德，因為你可憐他們，所以盡力去安慰他們，藉由這樣來加快修行的速度。","date":"清海無上師以英文講於國際聚會2009.07.25","url":"http://www.godsdirectcontact.org.tw/ch/news/205"},{"content":"我們要將自己分內的事做好，要工作，運用自己的智慧，最起碼把家庭照顧好，如果還有餘力，就可以幫助那些情況危急的人。如此一來，我們不僅在靈性上幫助淨化世界的氣氛，而且在經濟、物質和許多方面，也對世界有所貢獻。我們必須各方面都發展，才能成為完美的眾生。","date":"清海無上師以英文講於美國洛杉磯 1993.10.29（影帶編號#388)","url":"http://www.godsdirectcontact.org.tw/ch/news/157/ap1.htm"},{"content":"愛自己很難，因為我們不認識自己。我們會根據社會的傳統和習俗來判斷事情的好壞，然後認為自己就是那個犯錯的人，因而責怪自己。我們從小就被罵慣了，不論做什麼，父母都會說：「哦！好頑皮、好差勁、好壞！」我們從小就帶著這種罪惡感，所以很難去除。唯一能使我們擺脫罪惡感的方法，就是了解自己的偉大，直接認識自己真正偉大的本質。","date":"清海無上師以英文講於美國科羅拉多州波特城 1991.03.09\n（影帶編號#159）","url":"http://www.godsdirectcontact.org.tw/ch/news/158/qk1.htm"},{"content":"我們什麼都不缺，我們需要的任何東西，在該有的時候都已經有了。因為我們很完美，所以才選擇這樣的安排。","date":"清海無上師以英文講於韓國永同道場國際禪六 2000.05.12（DVD#701）","url":"http://www.godsdirectcontact.org.tw/ch/news/158/tip2.htm"},{"content":"你的頭腦塞滿那些負面的思想，掩蓋了你的快樂，結果你的人生就被它們控制，而不是你去掌控一切，所以你才會活得這麼痛苦。","date":"清海無上師以英文講於韓國永同道場國際禪六 2000.05.12（DVD#701）","url":"http://www.godsdirectcontact.org.tw/ch/news/158/tip2.htm"},{"content":"自己的事情，沒人能幫我們，打坐也是一樣。打坐是內在心靈的東西，它不是經別人解釋後，你馬上就能了解的。唯一方法是印心。","date":"","url":"DVD965趙州禪師的智慧"},{"content":"通常世人會非常謙卑地對待位高權重的人，卻鄙視沒有地位的人，甚至驅趕窮人。但開悟的禪師不同，他平等對待每個人。「平等」不是說對待國王和窮人一樣，「平等」代表他的內心對每個人一樣尊敬，並依情況只給予他們所需的。","date":"","url":"DVD966趙州禪師的智慧"},{"content":"生氣時就講出來，講的時候，不要用嘲諷或傷人的口氣，只要把自己的想法說出來，告訴對方是因為哪些因素而使我們生氣，希望以後不要再發生同樣的事，因為下次我們就不會再容忍。把自己的觀點表達出來，然後就此打住，以後大家還是相親相愛。","date":"清海無上師以英文講於以色列特拉維夫1999.11.21（DVD#671）","url":"http://www.godsdirectcontact.org.tw/ch/news/159/ap4.htm"},{"content":"要記住：上帝就是我們自己。","date":"清海無上師以英文講於美國華府國際禪四 \n1997.12.23（DVD #604）","url":"http://www.godsdirectcontact.org.tw/ch/news/160/index2.htm"},{"content":"看我們的行為傷害什麼人，傷什麼人的心，對什麼人不好，對自己怎麼障礙，那個比我們看別人的好壞還重要。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/31/"},{"content":"沒有什麼方式比「愛心」和「謙卑心」更好和別人溝通了。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/31/"},{"content":"我們給什麼人一點恩惠，然後執著在那邊的話，也像世界世俗的人做生意一般，不是真正無我貢獻。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/31/"},{"content":"當一個人開悟，重新發現自己的偉大和內在的榮耀之後，他便永遠滿足了，那是修改我們缺點、滿足我們慾望的最好方法。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/31/"},{"content":"我們一秒分身口意乾淨的話，天使、天龍八部、護法統統都擁護我們，那個剎那，全宇宙都是我們的、都擁護我們，準備好王位給我們上去坐。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/31/"},{"content":"我們應該從許多痛苦、冤枉及悲哀的情況中被訓練，然後突破，這樣我們才真正解脫。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/31/"},{"content":"我們要勇敢，做一個很轟烈的人物，不能每次都頭低低，甘心地投降在我們小的障礙裡。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/31/"},{"content":"多數我們喜歡那種個人成功的感覺，才被誘惑的。如果我們我執小，有犧牲的精神，不管人家是否讚歎及認可，誘惑力就比較不會影響我們那麼多，考驗時也不會那麼簡單掉。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/31/"},{"content":"不論我們對別人做好的事或有好的意念，最終還是利益到自己，所以我要求你們思想要正，言語要正面，而且要做正面的事情，這是我們唯一該做的事。","date":"清海無上師以英文講於美國洛杉磯共修會 1997.7.5","url":"http://www.godsdirectcontact.org.tw/ch/news/84/h-1.htm"},{"content":"我們認為的這個「我」，自始至終都不曾存在過！","date":"清海無上師以英文講於美國加州舊金山 1993.11.27\n（影帶編號＃397)","url":"http://www.godsdirectcontact.org.tw/ch/news/160/index2.htm"},{"content":"我們和最高的力量從未分開過，我們一直都是至高無上的，但因為我們習慣從外在環境和情況中收集各種資訊，然後認同這些資訊，才會有個人的「我」產生，認為「我」和宇宙全體是分開的。","date":"清海無上師以英文講於美國加州舊金山 1993.11.27\n（影帶編號＃397)","url":"http://www.godsdirectcontact.org.tw/ch/news/160/index2.htm"},{"content":"我們越認同物質的學問和財產，就越不曉得自己有多偉大。","date":"清海無上師以英文講於美國加州舊金山 1993.11.27\n（影帶編號＃397)","url":"http://www.godsdirectcontact.org.tw/ch/news/160/index2.htm"},{"content":"印心的時候，過去的業障已經消除，只有這世的業障留下來。假如你本來這輩子是要再回來做壞事，但因為你跟隨好的教理、好的明師，你就不會再為非作歹，這樣就能破除這一世的因果循環，然後每個人才會變得越來越好。","date":"清海無上師以英文對英國舍瑞小中心的電話開示 2007.07.01","url":"http://www.godsdirectcontact.org.tw/ch/news/189/ms_41.htm"},{"content":"不管你們過去造了什麼惡業都沒關係，只要你們回頭，上天、上帝都會原諒你們。這輩子很重要，不要管過去的業障，重要的是這輩子。所以你們這輩子一定要努力，這樣你們的來世才會在天堂。","date":"清海無上師以英文對英國舍瑞小中心的電話開示 2007.07.01","url":"http://www.godsdirectcontact.org.tw/ch/news/189/ms_41.htm"},{"content":"要儘可能以無條件、有愛心、無私的方式去做，這是唯一能讓我們這世就擺脫過去業障的方法。因為假如你們前世做錯一些事，就算受害者原諒你了，但如果你繼續那種習慣，不檢討自己，不想成為更高雅的人，那就沒有用。你會一直帶著那種習性，而且「同性相吸」，你會吸引更多這類的氣氛或能量，如此一來，你就永遠無法改善自己，甚至還會變得更糟。","date":"清海無上師以英文對英國舍瑞小中心的電話開示 2007.07.01","url":"http://www.godsdirectcontact.org.tw/ch/news/189/ms_41.htm"},{"content":"我們內邊的明師是永久不離開我們，我們應該靠祂，祂是我們的主人、本人、本性。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/09/index2.htm"},{"content":"如果我們真正有誠心，往內邊找那個救命的能力，我們修行會很快。應該要愛護我們的本人，要真正地愛祂，真正地要求祂，真正地想念祂才行。如果我們用自己所習慣的辦法處理事情，就永遠看不到祂本人，都是自己的頭腦在處理，或是外力，比如神、魔、鬼等無形眾生來困擾我們而已。(News No. 12)","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/12/"},{"content":"我們應該像觀眾，必須有足夠的智慧及開悟來看宇宙的各種遊戲，那就不會受痛苦折磨。(News No. 53)\n~清海無上師~","date":"","url":""},{"content":"觀音法門不是師父用語言所能講明，祂不是指那個五句，也不是師父教你們做什麼動作，而是一種從高等級的世界傳下來的無形電波，那個才是觀音法門，所以這個法門沒有法門，而是一種愛力。(News No. 7)","date":"","url":""},{"content":"我們替師父做任何工作，會感覺跟師父很接近，會得到無量加持力，佛菩薩就是博愛、慈悲，如果我們貢獻給別人，我們所知道、所利益的方面，我們就有佛菩薩的精神，當然我們是跟佛菩薩很接近的；如果我們很自私，自己吃飽不管別人餓死，或是常往那種否定，黑暗的品質裡，當然要知道我們離佛菩薩很遠的。","date":"","url":"21期"},{"content":"我們要常記得，要在裡面靠近佛菩薩，應該外面也像佛菩薩一般，讓我們常念這個目標（絕對只要想好、做好、說好、聽好）。","date":"哥斯大黎加","url":"9期"},{"content":"任何有一點善根的人，得到師父的書，都得到不可思議的利益。","date":"","url":"9期"},{"content":"愛師父不是抓住師父在自己的地方，而是想盡辦法幫助師父的使命，像一位哲學家說：「相愛不是彼此看眼睛，而是看同樣的方向。」","date":".","url":"http://magazine.godsdirectcontact.net/chinese_t/09/"},{"content":"上帝讓我們從錯誤中、從教訓中、從他人的行為中學習。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/30/"},{"content":"對人誠信是我們保護自己尊嚴及良知的最佳保障，也是最好的方法。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/30/"},{"content":"為了批評世界及試著指正他人，我們的生活才會過得如此忙祿、如此精疲力盡。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/30/"},{"content":"你越奉獻，就越擴大自己，你會越來越偉大。","date":"","url":""},{"content":"我們在生活上真正想要成功的話，我們應該從內邊開始。就像我們澆花，水要澆到根部，而不是只澆在葉子上面而已。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/30/"},{"content":"不論內在或外在，我們都應該做個真、善、美的代表。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/30/"},{"content":"我們沒有學會婉轉，所以我們才跌倒、才受苦，因此我們才必須學習與我們智慧的真正源頭溝通，然後只用愛心和體諒，而不用責難去處理每一種情況。","date":"清海無上師","url":"http://magazine.godsdirectcontact.net/chinese_t/30/"},{"content":"除非我們重新找回自己與生俱有的權利、找到上帝，盡好我們加持這個世界的責任。不然，我們很難克服任何的障礙。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/30/"},{"content":"你必須真正知道自己想要什麼，清楚明白做什麼事可以讓你擁有找到自己的感覺","date":"清海無上師 以英文講於柬埔寨 Raising Center 1996.7.28","url":"http://www.godsdirectcontact.com/chinese/jian/teaching/70/1.html#SEC6"},{"content":"無論你選什麼工作，應該要知道這是你自己想要的。也許那就是你今生今世的任務，是你自己選擇要走的路。","date":"清海無上師 以英文講於柬埔寨 Raising Center 1996.7.28","url":"http://www.godsdirectcontact.com/chinese/jian/teaching/70/1.html#SEC6"},{"content":"當你能夠在生活中遵守這些戒律，就表示你已經找到回家的路，走在正確的路上，並且也顯示你的靈性已經發展，夠資格回到上帝的國度，重新獲得以前的榮耀。","date":"清海無上師 以英文講於柬埔寨 Raising Center 1996.7.28","url":"http://www.godsdirectcontact.com/chinese/jian/teaching/70/1.html#SEC6"},{"content":"我們來此的唯一目的，只是為了要體驗另一種情況，如果沒有經歷過這些「陰」的部份，經歷這些痛苦和黑暗的世界，我們將無法認識自身的光亮，無法比較，這就是我們下來這個世界受苦的原因。","date":"清海無上師 以英文講於柬埔寨 Raising Center 1996.7.28","url":"http://www.godsdirectcontact.com/chinese/jian/teaching/70/1.html#SEC6"},{"content":"無論是已開悟的靈魂，或是剛開悟的，或正往開悟的路上走，他們都有這個責任去喚醒其他兄弟姊妹，讓他們記得要重回天國。","date":"清海無上師 以英文講於柬埔寨 Raising Center 1996.7.28","url":"http://www.godsdirectcontact.com/chinese/jian/teaching/70/1.html#SEC6"},{"content":"在得到明師的等級之後，我們知道自己在做些什麼，可以選擇自己想做的事情，或是很清楚地知道，在這裡所做的一切都是好的。","date":"清海無上師 以英文講於柬埔寨 Raising Center 1996.7.28","url":"http://www.godsdirectcontact.com/chinese/jian/teaching/70/1.html#SEC6"},{"content":"無論你幫忙別人或是幫忙自己，無論你結婚與否，這一切的一切都是自己事先選好要走的路。並不是說你結了婚便比其他不結婚的人差，或是那些沒結婚的比結婚的人好等等，並非如是。這些都只是你們事先做好的選擇，以便從這些功課中重新認識自己而已。","date":"清海無上師 以英文講於柬埔寨 Raising Center 1996.7.28","url":"http://www.godsdirectcontact.com/chinese/jian/teaching/70/1.html#SEC6"},{"content":"假如我們居住的世界到處充滿混亂和苦難，我們就不會有和平，所以說幫助世界就是幫助我們自己。","date":"清海無上師以英文講於美國紐約哥倫比亞大學 \n1989.11.03（影帶編號#102A）","url":"http://www.godsdirectcontact.org.tw/ch/news/166/index2.htm"},{"content":"真正的入定就是我們和我們最高的智慧溝通，或所謂的上帝、佛溝通，我們靈體上去時充滿快樂、愛心，想侍奉眾生，出定後我們帶著那種充滿的愛心加持任何附近的人，讓人家一靠近我們就好舒服，一靠近就很快樂，或病好、煩惱減少，也開悟等等，那種才是真正的定。要得到那種定應該持戒、應該修正確的法門、有正確的概念才能得到。","date":"清海無上師以中文講於福爾摩沙花蓮 1989.3.22","url":"http://www.godsdirectcontact.org.tw/ch/news/82/u-0.htm"},{"content":"我們修行的人，越往內邊越好，內邊是我們善良的品質，是我們至高的智慧，是我們最大的能力；如果我們往外面，我們那個能力、那個定力的智慧會分散。","date":"清海無上師以中文講於福爾摩沙西湖 1991.08.18","url":"http://www.godsdirectcontact.org.tw/ch/news/136/ap.htm"},{"content":"修行的人可以逃過那些所謂的因果和業障的氣氛，讓我們輕鬆。所以我們越修行，我們生活越快樂、越順，就是因為我們逃過了這個業障的過程， 它不能抓我們了，因為我們比它高。","date":"清海無上師以中文講於福爾摩沙西湖 1991.06.28","url":"http://www.godsdirectcontact.org.tw/ch/news/136/ap.htm"},{"content":"如果我們只是全神貫注於煩惱，就會困在煩惱的等級，永遠無法從更高處來看清問題所在。這樣一來，不但解決不了問題，反而延誤自己修行的進步，摒棄靈性加持力量，最終會兩頭落空，問題既沒獲得解決，也無法提昇修行等級。","date":"清海無上師以英文講於歐洲國際聚會 2013.07.05","url":"http://www.edenrules.com/index.php?route=product/product&product_id=1381"},{"content":"抓住在一個角落，然後用自己所了解的批評別人、告訴別人、禁止別人，這表示說：「我們還沒有長夠大，我們還沒有看很廣，我們心還不夠單純。」","date":"清海無上師","url":"http://magazine.godsdirectcontact.net/chinese_t/24/"},{"content":"我們如果相信上帝的話，任何情況我們都不會抱怨。","date":"清海無上師","url":"http://magazine.godsdirectcontact.net/chinese_t/24/"},{"content":"吃愈多動物，就會失去愈多生命力，然後你就愈變愈小，變成像一隻蟲，一隻小昆蟲，一個細菌，然後你就什麼都不是了。","date":"清海無上師以英文講於美國紐約 1990.2.3","url":"http://godsdirectcontact.us/sm21/cnews/www/078/c-0.htm"},{"content":"只要一有時間，就閉上眼睛，集中注意力在智慧眼，這就是在打坐了。你用在打坐的每一分每一秒，都會累積你的靈性財富。","date":"清海無上師以英文講於韓國1992.03.22（影帶編號#233）","url":"http://www.godsdirectcontact.org.tw/ch/news/157/qa4.htm"},{"content":"不要失去自己的本心、自己個人的風度，為了任何人都不要。這樣我們才原本、才原始、才自然、才會有那種吸引力、才有可愛的地方、才有美的地方，我們模仿誰都不好。","date":"清海無上師以中文講於福爾摩沙西湖1992.01.12 （影帶編號204）","url":"http://www.godsdirectcontact.org.tw/ch/news/136/ap.htm"},{"content":"上帝的恩惠我們要回報，我們怎麼回報祂呢？第一是誠心誠意修行，每天想祂。第二就是幫助祂的小孩子。","date":"清海無上師","url":"http://magazine.godsdirectcontact.net/chinese_t/24/"},{"content":"要研習教理、要遵守戒律、要打坐，還要去看師父--這是額外的發紅。","date":"清海無上師以英文講於美國佛州小中心 2001.12.23\n（影帶編號#725）","url":"師父的話"},{"content":"每個人生在這個世界都有他的責任和任務，如果我們靠近什麼人、跟誰有關係，一定他有一點什麼任務是關於我們的；不管是好或壞，他有負一些教育我們責任的功課。所以大家眼睛要睜亮一些、耳朵要靈一點，看看上帝透過旁邊那個人想教我們一些什麼","date":"清海無上師以中文講於福爾摩沙西湖道場1995.1.29","url":"清海無上師以中文講於福爾摩沙西湖道場1995.1.29"},{"content":"△ 修行的人，二十四小時都應該謹慎，有魔來應該馬上認識，凡是用悲哀、懊惱、自卑、想自殺、愛講閒話、喜歡看人家不好的地方、批評師父外表的行動、用凡夫心量師父、量同修……等等，統統都是魔的工作，應該馬上認識他。──清海無上師\n△ 不要以為你們在家做什麼事情，師父不知道，錯了，師父只是不想講而已；講出來幹什麼？有什麼用？既然你們不相信師父，就讓你們處理自己的業障，不管你們做任何事情，都應該想：「師父一定會知道」。所以在做以前，應該先考慮一下，這樣做好不好，師父同不同意？對修行有沒有幫助？──清海無上師","date":"","url":"http://www.godsdirectcontact.org.tw/gb/news/13/l-1.htm"},{"content":"隨宇宙安排，然後你會知道什麼是對，什麼是錯，你會和宇宙的大計畫合為一體。","date":"清海無上師以英文講於美國科羅拉多州波特城 1991.3.9","url":"http://www.godsdirectcontact.org.tw/ch/news/27/a-1.htm"},{"content":"魔王的系統讓大家辛苦工作，以至於沒有時間記得上帝。越不記得上帝，就有越多麻煩、越墮落，對魔王的負面的力量越沒有抵抗力。","date":"清海無上師以英文講於美國科羅拉多州波特城 1991.3.9","url":"http://www.godsdirectcontact.org.tw/ch/news/26/j-1.htm"},{"content":"靈性的提昇會打通所有的管道，清除靈體、身體脈絡的阻塞。你體內的血液循環會更順暢，訊息傳遞更迅捷，看事情也會看得更清楚。你的等級越高，溝通管道就越暢通，可以從大腦接收更多的訊息和更正確的指示。","date":"清海無上師以英文講於匈牙利歐禪 2005.02.26","url":"http://oceanhui.pixnet.net/blog/post/64495093"},{"content":"唯有接受一切，我們的心才不會那麼掙扎， 因而省了很多精力、時間和麻煩， 這是生存於這世間的不二法門。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/55/"},{"content":"有時我們需要空間才能成長、需要犯錯才能懂；假如我老是什麼都告訴你們，你們就不會犯錯，而錯誤是完美之母。所以別抱怨人生不夠好、不夠完美，只要接受它並從中學習。","date":"清海無上師以英文講於美國華盛頓Ｄ.Ｃ.1993.4.15","url":"http://oceanhui.pixnet.net/blog/post/64494976"},{"content":"我們必須將和平帶到每個地方，並在裡面培養它。如此，我們走到哪裡，我們就代表和平、代表天國；我們就是天使，我們就是佛。","date":"清海無上師","url":"http://magazine.godsdirectcontact.net/chinese_t/43/"},{"content":"有一個在靈性方面掌管我們的開悟和永恆的快樂，這個小中樞就在大腦接近中央的地方，也就是額頭中央和頭頂進去到頭部三分之二的地方，智慧眼確實就在這個地方、真的在裡面。","date":"","url":"http://godsdirectcontact.com/chinese/jian/teaching/133/1.html#SEC2"},{"content":"打坐的時候可以利益很多眾生，我們的振動力發出去，可以使整個國家亮起來，整個宇宙的下意識提昇。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/29/"},{"content":"佛跟魔最大的分別就是──佛都是給，魔都是拿；佔有別人的時間、空間，都是魔的品質。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/29/"},{"content":"雖然在這個世界，有法律以及因果的存在，但是如果我們跟這個最高的力量，也就是跟我們的本來面目溝通，跟這個永遠存在的力量，大慈大悲、大雄大力的力量溝通，就會和因果絕緣。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/29/"},{"content":"要關愛我們的親人，更要隨時獨立自主，隨時信靠上帝，因為上帝才是我們真正唯一的親人。上帝是我們的丈夫、太太、父母、兄弟姊妹、情人、朋友，祂什麼都是！只要信靠上帝，內心永不匱乏，漸漸地，我們將不執著任何外在的關係。否則，任何外在的關係都足以綁住我們，把我們變成囚犯，雙方所汲取的都是對方凡夫的品質，而不是上帝的品質。","date":"清海無上師以英文講於巴拿馬1991.1.27","url":"http://www.godsdirectcontact.org.tw/ch/news/15/f-1.htm"},{"content":"魔也是從造化出來的，有什麼東西不是從造化造出來？所以才叫祂造化。造任何東西，變化任何東西，所以我們不怕任何東西。修行的人，心無罣礙，心要單純，魔也會變佛，心不單純，佛也變魔。","date":"","url":""},{"content":"不是跟人家辯來辯去，或是打仗才算有勇氣，而是我們內邊充滿一種樂觀、肯定的愛力，它勝過否定的力量。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/27/"},{"content":"我們不要批評什麼人，看一清二楚再講，看一清二楚以後，任何人都不敢批評了。知道都是因果、業障、演戲，沒什麼很嚴肅；因為沒有看到，捉住一個角落，用自己所了解的東西去批評別人、告罪別人、禁止別人，這表示說我們還沒有長大，我們還沒有看很廣，心還不單純。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/11/"},{"content":"我們愈修行要愈有警覺心，不然會簡單掉在修行的角落裡面，我們修行每天都會發展不同的角落，如果我們掉在某個角落的話，我們就不能去別的角落了。所以修行不能沈在某個境界，因此金剛經才說：「應無所住而生其心。」如果執著某些成就，就不能再發展了！","date":"清海無上師以中文講於福爾摩沙西湖道場\n一九九一年八月二十五日","url":"http://www.godsdirectcontact.org.tw/ch/news/56/b-4.htm"},{"content":"我們生生世世看別人做事，我們也要試看看，試看看以後又碰到別的東西，又想試看看，一天到晚去收集新的材料、新的經驗，忘記那個本人；如果死的時候還沒有通通滿足我們所好奇、要試驗的東西的話，我們還要再回來，所以叫輪迴。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/12/"},{"content":"我們修行有很多方面，布施、持戒、忍辱、精進、禪定、智慧都有，不過，我們有佛菩薩的加持力，這是最重要的；我們一個人真的爬不上哦！我甚深了解這個，不是師父恐嚇你們，修行當然是靠自己，靠自己是什麼呢？我們自己應該誠心、應該努力、應該用功，應該時時不忘自己內邊那個佛的力量，我們時時都要懇求祂幫我們忙，那個力量我們叫上帝或是佛祖，也就是我們的本人。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/12/"},{"content":"我們所期望的事不一定對我們有好處；就像師父曾經告訴你們：有時候災難對我們有好處。有時候，師父跟你們講很多故事，以便證明上帝不論安排什麼事，都是最好的，雖然當時看上去並不好。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/13/"},{"content":"尊重任何人，以純淨的眼光看任何人，這樣做永遠對自己有益處，這是看待別人的最佳方式。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/13/"},{"content":"我們集中注意力，自自然然做事情的時候，結果才會完美；因為這是從上帝來，從我們的智慧來的，從我們真正的本性來的。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/13/"},{"content":"慈悲心不是能學的，而是從修行當中自然生出來的，從真正的慚愧心出來的。佛菩薩加持才能讓我們改比較快，如果我們自己不願意改，不誠心誠意求佛菩薩給我們這個慈悲心、愛力的話，就改不掉。修行也可以改，不是說不行，不過不能成佛，修到一個程度就停了，雖然有神通、有力量、能救病，或是能自在安詳、有人供養，不過沒有慈悲心不能感動人天、不能教育什麼人；不能感化眾生，包括動物，懂不懂師父的意思？慈悲心是最重要","date":"清海無上師以中文講於宜蘭1988.6.20","url":"http://magazine.godsdirectcontact.net/chinese_t/14/"},{"content":"看眾生苦，我們才苦；如果沒有苦心，沒有同情心，即使修好久好久，還離道很遠。","date":"清海無上師以中文講於宜蘭1988.6.20","url":"http://magazine.godsdirectcontact.net/chinese_t/14/"},{"content":"我們唯有跟自己內在和平的源頭溝通， 才能得到心靈的平靜。 和平原本就在你的內邊， 如果你往外找，永遠找不到。 ~清海無上師~","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/128/index.htm"},{"content":"別忘了古代修行人的榜樣，別忘了你的誓願，你們進來就是要求解脫的。你們想成佛，也許不是現在成佛，但你們心懷此願，你們想開悟，想要更有智慧、更聰明，這樣你們才能幫助世界，幫助自己和親友，這是你們想要的。所以要專注於此，不要被任何事情分心。你也許結婚了，也許有丈夫或太太，我都沒意見，只是別忘了，你們來印心時的高雅理想。","date":"清海無上師以英文講於歐洲BUDDHIST STORIES: 500 BEGGARS - 20150817","url":"https://www.youtube.com/watch?list=PLpJLaN6_bnEECoPKWa4J-ngydLcthK4qe&v=rR6wSVDQb0E"},{"content":"任何人在我們身邊，我們要想辦法儘量讓他快樂、滿足、歡喜，那是最重要的。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/55/"},{"content":"我們如果要得到一位明師的智慧或是她的愛力，我們不能太複雜，我們應該要一心不亂才能得到。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/55/"},{"content":"任何需要我們工作的時刻，我們就配合工作， 這樣我們將感覺到自己的靈性生活愈來愈進步，愈能忍辱。愈工作、愈奉獻，我們會愈快進步， 不需要誰來讚歎我們，自己也會知道。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/55/"},{"content":"如果我們全心全意去侍奉，就會永遠感到滿足、滿意，也就不會想再要求什麼，我們會覺得什麼都夠了。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/55/"},{"content":"痛苦不是情況造成的，並不是貧窮讓我們變成很痛苦，而是因為我們不知道我們是上帝，所以才被影響。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/55/"},{"content":"不必煩惱那麼多，盡情生活在每一個時刻，該做什麼事，就全心全意去做，對上帝有信心，對整個宇宙的大計畫有信心。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/55/"},{"content":"我們為大眾服務，上帝也會為我們服務，這就是宇宙工作的法則。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/55/"},{"content":"我們臨終時的念頭非常重要，如果你全想著痛苦，就會到地獄去，如果你所想的全是師父，和師父在一起時的快樂和喜悅，你就會馬上去涅槃，秘訣在於此，懂嗎？那是和師父在一起的好處，不論是內在或外在，肉體或精神上在一起。永遠記得師父","date":"","url":""},{"content":"我們修行的力量是無形的，不過並非不消耗，我們住在這個世界是魔王的世界，難免會碰到很多誘惑、很多業障，有時候是共業，有時候是自己的業障，相互染來染去，所以誰也不能怪誰不好。\n清海無上師","date":"","url":""},{"content":"如果我們自己本人不控制自己的心，不認真修行，不誠心對自己，不嚴格檢討的話；我們一定會走火入魔。走火入魔並非哇哇叫，或是臉變成令人恐怖的那種；只要我們不走正道，就是走魔路。\n--清海無上師","date":"","url":"(News No.)16期 http://godsdirectcontact.com/aphorisms/ce.html"},{"content":"如果有時候你們有什麼無形或是有形的障礙，不管是嫉妒心、或是阿修羅的感情、貪嗔痴…等，都只要多修行而已；沒有別的辦法。要多看師父的經書，聽師父的錄音帶、多打坐、多做觀音、多努力、多用功、多專心在道裡面、躲在道裡面才安全，躲在那裡都不安全。( p20)\n--清海無上師\nSometimes, if we are faced with obstacles, be they tangible or not, such as jealousy, worldly sentiment, greed, hatred or obsession, etc., there is no other way to overcome them except by practicing more diligently. You need to read Master's books and to listen to Master's tapes more often, meditate more, do Quan Yin more, put more effort into your practice and concentrate more on the path of practice. It is safe only when you are sheltered by the supreme power, no other way.(p20)\n--The Supreme Master Ching Hai\n有時候你們打禪七、禪一、禪二，會感覺到自己的等級提高，有沒有？因為我們很專心啊！我們那個時候知道來這裡為了專心突破等級，所以等級會提高，把業障留在後面。\n--清海無上師\nSometimes, after you have taken part in a seven, one or two-day retreat, you could feel that your level of practice had risen. That was because we had given our undivided attention to breaking through our level of practice. We knew that was the sole purpose of coming to a retreat here, so our levels were uplifted and our karma left behind.\n--The Supreme Master Ching Hai\n相信公理正義，行為正直的人，無懈可擊，上帝也會關照愛護這些人。\n--可蘭經\nThose who believe in truth and justice and have a high morality are not vulnerable, as God will look after them.\n--Koran\n我們的業障和因果，只有靠修行突破它，我們才能夠逃走；不管你做什麼功德，功德是功德、業障是業障；修行觀音法門的話，不管有功德或沒有功德，都可以超脫上去，就是這麼邏輯、這麼科學。\n--清海無上師\nOnly by spiritual practice can we break through our karma and the effects of the causes we have made. Only then can we escape from them. It matters not whether you have acquired any merit. Merit is merit. Karma is karma. Nonetheless, if one practices the Quan Yin Method, one can be liberated regardless of having any merit or not. It is so logical, so scientific.\n--The Supreme Master Ching Hai\n世界的愛情如果不小心處理很麻煩，我們也可以戀愛一個人，然後用這個愛情互相幫助、互相鼓勵，互相培養我們修行的道心，一起提高等級；那就很好。如果為了一個人，不管他多好、多美，而生生世世輪迴，沈淪苦海的話，是太不值得。愛情有好有壞是這樣，什麼東西都有它的好、它的壞，看你要用哪一個方面，它就對你好，或是對你不好。\n--清海無上師\nIt can causes us great trouble if we do not handle our worldly love carefully. Of course we can love someone. If we use our love to help and encourage each other, to cultivate our aspiration to practice the path of Truth and thus uplift the level of our practice, then it is fine. However, if in order to love someone, no matter how good or beautiful that person may be, we have to keep on reincarnating in this bitter sea of suffering, then it is not worth it at all. This is how there is a good and bad side to loving someone. Anything has a light and a dark side and depending on which side you use, the result will be good or bad for you.\n--The Supreme Master Ching Hai","date":"","url":"(News No.)16期 http://godsdirectcontact.com/aphorisms/ce.html"},{"content":"修行有很多方面，有的人開智慧、有的人看境界、有的人聽聲音、有的人入定、有的人發展愛心、有的人對上帝有信心、對佛菩薩有依靠的感覺、有的人發展他的辯才，那個就是他們修行的結果。\nThere are many benefits to practicing the Quan Yin Method. Some gain heavenly wisdom, some have inner experience, some heavenly sound, some get into deep samadhi, some develop love, some have faith in God, some feel that they can depend on the supreme teaching, and some cultivate eloquence. These are the results of their spiritual practice.\n我們修行的力量是無形的，不過並非不消耗，我們住在這個世界是魔王的世界，難免會碰到很多誘惑、很多業障，有時候是共業，有時候是自己的業障，相互染來染去，所以誰也不能怪誰不好。\n清海無上師\nThe power from our spiritual practice is invisible but not that it cannot be used up. Since the world we live in is Maya's world, it is unavoidable for us to encounter many temptations and karma. Sometimes, this is collective karma and sometimes, our own. This karma affect each others, so no one should blame anyone else.\n在師父甚深的心裡面，我很尊重你們，知道你們也是佛，你們靈魂是乾乾淨淨的；我不必多說，我也不能、不應該罵你們一句才對，不過因為我沒有罵，你們就不知道你們是乾淨的；責罵你們不乾淨，為了要你們了解，你們本來很乾淨。\nDeep down in my heard, I respect you very much. I understand that you are children of God and that your souls are clean. There is not need for me to say anything. I couldn't and shouldn't scold you at all. But then, if I don't reprimand you, you would not know your souls are clean. By scolding you for being not clean, I make you remember and understand that you were originally very clean.\n有時候我們有問題，我們還不知道，等時間到了，情況到了，我們才知道我們有什麼問題；有時候師父為了要教育你們、整理你們，會用比較不柔和的方法照顧你們，這樣你們才會了解你們弄錯的地方。\nSometimes we are aware that we have problems. Only when the time comes and situation arises do we realize what kind of problems we have. In order to educate and help us, Master sometimes would use certain not so tactful means to take care of us; as only they will we know what we have done wrong.\n最自由的人是最有壓力的，應該自己管自己，自己對自己負責任，自己勸導自己怎麼做；應該準時、應該做好的榜樣，如果我們不自由就舒服了，我們等別人叫我們，然後怪別人；如果我們是自由的人，沒有人可怪、沒有人可靠，所以壓力很重。\nThe freest person has the most pressures. He has to watch his own behavior, to be responsible for himself, to give himself advice and guidance, to be punctual and to be a good example for others. If we are not free, it is much easier as we can wait for others to tell us what to do and we can always put the blame on someone else. If we are free, there is no one to blame, no one we can rely on, so the pressure on us is great.\n我們可以罵人，不過我們自己有愛心，人會感覺到，不是我惡心罵的，而要照顧他們，所以他們永遠不會生氣。(p21)\nWe can scold people. When we have love, people can feel that we are not doing it with malice, but for the sake of taking care of them, so they will never be angry with us.(p21)\n我們修行沒有到很高等級的時候，都第 (News No.)望很多，我們認為師父應該摸我們的頭，然後看眼睛好幾個小時，才是算加持。不是這樣啦！師父不應該這樣做，不過我有時候也這樣做，因為要讓你們滿足內心那種凡夫的要求而已。\nBefore we have attained a very high level in our spiritual practice, we always have many expectations. We think that only when Master touches our heads and looks at us in our eyes for hours will we receive real blessing? No, it is not so! Master needs not do these things. But, sometimes I do so in order to satisfy the mundane longing in your hearts.\n最值得讚許的功德，就是接受的行為。因為要接受別人給的東西，本來是一種功德、一種勇氣、一種慷慨，為什麼呢？因為必須忘記自己的我執、自己的名譽、自己的分別心，才能拿得這麼輕輕鬆鬆，所以我認為拿的人很有佈施的心、慷慨的心，他能夠接受我們的東西，已經很有勇氣（除了為了貪而接受，就不一樣）。\nThe merit which is worth praising the most is the act of receiving, because accepting what is given by others is in itself a kind of merit, a kind of courage and a kind of generosity. Why? It's because one has to forget his ego, his reputation and his distinguishing mind, before he can receive with ease. Therefore, I think that a person who receives is giving and generous at heart. He is very courageous being able to accept what we give him. (But, if you do it with greed, then it's different.)\n我們可以在世界裡面，但是心不要執著在那裡，知道任何都是煩惱，我們要好好保護我們的道心，像蓮花長在泥巴的湖裡面，不會污染就可以。(p22)\nWe live in this world, but we should not be attached to it. We need to know that everything in this world is trouble and to keep our mind in the supreme teaching, just like lotus flowers in a muddy lake without being contaminated.(p22)\n如果有什麼問題，多打坐就會沒有。有問題就是因為太少打坐，我本人也是這樣子，我有問題的時候就是我沒打坐。有就趕快去做觀音嘛！問題就消失了。(p23)\nIf you encounter problems, just try to meditate more and they will be gone. We have problems because we do not meditate enough. It is the same with me. The times when I have problems are those when I have not meditated. I would quickly start to meditate and do Quan Yin and the problems would disappear.(p23)","date":"","url":"第 (News No.)17期  \nhttp://godsdirectcontact.com/aphorisms/ce.html"},{"content":"醜陋的東西有時候也有它的美，如果我們用比較開悟的眼睛看，任何東西都有它的美。(p24)\nUgly things can be charming sometimes. In the eyes of the enlightened everything has its own beauty.(p24)\n八關齋戒不是斷除食物而已，重要的是斷除一些不好的思想、不好的習慣、不好的外在影響。( p25)\nThe eight precepts are not just fasting. To get rid of impure thoughts, habits and bad influences from the outside are the main objectives.(p25)\n每個人都是佛菩薩，有可能他們還不了解自己是佛菩薩；但我們還是要尊重他們，對待他們就像對待自己一樣；嚴格不過包容，疼愛不過不執著。\nEveryone is Buddha. It is possible that they may not realize it. We should still respect them and treat them like ourselves. Be strict with tolerance and be loving with detachment.\n師父成道沒什麼秘訣！我只有一片誠心而已。我修道就是修道，我沒有任何別的概念、沒有別的要求、沒有任何人在我的腦海裡面。\nThere was not any secret way with which I realized God. I had nothing in my mind but wholehearted sincerely to practice spiritually. I though of nothing or nobody else, and I wanted nothing else.\n尊重和委曲自己不一樣，尊重是我認得別人的地位，不過我也認得我的；我儘量做好我的本分，不應該把自己降得很低，為了要讓別人高興。\nRespect for others and low self-esteem are not the same. To respect someone is to recognize his position and to recognize your own position as well. We should try our best to do our part and not to do lower ourselves in order to please others.\n我們做觀音的時候，裡面的振動力會變改，新鮮的概念會冒出來，新鮮的細胞會生出來，那時我們好像重新再生一樣，所以叫「還老返童」。\nDue to the change of the internal vibrations while we are practicing \"Quan Yin\", new ideas will come up and new cells will grow. At that time, it is as if we were reborn. This is so called \"rejuvenation\" or born again.\n我們修行的人心量越來越擴大，才能容納佛菩薩的加持力。當我們的心擴大到整個宇宙都在我們心內的時候，那個時候就是成佛了！\nSpiritual practitioners should become more broad- minded all the time, so that is enough room to accommodate God's blessing. When our mind is broad enough to take up the whole universe, we have realized God.\n我們越藏東西給自己，我們越吃虧；我們越大量、越付出，我們越富有；宇宙的法律就是這樣子。(p30)\nThe more we hoard for ourselves, the more we lose; and the more we give, the more we gain, which is the law of the universe.(p30)\n不是靜靜坐在那邊就好了，心也要乾淨、善良、真正的專心，才可以算「打坐」；不然就是「打錯」。(p27)\nMeditation is not merely sitting there. You have to be concentrating with a pure and merciful heart, otherwise you are just idling.(p27)\n有些事自認不能做得到但最後卻做到了才好，如果什麼事都很順利、很簡單就能夠做到，然後我們隨便做，這樣就算成功了，也不怎麼很好！這也是我們修行有障礙，還是要很努力的原因。(28)\nIt is more rewarding for us to achieve a goal which we thought not possible in the beginning. It is not really good for us if thing goes smoothly and we can accomplish anything easily, without really hard working. This is why there are obstacles. We need to work hard on our path of practice.(28)\n修行的方面儘管好，照顧世界的方面還是要有自己的妙法跟秘訣。如果我們兩個方面都好的話，我們才有自信，才感覺到自己真的很有力量、很有風度。(29)\nWe can be good in our spiritual practice but we still need to be skillful in handling matters in this world. Only when we are good in both aspects, can we have self-confidence and feel that we truly have the great power within.(p29)\n修行是自己修的、 燈是自己點的、 路是自己走的。當然我們病了不能走的時候，師父會扛、會抱。但是如果我們自己抵抗，要往相反的地方走，師父也只能跟在我們後面走，雖然知道徒兒離道愈來愈遠，不過也只能跟著，不能丟、也不能介入。(p31)\nNobody but the person himself can carry out his spiritual practice, light the lamp and walk the path. Of course, when we are sick and cannot go on, Master would hold us and carry us forward. However, if we resist and want to go the other way, Master can only stay behind us. Even though Master knows that her disciples are moving further away from the right path, She can only follow them. Master will never give up on Her disciples, yet would not interfere with our decisions.(p31)\n簡單的生活才是長壽的秘法。吃什麼都消化，吃什麼都吸收。太富裕的生活真的不好，因為我們滿足這個欲望時，就生出另外一個欲望；那種物質的快樂從不會令這個世界的任何人滿足。(p32)\nA simple life is the secret of longevity for we can absorb whatever we eat. A life of luxury is not really good, because when we satisfy one desire. The happiness of material fulfillment will not be able to truly satisfy anyone in this world.(p32)\n我們對自己有尊重的心，那個時候，不管我們在那個等級，我們會感覺到很滿足，感覺到我們不缺少什麼，感覺到我們跟那個十全的品質很靠近！\nWhen we gain self-respect, then no matter what level of spiritual practice we are in, we will feel contented, not lacking anything. We are very close to the essence of perfection.","date":"","url":"(News No.)18期\nhttp://godsdirectcontact.com/aphorisms/ce.html"},{"content":"真正的愛心是人家做壞事，我們應該警告他，要想辦法讓他開悟，愛心不是人家做什麼好事、什麼壞事，我們都保護他。(p26)\nA true love is to warn and to help people to be enlightened and stay away from wrong things. It is not to protect them from the bad consequences of their actions.(p26)","date":"","url":""},{"content":"如果深深感覺到世界無常，一點也沒有留戀這個世界，靈魂才能夠很乾淨、很單純，才能夠一心不亂，才能夠簡單入定。","date":"清海無上師","url":"http://www.godsdirectcontact.org.tw/ch/news/19/b-1.htm"},{"content":"我們修行的人有很多騙自己的陷阱，外面的人騙我們或是魔鬼騙我們，我們還可以預防。自己騙自己，就不簡單預防。比方說：我們的個性或是我們的習慣，有很多地方不對，我們也不曉得。\nThere are many traps on our path of practice in which we are deceived by ourselves. We can take precautions against traps from the outside world or from the Maya, but it is not that simple if we deceive ourselves. For example: there are many wrong aspects in our characters or habits that we are not even aware of.\n我們修行愈多，更需要有警覺心，不然我們會簡單掉在一個固定的角落裡！如果我們掉在那裡的話，我們就不能學到別的角落，所以不能沉在某個境界。也因此金剛經才說：「應無所住，而生其心」。\nThe more we practice, the more alert we need to be; otherwise we will easily fall into a corner. If we are dropped there, we will not be able to learn from other aspects. So we must not indulge in any level of experience. It was because of this that the Diamond Sutra had stated: \"Let there be no addiction, let our hearts be free.\"\n高等的法門都是很簡單啊！因為很平常、很簡單，所以別人沒辦法了解，他們複雜習慣啦！\nAdvanced method of spiritual practice are always very simple. Because they are so ordinary and simple, people could not understand them. People are used to complicated systems.\n每天早晚要打坐，出家、在家都一樣。早上打坐是為了面對整天那種污染的禮物，晚上打坐為了要保護我們平安的一夜，洗淨整天被污染的氣氛。\nEvery day we must meditate, both in the morning and in the evening, whether we are monastic or lay practitioners. We meditate in the morning so that we can face the day's polluted gifts. We meditate in the evening so that we are protected and in peace at night, and so that we can cleanse the contaminated atmosphere of the day.\n我們修行的人更要懂得保護自己，因為我們裡面有珠寶，那些否定的力量會很喜歡靠近有修行的人。\nIt is even more necessary for spiritual practitioners to know how to protect themselves, because they have precious jewels inside. The negative forces like to get close to people who practice well.\n有的時候我們有很好的修行方法、有很好的路，不過我們自己信心不夠，道心沒有很高強，所以修行也沒有很多的結果。\nSometimes we can have a good practicing method, a very good path; however, if we lack confidence and a strong desire for the Truth, we still can not achieve much result in our spiritual practice.\n如果我們的境界不很光亮，不過我們有慚愧的心、有誠心，每天祈求，我們也會得到恩典。\nIf our level of practice is not so bright, but we have repentance, sincerity and pray daily, God's grace will still be bestowed upon us.\n沒有一個人持戒清楚、吃素菜、每天打坐，會沒有得到利益的；任何人依照師父指示，都變成仙人、菩薩、聖人、阿羅漢。\nThere is no one, who is a vegetarian, who strictly keeps the precepts and meditates daily that will not gain benefit from doing so. Anyone who follows Master's instructions will become a fairy, Bodhisattva, saint or arahant.\n人間是一所學校，一所最好的大學。地獄是太苦，天堂是太樂。所以只有人間，喜怒哀樂都有，每天讓我們反省、讓我們磨鍊，因為越磨鍊，我們越堅強。\nThis world is a school, the best university. One suffers too much in hell, and one is too happy in heaven. Only in this world we have happiness, anger, sadness and joy, which make us reflect, learn and discipline ourselves everyday. The more we are disciplined, the stronger we will become.\n為什麼我們的世界那麼苦？因為我們要了解人家的苦心，我們心量才擴大。心越擴大我們越偉大，我們越變成跟萬物同一體。如果我們還有隔開的感覺，還是只想我們自己而已，我們就沒辦法跟萬物同一體。\nWhy is there such pain and suffering in this world? It is because we need to appreciate the sufferings of others before we can expand our hearts. The bigger our hearts expand, the greater we will become and the closer we will be with Creation. If we still feel that we are separated and we still think for ourselves, then we cannot be at one with Creation.\n你愛一位明師，他的品質會送給你，他的加持力會送給你，你們越來越聰明，越來越輕鬆，越來越有智慧。\nWhen you love an enlightened master, Her good qualities will be yours. Her blessings will be bestowed upon you. You will become more and more intelligent, at ease and wise.\n修行應該有愛心才算進步，不是每天打坐很多才算進步，不是啦！我們要多有愛心，多原諒別人；不管境界怎麼樣。\nYou are making progress on the path of spiritual practice when you have developed a loving heart, not when you can meditate a lot everyday not at all! We should have more affections and forgiveness towards others, and not to mind the level of experience.\n我們打坐的時候要誠心誠意好像是最後一次打坐，或像是明天或是過五分鐘就要往生一般，如果有這種心態，打坐就會有結果。\nWhen we meditate we should be sincere, so sincere that it is as if we are meditating for the last time, or as if we are to die the next day, or in five minutes. If we have this attitude in our heart when meditating we will have achievement.\n世界有很多人，每個人都有不同的工作。修行的人是專門加持靈魂與精神的。所以我們修觀音法門，就是要種這些精神食物，因為世界需要，這是我們修行人的責任。\nThe world is full of people. Each person has a different job. Spiritual practitioners are specialized in blessing the soul and spirits. As the world needs these spiritual foods, we cultivate them by practicing the Quan Yin method. It is the responsibility of spiritual practitioners.\n我們修行的功德，都要分享給世界，我們修行不是只為了一個人。(p33)\nWe should share the merits derived from our spiritual practice with the world. We do not practice for the sake of ourselves only.(p33)","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/19/b-1.htm"},{"content":"我們的心應該跟小孩一樣，很單純、很簡單接受加持，這樣才能很快進步。","date":"清海無上師以中文講於福爾摩沙西湖19881029(音帶編號CG04)","url":""},{"content":"(News No.)20期\n\n謙卑心也不是一個晚上就得到，還是要打坐，要提醒自己，要對自己很誠心，看透自己不怎麼很好的品質，才能夠尊重別人。\nWe cannot acquire humility overnight. We need to meditate and keep reminding ourselves to be true in recognizing our own faults. Only then will we be able to respect others.\n真正的快樂就是我們找到自己快樂的地方，我們找到自己是誰，知道自己多偉大，有什麼能力，有不生不死的那種境界，那個時候我們才真正快樂。然後我們親戚朋友也跟著快樂。\nThe true bliss is to find where our own happiness lies. When we are able to find out who we are, how great we are, what power we have, and that there are spiritual planes without birth or death, then we will be truly happy, and our relatives and friends will be happy too.\n不是因為佛不想度眾生，是眾生不想度自己。(p34)\nIt is not that Buddha does not wish to liberate sentient beings. It is that sentient beings do not wish to liberate themselves.(p34)\n人家的是非啊！我們知道愈少愈好。(p35)\nThe less we know about other people's business, the better it is for us.(p35)\n我們開佛眼以後，才真正了解宇宙是很美麗，世界真的本無事，任何煩惱都是自己造，所以叫大法眼藏。\nOnly after our wisdom eye is opened can we truly appreciate the beauty of the Universe, that there is nothing happening in this world, and that all problems are created by ourselves. That is what is meant by the phrase \"complete the opening of the wisdom eye\".\n如果我們要名要利啊！就會造成很多的災難給自己。佛菩薩是很有大量啊，不過我們的良心它會不安。我們是唯一的閻羅王啊！我們也是唯一大開悟的佛。\nIf we crave for fame and fortune, we will create a lot of misfortune for ourselves. Although God Almighty is broad-minded, our conscience will not be clear. We are the only Yama in hell, and we are also the only truly enlightened Buddha.\n越沒有時間，我們越做很多工作。我們越想辦法處理，我們的反應越快，內在萬能的智慧都會跑出來。(p36)\nWe can accomplish more when we are running short of time. The more we try to solve our problems, the faster our reactions well become; our inner all-powerful wisdom will emerge.(p36)\n業障是什麼呢？就是我們做出來一些不該做的事情，會傷害到自己，傷害到別人，傷害到萬物；然後我們做完以後，就收因果的果報。\nWhat is karmic hindrance? It is something that we should not have done\nbecause it will hurt ourselves, others and all creation. After that we will receive the retribution of cause and effect.\n修行的人愈修愈變平常，沒有人知道我們在修行才好。(p37)\nA practitioner becomes more and more ordinary; it is best if nobody knows that we are practicing.(p37)\n修行應該自在，也讓人自在。(p38)\nAs we practice we should put ourselves as well as others at ease.(p38)\n上帝要誰修就那個人修，不是因為我們很多才華或是很多文章或是多嘴，他就來修行。如果我們跟誰有緣，或是那個人上帝剛好選他要來修觀音法門，上帝會借我們的口、借我們的身、借我們的意來影響那個人。\nA person practices spiritually when God wants him to. It is not because we have many talents, or we have written or said a lot that someone comes to join us in practice. If a person has an affinity for us, or if God decides that that person should practice the Quan Yin Method, God will use our speech, our behavior and our thoughts to influence that person.\n要婉轉才是開悟的人，情況怎麼樣我們就怎麼樣，才不會得禪病！\nAn enlightened person should be very flexible. He should conform with the situation whatever it may be. This is the way to avoid \"Ch'and syndrome\".\n最好的改變方式，就是我們跟裡面上帝的力量溝通；然後讓上帝的力量改變我們。(p39)\nThe best way to change ourselves is to communicate with our God Power inside, and then let that God Power change us.(p39)","date":"","url":"http://godsdirectcontact.com/aphorisms/ce.html"},{"content":"沒有煩惱不要惹煩惱，已經有煩惱儘量解決煩惱，如果不能解決，那求佛菩薩幫忙解決。(p40)\nIf you don't have trouble, don't look for trouble. If you are having problems, try to solve them the best you can; and if you are unable to solve them, then ask the Buddhas and Bodhisattvas to help you.(p40)\n懺悔心、謙卑心是很重要，不過，對自己的愛心更重要，不能愛自己，能愛誰呢？(p41)\nIt is very important to be repentant and humble, but it is more important to love yourself. If you can't love yourself, whom can you love?(p41)\n我們要改將來的話，改現在；所以現在最重要，根本不用看過去啦！(p42)\nIf we want to change our future, we must change our present; therefore, the present is the most important. Forget the past!(p42)\n愛心要訓練很微細，不是不殺生就好，不是不殺人就好，也不是不殺動物就好，了解嗎？我們要真正的有愛心才好。\nTeach your hearts to love all small and insignificant things! Not killing sentient beings is not good enough, nor is not killing humans or animals. Understand? We must have truly loving hearts.\n世界不是一百年就完了，還會繼續下去，我們的生活生生世世也不會斷，就是看我們生活在那裡而已，在天堂或是在地獄，在涅槃或是在世界。\nThis world will not be finished in one hundred years. It will continue. Our life after life will not stop either. The difference depends on where we shall be living, in heaven or hell, in nirvana or in the world of samsara.\n愈沒有時間，我們愈做很多工作。\nThe more we are pressured by time, the more productive we will be.\n寧可傷害自己，也不傷害別人，這是生生世世不可忘記的真理，別的戒律有時忘記還沒關係呀！(p43)\nRather hurt oneself, but never hurt others! This is a truth that should never be forgotten, this life or beyond. This is the utmost important commandment of all.(p43)\n我們可以騙整個世界，騙不了自己才麻煩，或許我們可以騙到佛呢！不過騙不了自己。去到那裡，我們都知道我們要做什麼，去那裡，我們都知道我們壞到什麼程度，好在什麼地方；這個就是蓋天堂、造地獄的力量，出於我們自己的內在，所以佛教才說：「一切唯心造。」\nWe can fool the whole world, and perhaps, sometimes we can even fool the\nBuddhas and Bodhisattvas; but the trouble is that we can never fool ourselves. No matter where we are, we always know what we want to do, where we are going, and we know how bad we are, and what is our best quality. This the power that creates heaven and hell, and it exists within ourselves. Thus, the Buddhist doctrine says, \"All is created from one's mind.\"\n知道我們弄錯還不夠，不再弄錯還不夠；而要弄好，要做更好，才是真正的懺悔。(p44)\nTrue repentance is not just to know our mistakes, nor it is to say that we won't make the same mistake again. It is to correct what we do, do it well, and do it better.(p44)\n我們如果真正的愛一個人，他怎樣弄錯，我們都還一樣愛他，那才表示我們愛心非常大，是真正的愛。(p45)\nIf we really love someone, we would love him the same, even if he did us wrong, or made mistakes. This shows we have enormous love, and that it is the true love.(p45)\n真善美不是學一年就好，不是學二年就夠，上帝的智慧、宇宙的力量永遠學不完。\nOne cannot learn the qualities of \"truth, compassion and beauty\" in one year, or two; it is God's wisdom, the power of the universe, and one can never learn it all.\n如果我們想自己很弱小，我們就會變弱小；如果我們認為自己很偉大，我們會變成偉大。(p46)\nIf we believe ourselves to be weak, we shall be weak. If we believe ourselves to be great, we shall be great.(p46)\n要躺下打坐也可以，就是心要恆常保持在智慧眼的地方。眼睛閉起來，不過智慧眼不能閉；身體躺下來，靈魂不躺，就沒事。\nYou can also meditate when you are lying down. Keep your conscious mind at your wisdom eye, close your eyes, but do not close your wisdom eye.","date":"","url":"(News No.)21期"},{"content":"天堂、地獄都是我們自己造的。(p47)\nHeaven or hell, they are all created by ourselves.(p47)\n如果我們執著某些成就，我們就不能再發展！(p49)\nIf we cling to our past achievements we will not be able to progress any further.(p49)\n快樂就是因為我們自己不變，任何情況我們都保持一樣。(p50)\nHappiness comes when we ourselves do not change; what we remain the same\nunder any circumstances.(p50)\n我們要尊重自己，別人才尊重我們。\nWe have to respect ourselves before anyone else will respect us.\n我們不是為了賺錢而工作，而是為了盡我們自己的責任。(p51)\nWe do not work because we want to make money. We work to fulfill our responsibilities.(p51)\n賺錢夠用就好，節省時間修行。(p52)\nMaking just enough money for ourselves is good enough. We should save time for meditation practice.(p52)\n並不是我們沒有痛苦、快樂，只是我們不管它而已，所以我們才自在！(p53)\nIt is not that we do not have misery or happiness. It is just that we do not care about them. Thus, we are at ease.(p53)\n我們靜下來的時候，很多事情的答案會出現。(p55)\nWhen our mind is still, all the answers to our problems will be revealed.(p55)\n全部放下，是最舒服的一種感覺。(p56)\nThe most comfortable feeling is when we lay everything down.(p56)\n我們的心想要什麼目標，我們會得到那個目標。(p57)\nWe shall attain whatever goal we set in our mind.(p57)\n做什麼事，要快決定、快做，才會得到第 (News No.)一流的獎賞。(p59)\nMake wise decisions and act quickly in whatever you do, then we will be able to obtain the best reward.(p59)\n我們欠世界很多恩情，即使給人家一點點，只是還債而已，算不上布施。\nWe owe so much debt to this world. Even though you give a little to others, it is just an act of repaying. It is not an act of charity.","date":"","url":"(News No.)22期"},{"content":"工作是為了訓練自己，為了愛心貢獻，為了報答這世界的恩義。","date":"","url":""},{"content":"任何理想，如果不合邏輯，太複雜，太麻煩、又不利益任何人，那就不用做！\nAny ideal which is illogical, too complicated, too troublesome and benefits no one should not be carried out.","date":"","url":""},{"content":"幫忙別人解脫，知道「正道」，才是最高的幫忙、最高的功德。(p48)\nHelping others to attain liberation, and helping others to know the \"True Path\" are the highest forms of help we can give; they also bring the highest form of merit.(p48)","date":"","url":""},{"content":"「三摩地」就是心靈進入一種極度喜悅而非常寧境的境界，在其中你不會有煩惱、憂傷、恐懼。在三摩地的境界，我們會覺得至善至美，覺得世界上沒有什麼困擾，覺得天下本無事，一切都很完美。","date":"清海無上師以英文\n講於馬來西亞　 1989.10.1","url":"http://www.godsdirectcontact.org.tw/ch/news/108/b-0.htm"},{"content":"不管做什麼事，心很安就知道是對，心不安就不要做。(p54)\nNo matter what you do, as long as your mind is at ease, you know that you have done the right thing. Otherwise, you should not do it.(p54)","date":"","url":""},{"content":"「人們說女眾無法成佛，事實上正好相反：女性更接近佛性。如果你瞭解自己、如果你善用自己的女性品質來追求更高等的目標，你會更快到達那裡，因為你更精準、更關注、更細緻，而且有常識，所以你想要什麼，就會得到什麼，這就是男人害怕女人的原因。」\n\"People told you that woman can not become Buddha. It's exactly the contrary. Woman are nearer to Buddhahood. If you know yourself, if you use your feminine quality for some higher purpose, you get there quicker, because you have the perception, you have the attention, you have the delicate feelings, and you have the common sense. So, whatever you want, you'll get it. That's why men are afraid of woman.\"","date":"清海無上師以英文講於美國佛羅里達奧蘭多道場,1998年10月5日\nSpoken by Supreme Master Ching Hai at Orlando Center\nFlorida, U.S.A. Oct.5, 1998","url":"http://www.sm-celestial.com/ch/jewelry/4-9.htm"},{"content":"我們修行的人，應該集中精神修行，不管是在痛苦的時候，或是在快樂的情況，我們應該時時都為了上帝，忘記自己和世界種種誘惑及任何不同的情況。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/36/"},{"content":"從苦難艱辛之中學習善良；從每個不幸事件之中，得到上帝的神聖計劃，使結果更好。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/36/"},{"content":"我們越想到上帝，我們越輕鬆，想跟沒想一樣，因為跟祂融化在一起了，那個時候才叫做行、住、坐、臥都是禪，那個時候我們就成道了。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/36/"},{"content":"分享就像種下更多的種子，它將會長成許多許多，然後你會回收超過你所播種的，而且還會有剩餘；可以一次、再一次的播種、收成，你從不會虧損。而縱使你失去所有一切，那又如何？你來這世界時一無所有，你不會失去什麼，你已得到太多，從你出生到這世上，你什麼也沒帶，卻得到所有一切。你長大成人，來這世界只有收穫，你從這世界拿取許多，所以即使我們失去一切，無論如何，這也是屬於世界的，這原本就不屬於我們。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/36/"},{"content":"修行就是每天檢討自己、持戒清楚、好事要做、壞事不做；每天打坐，觀自己的智慧、養自己的慈悲心，默默知「道」，這樣才算是修行。","date":"","url":"甘露法語"},{"content":"我們做事，應該時時謙卑；要當是第一次有這個榮幸做，要當那是你的最後一次機會去做，這樣我們就永遠不會有任何問題。","date":"","url":"甘露法語"},{"content":"我們應該瞭解，這個世界很無常，任何的喜、怒、哀、樂、苦，都是很無常，我們不該為了這種無常的東西而失掉永久的寶貝。我們得到加持力、我們打坐入定、我們有智慧，這是最寶貝的事情，我們不能用世界的任何東西來交換。","date":"清海無上師以中文講於福爾摩沙西湖禪七19880924-27(MP3)","url":"http://www.godsdirectcontact.org.tw/ch/news/135/ms1.htm"},{"content":"即使我們有世俗的問題和煩惱，不過我們不應該用我們的福報和修行的功德來換取世界舒服的生活，因為那些太寶貝了！","date":"清海無上師以中文講於福爾摩沙西湖禪七19880924-27(MP3)","url":"http://www.godsdirectcontact.org.tw/ch/news/135/ms1.htm"},{"content":"假如我們修行有困難、有困擾，我們應該忍受，應該把這種不如意的情況當成是我們的考驗，看看我們信心有多大、勇氣有多少。不是一遇到什麼情況就退心、就信心動搖，一遇到什麼情況就哭、就抱怨，這樣子算什麼修行人！沒有一點勇氣，像小孩一樣！","date":"清海無上師以中文講於福爾摩沙西湖禪七19880924-27(MP3)","url":"http://www.godsdirectcontact.org.tw/ch/news/135/ms1.htm"},{"content":"所以我們修行，真正的應該瞭解自己，不用看別人。我們看自己勇氣有多少？信心有沒有高強？我們不用看別人修行怎麼好、怎麼壞，我們看自己就夠了。我們每天照顧自己的勇氣、照顧自己大丈夫的風度、照顧自己的道心，不讓它減少、不讓它消滅掉、不讓它動搖，這樣才是我們的責任。","date":"清海無上師以中文講於福爾摩沙西湖禪七19880924-27(MP3)","url":"http://www.godsdirectcontact.org.tw/ch/news/135/ms1.htm"},{"content":"任何的同修，無論他修行進步快或慢，如果他把這個世界擺在次要，把「道」擺在第一，不管他體驗多大、多小，一定可以解脫，這就是最好的衡量方法。因為這個世界的存在，就是為了要綁我們，這個世界的喜、怒、哀、樂，都是為了要考驗我們的信心和勇氣、考驗我們大丈夫的風度、考驗我們的道心。","date":"清海無上師以中文講於福爾摩沙西湖禪七19880924-27(MP3)","url":"http://www.godsdirectcontact.org.tw/ch/news/135/ms1.htm"},{"content":"你們要成佛、成菩薩，應該瞭解清楚，任何不如意的情況都是為了考驗我們，我們應該勇敢活下去，即使很痛苦，也是過了二、三天就好了。任何最黑暗、最長的晚上，也只會持續到明天早上而已，不可能永遠都是晚上。","date":"清海無上師以中文講於福爾摩沙西湖禪七19880924-27(MP3)","url":"http://www.godsdirectcontact.org.tw/ch/news/135/ms1.htm"},{"content":"只有一個東西永久，就是我們內邊的「觀音」，祂每天都在，每天都照顧我們，等一會兒，我們就可以上去住在祂那個永久的地方。","date":"清海無上師以中文講於福爾摩沙西湖禪七19880924-27(MP3)","url":"http://www.godsdirectcontact.org.tw/ch/news/135/ms1.htm"},{"content":"除了用自己靈性發展的力量來保護自己以外，沒有人可以保護我們。","date":"清海無上師以英文講於南非開普敦 1999.11.28-30","url":""},{"content":"開悟是根治這個世界各種病症的唯一方法，上帝之愛是解決世間所有紛爭的唯一藥方。","date":"清海無上師以英文講於\n斯洛維尼亞流布里雅那 1999.5.26","url":"http://www.godsdirectcontact.org.tw/ch/news/127/index.htm"},{"content":"卑下的人他們心很謙卑、很單純，他沒有一個地方可靠，沒有一樣東西可抓、可執著，他知道自己什麼都沒有，所以他的心比較簡單，空空著一個很單純、很簡單的心，所以那種大的加持力比較簡單進入。","date":"清海無上師以中文講於福爾摩沙高雄","url":"教理選粹"},{"content":"有 時候人們說，苦難是上帝另一種加持，也沒錯。不然如果我們總是生活快樂、事事順利，我們就不會珍惜，不會聽從上帝的旨意，真的是這樣！也許這就是受苦的好 處，受苦時，我們更向內祈求，因為那時我們會知道，內邊必定有某種力量，雖然我們不瞭解那是什麼，但我們非依賴祂不可。","date":"清海無上師以英文講於美國夏威夷 19940903","url":"http://www.godsdirectcontact.org.tw/ch/news/82/i-1.htm"},{"content":"我們供養時，最好不要心有所求，我們做善事，但不要祈求有福報，純粹只因別人需要，我們就給，這樣就好。","date":"清海無上師以英文講於歐洲20150826","url":"https://www.youtube.com/watch?list=PLpJLaN6_bnEECoPKWa4J-ngydLcthK4qe&v=WJL7_Vsulgg"},{"content":"每個修行者都有本分用各種方式弘法，不是師父一個人，不是上台講經才弘法。愛師父不是抓住師父在自己的地方，而是想盡辦法幫助師父的使命，像一位哲學家說：「相愛不是彼此看眼睛，而是看同樣的方向。」","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/09/"},{"content":"我們修行的人，所以常要檢討自己，不是重複別人大話、誇口，不是用這種方式當藉口，拒絕工作、拒絕責任，保護自己硬、懶的心態，一方面又為了名利心，想讓別人崇拜我們所還沒有得到的果位，這是很慚愧的事情。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/09/"},{"content":"每個字都有振動力，你們知道吧？ 你說上帝這個字時，即使是這影子宇宙都給你說“糟糕”是不一樣的，會影響你，聽到的人即使你沒看到振動，每個字確實有振動力，所以我們才應該講肯定的事。這是為什麼菩蘇語沒有任何否定字彙，所有字都閃閃發光、有多種顏色。","date":"","url":""},{"content":"任何人愛別人比愛自己多，那個人一定是聖人、是菩薩，不管修什麼，一定得到很高的果位。","date":"清海無上師以中文講於歐洲20081217","url":""},{"content":"菩蘇歌","date":"","url":"https://www.youtube.com/watch?v=-TJLgt5CsQg&feature=youtu.be&t=2187"},{"content":"我們不知道什麼對我們是最好的，所以最好就是盡力而為並接受任何情況。任何時候都要竭盡所能，這樣你才可以心靈寧靜，而且你也才能知道你的力量和智慧經得起試煉。","date":"清海無上師以英文講於印尼泗水1997.3.19","url":"甘露法語"},{"content":"我們必須每天努力，就像上學一樣，每天都要不斷地努力。所以有任何空檔，都要保留下來打坐。","date":"清海無上師以英文講於馬來西亞 1992.02.27（影帶編號#220）","url":"師父開示"},{"content":"我們必須繼續修行，讓自己習慣這種更高等的生活。這麼一來，當我們離開這個世界時，便已做好準備，對於高等的頻率已經很熟悉，所以可以適應新的境界。","date":"清海無上師以英文講於馬來西亞 1992.02.27（影帶編號#220）","url":"師父開示"},{"content":"最好的意念就是想念上帝，因為上帝是萬能的，什麼都可以做。我們想念上帝，表示我們完全順服上帝的旨意，讓上帝來管理宇宙，那時候我們會感覺沒有負擔。","date":"","url":""},{"content":"賺功德有許多方式，除了無私、幫助他人，還有很多方式。但不是為了想賺功德，而是真心服務。因為你為別人感到難過，因為別人受苦就如同你自己受苦，或你自己出錢出去發樣書等等以提昇大眾的認知，這樣你會賺許多功德。這種事一定會帶給你很多功德，提昇你的等級。","date":"清海無上師以英文講於歐洲20090208（影帶編號#876 創造人間天堂）","url":"https://www.youtube.com/watch?v=XLkM3LPY2QA"},{"content":"我們修行人應該要有正確的觀念，身為人類該有如何的行為舉止。絕對不要想拿任何東西，任何東西都不要，甚至福報也不要，因為福報會自動來。但如果你想要福報，你的心念一起，你的我執就會阻擋，就算要給你福報也會有更多問題，我們若想要抓東抓西，就無法好好地擁有它，即使我們有福報也無法好好地享有。","date":"清海無上師以英文講於歐洲20090208（影帶編號#876 創造人間天堂）","url":"https://www.youtube.com/watch?v=XLkM3LPY2QA&feature=youtu.be&t=178"},{"content":"在困境中我們祈禱，或打坐前我們祈禱：「請幫助我能打坐好」，這是很好的禱告與祈求。為什麼要祈求打坐好？這樣你才會更有智慧，你的等級也會提昇，然後你能用它來幫助別人，這就是很好的祈求，而不是上去很高的境界，感覺自己很了不起。……正確的概念非常重要。","date":"清海無上師以英文講於歐洲20090208（影帶編號#876 創造人間天堂）","url":"https://www.youtube.com/watch?v=XLkM3LPY2QA&feature=youtu.be&t=219"},{"content":"任何事都歸結於這五個戒律，你仍有這個肉身時就要嚴守戒律，它會是你最佳的防衛。","date":"清海無上師以英文講於歐洲20090208（影帶編號#876 創造人間天堂）","url":"https://www.youtube.com/watch?v=XLkM3LPY2QA&feature=youtu.be&t=268"},{"content":"悠樂諺語「毋與惡人為伍，毋取不清廉之物」意思是不正派之人，我們不與他人接觸，任何不清廉的東西我們不拿，「不清廉」意思是不符道德，來源不是很好的贈禮，不要拿這種禮物。若人家賣毒品、殺人，然後擁有許多錢財，他買給你禮物，你絕對不要拿。這就是「不取不清廉之物」的意思。","date":"清海無上師以英文講於歐洲20090208（影帶編號#876 創造人間天堂）","url":"https://www.youtube.com/watch?v=XLkM3LPY2QA&feature=youtu.be&t=461"},{"content":"當我們打坐，或是想念上帝的時候，我們的思想神聖純潔，一無所求，只有神聖的振動力和強烈的加持力，所以不會產生任何不好的東西。","date":"清海無上師以英文講於福爾摩沙西湖1991.9.24","url":"焦點文章"},{"content":"每當我們想念上帝、想念上帝的聖名，就會被賦予純淨、神聖和加持的力量。","date":"清海無上師以英文講於福爾摩沙西湖1991.9.24","url":"焦點文章"},{"content":"我們集合肯定的力量，來淨化世界，使世界變得越來越好；幫助和我們有同樣理想的人，使他們更有力量；幫助那些和我們的思想有溝通以及和我們有接觸的人，增強他們的力量、提昇他們的等級，這是幫助世界的最好方法。","date":"清海無上師以英文講於福爾摩沙西湖1991.9.24","url":"焦點文章"},{"content":"幫助別人就是幫助自己，所以我們應該時時刻刻發出純淨意念！送出無條件的愛心和善意，而不求任何回報，這是最好的方法。就算我們沒有得到聖果，沒有達到菩薩或佛的等級，至少我們可以保持自己的純淨，不受周圍否定力量的影響。","date":"清海無上師以英文講於福爾摩沙西湖1991.9.24","url":"焦點文章"},{"content":"如果我們沒有用自己的精神保護力，及純淨善良的意念，建立神聖的防護盾牌，我們會被周圍大量的否定力量所淹沒。所以我們要不斷念五佛號，因為在印心的時候，五句已經得到師父力量的加持，那就是所謂的法脈、法統。","date":"清海無上師以英文講於福爾摩沙西湖1991.9.24","url":"焦點文章"},{"content":"最好的意念就是沒有意念，所以念五佛號就夠了！那是最好的意念，非常中立、非常神聖有力","date":"清海無上師以英文講於福爾摩沙西湖1991.9.24","url":"焦點文章"},{"content":"最好的意念是只想上帝，因為祂是萬能的，也是最有力量的，什麼都可以做。意思是說，那個時候，我們完全順服上帝的旨意，讓上帝管理宇宙，我們沒有負擔。","date":"清海無上師以英文講於福爾摩沙西湖1991.9.24","url":"焦點文章"},{"content":"我們越尊重別人，我們的我執、我慢、驕慢心越減少；我們越減少驕慢心，我們越高雅、越聰明、越自在，沒有這個小小的我綁住，沒有這個敏感的心，沒有這個自卑感傷害。","date":"清海無上師以中文講於香港 1989.09.24","url":"http://www.godsdirectcontact.org.tw/chg/news/147/ap1.htm"},{"content":"教理本身並不重要，重要的是教理的實踐，因為你們不斷實踐這些教理，我們才能成為一體，才能夠如此互愛、互信。","date":"清海無上師以英文講於美國佛州1999.09.25（影帶編號#704）","url":"http://www.godsdirectcontact.org.tw/ch/news/163/mt1.htm"},{"content":"當我們苦的時候，應該感激上帝、感激佛菩薩，讓我們有機會長養慈悲心。…..","date":"清海無上師以中文講於福爾摩沙西湖19880925","url":"http://www.godsdirectcontact.org.tw/ch/news/145/ms.htm"},{"content":"我們的慈悲心就是「禪」，我們的愛心就是「佛」，如果我們失掉愛心和慈悲心的話，我們就離佛很遠了。","date":"清海無上師以中文講於福爾摩沙西湖19880925","url":"http://www.godsdirectcontact.org.tw/ch/news/145/ms-2.htm"},{"content":"耐心是最高的等級，並不是只有忍受、不抱怨而已，還要有感恩的心，再高等一點就是，我們不在乎任何情況，情況怎麼樣就怎麼樣，跟我們無關，那時候我們對世界沒有一點點興趣，對喜、怒、哀、樂沒有任何罣礙，也不會害怕。","date":"清海無上師以中文講於福爾摩沙西湖19880925","url":"http://www.godsdirectcontact.org.tw/ch/news/145/ms.htm"},{"content":"我們的人生也是一樣，每個人有多少時間、多少呼吸，都已經定好了，我們有多少時間可以用來修行成佛，也都定好了，如果我們沒有好好利用那些時間和力量趕快修行成佛的話，以後我們就完了。所以我們時間很有限，要趕快修，不能說我慢慢修就好了。","date":"清海無上師以中文講於福爾摩沙西湖19880925","url":"http://www.godsdirectcontact.org.tw/ch/news/145/ms.htm"},{"content":"這個世界我們不能太急，我們要什麼，應該不要，它才變成我們的，這個是奇怪的事，我們越要，越得不到。開悟也是一樣，得道也是一樣，不是我們用那種很急、很緊張那種心態來抓佛菩薩，或是要成佛那麼快，而我們清清涼涼修，每天做我們的責任即可。","date":"清海無上師以中文講於福爾摩沙台北 1988.12.20","url":"http://www.godsdirectcontact.org.tw/ch/Master/ap-2.htm"},{"content":"我們在順利、輕鬆的時候更要當心，不要變得理所當然，失去謙卑心、慚愧心，然後就懈怠下來，沒辦法進步。","date":"清海無上師","url":"http://www.godsdirectcontact.org.tw/ch/news/52/f-0.htm"},{"content":"不要被障礙、苦難打敗，也許今天我們不懂得怎麼反應，比較驚嚇一點，所以被打敗，那明天再繼續，有一天會好。","date":"清海無上師","url":"http://www.godsdirectcontact.org.tw/ch/news/52/f-0.htm"},{"content":"當我們開悟的時候，我們會創造一個新的天堂；當我們做壞事或犯罪的時候，我們會創造一個新的地獄。不要認為地獄早已存在，等著你掉進去；不！天堂和地獄都是我們自己創造的。","date":"清海無上師(原文為英文)","url":"http://www.godsdirectcontact.org.tw/ch/news/52/f-0.htm"},{"content":"要關愛我們的親人，更要隨時獨立自主、隨時信靠上帝；因為上帝才是我們真正唯一的親人、朋友，祂什麼都是！只要信靠上帝，內心永不匱乏。","date":"清海無上師(原文為英文)","url":"http://www.godsdirectcontact.org.tw/ch/news/79/index.htm"},{"content":"我們和現在的情況奮鬥，為了要成長、要超越它，而不只是用這種精神的力量治療自己，自己覺得不錯﹐然後就算了。有時掙扎和奮鬥也對我們很好，能使我們堅強。","date":"清海無上師(原文為英文)","url":"http://www.godsdirectcontact.org.tw/ch/news/79/index.htm"},{"content":"儘量做到所有的行動、思想和言論，都能保持獨立自主，不管是什麼人，不要讓他們過分控制我們的生活， 令我們不能呼吸，沒有伸展的空間，我們就停在那個階段，無法長大。","date":"清海無上師(原文為英文)","url":"http://www.godsdirectcontact.org.tw/ch/news/79/index.htm"},{"content":"看你對待別人的方式，就知道自己在什麼境界；看你每天抱怨多少，就知道自己的等級；看你打坐用功多少，就知道自己有沒有進步。","date":"（原文為英文）","url":"http://magazine.godsdirectcontact.net/chinese_t/37/c-0.htm"},{"content":"我們做事，應該時時謙卑；要當是第一次有這個榮幸做，要當那是你的最後一次機會去做，這樣我們就永遠不會有任何問題。","date":"（原文為英文）","url":"http://magazine.godsdirectcontact.net/chinese_t/37/c-0.htm"},{"content":"假如我們要生氣，就對我們累積的習性生氣，或者我們歸咎於情況上，而非責怪這個無上的智慧、真正的自我，因為真我從不犯錯。","date":"清海無上師以英文講於美國加州佛里孟特印度寺廟1993.11.25","url":"http://magazine.godsdirectcontact.net/chinese_t/37/c-0.htm ，http://www.godsdirectcontact.org.tw/ch/news/34/d-1.htm"},{"content":"學習主動的精神，決定什麼時候去做最好；必須要果斷，用自己已被開啟的智慧。","date":"（原文為英文）","url":"http://magazine.godsdirectcontact.net/chinese_t/37/c-0.htm"},{"content":"打坐本身也是一種獎賞，因為當我們能夠真正為了想得到智慧而打坐，不管你是否真正得到所謂的體驗，那已經是一種獎賞了。","date":"（原文為英文）","url":"http://magazine.godsdirectcontact.net/chinese_t/37/c-0.htm"},{"content":"試著柔順、謙虛、臣服，那你會更清楚看到上帝。","date":"（原文為英文）","url":"http://magazine.godsdirectcontact.net/chinese_t/37/c-0.htm"},{"content":"修行就是每天檢討自己、持戒清楚、好事要做、壞事不做；每天打坐，觀自己的智慧、養自己的慈悲心，默默知「道」，這樣才算是修行。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/37/c-0.htm"},{"content":"最好你們自己好好用功修行，而且要真正研究自己的內邊，要時時心放內邊，就不用師父修改、不用被社會磨練。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/37/c-0.htm"},{"content":"我們每個人都應該傳播上帝的訊息，傳播愛、忍辱和慈悲的福音給別人，要時常彼此互相提醒。不只在教堂裡，即使在街上、餐廳、旅館、市場，無論在任何地方，我們都要隨時記得傳播福音。不但自己要記住，同時也要提醒別人。","date":"清海無上師\n以英文講於馬來西亞 \n1989.10.2 （影帶編號＃100）","url":"http://www.godsdirectcontact.org.tw/ch/news/129/pw.htm"},{"content":"開悟和未開悟的人有什麼不同呢？開悟的人會從不同的角度來看待人生，會比較輕鬆快樂，而且他知道自己內在的寶藏，知道那個讓所有事物運轉、讓人們彼此相愛、讓地球生生不息、讓生活更快樂的偉大力量，也就是我們每個人內邊都擁有的無上師力量，只有當我們喚醒祂、運用祂時，那些生生世世收集來的消極、負面的記憶和習慣，才會慢慢地消失不見。","date":"清海無上師以英文\n講於美國夏威夷1993.3.27\n（影帶編號＃341）","url":"http://www.godsdirectcontact.org.tw/ch/news/129/pw.htm"},{"content":"觀音法門是我們所擁有最珍貴的寶物！這是千真萬確的事。有時你們會忘掉很多事，或不知道如何解決問題，但是打坐一會兒後--先觀光再觀音，所有的答案就會馬上出現在心中，你就知道該如何處理這些問題了。所以才說「先求內在的天國」，就是指打坐！要先打坐，然後「一切都會跟著來」，如果沒有得到結果的話，就表示你並不是真正地需要它。","date":"清海無上師以英文\n講於美國洛杉磯 1999.1.1 \n（影帶編號＃643）","url":"http://www.godsdirectcontact.org.tw/ch/news/129/pw.htm"},{"content":"當我們犯錯時原諒自己，當我們無法控制自己的習性，例如生氣、有時貪婪或充滿慾望時也要原諒自己，因為這些事情也因環境而生，不是真實的本人，不是靈魂真正地要這些東西。所以我們必須一試再試，最後還是要原諒自己！","date":"清海無上師以英文講於美國加州費利蒙19931125（DVD編號＃396）\n（影帶編號＃643）","url":"https://www.youtube.com/watch?v=P8xQReCJh74"},{"content":"不要把注意力太過於放在物質方面，這樣會妨礙你們修行；用這個世界的東西太多，還是要清付的。","date":"清海無上師以中文講於福爾摩沙西湖道場19960225","url":"http://www.godsdirectcontact.org.tw/ch/news/57/"},{"content":"打坐的時候就可以運用自由意志，那是我們善用自由意志的最佳時間。其他的時候，自由意志只會造成更多麻煩和業障。","date":"清海無上師透過網際網路視訊會議以英文對哥斯大黎加同修開示 2002.09.28","url":"http://www.godsdirectcontact.org.tw/ch/news/161/qa7.htm"},{"content":"為了自己和這個世界，在日常生活中多想想、發揮創意，試著儘量節約使用，或找尋替代辦法，或徹底不用，以採行更簡單、健康且和善的生活方式。","date":"清海無上師與無上師電視台員工農曆新年視訊會議，美國加州洛杉磯\n黃金11年1月26日（2014）（原文為英文），《歸鄉的喜悅：師父尋回初始宇宙》 DVD#1048","url":"https://news.godsdirectcontact.net/long-god-ch/"},{"content":"你越渴望上帝，越不想要世俗的東西，你會越快樂。","date":"清海無上師以英文講於歐洲國際聚會，黃金10年7月5日（2013）DVD#1016","url":"https://news.godsdirectcontact.net/long-god-ch/"},{"content":"你越意識到全宇宙給你的加持，你就會獲得越多加持。你會更強壯，不論是靈性、身體、心理、情緒或心靈。要保持知覺，要意識到在生活中你隨時都受到加持，生命中的每一秒都被加持。我們有來自各種不同源頭的加持，要去感覺、體會而且要感恩。","date":"清海無上師以英文講於墨西哥坎昆 2010.12.15 （DVD#945）","url":"https://www.youtube.com/watch?v=saASh0izLN4&feature=youtu.be&t=2873"},{"content":"有時你在睡夢中，上帝也會大大加持，等你一覺醒來，只看到光一閃而過，那就是你蒙受恩典之後所殘留的印象。善盡自己的本分，好好打坐就是了，你只要努力都算數。","date":"清海無上師以英文講於歐洲國際聚會\n黃金10年（2013年）7月6日\nvideo-1017","url":"https://news.godsdirectcontact.net/try-to-concentrate-time-travel-put-it-into-practice-170601-ch/"},{"content":"打坐是給我們去發掘這沈睡的百分之九十五的潛能，將它整理、擦亮，拿出來善加利用。","date":"清海無上師以英文講於美國洛杉磯1989.10.20","url":"http://www.godsdirectcontact.org.tw/ch/news/98/i-1.htm"},{"content":"如你們所知，我們有百分之九十五的腦力還沒有拿出來用。在這百分之九十五的腦力裡，蘊藏了無數的祕密、無數的寶藏、無上的喜悅與智慧。","date":"清海無上師以英文講於巴西聖保羅1989.11.11","url":"http://www.godsdirectcontact.org.tw/ch/news/98/i-1.htm"},{"content":"你們要以身做則。如果我們做好模範，小孩便會跟著做，不需強迫他們。身教勝過二十年的言教。","date":"清海無上師以英文講於美國洛杉磯1993.4.3","url":"http://www.godsdirectcontact.org.tw/ch/news/98/i-1.htm"},{"content":"當我們開悟的時候，我們會創造一個新的天堂；當我們做壞事或犯罪的時候，我們會創造一個新的地獄。不要認為地獄早已存在，等著你掉進去；不！天堂和地獄都是我們自己創造的。","date":"","url":""},{"content":"父母把小孩照顧好是很重要的，自己也要認真學習、認真開悟、了解好道理和道德，自己開悟後才能夠幫助小孩，帶他們到比較正確、好的方向去。\n上帝給我們小孩，也是為了要提醒我們當好老師。因為有一個小孩在等待你，等你幫忙他、指導他。上帝把小孩－－一個新鮮的靈魂放在你的手上，要你照顧、要你磨亮、要你弄一個模型出來。所以有小孩也不要抱怨；他們就是你當老師的功課。\n身、口、意是從同樣的原料分出不同的形狀出來，所以我們想也是像做一樣，因此我們才要檢查自己的意念、行動和言語。\n任何情況對我們有利益，上帝才安排的。有時候我們責怪上帝做不對，事實上我們不了解真相、我們不知道上帝做對的地方，我們只看到外表而沒有看到內在。（原文為悠樂文）\n我們想到別人有利益，就我們會忘記自己恐嚇的精神，這是最好長養勇氣的辦法。\n任何的祕方能幫助我們，都應該學的，都應該接受、應該保持。\n我們每個人做事很細心、很節省的話，整個國家、整個宇宙都有利；不是我們自己本人而已。所以不是我們有錢，我們就花費很多，不是這樣子；因為材料是整個宇宙分享著用。\n我們越浪費，我們業障越多。因為人家種東西、做東西什麼都很辛苦、很辛苦、流淚流汗做的。我們如果太浪費超過我們福報的話，那些剩下來的人家的業障、功勞和痛苦，我們要賠的。\n（原文為英文）\n任何時候只要情況需要，我們都要發揮愛心，並用行動表示。身、口、意隨時都要保持愛心，這樣對我們的靈性成長和對全人類都是最好的。\n對整個宇宙而言，我們像是一本翻開的書，所以要小心。每當動什麼惡念的時候，最好馬上砍斷，否則真的很不好意思。\n我們太忙於發展科學方面、文學領域和機械方面的成就，卻沒有試著發展我們自己所有、完整的力量。\n我們必須依照上帝的旨意行事，而且為了了解上帝的旨意，我們必須將身、口、意都準備好，這樣才能聽到上帝的聲音，而不是我們自己的意思。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/40/"},{"content":"不論內在或外在，我們都應該做個真、善、美的代表。(p92)（原文為英文）\nWe should be the representative of truth, wisdom, and beauty, from inside and outside. (p92)(Originally In English)\n我們在生活上真正想要成功的話，我們應該從內邊開始。就像我們澆花，水要澆到根部，而不是只澆在葉子上面而已。（原文為英文）\nIf we truly want to have a successful life, from inside out, just like we water the plant from the roots, and not on top of the leaves only. (Originally In English)\n一旦我們開悟了，每件事都會變得簡單。我們會想得快、做得快、會在適當時機做正確的反應，那就是成功的要訣。(p93) （原文為英文）\nIf we are enlightened, all things will become easy. We think fast, we do things quick, we react precisely at the appropriate moment. And that's the key of success.(p93) (Originally In English)\n我們沒有學會婉轉，所以我們才跌倒、才受苦，因此我們才必須學習與我們智慧的真正源頭溝通，然後只用愛心和體諒，而不用責難去處理每一種情況。（原文為英文）\nWe have not leaned to be flexible, therefore we stumble and we suffer. That's why we have to learn to get in touch with the real source of wisdom, and then handle every situation accordingly, without condemnation, only with love and with understanding. (Originally In English)\n為了批評世界及試著指正他人，我們的生活才會過得如此忙碌、如此精疲力盡。(p94) （原文為英文）\nAnd that's how we have been busy our life with, after being so tired out with criticizing the world and trying to make people right.(p94) (Originally In English)\n上帝讓我們從錯誤中、從教訓中、從他人的行為中學習。（原文為英文）\nGod makes us learn by mistakes, and by lessons, and by other people, other people's examples. (Originally In English)\n對人誠信是我們保護自己尊嚴及良知的最佳保障，也是最好的方法。(p95) （原文為英文）\nTo be honest with other people is the best protection for our dignity and our conscience. It's the best way for us.(p95) (Originally In English)","date":"","url":"(News No.)30期"},{"content":"如果我們還有一個心，想要保護我們的名譽、保護我們的風度，讓大家認為我們很善良，這個還是有我執、還不完全解脫這個凡夫我執的概念。","date":"","url":"http://www.godsdirectcontact.org.
