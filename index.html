---造化的好工具)","url":"http://edenrules.com/index.php?route=product/product&product_id=850"},{"content":"我們從來不死也不生，永遠存在，我們看著宇宙萬物生生滅滅，我們永遠只是個旁觀者，但是因為我們有時把自己與所看到的主體及環境當作是自己本身，所以才有苦有樂。","date":"清海無上師以英文講於美國夏威夷 1993.10.22","url":"http://www.godsdirectcontact.org.tw/ch/news/117/sl1.htm"},{"content":"挑戰愈大，我們靈性的領悟及成長也愈大。","date":"(Originally In English)","url":"100期"},{"content":"耐心是最高的等級，並不是只有忍受、不抱怨而已，還要有感恩的心，再高等一點就是，我們不在乎任何情況，情況怎麼樣就怎麼樣，跟我們無關，那時候我們對世界沒有一點點興趣，對喜、怒、哀、樂沒有任何罣礙，也不會害怕。","date":"清海無上師以中文講於福爾摩沙西湖禪四 1988.09.24-27 （MP3-3）","url":"http://www.godsdirectcontact.com/chinese/jian/teaching/145/1.html#"},{"content":"我們帶著才華、聰明、美貌、健康、好運、金錢來到這個世界後，我們會太舒服，而忘記這些加持力是從哪裡來的，會以為是由於自己的個性、才華、美貌、聰明、運氣，才擁有這種種的一切。事實並非這樣，這是有條件的！我們必須工作、必須幫助人們，為了整個宇宙而運用這些工具、裝備，否則用完了這些宇宙的加持力之後，會跌得很重，超乎我們的想像。","date":"清海無上師以英文講於美國洛杉磯1996.3.13","url":"78期"},{"content":"如果我們想要時時生活在天堂的境界，我們的行為就必須像天堂的眾生一般，這樣才能吸引天堂的加持過來。","date":"清海無上師\n以英文講於美國洛杉磯共修會 1997.07.08（DVD#588）","url":"http://www.godsdirectcontact.org.tw/ch/news/168/"},{"content":"如果沒有明師指導，我們真正的每天一直做一樣的事情，人家叫我們一聲，我們就回頭看；人家罵我們，我們就生氣；人家用那種戀愛的眼神看我們，我們就心跳跳（大眾笑），整個輩子都是做那些無聊的事，都是被外在的情況控制、被自己的頭腦騙、被過去的影響綁住，我們真正不是自由的人，沒有獨立的人格！是不是好可憐？很像牛一樣，被人家牽著鼻子走。","date":"清海無上師以中文講於福爾摩沙屏東三地門禪七 1990.04.01 MP3-CR08","url":"http://www.godsdirectcontact.org.tw/ch/news/185/"},{"content":"純素生活不是終點，只是個起點。地球上的人類和眾生，正展開更偉大的旅程，邁向更光明的未來。","date":"清海無上師以英文講於歐洲2013.7~8月","url":"http://suprememastertv.com/tw/"},{"content":"我們仍要多打坐，才能讓世人更聖潔，不斷向上提升到更高等的意識層次。","date":"清海無上師以英文講於歐洲2013.6.30","url":"http://suprememastertv.com/tw/"},{"content":"我們要記得感謝全能的上帝，感謝過去和現在所有的明師，他們為我們做了很大的犧牲。","date":"清海無上師以英文講於南非開普敦國際禪三 \n1999.11.29（影帶編號＃674","url":">>"},{"content":"我執很大時會有問題，接著就會做錯事，我們做事就會自私自利、自以為是，不顧其他人或事，那就會做錯。","date":"清海無上師以英文講於歐洲2013.7.2","url":"http://suprememastertv.com/tw/"},{"content":"我們修觀音法門的人，要把我們不分別的愛心遍佈整個世界，只有這條愛心之路，才能夠化解任何的天災、戰爭，才能夠把敵人變成朋友。","date":"清海無上師以中文講於福爾摩沙西湖 1992.05.10（影帶編號#245b）","url":"http://www.godsdirectcontact.org.tw/ch/news/150/ms1.htm"},{"content":"你們隨時都要單純，就不會出狀況，即使有狀況也會轉好為安。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/78/index.htm"},{"content":"任何人罵我們、毀謗我們，如果我們把他當成是菩薩在罵我們、上帝考驗我們的話，就不會有什麼問題了，不然的話，我們不會進步。","date":"清海無上師以中文講於福爾摩沙台北 1989.2.28（影帶編號＃50）","url":"http://www.godsdirectcontact.org.tw/ch/news/129/ms.htm"},{"content":"各位同修別怕辛苦，別怕工作，別怕新的任務，自己要試看看，任何東西你們都可以做，因為任何東西「我」可以做。","date":"清海無上師以中文講於福爾摩沙西湖 1992.05.10（影帶編號#245b）","url":"http://www.godsdirectcontact.org.tw/ch/news/150/ms1.htm"},{"content":"任何時候，任何人生你的氣或你生氣某人，試著集中注意力，不要將所有的怒氣發給那個人，只要記得念佛、可能集中注意力。如果你忘了也沒辦法，如果記得，試著再次集中，並且忘了那個人。","date":"清海無上師（原文為英文）","url":"http://www.godsdirectcontact.org.tw/ch/news/84/c-0.htm"},{"content":"不要忘了你想要成為什麼樣的人，以及自己是多麼偉大，你必須展現出的是內在所有的良善 、高貴的品質及真誠，那麼來親近你的就會是誠心且美好的人。","date":"清海無上師以英文講於新加坡共修會 1997.4.26","url":"http://www.godsdirectcontact.org.tw/ch/news/84/c-01.htm"},{"content":"在我們內在有一個地方，是所有溝通聯繫的中心，如果每個人都把注意力轉向那個中心，我們就能從裡面互相溝通。","date":"清海無上師以英文講於韓國釜山 1993.5.15","url":"http://www.godsdirectcontact.org.tw/ch/news/111/"},{"content":"在靈性上，我們變成同一體。不是像這裡的東西一樣變成一個「個體」，不是這樣，而是我們互相有溝通，這樣我才能依照我要去的方向提昇你們上去。而且有這麼一天，你們會成為自己的師父。","date":"清海無上師以英文講於泰國特別聚會 2006.11.28","url":"http://www.godsdirectcontact.org.tw/ch/news/178/ms_51.htm"},{"content":"我們必須保持高雅純潔的另一個理由是因為人們可以看得到我們，先知、聖賢和心靈純潔的人可以看到我們的靈氣。如果我們行事正當、了悟上帝，像上帝一樣慈悲博愛，並與上帝同一體，那麼我們的靈氣會是金色的，並且非常明亮。假如我們做了不對的事，傷害別人的感情、身體、心理或靈性，我們的靈氣就會變得很暗。人們可以看得到，我們騙不了人，因此我們必須讓自己保持完美。","date":"清海無上師以英文講於印度普納1997.11.23(DVD600)","url":"http://www.godsdirectcontact.org.tw/ch/news/186/pw_28.htm"},{"content":"我們對於所見所聞要很小心，如果沒有小心篩選，有時候別人不很正確的觀點、學說、哲理，就會潛入我們的頭腦中，變成我們的思想，然後我們就認為「我」有這種想法，「我」相信這種事、「我」相信那種事等等。","date":"清海無上師以英文講於美國加州舊金山 1993.11.27\n（影帶編號＃397)","url":"http://www.godsdirectcontact.org.tw/ch/news/160/index2.htm"},{"content":"無論我們講什麼好事或壞事，都會產生同樣的振動力，然後反過來影響我們。","date":"清海無上師以英文講於福爾摩沙西湖 \n1995.06.06（影帶編號#478）","url":"http://www.godsdirectcontact.org.tw/ch/news/159/ap4.htm"},{"content":"我們身體即使不在了，我們還可以繼續活下去嘛。然後要有一個身體，也可以化身出來下去走幾天嘛，這世界有什麼?要留這麼久，幾天已經很久了，幾個小時已經多了，幾分鐘也是夠了，所以意思是這樣子。真的是我們不用這個身體，我們修行好以後，上去了以後，如果要下來很簡單，要上去才難。","date":"清海無上師以中文講於歐洲2008.9.9","url":"http://smchbooks.com/new-c/dvd/dvd967.htm"},{"content":"我們的人生也是一樣，每個人有多少時間、多少呼吸，都已經定好了，我們有多少時間可以用來修行成佛，也都定好了，如果我們沒有好好利用那些時間和力量趕快修行成佛的話，以後我們就完了。所以我們時間很有限，要趕快修，不能說我慢慢修就好了。","date":"清海無上師以中文講於福爾摩沙西湖禪四 1988.09.24-27 （MP3-3）","url":"http://www.godsdirectcontact.org.tw/ch/news/145/ms.htm"},{"content":"當我們苦的時候，應該感激上帝、感激佛菩薩，讓我們有機會長養慈悲心。如果我們苦的時候，慈悲心都沒有冒出來的話，那我們應該可憐自己，反省自己為什麼那麼硬，跟石頭一樣","date":"清海無上師以中文講於福爾摩沙西湖禪四 1988.09.24-27 （MP3-3）","url":"師父開示"},{"content":"我們一直想抓住世俗的學問或習慣，認同那個所謂的「我」，才會讓我們覺得被綁、覺得不自在，才會讓我們忘了注意真實的一面","date":"清海無上師以英文講於美國加州舊金山 1993.11.27\n（影帶編號＃397)","url":"http://www.godsdirectcontact.org.tw/ch/news/160/index2.htm"},{"content":"你不需要別人的讚美或責難，因為只有自己知道值不值得。","date":"清海無上師以英文講於美國洛杉磯1996.3.13","url":"78期"},{"content":"在我們的法門裡如果持戒不清楚、沒道德，師父會收回一部份你的力量，這樣你就不能在社會上亂做壞事，我們的法門與其他法門的不同之處，就在於師父能夠控制這個主宰的力量。","date":"清海無上師以英文講於美國紐約聯合國 1992.6.26","url":"http://www.godsdirectcontact.org.tw/ch/news/123/index.htm"},{"content":"有時候我們認為修行不順利，或是生意、生活不順利，事實上那才是最順利、對我們最好的情況，因為等一下我們的靈性會發展、會發芽、會開花。","date":"清海無上師以中文講於福爾摩沙台北 1989.2.28（影帶編號＃50）","url":"http://www.godsdirectcontact.org.tw/ch/news/129/ms.htm"},{"content":"上帝給我們自由意志，我們可以為所欲為，那也沒關係，不過如此一來，要花很長時間才能回去我們的故鄉，才能了解宇宙的奧秘。只有明師才會教導我們…….","date":"清海無上師 以英文講於歐洲  2008.01.01(DVD983想學動物語言的人)","url":"詳細介紹"},{"content":"師父能夠保證，我們修觀音法門，像師父一樣，過了一段時間，有可能會記得自己前世是誰，有可能記得自己是某某重要的阿羅漢、菩薩，秘密是在這裡而已。","date":"清海無上師以中文講於福爾摩沙彰化 19890428","url":"http://edenrules.com/index.php?route=product/product&product_id=298"},{"content":"這個世界的喜、怒、哀、樂、苦，都是讓我們學習的科目，如果我們沒有經歷這些，我們不會了解眾生的感受。","date":"清海無上師以中文講於福爾摩沙西湖禪四 1988.09.24-27 （MP3-3）","url":"http://www.godsdirectcontact.org.tw/ch/news/145/ms.htm"},{"content":"真的如聖經所言:要先找尋內在的天國。專心在內邊，真正渴望上帝，那麼生活上大小事自然沒問題。都會很順利。","date":"清海無上師 以英文講於歐洲  20130705(DVD1016一心想念上帝與開悟)","url":"July 5,2013 Morning~Europe-DVD#1016"},{"content":"你越渴望上帝，越不想要世俗的東西，也會越快樂。","date":"清海無上師 以英文講於歐洲  20130705(DVD1016一心想念上帝與開悟)","url":"July 5,2013 Morning~Europe-DVD#1016"},{"content":"我們權力很大，但因為我們不知道，每天忙碌在這種小的角色，在物質的方面掙扎，然後才忘記我們最大的能力。","date":"清海無上師以中文講於福爾摩沙西湖 1992.05.10（影帶編號#245b）","url":"http://www.godsdirectcontact.org.tw/ch/news/150/ms1.htm"},{"content":"我們修觀音法門就開始準備嘛，準備要多習慣那個比較高級的生活、高級的境界。不然死的時候，不會習慣的就會再輪迴，因為還喜歡再選那個以前我們習慣的……","date":"清海無上師 以英文講於歐洲  2009.01.10","url":"DVD985 蘇菲教的教理與觀音法門殊勝的特性"},{"content":"我們可以經歷任何事，而仍然可以活得下來！因為如果我們的精神夠堅強，有高雅的目的和崇高的理想，只要我們專注我們的理想，我們會忘掉其它任何事物，真的是這樣子。","date":"清海無上師以英文講於美國加州長堤1996.12.28","url":"http://www.godsdirectcontact.org.tw/ch/news/78/g-1.htm"},{"content":"假使我們沒有打坐，沒有將內在造化的萬能力量拿出來用，那麼不管我們想法有多肯定，都不會實現。","date":"清海無上師以英文講於美國加州聖荷西1996.03.20（影帶編號#539）","url":"師父的話"},{"content":"你們什麼時候有時間就打坐，不一定是早上或是晚上…；不然的話，我們心情不穩呀！好我們看成壞，壞我們看成好。我們簡單被人家的業障污染，拉我們下來，等級掉得很快。 即使沒有掉的話，也是難進步。","date":"清海無上師以中文講於福爾摩沙西湖19920412（01112 宇宙最高等溝通方式）","url":"http://suprememastertv.com/tw/bbs/board.php?bo_table=download_tw&wr_id=2727&goto_url=&sfl=wr_content&stx=%E5%AE%87%E5%AE%99%E6%9C%80%E9%AB%98%E7%AD%89%E6%BA%9D%E9%80%9A%E6%96%B9%E5%BC%8F&sst=wr_num&sop=and&url=link2&year=&month=&day="},{"content":"因為有這個肉體的緣故，我們看不到實相和真理，所以才會以為自己偷偷想什麼、做什麼，不會有人知道。不過這些事情到頭來還是會回到我們身上。","date":"清海無上師以英文講於南非德爾班1999.11.26（DVD#668）","url":"http://www.godsdirectcontact.org.tw/ch/news/159/qa2.htm"},{"content":"修行觀音法門的人要有智慧、要影響整個世界，而不是被無明 的群眾影響！","date":"清海無上師以中文講於福爾摩沙西湖 1992.05.10（影帶編號#245b）","url":"http://www.godsdirectcontact.org.tw/ch/news/150/ms1.htm"},{"content":"我們要把注意力集中在智慧眼，讓靈魂趕快飛上去，越快越好！","date":"清海無上師以中文講於福爾摩沙西湖禪四 1988.09.24-27 （MP3-3）","url":"師父開示"},{"content":"很多人說佛在心，或是眾生都是佛，我們怎麼不懷疑?怎麼不說，那如果這樣的話，我有可能也是佛啊，有可能我忘記自己是佛，現在如果有辦法，我能記得的話，那多好。","date":"清海無上師以中文講於福爾摩沙彰化 19890428","url":"http://edenrules.com/index.php?route=product/product&product_id=298"},{"content":"如果我們不認真打坐的話，我們的業障沒辦法消除。","date":"清海無上師以中文講於福爾摩沙西湖19920412（01112 宇宙最高等溝通方式）","url":"WMV (56 MB)"},{"content":"要幫助世界，我們先要修身，修行好，要對自己有規矩、要嚴格，我們才能夠瞭解要怎麼做。不然的話，我們真正的要做也做不成。……因為我們不夠福報可以做那種工作。不是我們想要做什麼工作，我們就可以做什麼工作，不順!還有我們生生世世沒有幫過人家忙，","date":"清海無上師以中文講於福爾摩沙西湖19920412（01112 宇宙最高等溝通方式）","url":"WMV (60 MB)"},{"content":"我們所有藝術家們，應該注意提昇自己，才能更與天堂創造的力量連結。然後即使在我們把自己的思想放進畫布中或音符、詩文中之前，我們的作品與存在都會帶給人們提昇，並在不同層面上利益眾生。","date":"清海無上師以英文開示於泰國新書發表音樂會視訊會議2011.05.29","url":"詳細介紹"},{"content":"我們生生世世累積的習慣和冷酷的個性，非常微細，連我們自己也沒有察覺到。所以，如果我們不想繼續保留那些不好的品質和根深柢固的習慣，就要好好檢查、反省自己。","date":"清海無上師以英文講於福爾摩沙西湖 1995.06.06（影帶編號#478）","url":"修行小錦囊"},{"content":"我們要培養仁慈心，並且長養它，使它發展茁壯，進而散播到全世界，這就是讓這個世界越來越好的方法。","date":"清海無上師以英文講於英國舍瑞 2006.01.02","url":"http://www.godsdirectcontact.org.tw/ch/news/167/index2.htm"},{"content":"做事要婉轉，因此我們才需要智慧和愛心，不是規則和法律而已，愛心的律法超越一切，  所以我只要求你用愛、單純心和智慧做事。","date":"清海無上師講於美國科羅拉多州1993.4.11 原文為英文","url":"甘露法語"},{"content":"你出自完美，將不會接受自己不完美的行為，這就是為什麼人要一再輪迴，回到人世或任何世界，來彌補他們過去的錯誤。但是當我們下來後，又忘了，我們被誘惑，處在不同的舒適情況中。","date":"清海無上師以英文講於法國聚會 2009.03.08","url":"http://www.godsdirectcontact.org.tw/ch/news/203/"},{"content":"不要降低自己高貴莊嚴的等級，也不要降低自己的意識；不要滿足於那個較低等的自我，也不要被習性驅使，成為到處貪婪爭奪、困擾別人的討厭鬼，讓自己出醜。","date":"清海無上師以英文講於美國佛州 2001.06.08（DVD716）","url":"http://www.godsdirectcontact.org.tw/ch/news/136/ms1-2.htm"},{"content":"我們修行的人不是那種厭世、逃避的人，我們修行為了要發展我們全部的才華、能力、道德和智慧。","date":"清海無上師以中文講於福爾摩沙西湖 1992.05.10（影帶編號#245b）","url":"http://www.godsdirectcontact.org.tw/ch/news/150/ms1.htm"},{"content":"你們是我的代表，你們以適當的方式做你們認為師父會做的事，不論是這裡或是別處。","date":"清海無上師以英文講於歐洲 2008.08.20和21（DVD868）","url":"868 睿智的聖者--納斯魯丁與魯米寓言詩作"},{"content":"自私的人什麼都得不到，唯有無私、高貴、先考慮別人，我們才會得到福報。","date":"清海無上師以英文講於歐洲 2008.08.20和21（DVD868）","url":"868 睿智的聖者--納斯魯丁與魯米寓言詩作"},{"content":"怎麼死不重要，而是活著時候如何。何時死不重要，關鍵是直到死的一刻，我們一生做了甚麼。我們沒有浪費生命，我們幫助世界，是上帝的好工具，這才真正是好的一生。","date":"清海無上師以英文講於歐洲 2009.8.8（DVD875）","url":"875 清海無上師談環保：必須全力拯救地球"},{"content":"我們都是很正常的人，天生擁有各種恩賜，有身為人類的所有工具，還有可以掌控的聰明才智，而我們竟然沒好好造福人類，或沒做促進世界和平或提昇人類靈性的事，這樣我們就該覺得慚愧。","date":"清海無上師以英文講於福爾摩沙西湖20070226","url":"DVD988上帝的殿堂"},{"content":"所有這些工作和挑戰都會使我們更有智慧，而各種苦難有時也會使我們更有慈悲心。每件事都對我們有好處。","date":"清海無上師以英文講於英國倫敦 2005.12.31","url":"http://www.godsdirectcontact.org.tw/ch/news/170/qa2.htm"},{"content":"根本沒有一個人是受害者，發生在我們身上的每件事，都是我們為了達成最高的目的而造出來的，但因為我們選擇忘記，所以才不了解。","date":"清海無上師以英文講於南非德爾班1999.11.26（DVD#668）","url":"物質世界的時空限制"},{"content":"所以要珍惜你們的人身，尤其趁你們還有健全的四肢，可以修觀音法門的時候請務必善用生命的每一秒分，提昇自己的靈性等級。…不要等待，因為現在你們只有自己的業障要背，所以比較好處理。不要等到被業障擊垮，失去了修觀音法門所需的寶貴工具…","date":"清海無上師以英文講於福爾摩沙西湖20070226","url":"DVD988上帝的殿堂"},{"content":"在這個娑婆世界中，我們也是上帝：當我們愛我們的小孩、愛我們的鄰居、愛我們的同胞，那個時候我們就是代表上帝的品質，我們發揮祂給我們的內在的愛力，將它表達出來。我們發揮越多這個愛心，我們跟佛祖、上帝、造化、道就越接近，因為道、上帝、佛祖就是愛力。","date":"清海無上師以中文\n講於福爾摩沙台北 1989.2.28\n（影帶編號＃50）","url":"http://www.godsdirectcontact.org.tw/ch/news/129/ms.htm"},{"content":"變化那些東西需要消耗很多力量，除了讓我們有我執，不能解脫以外，還會浪費力量，讓我們沒辦法上去高的境界，所以才不應該使用神通。像用靈力救病也是一樣，那些人為了替人救病，浪費很多力量，力量都消耗在娑婆世界裡，所以不能超三界。","date":"清海無上師以中文講於福爾摩沙西湖禪四 1988.09.24-27 （MP3-3）","url":"師父開示"},{"content":"我們修行的人時間有限，當然我們要越快越好，越省時間越好，因為我們在家人、出家人這個時代都好忙，我們沒有時間可以浪費在那裡繞來繞去那麼多.","date":"清海無上師以中文講於福爾摩沙澎湖19890127（MP3下載00510 得「一」即得道）","url":"http://edenrules.com/index.php?route=product/product&path=60&product_id=272"},{"content":"愈開悟你會變得愈謙卑，因為你會明白自己所知那麼有限，而宇宙是如此浩大。然後你會愈來愈謙卑，直到你變成最謙卑的人，那時你會承認自己一無所知，但同時你又無所不知；這就是老子說的「大智若愚」，也就是耶穌基督說的：「我工作，但並不是我在做，而是天父在我裡面做的。」","date":"清海無上師以英文講於巴西 1989.6.18","url":"http://www.godsdirectcontact.org.tw/ch/pearl_wisdom/qa/3-28.htm"},{"content":"不要看別人好壞，就能保留自己辛苦賺的靈性功德。","date":"DVD916新年新希望：如何更接近上帝2011.01.01英文開示","url":"新年新希望：如何更接近上帝"},{"content":"要做偉大的事情，不能這樣子想法，不能想跟普通人一樣，不能講話跟普通人一樣，…...我們能力要越來越偉大才可以。你們就要開始想大一點哪!我們來這邊訓練，然後我們要出去，要了解清楚，像一個學校一樣，不是給你賴的，是要給你畢業的。","date":"清海無上師以中文講於福爾摩沙西湖 19920415","url":"http://suprememastertv.com/tw/bmd/?wr_id=489&page=4&url=link2_0&eps_no=831&show=bmd&flag=0"},{"content":"如果你真正相信明師，並實踐他們的教理，那麼經過一段時間後，你就會與明師同一體，並做跟明師一樣的事。所以那就是我們應該達到的目標。不能只是背誦任何先知或明師的教理，還要將盛典中的教理付諸行動。","date":"清海無上師以英文講於歐洲20080825(DVD970當明師真正的徒弟)","url":"當明師真正的徒弟"},{"content":"不能只是背誦任何先知或明師的教理，還要將盛典中的教理付諸行動。","date":"清海無上師以英文講於歐洲20080825(DVD970當明師真正的徒弟)","url":"http://edenrules.com/index.php?route=product/product&path=59&product_id=391"},{"content":"你用肯定的字眼越多，對世界和自己就越好。不要吝嗇用愛及肯定的字，任何時候能講就講。","date":"清海無上師以英文講於英國倫敦1997.8.26","url":"字的振動力"},{"content":"如果要取笑別人，責罵別人，最好不要!因為我們會得他的那個業障、因果。","date":"清海無上師以中文講於台南 1989.03.02(孔子也是修行人)","url":"https://www.youtube.com/watch?v=rEwGBUWWNaU"},{"content":"那是上帝的力量，當你與那力量溝通時，你無所畏懼。","date":"清海無上師以英文講於歐洲 20080821（DVD868）","url":"868 睿智的聖者--納斯魯丁與魯米寓言詩作"},{"content":"犯戒有三種，細微的是來自我們的頭腦，較粗糙的是我們的行動，再加上言語，那麼就完了。因此我們應該隨時小心，如果我們想要再回來做人，就必須持戒清楚。","date":"清海無上師以悠樂文講於美國洛杉磯小中心1997.7.13","url":"師父開示"},{"content":"如果我們高於五戒，又有修行，遵守其它更微細的戒律，那麼我們可以做聖人或佛。","date":"清海無上師以悠樂文講於美國洛杉磯小中心1997.7.13","url":"http://godsdirectcontact.com/chinese/jian/teaching/87/1.html"},{"content":"修習觀音法門，內在的光和音，才是最大的幫忙。因為會喚起保護力，如你印心時所見，你能以堅強的意志力，良知以及打坐力量趕走魔界眾生。","date":"清海無上師與無上師電視台員工農曆新年視訊會議\n2014年1月26日，美國加州洛杉磯","url":"http://suprememastertv.com/tw/2014-Lunar-New-Year/"},{"content":"有時佛菩薩也考驗我們，送醜陋的景象來，看看我們的反應如何，是否記得佛？或被魔嚇壞了，對佛失去了信心。","date":"清海無上師以英文講於福爾摩沙西湖 1995.7.12","url":"78期"},{"content":"我們如果得到這個內在的博愛的那個品質，我們自然會愛別人，我們自然會利益別人，我們不應該說我們愛他，我們不應該拿錢供養他，或是我們不應該去看他有病，有可能這個我們順便做的，不過另外一個無形的愛力，會自然加持他，讓他感覺到很舒服，讓他感覺到很愉快，讓他病快好，讓他靈魂解脫，那個才是真正的耶穌基督所講的博愛。","date":"清海無上師以中文講於澎湖 1989.03.06(mp3下載00531觀音法門就是愛力的法門38:36~40:24)","url":"http://blog.xuite.net/ccymcw99/divinelove/109907360"},{"content":"這個情慾啊會浪費我們很多的力量，修觀音或不修觀音法門都一樣的，會傷害到我們的頭腦，傷害到我們的心臟，那個把我們的那個元氣漏出去的，快樂幾分鐘而已，然後就整天都在那裏很累，修行也不好，講什麼都不通…","date":"清海無上師以中文講於台南 1989.03.02(孔子也是修行人)","url":"http://edenrules.com/index.php?route=product/product&product_id=825"},{"content":"任何眾生都有那個振動或聲音，彼此互相影響。這個世界和極樂世界不同，因為這個世界有動物、有壞人、有好人、有緊張的人、有清淨的人、有快樂的人、有痛苦的人，很多種氣氛混在一起，我們處在這種混淆的狀態中，很難安心修行，總是有很多的障礙或不好的氣氛困擾我們，但是如果能專心修行的話，進步很快。","date":"清海無上師以中文福爾摩沙台北  19890306","url":"http://www.godsdirectcontact.org.tw/ch/news/100/c-1.htm"},{"content":"師父二十四個小時一直和我們在一起，但是我們又聾又盲，什麼都聽不到，只聽到頭腦記錄的亂七八糟的事。要是能聽到內在師父的聲音，就不會有人犯戒，沒有人會墮落。就是因為我給每個人機會，讓你們可以自己奮鬥，否則要是由我來選擇，就沒多少人可以坐在這裡。","date":"清海無上師以悠樂文講於美國洛杉磯小中心1997.7.13","url":"http://www.godsdirectcontact.org.tw/ch/news/87/b-1.htm"},{"content":"你們只是減少汙染環境，你兩手空空來到地球，你的打坐甚至還不夠清付在這裡所耗費的，一定要更精進才行，如果你打坐夠好，才有資格那樣說，透過你的正面能量，可以加持地球並回報地球的恩惠。但若你打坐不夠好，根本連在世上耗費的都無法清付。","date":"清海無上師與無上師電視台員工農曆新年視訊會議 - 2014年1月26日，美國加州洛杉磯","url":"http://www.suprememastertv.com/tw/2014-Lunar-New-Year/"},{"content":"太注意那些物質的生活，就心比較沒辦法上，了解嗎?不是說師父禁止，也不是說師父討厭你們問這個要生兒子、要多少錢那個。不是，就是你們等級太低了，那個就是去拜土地公夠了，不用來這邊找師父。我這邊是教人解脫的，教人找自己的本性，偉大的佛性的，了解嗎?然後最少也可以救自己，還有五、六、七、八、代超生，多一點就可以救別人，當英雄、當菩薩、當聖人，我不喜歡那種一天到晚要這個、要那個，自己又不修行，這跟外面的人那個做生意一樣，或是乞丐一樣，了解嗎?這些是一種靈修的乞丐，靈修的乞丐，托缽的，托缽人家的福報，托缽人家的神通，這個不是我們修觀音法門的人的態度。","date":"清海無上師以中文講於法國20090214(DVD958愛心很重要)","url":"http://edenrules.com/index.php?route=product/product&filter_name=958&product_id=485"},{"content":"當我們還活著的時候，每天應該儘量訓練自己的意念保持很正面、肯定，直到這種想法成為我們的第二天性，成為我們自己為止。","date":"清海無上師以英文講於南非開普敦 \n1999.11.27 （影帶編號＃669）","url":"為臨終時刻預做準備"},{"content":"靈魂與\"至高之靈\"的結合，\"至高之靈\"意思是上帝，兩者的結合就像結婚。種種邪惡、阻礙擋在靈魂跟上帝之間，如果我們有耐心，如果我們相信上帝，最後終將與上帝再度歡喜團圓。","date":"清海無上師以英文講於歐洲\n2008.12.26（DVD887上帝照顧一切）","url":"http://edenrules.com/index.php?route=product/product&filter_name=887&product_id=552"},{"content":"不管去哪哩，我們都要守戒律，我們應該帶給別人歡樂，要守規矩而不要找麻煩，到哪裡都不要變成別人的負擔。","date":"清海無上師以英文講於歐洲\n2008.12.26（DVD887上帝照顧一切）","url":"http://edenrules.com/index.php?route=product/product&filter_name=887&product_id=552"},{"content":"我們因為每天跟著我們的那個習慣走，我們忘記我們根本不應該注意那些東西。比方說，我們走路的時候，有的時候看到我們的那個陰影爬在地上有沒有，這個陰影不是我們的，不過有時候我們看到彎彎…","date":"清海無上師以中文講於福爾摩沙台南 19900315","url":"http://edenrules.com/index.php?route=product/product&product_id=315"},{"content":"並不是說你結了婚便比其他不結婚的人差，或是那些沒結婚的比結婚的人好等等，並非如是。這些都只是你們事先做好的選擇，以便從這些功課中重新認識自己而已。","date":"清海無上師 以英文講於柬埔寨 Raising Center 1996.7.28","url":"http://www.godsdirectcontact.com/chinese/jian/teaching/70/1.html#SEC6"},{"content":"真正的「我」只是清醒的在旁邊觀看，看著我們收集一切，看著我們一連串的行動和反應，明白只是在觀看，而並不是行動，也不是反應，只是看而已，這才是真正的「我們」，才是真「我」。","date":"清海無上師以英文講於福爾摩沙屏東三地門 1992.12.26","url":"http://www.godsdirectcontact.org.tw/ch/news/117/sl3.htm"},{"content":"上帝愛我們，明師愛我們，透過所有的愛人，所有的慈母，所有的嚴父，所有的摯友，任何愛我們的就是上帝愛我們。God loves us, The Masters love us, through all the lovers, through all the mothers, through all the fathers, through all the faithful friends. Whoever loves us, it is God Who loves us.","date":"清海無上師\n以英文講於美國芝加哥19940222","url":"清海無上師歌曲創作專輯(MTV)"},{"content":"我們的身體會很自然的一直要求那些東西。有時候因為已經累積太多，我們整個人、全部的細胞會一直渴求那些東西，那時候我們的頭腦會很軟弱，再也無法扺抗，一直墮落，越沈越下去，越下去就越沈重越無法提昇，結果就必須再回來做人，才能滿足自己的慾望。直到什麼時候他被打擊得東倒西歪，被淹沒到再也受不了，他才會張開眼睛，才自己站起來，但這需要很久的時間，甚至好幾百年。因此當頭腦唆使我們去做那種事的時候，我們要警覺、要馬上醒過來，立刻默念佛號，趕快拉自己回到正路上，就沒每如果我們一直順著頭腦做這、做那，我們會墮落下去，即使修行，也是白費功夫。我們一天只打坐兩個半小時，也可能還沒有打坐那麼久，但用這種意念拖了自己一整天，當然會掉下來。它拖我們二十一個或二十二個小時，而我們只拉它兩個半小時，加上我們搖頭晃腦打瞌睡，時間根本就不夠。兩個半小時是要訓練自己過著純潔的生活，我們一旦沒有適度地訓練自己，就會統統被拉走，會跟不上腳步。","date":"清海無上師以悠樂文講於美國洛杉磯小中心1997.7.13","url":"http://godsdirectcontact.com/chinese/jian/teaching/87/1.html"},{"content":"你們必須更加意識到帶下來地球的這股力量，真正具體的感受它。因為如果沒有傾聽，或專注於它，它會被忽略掉，這樣一來，對你就沒有太大的幫助。","date":"清海無上師以英文開示 歐洲國際聚會20130705(DVD1016)","url":"http://suprememastertv.com/tw/2013-EU-Gathering/"},{"content":"打坐不僅是坐那裡很久就好，你必須把自己完全融入這個法門、完全融入打坐中，一天比一天更深入，愈深入愈好，然後你會發現萬事OK！","date":"","url":"http://www.godsdirectcontact.org.tw/eng/news/87/"},{"content":"我們工作是裡面的主人在工作，而不是這個身體。所以工作的時候應該了解清楚，應該記得是裡面的主人祂指揮我們的手工作。","date":"清海無上師以中文講於福爾摩沙宜蘭禪七1988.8.12（MP3-1）","url":"http://www.godsdirectcontact.org.tw/ch/news/137/ms.htm"},{"content":"剛開始訓練的時候，我們就多坐一些，把我們的心抓回來，以後我們去任何地方，我們的心就能隨時往內，那個時候即使我們沒有坐下來，我們的心也不會分散，或是當我們工作的時候，我們也不會忘記修行。","date":"清海無上師以中文講於福爾摩沙宜蘭禪七1988.8.12（MP3-1）","url":"http://www.godsdirectcontact.org.tw/ch/news/137/ms.htm"},{"content":"把握每個機會展現你的愛心，你就會有愛，就會再度被整個愛所包圍，你會重新得到你所有的無條件的愛心，百分之百的整個愛心。就是這樣做，你就是這樣得到更多加持的。","date":"清海無上師以英文開示於歐洲2007.05.27","url":"http://smchbooks.com/new-c/dvd/dvd990.htm"},{"content":"你必須小心，如果你生別人的氣，你就得承擔他們的業障，只是對你不好而已，沒有人會責怪你什麼。","date":"清海無上師以英文開示於歐洲2007.05.27","url":"http://smchbooks.com/new-c/dvd/dvd990.htm"},{"content":"必須有觀音法門，不然堅強的意志是不夠的。堅強的意志足夠讓你克服世界的慾望與誘惑，但不能讓你到更高的等級。","date":"清海無上師以英文開示於歐洲2008.08.29  DVD991","url":"詳細介紹"},{"content":"我們不該做任何壞事，讓別人對我們有否定的想法，所以我們該守五戒，才不會造成別人的麻煩和不好的業障。","date":"清海無上師以英文講於歐洲2008.12.21（DVD887上帝照顧一切）","url":"詳細介紹"},{"content":"身體只是用來收受業障與靈性加持，所以既使你沒感覺到自己提昇，你的身體靠近加持力的來源時，它還是感到很舒服。頭腦也覺得很舒服很放鬆，就會產生療癒效果。","date":"清海無上師以英文開示於歐洲20130706(DVD1017)","url":"http://suprememastertv.com/tw/2013-EU-Gathering/"},{"content":"你們心中都已經有愛，只是重新使用它，重新訓練自己，重新學習如何使用這個愛心，散播愛心、施予愛心。你給的越多，就越有愛心。你會停不下來，到後來你會不由自主地愛你所看到的一切。","date":"清海無上師以英文開示於歐洲2007.05.27","url":"http://smchbooks.com/new-c/dvd/dvd990.htm"},{"content":"用跑的，跟業障賽跑比賽，跑在業障前面，要修行，讓業障只能在你後面跑得氣喘吁吁…","date":"清海無上師以英文講於福爾摩沙西湖20070226","url":"DVD988上帝的殿堂"},{"content":"跟師父印心以後，可以五代超生，就是靠這種修行的力量，將他們統統拉上去的。所以說修行的力量最可貴，再多的錢也不能買祂，再大的權威也帶不走祂。","date":"清海無上師講於福爾摩沙台北 一九八六‧三‧六","url":"Master Says"},{"content":"我們所持的每一個戒律，都要在身心靈各方面保持完全乾淨、單純。當然，以前的習慣難免會再冒出來，但是我們可以加以控制，不要按照它的意思去做，不給自己找藉口。","date":"清海無上師以英文講於福爾摩沙西湖19951031","url":"甘露法語"},{"content":"相信師父百分之百，這個比有體驗好。表示說那個等級很高，才能相信師父，那個下意識很明白，才相信師父。","date":"清海無上師以中文講於福爾摩沙新店19880101","url":"https://www.youtube.com/watch?v=-j13K6k3oQI"},{"content":"如果你們愛我，就幫助世界，愛世界，愛人們，幫助他們走出無明。","date":"清海無上師以英文開示 歐洲國際聚會20081208","url":"詳細介紹"},{"content":"做老師就是要成為自己的老師，並非做別人的老師，做自己的老師才難，做別人的老師太簡單。從古代以來，每個明師都是做自己的老師，當我們成為自己的老師之後，其他人會自動被我們的磁場和力量所吸引…..","date":"清海無上師以悠樂文講於美國洛杉磯小中心1997.7.13","url":"http://www.godsdirectcontact.org.tw/ch/news/87/b-1.htm"},{"content":"我們如果修行認真，我們自己會發光，會發出一種善良的、道德的、很和平的氣氛，大家都聞得到，也會感覺到，所以不能也不用躲起來，也不用講話什麼，大家也知道。","date":"清海無上師以中文講於福爾摩沙澎湖 1989.3.6","url":"http://www.godsdirectcontact.org.tw/ch/news/91/j-1.htm"},{"content":"你們最好不要崇拜我、不要跟隨我，只要學我的榜樣就好了。看看我做的努力有什麼成果，崇拜那個成果，然後做一樣的事，不久你也可以成為明師。","date":"清海無上師以英文講於美國加州洛杉磯共修會 1996.3.13","url":"http://www.godsdirectcontact.org.tw/ch/news/155/index2.htm"},{"content":"五戒要持清楚，因為那是修行之旅的保障。就好像開車的時候要繫安全帶一樣，雖然繫安全帶覺得行動受限，但它對你有益，提供你安全保障。","date":"清海無上師以英文與美國洛杉磯視訊開示20130414","url":"詳細介紹"},{"content":"傾向靈性方面往內邊尋找，並相信上帝、想找上帝，這樣會比做好事更能讓等級提昇。做好事只是為世界帶來和平與帶來彼此間愛心和善的氣氛，但想提昇靈性的話，需要的更多，必須內在渴望找到上帝。","date":"清海無上師以英文與美國洛杉磯視訊開示20130414","url":"http://smchbooks.com/new-c/dvd/dvd1012.htm"},{"content":"你們可以問那些退心的人，我可以告訴你們，百分之九十九都是由於吃了不對的食物或是犯戒，最後漸漸地離師父而去，因為這是兩條相反的道路，即使我們並沒有離開對方，但如果愈往相反的方向走，我們彼此就離得愈遠，一個往北而另一個往南的兩個人怎麼可能會再見面呢？","date":"清海無上師以悠樂文講於美國洛杉磯小中心1997.7.13","url":"http://godsdirectcontact.com/ch/collections/jie4lv4.html"},{"content":"每天如果不量自己的等級，不好好檢討自己，一定著魔啊。然後著甚麼時候都不曉得，然後離師父越來越遠。然後靈魂越來越墮落，等級越來越掉下來，沒用，這是叫著魔。所以我們每天要有那個日記，出家、在家要檢討自己，不能懈怠，不然我們甚麼時候著魔我們不知道。","date":"清海無上師以中文講於福爾摩沙西湖19910714，MP3下載:00991明師難為","url":""},{"content":"有正確概念，做什麼都正確，沒有正確的概念，做好事也是著魔的。47:40..","date":"清海無上師以中文講於福爾摩沙西湖19910714，MP3下載:00991明師難為","url":""},{"content":"好，吃你能吃的，想吃就吃，好嗎?只不過你們要知道，難消化的食物吃多了，會難以專心打坐。","date":"清海無上師以英文開示於歐洲20130708(DVD1019減少飲食有助打坐)","url":"http://suprememastertv.com/tw/2013-EU-Gathering/"},{"content":"多看師父的經書、多聽師父錄音帶、多打坐、多做觀音、多努力、多用功、多專心在道裡面。躲在道裡面才安全，躲哪裡都不安全。","date":"清海無上師以中文講於福爾摩沙西湖19910714，MP3下載:00991明師難為","url":"超因果業障的祕法(中即6 P30)"},{"content":"如果我們不夠堅強，沒有辦法抵抗生活中的誘惑，當然會掉到造化的另一面，也就是否定的那一面。如果我們夠堅強，就可以維持中道，可以自由運用肯定和否定的力量，這樣才是開悟者之道。","date":"清海無上師以英文講於加拿大蒙特利爾大學1993年4月17日","url":"http://www.sm-celestial.com/ch/jewelry/2-5.htm"},{"content":"真正愛我就好好修行，胸懷高雅的理念，徹底實踐於生活中，也要幫助他人，盡你所能互相幫忙。","date":"清海無上師以英文開示於歐洲20130706(DVD1017)","url":"http://suprememastertv.com/tw/2013-EU-Gathering/"},{"content":"你們的愛就是真愛，愛是物質世界中最珍貴的東西，所以我們必須保護愛，無論是夫妻之間的愛，親子之間的愛，或朋友之間的愛，人與人之間的愛或動物與動物之間的愛，","date":"","url":""},{"content":"我需要愛的體現，各位只要對世界，對你們的小孩，對萬物眾生，多展現百分之一的愛，放下口腹之欲，放下那塊肉，並停用相關殘忍製品，我們要有大格局的愛，不只是對家人的浪漫之愛，那是我們應該保有的，因為每種愛都很神聖，每種愛都會散發一些美好正面的能量，保護我們，保護我們的親人與我們週遭的一切。所以如果每個人都能帶給四周更多愛，並擴展它超越家庭的愛，這些愛就足以產生所需的百分之百愛力，驅散我們生存的最大威脅。…","date":"DVD999真愛","url":""},{"content":"我們這個凡夫的身體，本來已經有很多毒藥、毒氣在裡面了，當我們生氣別人、憎恨別人時，毒氣就會留在身體裡。","date":"清海無上師以中文講於台北新店 1987.8.30","url":"http://www.godsdirectcontact.org.tw/ch/news/152/ms1.htm"},{"content":"應該從很高境界工作比較可以，比較輕鬆一點，不能沉在世俗的等級裡面太久。","date":"清海無上師以中文講於福爾摩沙西湖19910714，MP3下載:00991明師難為","url":""},{"content":"就管好自己的事並默念我在印心時教你們的保護方法，專注在肯定思想上，記得上帝，多祈禱、打坐。","date":"DVD1013師父的宇宙高境界之旅20130616美國加州洛杉磯電話會議英文開示disk2-06:36","url":"http://suprememastertv.com/Master-journy-eng-TV.php?country_code=_tw"},{"content":"我們人修行，等級不一樣，看事情不一樣。我們裡面心單純、肯定，我們看事情很肯定，很舒服、很漂亮。我們心不單純，心否定的話，看什麼都不好。有時候我們為了修行認真，當然這個外表不管…..","date":"清海無上師以中文在福爾摩沙西湖開示19940605","url":"http://suprememastertv.com/tw/wow/?wr_id=487&page=4#v"},{"content":"我們誠心的時候，我們那個我執減少，然後我們那個無明的牆壁會裂開。我們會看到很多那種不同的境界，或是我們會看到真正的那個現象。如果我們不誠心，我們被那個無明、驕慢、貪嗔疵的那種磁場蓋住的話，即使那位大修行者出現在我們的面前，用化身來的，不是用肉身，我們也沒辦法看到他。他的光芒充滿虛空，我們也沒辦法看到一點點。我們有可能看他像一位凡夫一樣而已，所以比較不簡單找到佛菩薩加持力。","date":"清海無上師以中文在香港開示19890703(得到福報的方法1/2)","url":"http://suprememastertv.com/bbs/board.php?bo_table=download_tw&wr_id=7053"},{"content":"我們誠心的時候，我們那個我執減少，然後我們那個無明的牆壁會裂開。我們會看到很多那種不同的境界，或是我們會看到真正的那個現象。如果我們不誠心，我們被那個無明、驕慢、貪嗔疵的那種磁場蓋住的話，即使那位大修行者出現在我們的面前，用化身來的，不是用肉身，我們也沒辦法看到他。他的光芒充滿虛空，我們也沒辦法看到一點點。我們有可能看他像一位凡夫一樣而已，所以比較不簡單找到佛菩薩加持力。","date":"清海無上師以中文在香港開示19890703(得到福報的方法1/2)","url":"http://suprememastertv.com/bbs/board.php?bo_table=download_tw&wr_id=7053"},{"content":"不要期待任何事，都平平順順或情況總是對你有利，那將無法訓練自己，無法成為萬能的靈魂。你仍是未經淬煉的黃金，未經琢磨的石頭， 不管都有價值，未經琢磨終究無用。","date":"清海無上師以英文講於新加坡19940927上帝的不同面 (1/2)","url":"http://www.suprememastertv.com/bbs/tb.php/download_tw/5246"},{"content":"佛菩薩、聖人不需要我們感恩他們，不過我們越感恩，越承認他們，越信任他們，我們越有福報。","date":"清海無上師以中文在香港開示19890703(得到福報的方法1/2)","url":"http://suprememastertv.com/bbs/board.php?bo_table=download_tw&wr_id=7053"},{"content":"因為靈性修行真的必須先放下身段，才能成就不凡，必須沒有我執，才能成就大事。因為我執永遠是最大的阻礙，如果我們認為自己很了不起，認為自己很偉大，什麼都知道，那真知就很難冒出來。這不是從外邊可得到的知識，而是從內心生出來。我執會一直把真我壓下去，...","date":"清海無上師以英文講於歐洲 February 1, 2009 (DVD889)","url":"889 放下我執戰勝自己"},{"content":"作為一個修行者，我們有時會受到考驗。我們會遇到精神上、內在的嚴厲考驗，如此我們才能越來越謙卑，我執越來越小，才更能忍受逆境，上帝的力量才能與我們合一而不受干擾與阻礙。","date":"By Suma Ching Hai (Originally In English)","url":"http://www.godsdirectcontact.org.tw/ch/news/89/index.htm"},{"content":"即使你修觀音法門，你持戒、你打坐，但是你的心不單純，沒擺脫物質的慾望，那就不好。","date":"清海無上師 以英文開示於福爾摩沙西湖道場1995.7.11(DVD488)","url":"http://www.godsdirectcontact.org.tw/ch/news/49/v-1.htm"},{"content":"一個人留在老師身邊，必然會在不知不覺中吸收無形的影響力，這些比口頭上的教誨還重要。","date":"清海無上師 以英文開示於福爾摩沙西湖道場1995.7.13(DVD488)","url":"新聞傳真"},{"content":"我們生在這個世界，因為要學這個愛心而已，其他都沒有。","date":"清海無上師以中文講於福爾摩沙台北19880106，MP3下載00317 愛力是成道的基礎","url":"http://edenrules.com/index.php?route=product/product&product_id=945"},{"content":"我們必須只為智慧修行，只為了認識自己、認識我們原本的家，只為得到解脫和快樂，僅此而已，任何其他的東西來或不來，都只是附帶的。","date":"清海無上師 以英文開示於福爾摩沙西湖道場1995.7.11(DVD488)","url":"新聞傳真"},{"content":"天堂在你的內邊，因為你印心後，你裡面真正有天堂，你每天修行，天堂都伴你而行。…","date":"清海無上師以英文講於香港1992.2.20人生的目的（三集之二）","url":"http://www.suprememastertv.com/tw/bbs/board.php?sfl=wr_content&sop=and&bo_table=download_tw&search_table=schedule_tw&d=y&sst=wr_num&s_target=all&stx=%E4%BA%BA%E7%94%9F%E7%9A%84%E7%9B%AE%E7%9A%84"},{"content":"最好不要談論別人不好的一面，以免汙染我們的頭腦。因為我們不瞭解真相，每個人有自己的工作，學習不同的功課。我們應該高興自己不必經歷這種考驗，學習這痛苦的功課。","date":"清海無上師以英文講於香港1992.2.20人生的目的（三集之二）","url":"http://www.suprememastertv.com/tw/bbs/board.php?bo_table=download_tw&wr_id=4867&goto_url=&sfl=wr_content&stx=%E4%BA%BA%E7%94%9F%E7%9A%84%E7%9B%AE%E7%9A%84&sst=wr_num&sop=and&url=link2&year=&month=&day="},{"content":"…上帝無所不在，我們無法逃開祂的照顧，應該記得服從上帝的旨意，這樣我們的生命才更有意義，才能很快實現做人的目的。","date":"清海無上師 以英文開示於福爾摩沙西湖道場1991.9.24","url":"http://video.suprememastertv.com/daily/iPhone_iPod_Touch/2009.03.02/"},{"content":"要試著盡量無私，要試著盡量去愛，雖然也許你還無法感受到內在真愛，只要你實踐的越多，那麼真愛就會甦醒。它將越長越大，到後來它將成為你的第二天性。","date":"清海無上師與無上師電視台員工的視訊會議2014年5月29日 -- 美國加州洛杉磯","url":"http://suprememastertv.com/2012after/FromOU-TrueLoveNeverChanges/"},{"content":"我們修行為了要訓練自己的頭腦，讓它越來越想好的方面，這樣我們周遭的氣氛也會越來越淨化；我們淨化自己，就是淨化我們的世界。","date":"清海無上師以中文講於台北新店 1987.8.30","url":"http://www.godsdirectcontact.org.tw/ch/news/152/ms1.htm"},{"content":"即使明師滿足了我們的願望，但是要的越多，我們越不滿足，我們會一直要、一直要，沒完沒了。這樣我們的注意力和精力都集中在這些物質的目標上，忘記了內邊萬能的力量。","date":"清海無上師 以英文開示於福爾摩沙西湖道場1995.7.11(DVD488)","url":"新聞傳真"},{"content":"如果我們較無私、較少我執，也是一種對人類與眾生的服務。","date":"清海無上師以英文講於歐洲 July 2, 2013(DVD1015隨時散播愛)","url":"https://smchbooks.com/new-c/dvd/dvd1015.htm"},{"content":"什麼事都是衡量自己的需要去做就好。多打坐，那才重要。渴望上帝，渴望獲得加持以幫助其他眾生，這些更重要。","date":"清海無上師以英文講於歐洲 July 2, 2013(DVD1015隨時散播愛)","url":"http://smchbooks.com/new-c/dvd/dvd1015.htm"},{"content":"總之，要感激我們所擁有的一切，厲行節約、簡化生活","date":"清海無上師與無上師電視台員工農曆新年視訊會議 - 2014年1月26日，美國加州洛杉磯","url":"http://www.suprememastertv.com/tw/2014-Lunar-New-Year/"},{"content":"你越去關心那些苦難者的感受，你就越覺得自己的慈悲心受到觸動，於是你會想為對方、為動物或那種情況做些事，這樣你的高貴品質就會增長，就像銀行利息一樣。","date":"清海無上師以英文講於法國巴黎歐洲禪三 2007.08.22","url":"http://www.godsdirectcontact.org.tw/ch/news/191/ms_49.htm"},{"content":"愛他人就是愛我們自己，恨他人就是麻煩我們自己。","date":"http://www.godsdirectcontact.org.tw/ch/news/72/i-0.htm","url":"http://www.godsdirectcontact.com/aphorisms/aph_c.htm"},{"content":"看著我或想念我，一切對你們都有幫助。我不是這個『肉體』，而是師父的力量。","date":"清海無上師 以英文講於歐洲  20130705(DVD1016一心想念上帝與開悟)","url":"http://suprememastertv.com/tw/2013-EU-Gathering/?wr_id=5&page=1"},{"content":"記住上帝，渴望與上帝同在，渴望更加深入地更深一層地認識上帝，然後其它的事情，上帝會照顧。","date":"清海無上師 以英文講於歐洲  20130705(DVD1016一心想念上帝與開悟)","url":"http://suprememastertv.com/tw/2013-EU-Gathering/?wr_id=5&page=1"},{"content":"一旦你更專注於內邊，所有答案都會出來。","date":"清海無上師 以英文講於歐洲  20130705(DVD1016一心想念上帝與開悟)","url":"http://suprememastertv.com/tw/2013-EU-Gathering/?wr_id=5&page=1"},{"content":"記得在打坐當中，一定要一直記得上帝，不管因為什麼，感覺到焦慮或害怕，就求上帝保護你、加持你","date":"","url":"http://suprememastertv.com/tw/worldvegan/"},{"content":"不要給頭腦塞太多跟你無關的事情，讓心自在一點，越單純越好，就不用想太多事，打坐比較快靜下來。","date":"清海無上師以英文與美國加州洛杉磯視訊會議2011.04.27(DVD944)","url":"http://smchbooks.com/new-c/dvd/dvd944.htm"},{"content":"你們若想有所提昇，這些物質上的依戀一定要全部斬斷，我沒教過的，就別做。…...別崇拜我和這個身體，要崇拜師父的教理。","date":"清海無上師 以英文講於歐洲  20130710(DVD1020)","url":"http://suprememastertv.com/tw/2013-EU-Gathering/"},{"content":"世界上的任何東西都是造化安排，沒有什麼是我們造出來的，所以不用驕傲什麼。","date":"清海無上師以中文講於福爾摩沙西湖 1991.07.21（影帶編號＃183）","url":"http://www.godsdirectcontact.org.tw/ch/news/155/ms1.htm"},{"content":"如果我們知道自己有道德，真的愛上帝，就會相信上帝會看我們值得什麼，而為我們安排一切，根本無需祈求任何事物。","date":"清海無上師以英文講於韓國漢城共修會","url":"教理選粹"},{"content":"你們要牢記，你們比生命中任何事物都重要，那些個人的幸福或不幸、事業的成敗等情況，沒有任何一樣比你們本人重要，所以要一直保持快樂的心情。上帝真的很疼愛我們，這一點我可以保證，因為我經常有親身的體驗，即使有時候祂會跟我開開玩笑，不過我還是沒事！","date":"清海無上師以英文講於美國加州洛杉磯國際禪三1998.12.16-18 （影帶編號＃639）","url":"http://www.godsdirectcontact.org.tw/ch/news/133/life.htm"},{"content":"信心是萬法功德之母…….如果我們沒有一點點信心，是很難得到佛菩薩、聖人的加持力。","date":"清海無上師以中文在香港開示19890703(得到福報的方法1/2)","url":"http://suprememastertv.com/bbs/board.php?bo_table=download_tw&wr_id=7053"},{"content":"先打坐，一切自然會隨之而來；不用擔心沒有成果，該擔心的是自己打坐夠不夠。","date":"清海無上師以英文講於美國加州洛杉磯1996.03.14（影帶編號#537b）","url":"http://www.godsdirectcontact.org.tw/ch/news/147/"},{"content":"我們經過眼睛．經過我們那個成見，經過我們頭腦過濾的時候，看到東西不大真的。我們用靈魂看，我們集中的時候 ，我們就變成我們自己本人，那個靈魂自己看，那個時候才是看到真相。","date":"清海無上師以英文講於美國加州長堤耶誕禪五 1996年12月29日\n(DVD571明師的本來面目)","url":"http://smchbooks.com/new-c/dvd/dvd571.htm"},{"content":"我們生活中發生的每件事，都是用來測量我們已經長多大了？我們的靈性成長了多少？如果你們用這種角度來看，那就很好，要試著了解如何反應對你自己最好。","date":"清海無上師以英文講於美國加州長堤禪五 \n1996.12.29（影帶編號#571）","url":"http://godsdirectcontact.com/chinese/jian/teaching/147/1.html"},{"content":"人類必須改變，不能只仰賴天堂。父母可以幫你，但你自己也得長大，必須為自己學習，擁有自己的智慧，自己的知識。人類必須改進，必須知道對錯，然後擇善而行。","date":"清海無上師以英文與SMTV員工視訊 20140915美國加州洛杉磯","url":""},{"content":"我們越尊重別人，我們的我執、我慢、驕慢心越減少；我們越減少驕慢心，我們越高雅、越聰明、越自在，沒有這個小小的我綁住，沒有這個敏感的心，沒有這個自卑感傷害。","date":"清海無上師以中文講於香港 1989.09.24","url":"http://www.godsdirectcontact.org.tw/ch/news/147/"},{"content":"只專注於上帝和開悟，專注於更深層的意識等級和快樂。因為入定越深，你會更快樂、更開悟、更聰明、更喜悅。如果有甚麼問題，所有問題你都能處理。","date":"清海無上師 以英文講於歐洲  20130705(DVD1016一心想念上帝與開悟)","url":"http://suprememastertv.com/tw/2013-EU-Gathering/?wr_id=5&page=1"},{"content":"將注意力放在自己等級就好，看自己想要什麼，那才重要。...如果你本身很純淨，你會影響其他的人。","date":"清海無上師以英文講於美國聖荷西19960320命運掌握在自己的手上 (1/2)","url":"https://www.youtube.com/watch?v=CuC8NsCPQNs"},{"content":"「並不是強迫自己想正面的事就好，而是要知道為什麼？因為我們所想的每件事都會再回到自己身上，所以我們沒有別的選擇，我們只能想肯定的、想好的方面。」","date":"清海無上師以英文講於柬埔寨金邊,1996年7月23日","url":"http://www.sm-celestial.com/ch/jewelry/3-3.htm"},{"content":"思想和欲望的力量，非常非常強大，不會隨著時間或空間而消散。所以負面的影子宇宙，擴張如此迅速，因為我們的欲求太多了。所以小心自己所求，小心謹慎，行為思想高貴，一心只要上帝","date":"清海無上師以英文與SMTV員工視訊 20140915美國加州洛杉磯","url":"http://suprememastertv.com/tw/"},{"content":"我們裡面有些大力量，若我們身心未準備好，不夠乾淨，來保有這個力量，或承受這力量的話，一旦這力量打開了，會對我們身心造成混亂、不安的情況。","date":"清海無上師以英文講於澳洲墨爾本19930314","url":"https://www.youtube.com/watch?v=lih2Om8LejA"},{"content":"不要讓那些幻想的快樂騙我們，讓我們迷路，應該每天往前走在真理的路上。","date":"(Originally in Chinese)","url":"http://www.godsdirectcontact.org.tw/ch/news/89/b-0.htm"},{"content":"修觀音法門，五、六、七、八、一百代超生，因為你的修行的功德，和跟師父溝通的系統，然後師父會處理很好。因為你把你的身口意供養師父，讓師父處理，聽從師父指示，就是最大的供養，使你的業障變成師父的，意思說你的問題變成我的，像兩個好朋友，你有問題他也盡量幫忙。","date":"清海無上師以中文講於香港19890708","url":"http://edenrules.com/index.php?route=product/product&product_id=1038"},{"content":"大家盡量把這世界當成自己暫時的極樂，四週都是佛菩薩，僅管他們還不了解自己是佛菩薩，我們也還是尊重，對待他們像對待我們自己一樣，嚴格不過包容，疼愛不過不執著，然後我們的身口意會更輕鬆，修行自然會得道。","date":"清海無上師以中文講於福爾摩沙西湖共修會19910409","url":"焦點文章"},{"content":"我修道就是修道，沒有任何別的概念、別的要求，沒有人在我的腦海裡面，就是自然這樣子而已，那個時候即使叫我為了得道而死，我也會死，沒有留戀任何世界的東西。","date":"清海無上師以中文講於福爾摩沙西湖共修會19910409","url":"輕鬆修行的秘訣P15"},{"content":"師父講的教理也是一樣，如果你們不真正的珍惜、誠心應用的話，你們也是跟以前一樣啊！就差一點點，每天有盤腿、還有吃素，也許有驕慢一點：「我有修行。」這又更糟而已。所以要小心，不是修這樣就好了，要小心對自己真正的百分之百坦白。","date":"清海無上師以中文講於福爾摩沙台南1993.02.21","url":"師父的話"},{"content":"你們等級高低，就是看自己信心、看自己誠懇的道心，這個不能怪師父，我是指導而已，你們走慢、走快、走對、走錯，你們自己選擇。","date":"清海無上師以中文講於福爾摩沙西湖共修會19910409","url":"http://blog.xuite.net/ccymcw99/divinelove/109923442"},{"content":"我們是宇宙的主人，所以不要輕視自己，要記得自己是誰。你們什麼也不缺，什麼也不必乞求，只管付出，把你們的能量、好品質、上帝的品質分享出來。因此，不要為任何小事煩心，只要你不去理它就沒什麼能讓你煩惱。","date":"清海無上師以英文講於德國柏林1993.5.5","url":"http://www.godsdirectcontact.org.tw/ch/news/81/e-1.htm"},{"content":"我們每天要檢查自己，為了要知道我們頭腦要什麼，是真正需要，或是吵我們、麻煩我們，為了要把我們的時間消耗掉，讓我們沒時間想我們真正要的東西。","date":"清海無上師以中文講於福爾摩沙西湖道場1990.5.27 (聖經故事-伊甸園)","url":"http://www.godsdirectcontact.org.tw/ch/news/81/i-1.htm"},{"content":"我們用肉體和靈性的力量來美化我們的人生，不管走到哪裡，不論是地獄、地球或天堂，我們全將它美化成天堂，那就是我們的工作，是我們應有的作風，我想那就是聖人的作風。","date":"清海無上師以英文講於福爾摩沙西湖道場1995.7.4","url":"教理選粹"},{"content":"如果你們自己要成道的話，心要像小孩一樣，任何東西都單純、簡單，就你們會快成道。如果你們自己很複雜，掙扎太多、辯白太多、是非太多、勝敗看太重的話，如果自己慢成道，別怪師父，這是自己造出來的煩惱。","date":"清海無上師以中文講於福爾摩沙西湖共修會19910409","url":"http://www.godsdirectcontact.org.tw/ch/news/90/"},{"content":"人們若不改變自己，就算明師力量能停留很久，他們也無法獲得多少利益。獲益一些而已，但不多。善良的人會得到利益，不好的人就一點也得不到，因為他們被自己黑暗的品質包圍住。","date":"清海無上師以英文講於歐洲2013.07.08（DVD1019減少飲食有助打坐）","url":"http://suprememastertv.com/tw/2013-EU-Gathering/"},{"content":"缺點也不是甚麼不好，就是它們阻擋我們變成完美的人，我們一天到晚弄錯、重複缺點的話，我們就沒有空練習優點。","date":"清海無上師以中文講於福爾摩沙台南1993.02.21","url":"http://www.godsdirectcontact.org.tw/ch/news/90/a-1.htm"},{"content":"我們修行的話，如果不夠福報、不夠等級的話，叫你坐在那邊沒什麼用啊，感覺不出來。","date":"清海無上師以中文講於歐洲2013.07.08（DVD1019減少飲食有助打坐）","url":"http://suprememastertv.com/tw/2013-EU-Gathering/"},{"content":"你跟明師學，就是想自己也成為明師。當明師最重要的就是謙虛，所以在當徒弟時，謙卑就是必備的訓練。你就得開始學習對自己的修行所得守口如瓶。否則，上帝會把它們收回。","date":"清海無上師以英文講於巴西19890618","url":"https://www.youtube.com/watch?v=t9dFi7-5cZ8"},{"content":"要接觸到上帝很難，所以我們需要明師的指引及明師的加持力，經由明師接觸到上帝之後，我們必須讓上帝加持、引導我們，透過我們做任何事，而不是靠著我執做事。","date":"清海無上師以英文講於印尼泗水1997.3.19","url":"如何讓上帝安排一切"},{"content":"處處都是上帝的國土，處處都有師父。你走過的每個地方，師父也一同走過。沒有一處沒有師父，因師父就在你內邊，最後師父就是你自己。所以你必須有這種信念和高等的思想，如此一來，你時時都在天堂。","date":"清海無上師 以英文開示於福爾摩沙西湖道場1995.7.11(DVD488)","url":"新聞傳真"},{"content":"應該有那種決心、那種精神，可以把道放比任何事情高，這樣子的話我們修行絕對不會有障礙；如果沒有放下的精神，即使你當和尚也沒用。","date":"清海無上師以中文講於福爾摩沙西湖共修會19910409","url":"http://www.godsdirectcontact.org.tw/ch/news/90/"},{"content":"你們要好好的思考一下，過比較高雅的日子、單純的生活，證明給自己看你是真的高雅，真的來自天堂高雅的傳承，就是這樣而已，而這些欣喜、滿足應該是你自己的，而不是別人。","date":"清海無上師以英文講於美國加州洛杉磯1996.3.13","url":"http://www.godsdirectcontact.org.tw/ch/news/78/o-1.htm"},{"content":"最好、最單純的心自然會吸引宇宙中最好的、最純潔的東西，而且收穫比我們要求的還多。","date":"(Originally in English)","url":"http://www.godsdirectcontact.org.tw/ch/news/89/b-0.htm"},{"content":"因果法律所給的任何生活中的考驗，都是要清付我們過去的罪業和以前的錯誤，我們要耐心忍受。","date":"清海無上師以英文講於福爾摩沙西湖1996.2.19(師父講故事-維克多王子與五百個乞丐)","url":""},{"content":"去共修的地方，身口意要保持乾淨一點，不然的話，坐在那邊沒有功德。","date":"清海無上師以中文講於福爾摩沙西湖1994.12.29(師父講故事-一切唯心造)","url":""},{"content":"看他的外表不怎麼樣，但是他最喜歡師父、最相信師父、最疼愛師父，師父講怎麼樣就是怎麼樣，他裡面不懷疑，外面也不反對，你們看那些人就知道，他們進步很快。","date":"清海無上師以中文講於福爾摩沙西湖1988.10.29","url":"輕鬆修行的秘訣P70"},{"content":"去聽一位明師講經是最有福報、最有功德，因為那個時候我們可以連續看明師二、三小時，會被她的磁場提昇，或是被祂的光洗乾淨我們一些粗糙的業障，然後我們就會有體驗。","date":"清海無上師以中文講於福爾摩沙宜蘭禪七1988.8.12-18（MP3-1）","url":"輕鬆修行的秘訣P83"},{"content":"上帝就是愛力，如果我們想接近上帝，就應該接近愛力，並且以身作則，當一個愛力的典範。","date":"清海無上師以英文講於斯洛維尼亞‧流布里雅那1999.05.26（影帶編號#660）","url":"http://www.godsdirectcontact.org.tw/ch/news/160/index2.htm"},{"content":"靈魂來這世界的目的，就是為了尋找上帝。在找回祂之前，沒有什麼能令靈魂快樂。","date":"清海無上師以英文講於匈牙利布達佩斯1999.05.24","url":"http://edenrules.com/index.php?route=product/product&filter_name=%E7%94%9F%E5%91%BD%E7%9A%84%E7%9C%9F%E8%AB%A6&product_id=1127"},{"content":"你們打坐如果跟你們看師父的時候一樣那麼輕鬆，那就是真正的打坐。","date":"清海無上師以中文講於福爾摩沙宜蘭禪七1988.8.12-18（MP3-1）","url":"輕鬆修行的秘訣P77"},{"content":"別人罵你，那對你很好，是在幫你砍掉我執。如果你覺得被人羞辱，要為此感謝上帝。","date":"清海無上師以英文講於歐洲 20081219（DVD868）","url":"868 睿智的聖者--納斯魯丁與魯米寓言詩作"},{"content":"生活平均是道，心平常是道，我們不應該貪求什麼，我們貪快成佛，這也是一種貪望，做什麼都應該平均才好。","date":"清海無上師以中文講於福爾摩沙西湖共修會19901019","url":"輕鬆修行的秘訣Ｐ８８"},{"content":"我們要先照顧好自己的心，看自己有沒有單純，有沒有高雅的理想，自己的貪嗔癡有沒有控制好，對別人有沒有足夠的愛心和耐心，有沒有寬容、諒解和慷慨的心，能不能包容別人弄錯的地方?如果都能做得到的話，那個時候當明師還可以、成佛還可以。","date":"清海無上師以中文講於福爾摩沙西湖共修會19901019","url":"輕鬆修行的秘訣Ｐ８９"},{"content":"我們修行不能一步登天，只要每天努力用功，時間到了，自然會得到。","date":"清海無上師以中文講於福爾摩沙西湖禪七19890729~0806","url":"輕鬆修行的秘訣Ｐ９2"},{"content":"我們心比較穩定，感覺到比較有安全感、比較有穩定的心情，有信心、有道心、有快樂心，感覺到有保護的力量，這才是很難得的境界。","date":"清海無上師以中文講於福爾摩沙西湖禪七19890729~0806","url":"輕鬆修行的秘訣Ｐ９2"},{"content":"我們修越多越輕鬆，沒有任何的罪惡感，沒有任何事物可以綁縛我們，沒有任何成見可以壓迫我們，所以我們好寬、好大、像空氣一樣、像海一樣，不會被限制在某種成見、角落或是風俗習慣裡。","date":"清海無上師以中文講於福爾摩沙西湖禪七19890729~0806","url":"輕鬆修行的秘訣Ｐ１００"},{"content":"你的愛心一直都在，你的聰明才智、智慧和慈悲心，全部一直都在，只是被各式各樣的垃圾所壓抑，包括受到別人的影響，錯誤的觀念，以及社會的壓力，以及上一代傳下來的習慣，這些東西太滿了，遮蔽了一切，你們都被遮蔽住了，直到印心以後，你才變得…突然間許多垃圾都被拿走了，因此你再度感受到自己的愛心與慈悲。","date":"清海無上師以英文講於歐洲2013.07.08（DVD1019減少飲食有助打坐）","url":"http://suprememastertv.com/tw/2013-EU-Gathering/"},{"content":"如果你們自己要成道的話，心要像小孩一樣，任何東西都單純、簡單，就你們會快成道。如果你們自己很複雜，掙扎太多、辯白太多、是非太多、勝敗看太重的話，如果自己慢成道，別怪師父，這是自己造出來的煩惱。","date":"清海無上師以中文講於福爾摩沙西湖共修會19910409","url":"http://www.godsdirectcontact.org.tw/ch/news/90/"},{"content":"你們選擇自己想要扮演的角色，做自己最渴望做的事情，這才是我們在這個世界上唯一該做的。不過要記得這場遊戲的最主要目的，是要我們再次認得自己，認識那個真正的自己，而不是此刻那個虛幻的你。我們要認識自己真正純潔無暇、榮耀輝煌的靈魂，在我們下來這個世界以前的「真我」。","date":"清海無上師 以英文講於柬埔寨 Raising Center 1996.7.28","url":"http://www.godsdirectcontact.com/chinese/jian/teaching/70/1.html#SEC6"},{"content":"世人應學會更有愛心，並傳播愛，不僅要愛家人、朋友，也要愛地球上的所有眾生。真正的藝術家是愛的化身，他們是來給予生命的，為無數人帶來很多燦爛的笑容。我們要愛他們、要尊重他們，我們要盡量幫助他們。","date":"清海無上師以英文開示於泰國新書發表音樂會視訊會議2011.05.29","url":"詳細介紹"},{"content":"我們必須時時保持肯定的想法，並且利用打坐的力量，來使這些肯定的想法成真。如果你不打坐，不跟內在那個萬能的力量溝通，無論你的想法有多麼肯定，它都不會實現。","date":"清海無上師以英文講於美國加州聖荷西19960320","url":"https://www.youtube.com/watch?v=ZvMh3D9pwns"},{"content":"靈魂是自由的，但我們仍須與它保持良好關係。我們的肉體，需要多與天堂聯繫。這樣靈魂才會快樂，才會提昇。當靈魂提昇了，它也能夠從高境界汲取天堂養分，不只是透過身體，也透過靈魂本身與天堂的連結。","date":"清海無上師以英文開示於歐洲20130706(DVD1017)","url":"http://suprememastertv.com/tw/2013-EU-Gathering/"},{"content":"生生世世我們應該聽明師的教理，做個好人，這樣萬一你必須下來幫助別人或師父，才不會增加師父的負擔，給妳想幫忙的人添麻煩。","date":"清海無上師以英文開示於法國聚會2009.2.21","url":""},{"content":"有一天等你厭倦了這個虛幻的世界，就會下定決心，不管你打坐多久，你都會很誠心，心中時時與上帝同在，那才是真正的打坐。","date":"清海無上師以英文開示於英國倫敦共修會1998.03.10","url":"輕鬆修行的秘訣P192"},{"content":"如果你們真的精進打坐、誠心修行，別人會聞得到、感覺得到，對你只有尊敬和愛，沒有別的；你的臉上除了愛和純潔以外，也沒有別的。","date":"清海無上師 以英文開示於福爾摩沙西湖道場1995.7.11(DVD488)","url":"新聞傳真"},{"content":"如果我們真正渴望過更高等的生活，想為宇宙提供更高等的服務，成為一位聖人、成為智慧更通達的眾生，和其他境界更有智慧的眾生一起工作，那麼就要努力修行，通過考試，取得資格。","date":"清海無上師以英文講於馬來西亞 1992.02.27（影帶編號#220）","url":"http://www.godsdirectcontact.org.tw/ch/news/157/ms1.htm"},{"content":"做點事情吧!在這世上有很多的苦難。在你空閒時，做一些義務性的工作，感受同胞手足所受到的苦難。發揮犧牲奉獻的精神，服務大眾，你會從中獲得純然的喜悅。","date":"清海無上師以英文講於新加坡弘法開示1995.01.10","url":"輕鬆修行的秘訣P146"},{"content":"如果沒有打坐，沒有用上帝的力量來洗掉遺傳基因的紀錄，就算我們想做好事，也做不了多少。","date":"清海無上師以英文講於泰國曼谷共修會1994.09.14","url":"輕鬆修行的秘訣P123(我執與觀音)"},{"content":"不要只憑自己個人的經驗，以低等級或高等級的意識來猜測、評判一個人，將他框在那裏，然後去跟別人講他們的閒話，甚至連他本人都不知道你在說他甚麼。而第三者更是無奈，他只是坐在那裏聽著一堆垃圾，不知道是怎麼回事;然後有可能第三個人又去告訴第四個人。哦，天啊!整個小中心就充滿了垃圾。","date":"清海無上師以英文講於美國加州洛杉磯共修會1997.07.05","url":"輕鬆修行的秘訣P136(身口意都要淨化)"},{"content":"我們不乾淨，有時候是因為和別人接觸，這不一定是因為我們自己的業障，所以不要什麼事都一味地責怪自己。有時候我們和別人接觸，對方不好的念頭和業障會影響我們，或是我們吃到不乾淨的東西也會影響我們。而不管是什麼事情影響我們，都要多打坐。","date":"清海無上師以英文講於福爾摩沙西湖國際禪七1995.10.31","url":"輕鬆修行的秘訣P178(當修行遇到障礙)"},{"content":"修到那種程度，沒有任何東西對你有什麼意思，只有師父而已。那個時候才快快變成師父，因為跟祂同一體了。師父是代表萬物、代表那個「道」。所以我們常想念祂到那種程度的時候，就表示說我們等級已經很高，快跟萬物同一體，快跟「道」同一體。","date":"清海無上師以中文講於福爾摩沙台北\n1987.11.04（錄音帶編號CE3A） \n1988.11.12（錄音帶編號CG05）","url":"http://magazine.godsdirectcontact.net/chinese-t/211/"},{"content":"為大眾服務，你們會得到無比的滿足，比看到任何境界、任何光、任何佛菩薩還要更充實。","date":"清海無上師以英文講於美國德州共修會19931112","url":"輕鬆修行的秘訣P198(當修行遇到障礙)"},{"content":"如果不為別人，只為自己的話，那不是菩薩的精神，應該知道我們還差太遠。","date":"清海無上師以中文講於柬普塞金邊國際禪三19960328","url":"輕鬆修行的秘訣P196(當修行遇到障礙)"},{"content":"任何世界的材料，不管是愛情、財產或是地位、學問，都不是障礙。是我們自己障礙自己，因為我們看重它們，給它們力量綁住、控制我們。如果沒有給它們力量，我們就可以用它們，可以控制它們，利用它們利益別人、利益自己。","date":"清海無上師 以中文講於福爾摩沙屏東來義道場  1993.1.3","url":"http://www.godsdirectcontact.org.tw/ch/news/70/"},{"content":"工作也是一種磨練的方式，讓我們可以衡量自己的個性、耐力、才華和開悟的程度。所以你們不要怕工作，怕工作也是一種恐懼感。我們工作越多，就越開悟。","date":"清海無上師以中文講於福爾摩沙西湖共修會19920425","url":"輕鬆修行的秘訣P202 http://www.godsdirectcontact.org.tw/ch/news/132/mt-2.htm"},{"content":"只要活著一天，我們就應奉獻自己，為了全人類、全世界、全宇宙的美好與進步而努力。我們的眼界必須放遠，遠過於生命的局限；必須高雅，高雅到不惜一切犧牲；必須偉大，偉大到無所畏懼。有了這種宏觀，任何障礙都將為不足道，任何個人的不便，也都將不值一提。","date":"清海無上師以英文講於福爾摩沙西湖共修會19920410","url":"輕鬆修行的秘訣P217"},{"content":"如果我們精進修行，而且信心高強，上帝的旨意和恩典會令我們擁有像耶穌一樣的愛力，我們會變成像祂一樣。","date":"清海無上師以英文講於美國加州19910519","url":"帶我回家P18"},{"content":"當控制不了自己習性而生氣，起貪念、有慾望時，也要原諒自己。因為這些也可能是周遭的環境造成的，不是我們真正的本人，靈魂並不真正需要這些東西。","date":"清海無上師以英文講於美國加州19931125(DVD396原諒自己)","url":"http://smchbooks.com/new-c/dvd/dvd396.htm"},{"content":"修觀音法門以後，我執會越來越小，而你會變得越來越偉大。","date":"清海無上師以英文講於美國加州舊金山19890525 (「道」與「音」)","url":"帶我回家P27"},{"content":"要找到一位明師並不難，難的是我們要每天長養自己好的思想，直到了解並記起這輩子的目的。一旦我們記起來時，就毋需再刻意去做任何事我們只須追隨靈魂走，跟隨前人的典範，遵循上帝的指引就行了。這就是我們所需做的一切，其它的事都是順便而已！","date":"清海無上師 以英文講於柬埔寨 Raising Center 1996.7.28","url":"http://www.godsdirectcontact.org.tw/ch/news/70/"},{"content":"假如你覺得很孤單，沒有一個無條件真正愛你的朋友，那可以來找我。我們將永遠有聯繫，你會知道永遠有個朋友在你身旁。如果你非常誠心祈願的話，甚至還可以看見我顯現在你面前。","date":"清海無上師以英文講於美國哈佛大學19910224(唯有開悟才能得到天國)","url":""},{"content":"這個世界無法滿足我們飢渴的靈魂，只有明師身上偉大而無形的毫光，才能滿足我們。","date":"清海無上師以英文講於美國紐約19900204(E8同性相吸)","url":"帶我回家P107"},{"content":"寧可為了別人的幸福快樂而工作，而不是為了自己。如果你們繼續走在這條愛的路上，你會感到很滿足，比看到任何的境界還要滿足。","date":"清海無上師以英文講於美國德州共修會19931112","url":"輕鬆修行的秘訣P198(當修行遇到障礙)"},{"content":"我們身、口、意應該乾淨，越乾淨，我們災難越少、病苦越減少。遇到任何情況我們都不能怪別人，任何的天堂、地獄，都是我們自己造出來的。","date":"清海無上師以中文講於福爾摩沙台南1988.10.13（MP3-CG02）","url":"http://www.godsdirectcontact.org.tw/eng/news/166/index2.htm"},{"content":"當我們透過頭腦來看待事物時，總覺得都不夠完美，然而，當我們在較高的意識層次時，就會以比較歡喜、輕鬆和肯定的態度來看待一切事物。","date":"清海無上師以英文講於美國麻州哈佛大學19891027永生和宇宙的法律)","url":"帶我回家P78"},{"content":"愛世界的人有時候會使你變得悲慘、憎恨和忌妒，以及受到各式各樣的束縛，因為世俗的愛其實是綁住我們的業障。然而愛明師是不同的，你們越愛師父，就會越自由，會體驗各式各樣未曾體驗過的自由。","date":"清海無上師以英文講於美國紐約19900204(E8同性相吸)","url":"帶我回家P107"},{"content":"如果不發展內邊的愛力，吃素也只是空洞的行為而已。","date":"清海無上師以英文講於韓國永同道場國際禪六 2000.05.12（影帶編號#701）","url":"http://www.godsdirectcontact.org.tw/ch/news/147/"},{"content":"當你了通一切時，你也能夠治病，不過是用為無為的方式，根本不必做任何手印，或調整病人的磁場，人們只要看到你就自然痊癒。…….所以最好的治病方法，是我們成為救世主，不知不覺地治癒他人。","date":"清海無上師以英文講於美國科羅拉多州波特城19910309(159找到內在明師才能了悟上帝)","url":"帶我回家P126"},{"content":"任何你想做的，你認為是高雅、偉大的理想，能利益其他人，而你也認為這是好的，那你必須努力去做，不管代價是什麼，直接去做，不要講太多。","date":"清海無上師以英文講於美國加州洛杉磯共修會19960313","url":"輕鬆修行的秘訣P205"},{"content":"沒有一樣東西是真正屬於你自己，你只想給，不會想拿。","date":"清海無上師 以英文講於柬埔寨 Raising Center 1996.7.28","url":"http://www.godsdirectcontact.com/chinese/jian/teaching/70/1.html#SEC6"},{"content":"我們不必一直坐著想念上帝，而是要與上帝合而為一、與上帝同一體，並時時活在「上帝意識」之中，那才是天國真正的意義。","date":"清海無上師以英文講於美國加州19910519(E1吃素的理由)","url":"帶我回家P138"},{"content":"你的愛心、信心和神聖的生活方式，會幫助你克服萬難。不一定要靠我，但師父的力量，時時都在幫助自力自助的人。只要過正當的生活，思想正確、行事合乎正道，那麼一生都會走在正途上。考驗和磨難雖多，只要確立目標、持戒，生活就會更順利。","date":"清海無上師以英文講於歐洲 國際聚會 20130718","url":"DVD1024讓下一代在健康的環境中成長"},{"content":"我們喜愛一切事物，盡力照顧好它們，但是心不執著。如果事情的結果不如我們所期望，我們也不會因此感到煩惱，這就是「無欲」的境界。","date":"清海無上師以英文講於美國夏威夷檀香山19930327(#341現實生活不忘靈性修行)","url":"帶我回家P143"},{"content":"真正的打坐是把注意力全部都放在內在的力量上，放在上帝慈悲、博愛以及寬容的品質上。並不是說盤腿坐在一個安靜的地方就能得到什麼，你必須先和內在的力量溝通，那麼內在的「真我」就會開始冥想並自己覺醒過來，這就是我們所謂的打坐。","date":"清海無上師以英文講於美國加州19910519(E1吃素的理由)","url":"帶我回家P137"},{"content":"我們是為了加持世界、為了瞭解自己的偉大而來。瞭解自己的偉大後，便與整個宇宙的力量同一體，不論誰和我們接觸，都會得到宇宙力量的加持。越多像我們這樣的人修行，地球就越進步，我們會用修行的功德及智慧默默加持世界，那是我們的目的","date":"清海無上師以英文講於澳洲布里斯本 1993.3.22","url":"問答精選"},{"content":"如果我們對待每個人都像兄弟姊妹的話，很快地，所有的分別心、仇恨和誤會都會消除。","date":"清海無上師以英文講於巴拿馬1989.11.29","url":"甘露法語"},{"content":"不要讓世俗問題或個人習慣阻礙自己回歸真我！每當你無條件地愛別人、每當你擴展這個偉大的愛的品質，那就是你的真我在擴展，每次這樣做，你就是在開闊自己的世界、開闊自己的真我，然後你變得越來越偉大。","date":"清海無上師以英文講於美國加州洛杉磯 1998.12.18","url":"教理選粹"},{"content":"如果沒修觀音法門，任何外在的活動、團體、療法都不用提了，那些都只是在身體或頭腦的等級，就算在心理上有幫助，也只是屬於心智上的。若沒有宇宙振動力做真正的治療，則都是短暫的，不會有什麼進步。","date":"清海無上師以英文講於美國佛州小中心19990215","url":"為生命上彩P58"},{"content":"不管我說什麼或你說什麼，你心裏清楚自己到底渴不渴望上帝，這才是重點，而不是看你打坐幾個小時、參加共修多少次。共修只是在幫助你，如果你真心想要上帝，這樣共修對你就會更有幫助，讓你信心更堅定、打坐打得更好。","date":"清海無上師以英文講於英國倫敦共修會19980310","url":"為生命上彩P95"},{"content":"我們應該隨時記得我們裡面有天堂，它不會消失也從未消失。每當我們忘記，要想辦法記起，把自己再拉回內邊，然後我們會覺得非常平和、寧靜、舒服。沒有人能把它拿走，這才是真正的天堂。","date":"清海無上師以英文講於泰國共修會1994.1.2","url":"http://www.godsdirectcontact.org.tw/ch/news/73/g-1.htm"},{"content":"如果你感到疲累不堪或是有什麼問題，別向我抱怨，都是打坐不夠造成，那是你必須付出的代價。","date":"清海無上師以英文講於福爾摩沙西湖19950619","url":"為生命上彩P123"},{"content":"修改自己是極為重要的事，這真的是唯一的途徑。如果我們想教化並幫助這個世界的話，我們必須真正地修養及改善自己，沒有別的辦法了！","date":"清海無上師（原文為英文）","url":"http://www.godsdirectcontact.org.tw/ch/news/84/c-0.htm"},{"content":"在平常，或至少當我們打坐或想念上帝的時候，我們的思想神聖純潔、一無所求，只有神聖的振動力和強烈的加持力時，就不會產生任何不好的東西。當這樣神聖有力的加持力和思想產生，環繞在我們四周和所處的環境時，等級自然就提昇了。","date":"清海無上師以英文講於福爾摩沙西湖19910925","url":"為生命上彩P125"},{"content":"這世界實在沒有一樣東西可以讓我們依靠，唯有光和音，也是上帝在我們來到這個世界前賦予我們唯一的利器，使我們記得上帝的國度，同時也可以化解所有阻礙我們回天國的困境和障礙。","date":"清海無上師以英文講於柬埔寨19960730","url":"為生命上彩P178"},{"content":"要幫助世界的話，我們先要修身、修行好，要對自己嚴格，這樣才能了解該怎麼做，不然的話，我們想做也做不成。","date":"清海無上師以中文講於福爾摩沙西湖09920412","url":"為生命上彩P135"},{"content":"真的要專心，只專注於上帝和開悟，專注於更深層的意識等級和快樂，因為入定越深，你會更快樂、更開悟、更聰明、更喜悅，如果有什麼問題，所有問題你都能處理。","date":"清海無上師以英文講於歐洲20130705","url":"DVD1016 一心想念上帝與開悟30:30"},{"content":"所以不管做甚麼，我們都要以最大的誠心，沒有我執地去做，不然會越幫越忙。","date":"清海無上師以英文講於歐洲 January 4, 2009 (DVD889)","url":""},{"content":"每個角落不斷有事情在發生，而我們唯一可仰賴的來源，只有從修行和信心所得到的靈性力量，而且也證明確實有效。","date":"清海無上師以英文講於美國維吉尼亞共修會19941029","url":"為生命上彩P187"},{"content":"我們想「愛」就好了，任何時候我們都想「愛」、想「愛力」，時時保持肯定的想法，師父力量自然會處裡一切。","date":"清海無上師以中文講於日本 2000.07.10\n（影帶編號＃706）","url":"http://www.godsdirectcontact.org.tw/ch/news/138/index2.htm"},{"content":"我們生出來在這個世界，是為了要知道我們的本性、要知道上帝、要記得我們的佛性，不是來這邊要交朋友的，因為除了記得本性以外，別的事情都不能讓我們永久 快樂。","date":"清海無上師以中文講於柬埔寨Raising Center 1996.7.24","url":"http://www.godsdirectcontact.org.tw/ch/news/68/h-1.htm"},{"content":"當我們心平氣和、安靜地坐著的時候，會有很多信息、加持力、愛力和能量灌注到我們本人裡面，所以打坐之後我們會感覺不一樣，打坐越久，我們會變得越有智慧、內心會越平和，如此一來，世界才會變得越來越平和。","date":"清海無上師以英文講於巴西聖保羅19891111 (為生命上彩P268)","url":"http://www.godsdirectcontact.org.tw/ch/Master/pw-3.htm"},{"content":"事實上我們內邊從未分開過，所以，一旦你意識到我們彼此相連，就會覺得你就是我，或至少是我的一部分，這是理所當然的。","date":"清海無上師以英文講於美國佛州20020511","url":"為生命上彩P229"},{"content":"我們也要更加努力修行，不是只有打坐盤腿而已，而是隨時都要記得高雅的理想、記得上帝，不要管那些名利錢財和別人的是非好壞，也不要管太多身體方面的需要，或是被自己頭腦的那種名利心所騙。","date":"清海無上師以中文開示於全球網路視訊會議 2002.08.03","url":"http://www.godsdirectcontact.org.tw/ch/news/137/mt.htm"},{"content":"教理選粹","date":"","url":""},{"content":"永遠要無私與無條件奉獻，這就是宇宙運作的方式。","date":"清海無上師以英文講於墨西哥坎昆 2010.12.09 （DVD#923）","url":"師父的話"},{"content":"謙卑心就是空心，沒有一點障礙、沒有我執、沒有驕慢、沒有地方可靠，已經空了，寶貝的東西才可以放進來；滿的心不能放。","date":"和平之道 P47","url":"http://www.godsdirectcontact.org.tw/ch/news/47/g-0.htm"},{"content":"上帝的恩典勝過所有否定的力量，勝過一切災難和任何預言。一旦跟上帝的恩典溝通，我們就安全了。","date":"清海無上師以英文講於荷蘭19990509(人間嘗淨土)","url":"和平之道 P78"},{"content":"這個世界的挑戰，就是要我們時時走在上帝的道上，時時遵循良心的戒律，我們因此而能超越各種差異與各種讚譽、責難，而成為高貴的人。","date":"清海無上師以英文講於福爾摩沙西湖共修會1995.6.5","url":"http://www.godsdirectcontact.org.tw/ch/news/47/b-1.htm"},{"content":"不管誰讚嘆我們或侮辱我們，對我們來說根本沒什麼重要，主要就是我們認識自己，知道自己的品質，這才是最快樂的福報。","date":"清海無上師以中文開示於全球網路視訊會議 2002.08.03","url":"http://www.godsdirectcontact.org.tw/ch/news/137/mt.htm"},{"content":"如果我們內邊有天堂，內邊和平，那麼所到之處都是天堂，到處都是和平，那就是做好人做好事的目的，因為那是唯一的選擇","date":"清海無上師以英文講於福爾摩沙西湖共修會1995.6.5","url":"http://www.godsdirectcontact.org.tw/ch/news/47/b-1.htm"},{"content":"愛的念頭和正面的思想一向會使氣氛變得更明朗、肯定與祥和。越多人有相同的思想，影響力就越大;思想越專注，影響越強大。","date":"清海無上師以英文講於保加利亞19990519(讓生充滿愛力與奇蹟)","url":"和平之道 P112"},{"content":"全體世人都應該學習這個榜樣---我們應該用善意、愛心、美與道德，來征服他人的心，而非用武器。","date":"清海無上師以英文講於義大利19990522(成為上帝才能了悟上帝)","url":"和平之道 P139"},{"content":"因為我們知道大家同一體，我們才能愛人如己;否則再多的高談闊論也無法使人有這種自發的愛心、自然的慈悲心。","date":"清海無上師以英文講於匈牙利19990524(生命的本質)","url":"P150"},{"content":"如果我們修行人盡力提昇意識到更高的了悟層次，世界就會變得更好。只有明白我們裡面是上帝，才能尊敬坐在我們面前或身旁的上帝。","date":"清海無上師以英文講於捷克19990528(無明是唯一的罪過)","url":"和平之道 P179"},{"content":"當靈魂覺醒，知道回家的時間到了，我們和上帝之間就再也沒有障礙存在；就算有障礙，也只會強化我們的靈性，使我們更決心要回家。","date":"清海無上師以英文講於挪威19990602(讓生活與上帝同在)","url":""},{"content":"我們修行是為了找到我們偉大的自性，為了與上帝合一，這是每位修行人的崇高目標，不為健康，不為錢，都不是，懂嗎?不為任何短暫的事物，不為任何世俗的東西，那不是我們的目的。","date":"清海無上師以英文講於泰國芭堤雅20061130(DVD778修行進步反應在日常生活中)","url":""},{"content":"修行嚴肅的人是指任何時間他都不忘記「道」，他真正的想要了解自己的本來面目，想要了解自己是誰，真正要了脫生死，即使工作的時候也在想這些事情。他不一定應該一直念佛號，不一定每次念佛號才是修行，有的時候他忘記念也沒關係，不過他的內心還是想了脫生死，想佛、法、僧，他想變成明白、有智慧的人，這種人就是修行嚴肅的人，就是行、住、坐、臥都是禪的人。","date":"清海無上師以中文講於福爾摩沙宜蘭禪七1988.8.12（MP3-1）","url":"http://www.godsdirectcontact.org.tw/ch/news/137/ms-3.htm"},{"content":"我們進入上帝越高的殿堂，就越感到被提昇，越感到內在的智慧被喚醒，我們會變得更有力量，更多的愛力會從上帝那兒流經我們加持世界，加持任何和我們有關的眾生，和所有靠近我們的人。","date":"清海無上師以英文講於俄羅斯19990513(人生的目的在於加持世界)","url":"和平之道 P102"},{"content":"善用智慧和單純心，隨時以單純心來行事，隨時祈求內邊指引對錯。...有疑問時就打坐...","date":"清海無上師以英文講於美國科羅拉多19930411","url":""},{"content":"我們應該以很謙卑的態度布施，好像我們不是在布施，就像給自己一樣。","date":"清海無上師以英文講於法國20081229(DVD871)","url":"http://www.edenrules.com/index.php?route=product/product&product_id=145"},{"content":"你們在不同的等級能有很多不同的體驗，但是如果你內心沒有師父，你不會了解體驗的真義，那就像是引誘小孩的糖果，為了要他們學習真正的功課「愛」。","date":"清海無上師以英文講於福爾摩沙三地門19921226（BMD473天堂就在聖人裡面）","url":""},{"content":"這個不抱怨的等級，這個跟我們老子說「天下本無事」那個等級，任何東西都接受。這個我們說「無生法忍」，得「無生法忍」，忍耐，不過自己不知道自己有忍耐的能力，自己理所當然的。任何的情況，我們都接受，因為上帝給我這樣子，因為佛菩薩那樣安排的，那個時候我們很充滿，很滿足，很快樂，很自在，沒有任何東西能動我們的心。人家毀謗我們，我們也沒感覺到很痛，人家讚嘆我們，我們也沒有感到很驕慢，那等級聽起來很簡單，不過不簡單得到。","date":"清海無上師以中文講於福爾摩沙屏東19881201 博納兒的故事","url":"https://www.youtube.com/watch?v=datJS4dbSf8"},{"content":"宗教都講一樣，就是我們信徒了解不一樣，才變成很多麻煩。我們看一個人修行，不要看他的外表，不要看他穿甚麼衣服，從什麼宗教的背景而來?而我們應該聽他的教理，看他通多少啦?懂多少啦?容納多少啦?就我們就知道他的等級啦。","date":"清海無上師以中文講於福爾摩沙屏東19881201 博納兒的故事","url":"https://www.youtube.com/watch?v=datJS4dbSf8"},{"content":"如果一個人還抱抱在一個角落，說這個角落是最好，這他還有分別心，他還沒有得到僧燦所講的平等心，他還沒有得到老子所講那個天下本無事那個等級，他還沒有得到那個耶穌基督說除了你變成小孩那個單純心。","date":"清海無上師以中文講於福爾摩沙屏東19881201 博納兒的故事","url":"https://www.youtube.com/watch?v=datJS4dbSf8"},{"content":"魔等我們停念五句、停觀音法門就馬上來啦。所以我警告你們，修行不論任何境界，就應該謙卑、不驕慢、每天懺悔、每天懺悔，每天知道我修不夠，每天知道我心很暗、很黑。….","date":"清海無上師以中文講於福爾摩沙台北19870610 楞嚴經卷 - 十種色陰魔","url":"http://edenrules.com/index.php?route=product/product&path=60&product_id=1365"},{"content":"最大的力量就是慈悲心、博愛心。慈悲心、博愛心的力量超過因果的力量，超過神通的力量，超過任何法律的力量，所以佛和魔王不一樣，魔王跟佛差不多力量，不過缺少慈悲心，所以還是應該佩服佛。","date":"清海無上師以中文講於福爾摩沙台南19880423   一世解脫的意義","url":"http://edenrules.com/index.php?route=product/product&path=60_89&product_id=1187#sthash.p0TBC5LD.dpuf"},{"content":"我們做人的本分，就是應該多愛心，不是多攻擊，不是多批評、毀謗，看人家壞的方面而已，大家都有好的地方。","date":"清海無上師以中文講於福爾摩沙台中19880609   00374 如何把握福報避免業障","url":"http://edenrules.com/index.php?route=product/product&path=60&product_id=1183"},{"content":"這個愛力、佛菩薩愛力，感化人不用語言，我們緣很深的話，看一眼就悟道啦~看一眼就開悟、證悟。就不應該講甚麼。應該講甚麼很多，就是因為我們還沒有到這個趕快悟道的等級，所以才講那麼多...","date":"清海無上師以中文講於福爾摩沙台中19880609   00374 如何把握福報避免業障","url":"http://edenrules.com/index.php?route=product/product&path=60&product_id=1183"},{"content":"每當我們想念上帝、想念上帝的聖名，我們就被賦予純淨、神聖的加持力量。","date":"清海無上師以英文講於福爾摩沙西湖1991.9.24  選錄自即刻開悟．問答錄第三冊208頁","url":"http://www.godsdirectcontact.org.tw/ch/news/44/l-1.htm"},{"content":"當你思想高雅或行為無私時，你就和天堂同一體。然後你會添加更多力量至天堂來戰勝這世界的否定力量。","date":"清海無上師以英文講於歐洲20120326  DVD998走在奇蹟的道上","url":"http://edenrules.com/index.php?route=product/product&path=59&product_id=360"},{"content":"我們沒有歷經這麼多考驗，大多數情況都是師父獨自承擔，像耶穌或其他古魯，穆罕默德、佛陀、錫克教的古魯還有其他明師，他們自願承擔所有磨難與負擔，所以你們才沒有負擔。","date":"清海無上師以英文講於歐洲\n2008.12.26（DVD887上帝照顧一切）","url":"http://edenrules.com/index.php?route=product/product&filter_name=887&product_id=552"},{"content":"對明師的愛會一直提昇你們，並清除所有你們可能造的業障或是這輩子帶來的定業，但你們愛的方式要正確。對她外表的愛沒問題，但不能有低等念頭，因為我一靠近那種人，就會感到很不舒服。","date":"清海無上師以英文講於歐洲20120326  DVD998走在奇蹟的道上","url":"http://edenrules.com/index.php?route=product/product&path=59&product_id=360"},{"content":"我們越尊重真理，就越快找到真理，也越了解真理。我們越相信傳給我們真理的那位師父是明師，就越快找到自己的明師。我們越幫忙多人修行，就越多福報。","date":"清海無上師以中文講於福爾摩沙宜蘭禪七1988.8.12（MP3-1）","url":"http://www.godsdirectcontact.org.tw/ch/news/137/ms-3.htm"},{"content":"我們的真我就是愛，當我們選擇了愛，就是作了最高等、最高雅的選擇，我們會覺得很接近上帝、接近佛。","date":"清海無上師以英文講於馬來西亞吉隆坡 2000.4.30","url":"http://www.godsdirectcontact.org.tw/ch/news/127/index.htm"},{"content":"我們已失去生命中每件事的主要目的，我們只是無意義地忙著任何事，忙著不相關的事，我們忘了生命，人類生命的偉大，那就是我們可以當人，有這個人身是很偉大的，我們應該要珍視它。並將它用在好的理由上，用來開悟。用來認識生命更偉大的目的，更高等的自性。用來更加認識我們真正有力量的本我。","date":"清海無上師以英文講於歐洲20150728","url":"https://www.youtube.com/watch?v=IAn3I21I4ic"},{"content":"你們要多打開心胸，多打坐，多有慈悲心，那麼不論現在和以後，你們都會有更多收穫，就能利益整個世界和宇宙。","date":"清海無上師以英文講於歐洲20150727","url":""},{"content":"只專注於上帝和開悟，領略更深層的意識等級和法喜，因為入定越深，你會越快樂、更開悟、更有智慧、更加法喜充滿。如果有什麼問題，你也更有能力處理。","date":"清海無上師以英文講於歐洲國際聚會\n黃金10年7月5日（2013）","url":"http://news.godsdirectcontact.org.tw/chinese/212/cnews212-lo.pdf"},{"content":"你得放鬆，讓你的靈魂運作，為了領略我所說的，你得要放鬆，或接受我無言的教導，直接傳給你。當我開玩笑或閒聊時，是讓你的頭腦分心，這樣我才能給你其他的東西。","date":"清海無上師以英文講於歐洲國際聚會\n黃金10年7月26日（2013）1029-3","url":"https://www.youtube.com/watch?list=PLreW_cIMOF7dpn-ik-m8J89RuF3Vii-PO&v=VLgq_yOqfsc"},{"content":"你們只要祈求自己解脫，祈求你們每天更開悟，來幫助世界、幫助自己，這樣就好了，不要祈求別的事。","date":"清海無上師以英文講於歐洲國際聚會20130726（黃金10年）1030-1","url":"https://www.youtube.com/watch?list=PLreW_cIMOF7dpn-ik-m8J89RuF3Vii-PO&v=Bkt_A0Fqfis"},{"content":"堅信上帝和肯定力量，堅持擇善而行。最重要的是避免所有惡行，不僅行為舉止、思想意念也要守五戒。好好打坐，純素生活、創造和平，那麼一切都會好轉。即使魔就在你身旁，也傷不了你，他只能流口水。","date":"清海無上師與無上師電視台員工農曆新年視訊會議，美國加州洛杉磯   黃金11年1月26日（2014）（原文為英文），《歸鄉的喜悅：師父尋回初始宇宙》","url":"http://news.godsdirectcontact.org.tw/chinese/212/"},{"content":"要把任何情況都當成上帝賜予的挑戰，或當成在洗業障，就算失去了什麼，也會得到其他的，事情總是如此。","date":"清海無上師以英文講於歐洲國際聚會黃金10年7月29日（2013）","url":""},{"content":"你都必須知道，世上任何東西，我們虧欠很多，所以要盡量行善，對世界和周遭的人，無論同修或非同修，都要心懷感恩。","date":"清海無上師以英文講於歐洲國際聚會黃金10年7月29日（2013）","url":""},{"content":"別執著在世界上那些小小的誘惑，還有那一丁點生活上的舒適，而錯過了提昇靈性到更高境界的機會。","date":"清海無上師以英文講於歐洲國際聚會黃金10年7月29日（2013）","url":""},{"content":"你們時時要知道，自己是無名小卒，哪裡都可以住，什麼工作都能做，我們要多修行，多多檢查自己，別總是刻意逃離困難，或困難的工作、情況…..","date":"清海無上師以英文講於歐洲國際聚會黃金10年7月29日（2013）","url":""},{"content":"等什麼時候那個惡心斷掉了才能夠有體驗，我們身口意應該乾淨才有體驗。印心是師父的本分，不過你們身口意乾淨是你們的本分。師父不能替你們每天長大，應該自己洗自己。","date":"清海無上師以中文講於福爾摩沙嘉義19880612   00376呼風喚雨的神通  CD-MP3-CG01","url":"http://edenrules.com/index.php?route=product/product&path=60&product_id=1251"},{"content":"假如我們相信上帝，事事終將圓滿收場，事事都對我們好，假如有不好的事，那是因為我們前世的業障。","date":"清海無上師以悠樂文講於歐洲國際聚會2013年8月5日（黃金10年）考驗鍛鍊我們更加堅忍與謙卑","url":"https://www.youtube.com/watch?v=lUKvUYmZSpo&feature=youtu.be&list=PLreW_cIMOF7dpn-ik-m8J89RuF3Vii-PO"},{"content":"多數問題只是來自頭腦的運作，要是我們多打坐，就不需要問一堆問題。只要求上帝和天堂，幫助你進步，並一切順利，隨順天堂的安排。","date":"清海無上師以英文講於歐洲國際聚會黃金10年7月30日（2013）","url":"https://www.youtube.com/watch?v=aEQ2dh9QDcU&index=16&list=PLreW_cIMOF7dpn-ik-m8J89RuF3Vii-PO"},{"content":"如果我們了解生命，及因果報應的法律，那麼就會接受一切，不會抱怨任何政府。受苦或不受苦，都是我們頭腦想的而已……","date":"清海無上師以悠樂文講於歐洲國際聚會2013年8月5日（黃金10年）考驗鍛鍊我們更加堅忍與謙卑","url":"https://www.youtube.com/watch?v=lUKvUYmZSpo&feature=youtu.be&list=PLreW_cIMOF7dpn-ik-m8J89RuF3Vii-PO"},{"content":"不論你做了什麼慈善，都必須是發自內心單純的愛，好嗎?必須像是同情有迫切需要的人，想想看那是你自己，設想那是你自己，有可能是你…..","date":"清海無上師以英文講於歐洲國際聚會2015/9/20 (名為銅牙的男人)","url":"https://youtu.be/dhwR3sxwC1M?list=PLpJLaN6_bnEECoPKWa4J-ngydLcthK4qe&t=1547"},{"content":"有任何痛苦，試著忍耐好嗎?要視它為挑戰，好訓練我們的個性，變得更有耐心，更加謙卑。","date":"清海無上師以悠樂文講於歐洲國際聚會2013年8月5日（黃金10年）考驗鍛鍊我們更加堅忍與謙卑","url":"https://www.youtube.com/watch?v=lUKvUYmZSpo&feature=youtu.be&list=PLreW_cIMOF7dpn-ik-m8J89RuF3Vii-PO"},{"content":"我們仍然得繼續打坐，分享一些好的能量，以平衡這星球上的否定力量，也必須這麼做，我們對他人才會有好的影響，然後傳播消息，讓他們也可以像你們一樣覺醒。","date":"清海無上師以英文講於歐洲國際聚會2013年8月12日永遠記得你與神聖的連結 1/3","url":""},{"content":"當你布施時，你不認為你在布施，因為佛陀說你不該分別自己和他人的自性，……...當你以施捨的想法布施，我給他東西，這不是完美的布施，不是布施波羅蜜。布施波羅蜜意指你布施但就像布施給自己，就像你渴時喝水，餓時吃飯一樣，你給自己東西吃時，沒什麼大不了的。","date":"清海無上師以英文講於法國20081229(DVD871)","url":"http://www.edenrules.com/index.php?route=product/product&product_id=145"},{"content":"要變成更好的人永遠不嫌遲，不只是要改變，還要做相反的，才能彌補你之前對別人尤其是對自己所造成的傷害。任何你對別人造成的傷害，都會先傷害到自己。永遠都是這樣。所以每個宗教都告訴人們: \"愛人如己\"。因為別人就是你自己，任何你對別人所做的，都會加倍回到你身上。所以\"己所不欲，勿施於人。\"","date":"清海無上師以英文講於歐洲國際聚會2015/9/20 (名為銅牙的男人)","url":"https://youtu.be/dhwR3sxwC1M?list=PLpJLaN6_bnEECoPKWa4J-ngydLcthK4qe&t=2204"},{"content":"我們對眾生付出越多仁慈愛心與保護，我們在世上就越偉大，\n我們內心會感覺更提昇，同時在天堂的等級也會越高。","date":"清海無上師以英文講於美國華盛頓特區視訊會議 2009.11.08","url":"http://www.godsdirectcontact.org.tw/ch/news/207/ap_82.htm"},{"content":"我們做什麼都是自然去做，因為我們感受到別人的痛苦，我們感覺到別人的需求，所以我們布施，就像我們需要東西時，我們給自己一樣。","date":"清海無上師以英文講於法國20081229(DVD871)","url":"http://www.edenrules.com/index.php?route=product/product&product_id=145"},{"content":"我們的生活應該要幫助其他人認識天國、認識那個長養我們的生命、長養整個宇宙的偉大聖靈，了解到如果沒有祂，我們只不過是一個沒有用的空殼而已。","date":"清海無上師以英文講於美國德州休士頓\n1993.11.13（影帶編號#393）","url":"http://www.godsdirectcontact.org.tw/ch/news/174/mt_2.htm"},{"content":"因果就是屬於魔的世界，佛菩薩來的話，魔也不敢看他們，何況講甚麼因果的東西。所以我們可以選擇，我們跟因果走?或是我們跟慈悲愛力走?跟慈悲愛力走的話，我們不怕任何東西，我們很乾淨，我們不會有因果。","date":"清海無上師以中文開示於福爾摩沙台南1988.04.22","url":"https://www.facebook.com/S.M.aphorisms/videos/979926295447593/"},{"content":"我們不知道業障什麼時候會來，它總是在你毫無防備的情況下，突然降臨。所以必須隨時照顧好自己的身、口、意，不忘記與內在萬能的力量溝通，提昇自己的等級，當業障來臨時，我們才有足夠的智慧、力量去克服。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/33/d-1.htm"},{"content":"我們以感恩加持世界，所有天堂會加持你更多。","date":"清海無上師以英文講於歐洲國際聚會2013年8月12日  永遠記得你與神聖的連結 2/3","url":""},{"content":"所以無論何時你吃什麼東西，都要感謝樹木或植物，給予你物質的享受以及能量，當你還不夠高等可以吸取宇宙能量已取代之，你要感謝他們，並為他們的犧牲道歉，這樣至少他們會開心。即使他們犧牲了自己，他們知道你很感恩。","date":"清海無上師以英文講於歐洲國際聚會2013年8月12日  永遠記得你與神聖的連結 2/3","url":""},{"content":"不管你做什麼，試著記得所有眾生之間的連結，記得你和天堂以及造化之間的連結。不只是為了他們開心才感謝他們，這也是為了讓你永遠牢記你處於整個宇宙的加持中，並記得你與神聖的連結….","date":"清海無上師以英文講於歐洲國際聚會2013年8月12日  永遠記得你與神聖的連結 2/3","url":""},{"content":"你們必須打坐，這是生命中最重要的事，比其他任何事情都重要，否則修不成。你們坐在那裡一、兩個小時，聽聽內在或外在的聲音（師父開玩笑）--要看你們睡得多熟而定，然後認為這樣就夠了。但其實是不夠的！所以即使我把你們提昇到第五界，你們也會很快掉下來，幾乎比你們上去還快。我們必須一心一意、心無旁鶩，才能很快修到第五界；如果心猿意馬，就會掉得很快。","date":"清海無上師以英、法文講於法國巴黎 2006.10.22","url":"http://www.godsdirectcontact.org.tw/ch/news/179/ms_34.htm"},{"content":"在這世界上，不論我們的任務是什麼，最重要的是要愛別人、彼此相愛；如果沒有這樣做，我們就會缺少很多東西。而不論從事什麼工作，我們也都必須全心全意去做 。同時，也要盡己所能幫助我們的同胞，使他們快樂，讓他們感到被疼愛。任何時候，只要情況需要，我們都要發揮愛心，並付諸行動，身、口、意。隨時都要有愛心、善意，這樣對我們的靈性成長、對我們的同胞都是最好的。","date":"清海無上師以英文講於泰國共修會1994.9.10","url":"師父開示"},{"content":"每個人都是佛菩薩，有可能他們還不了解自己是佛菩薩；但我們還是要尊重他們，對待他們就像對待自己一樣；嚴格不過包容，疼愛不過不執著。\nEveryone is Buddha. It is possible that they may not realize it. We should still respect them and treat them like ourselves. Be strict with tolerance and be loving with detachment.","date":"","url":"(News No.)18期"},{"content":"不是靜靜坐在那邊就好了，心也要乾淨、善良、真正的專心，才可以算「打坐」；不然就是「打錯」。","date":"","url":"(News No.)18期"},{"content":"隨時要默念聖號，盡你可能多打坐，並且幫助他人，幫助需要的人，我能說的就這些。","date":"清海無上師以悠樂文講於歐洲國際聚會2013年8月6日（黃金10年）要看肯定的地方 1/2","url":"https://www.youtube.com/watch?list=PLreW_cIMOF7dpn-ik-m8J89RuF3Vii-PO&v=czT7OoACiro"},{"content":"我們只是盡力做事，任何對別人好的人，我們真的感謝他們，也為他們祈禱。好，如果你負擔得起，就多收養幾個孤兒，或一些人，老年人之類的，做些事情。","date":"清海無上師以英文講於歐洲國際聚會2015/9/20 (名為銅牙的男人)","url":"https://youtu.be/dhwR3sxwC1M?list=PLpJLaN6_bnEECoPKWa4J-ngydLcthK4qe&t=1133"},{"content":"我們平常注意力都放在外面，放在不該放的地方，讓自己煩惱、痛苦，明師就是教我們把注意力放在比較有用的地方，對我們靈魂才有幫助，才能夠長養內邊的力量，然後我們回來我們原本的地方，最後就會了解我們不是這個身體，不是那些無聊的、無常的念頭，我們本來就是智慧、愛力，我們很自在。","date":"清海無上師以中文講於福爾摩沙高雄小港機場 1993.1.3","url":"http://www.godsdirectcontact.org.tw/ch/news/130/pw.htm"},{"content":"不論你在哪個天堂，我都會在那裏，你都會看到我，沒問題，甚至比這裡好，但你必須先上天堂，要確定你自己能上天堂。","date":"清海無上師以英文講於歐洲國際聚會2015/9/20 (名為銅牙的男人)","url":"https://youtu.be/dhwR3sxwC1M?list=PLpJLaN6_bnEECoPKWa4J-ngydLcthK4qe&t=1530"},{"content":"任何人責怪我們，我們應該馬上檢討自己，如果覺得自己的目的很單純，就知道沒事，那個時候我們就安心了；如果發現自己有什麼不好的地方，就要自我檢討，不是每次都怪別人。任何人罵我們，如果罵對的話，他們都可以當我們老師；如果罵不對，我們就把它當業障就好了（大眾笑）。","date":"清海無上師以中文講於福爾摩沙屏東來義道場 \n1993.01.03（影帶編號＃305）","url":"http://www.godsdirectcontact.org.tw/ch/news/142/mt.htm"},{"content":"修行的人就是為了要解脫，解脫自己的慾望、自己的名利心、自己那種競爭的心態，現在不解脫的話，要等到什麼時候才解脫呢？","date":"清海無上師以中文講於福爾摩沙屏東來義道場 \n1993.01.03（影帶編號＃305）","url":"http://www.godsdirectcontact.org.tw/ch/news/142/mt.htm"},{"content":"很多人有的時候替師父工作，會遭到很多困難，考驗比較多，雖然這樣我們還是應該忍受下去，等我們往生上去的時候，果位才會高，平常人家罵我們時，我們也會變得更光亮，何況是自己的師父罵？我們會變得很亮很亮，果位很高，因為這個娑婆世界是顛倒的世界，人家愈讚歎，我們愈黑，人家愈罵我們，愈誤會愈 誹謗我們，我們會愈光亮，不過卻沒有人知道這個道理。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/07/"},{"content":"不管你做什麼，都代表至高無上，因為我們追隨至上之路，只崇拜至高上帝，所以身口意都要代表衪，至少言行舉止要像。雖然別人不知道你在想什麼，但是你的言行別人看得一清二楚。","date":"清海無上師以英文講於美國紐約共修會\n1994.6.20","url":"http://www.godsdirectcontact.org.tw/ch/news/72/l-1.htm#SEC2"},{"content":"如果你做任何事尚未完美無瑕，那就該知道你的愛心還沒完全發展，還沒完全使用你內在愛的力量，那正是衡量我們修行是否進步的方法。","date":"清海無上師以英文講於美國紐約共修會\n1994.6.20","url":"http://www.godsdirectcontact.org.tw/ch/news/72/l-1.htm#SEC2"},{"content":"你可能不知道-用開悟的力量出三界","date":"清海無上師以中文講於福爾摩沙台北萬華\n(未經刪改的原版)1986.9.1","url":"http://www.godsdirectcontact.org.tw/ch/news/66/f-1.htm"},{"content":"如果我們滿懷怒氣地衝到惹你生氣的人那裡，我們就會忘了自己的真我，我們將自己所有的能量投射給那個人，我們修行的人有很好的能量，如果你把這些能量都給那個人，即使是充滿怨恨，你也會喪失一切，你的口袋就會空空。","date":"清海無上師以英文講於福爾摩沙西湖道場1995.12.25","url":"http://magazine.godsdirectcontact.net/chinese_t/55/a-1.htm"},{"content":"只要我們憎恨鄰居，我們將會失掉一些開悟，只要我們想某人不好，我們就喪失部分的真我，我們會失去一些光，失去一些原本屬於我們的天堂的快樂。","date":"清海無上師以英文講於福爾摩沙西湖道場1995.12.25","url":"http://magazine.godsdirectcontact.net/chinese_t/55/a-1.htm"},{"content":"如果把憤怒丟給別人，那也是我們的資產，我們所有的注意力、能量也丟給了別人，整天或者整個月打坐的能量都用完了，口袋也就空了，然後你就必須從頭開始學起，會跟師父哭訴：「喔！師父幫幫忙，我什麼也沒看見，一片漆黑。」或是你可能聽不到聲音，變成心靈上的聾子或瞎子。","date":"清海無上師以英文講於福爾摩沙西湖道場1995.12.25","url":"http://magazine.godsdirectcontact.net/chinese_t/55/a-1.htm"},{"content":"如果我們還不能感覺到別人的痛苦，還不能了解別人的心情，我們離道還很遠。","date":"清海無上師以中文講於福爾摩沙西湖19881106 (音帶CG5)","url":""},{"content":"同樣地，有些事你根本不想做，但為了利益他人，而應該去做的事，請設法去做。","date":"清海無上師以英文講於歐洲國際聚會黃金10年7月29日（2013）","url":"https://www.youtube.com/watch?v=PZKHV4wuiBU&feature=youtu.be&list=PLreW_cIMOF7dpn-ik-m8J89RuF3Vii-PO&t=1190"},{"content":"…所以別把靈性點數拿去交換些許世上的舒適，你在地球上的生命，你的每次呼吸，每一天每一年，都十分珍貴，要善加利用，等你提昇上去便能笑說 在靈修上我已盡了全力，我能夠到達這裡，全是我努力來的。","date":"清海無上師以英文講於歐洲國際聚會黃金10年7月29日（2013）","url":"https://www.youtube.com/watch?v=PZKHV4wuiBU&feature=youtu.be&list=PLreW_cIMOF7dpn-ik-m8J89RuF3Vii-PO&t=1190"},{"content":"若你持守五戒，天使就會保護你，要確保你食用的素食夠純淨，確保你打坐足夠，那麼任何情況，都會變得比較好處理，大事化小，小事化無。如果你持守戒律，吃乾淨的純素食物，又好好打坐，就自然而然會這樣。","date":"清海無上師以英文講於歐洲國際聚會黃金10年7月29日（2013）","url":"https://www.youtube.com/watch?v=PZKHV4wuiBU&feature=youtu.be&list=PLreW_cIMOF7dpn-ik-m8J89RuF3Vii-PO&t=1190"},{"content":"有時候，如果我們打坐不夠，或沒有持戒清楚，即使只差那麼一點，天堂也算得很清楚，","date":"清海無上師以英文講於歐洲國際聚會黃金10年7月29日（2013）","url":""},{"content":"對自己所擁有的要知足，我們打坐，自然一切就會沒事。","date":"清海無上師以英文講於歐洲國際聚會黃金10年7月31日（2014）","url":""},{"content":"別執著任何不再屬於你的東西，那從來就不是你的，在這個星球上沒什麼是你的。","date":"清海無上師以英文講於歐洲國際聚會黃金10年7月29日（2013）","url":""},{"content":"每次，當你全心全意、專心一意，那就是打坐；師父只注意內在的力量、同情心、愛和上帝慈悲的品質，這就是師父的打坐方式。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/63/e-0.htm"},{"content":"不僅要做好人，還要做好事，侍奉眾生，讓他人也能向善。不是光坐那兒等，一直祈求師父的加持。","date":"清海無上師以英文講於歐洲國際聚會黃金10年7月29日（2013）","url":""},{"content":"首先必須訓練自己，做個好人又有才幹，那麼或許有一天，我們能夠幫助他人。","date":"清海無上師以英文講於歐洲國際聚會黃金10年7月29日（2013）","url":""},{"content":"我們之所以不認識上帝的恩寵，感受不到上帝的愛，是因為我們把注意力放錯地方了。","date":"清海無上師以英文講於斯洛維尼亞19990526(祈求世界和平)","url":"和平之道 P159"},{"content":"我們的思想其實非常重要，我們應該照顧自己的思想，永遠想好的，因為思想就是宇宙造化萬物的材料。如果意念太強烈，就會馬上實現，變化成物質出來；如果不夠強烈，則一段時間後也會實現。","date":"清海無上師以英文講於泰國共修會 1994.09.11（影帶編號#445）","url":"http://www.godsdirectcontact.org.tw/ch/news/162/pw4.htm"},{"content":"世間沒有人對我們是好朋友，只有師父是最好的朋友，你們要了解。他無條件幫忙，我們弄錯在哪個地方他馬上講，讓我們改正，他不是在那裏讚嘆我們的業障，…","date":"清海無上師以中文講於福爾摩沙嘉義19880612   00376呼風喚雨的神通  CD-MP3-CG01","url":"http://edenrules.com/index.php?route=product/product&path=60&product_id=1251"},{"content":"身體健康沒有病，還可以聽到道理，還懂道德，還可以打坐，那個是最好的福報。打坐的時候即使沒看到境界，不過聽到聲音，已經是最好的福報。感覺到很自在，越來越輕鬆，那個也是很有福報。","date":"清海無上師以中文講於福爾摩沙嘉義19880612   00376呼風喚雨的神通  CD-MP3-CG01","url":"http://edenrules.com/index.php?route=product/product&path=60&product_id=1251"},{"content":"業障很重，要洗乾淨才能看到師父，不是師父不喜歡看你們，每天看你們，你們都看不到，掛好厚的牆壁在前面。","date":"清海無上師以中文講於福爾摩沙嘉義19880612   00376呼風喚雨的神通  CD-MP3-CG01","url":"http://edenrules.com/index.php?route=product/product&path=60&product_id=1251"},{"content":"有災難的時候表示說洗我們的業障乾淨，不論是什麼人的錯，不論人家罵我們是他錯，他碰我們是他錯還是我們錯，我們還是洗業障乾淨。…","date":"清海無上師以中文講於福爾摩沙嘉義19880612   00376呼風喚雨的神通  CD-MP3-CG01","url":"http://edenrules.com/index.php?route=product/product&path=60&product_id=1251"},{"content":"假如我們碰到明師，我們沒有跟他學，超過7億年才能夠再碰到他一次。","date":"清海無上師以中文講於福爾摩沙台中19880609   00374 如何把握福報避免業障","url":"http://edenrules.com/index.php?route=product/product&path=60&product_id=1183"},{"content":"愛敵人不簡單，為什麼呢?因為我們愛力有限，很對不起!為什麼我們愛力有限呢?因為我們跟那個大愛力現在沒溝通，所以修觀音法門的人啦~跟這個大愛力溝通以後，他就真正會多愛人。所以不能愛人的那些人，也不是他們的錯，但是很可憐就是啦。就跟這個大愛力沒溝通，跟他自己的大愛力不溝通。","date":"清海無上師以中文講於福爾摩沙台中19880609   00374 如何把握福報避免業障","url":"http://edenrules.com/index.php?route=product/product&path=60&product_id=1183"},{"content":"多修行以後，做什麼事都會自然好;不修行，即使我們刻意想做好，反而會破壞。","date":"清海無上師以中文講於福爾摩沙西湖 19910714超因果業障的祕法(中即6)","url":""},{"content":"每天把精神都集中在那個大智慧裡面，我們什麼情況都能突破，任何業障都會留在後面，或是留在下面。所以修行才有利益，靠自己是這個意思。","date":"清海無上師以中文講於福爾摩沙西湖 19910714超因果業障的祕法(中即6 P27)","url":""},{"content":"有正確的概念做什麼都正確，沒有正確的概念，做好事也是著魔的。","date":"清海無上師以中文講於福爾摩沙西湖 19910714超因果業障的祕法(中即6 P35)","url":""},{"content":"我們都是從天上下來的偉大眾生；我們來這裡之前都曾懷有高雅的理想，最好的動機和善意，以及強烈的決心想要幫助這個世界的人類，並且提昇自己的靈性等級。","date":"清海無上師於泰國1994.9.10共修會開示","url":""},{"content":"我們要拿到佛菩薩福報，我們也應該自己身口意單純乾淨，跟佛菩薩溝通才能夠拿的到。","date":"清海無上師以中文講於福爾摩沙台中19880609   00374 如何把握福報避免業障","url":"http://edenrules.com/index.php?route=product/product&path=60&product_id=1183"},{"content":"思想是很重要的，我們想高雅思想的時候，宇宙都佩服我們、寵愛我們、侍候我們，都等著我們光臨他們的地方。如果我們思想比較不高雅、不光榮，不像佛菩薩那麼大方的話，那我們就變成普通的眾生，一切唯心造是這樣！有時候你們認為一個念頭而已，不怎麼很重要，不！它是很重要的。因為我們人，身口意會黏在一起，如果我們裡面沒有發出一種清淨善良的修行、尊重的氣氛，就我們行為會表達出來。","date":"清海無上師以中文講於福爾摩沙西湖道場 1991年9月29日","url":"http://www.godsdirectcontact.org.tw/ch/news/56/b-6.htm"},{"content":"有時候我們和別人接觸，對方不好的念頭和業障會影響我們，或是我們不小心吃到不乾淨的東西也會影響我們。而不管是什麼事情影響我們，都要多打坐。","date":"清海無上師以英文講於福爾摩沙國際禪七1995.10.28","url":""},{"content":"我們不是這個身體，\n不是自己所認為的這個「人」，\n我們是智慧和愛力， 我們是極為神聖的品質。","date":"清海無上師以英文講於香港 1993.5.28","url":"http://www.godsdirectcontact.org.tw/ch/news/111/ap1-c.htm"},{"content":"我們不是這個身體，\n不是自己所認為的這個「人」，\n我們是智慧和愛力， 我們是極為神聖的品質。","date":"清海無上師以中文講於福爾摩沙高雄 1988.10.19 /   MP300446-9:12","url":"http://classic.godsdirectcontact.org.tw/ch/news/115/index.htm"},{"content":"如果我們太執著，以為我們成佛啦，就我們會被魔來抓，我們會著魔。","date":"清海無上師以中文講於福爾摩沙台北19870610 楞嚴經卷 - 十種色陰魔","url":"http://edenrules.com/index.php?route=product/product&path=60&product_id=1365"},{"content":"愛師父是做對你自己好的事，不是執著於我的肉身或我在不在，然後卻不照我的話做。我要你們展現愛心，不是光說而已，你們已經知道師父的力量會照顧你們，但你們也必須照顧自己。","date":"清海無上師以英文講於歐洲20081224","url":"DVD887上帝照顧一切44:07"},{"content":"所以別怕業障，就怕自己沒有定力，沒有想修行。業障不怎麼啦，可以洗。修觀音法門，任何業障都可以洗掉，這個師父保證。43:30..","date":"清海無上師以中文講於福爾摩沙西湖19910714，MP3下載:00992明師難為","url":""},{"content":"要做偉大的事情，不能這樣子想法，\n不能想跟普通人一樣，不能講話跟普通人一樣，…...\n我們能力要越來越偉大才可以。","date":"","url":""},{"content":"我們布施時要親切和藹，我們給別人的，不只是物質東西，我們也要懷有愛心，以及很自然的同情心來布施，就如同我們給自己，如此而已。","date":"清海無上師以英文講於法國20081229(DVD871)","url":"http://www.edenrules.com/index.php?route=product/product&product_id=145"},{"content":"布施，不過不布施，才是真正的布施。","date":"MP300446-10:10","url":"http://edenrules.com/index.php?route=product/product&product_id=203"},{"content":"我告訴你們的都是真理，任何我允諾的事，也一定做到。","date":"清海無上師以英文講於美國科羅拉多19930411","url":""},{"content":"我們修行的團體成員分別來自不同的國家和宗教信仰，大家一起工作卻很和諧融洽，儘管初次見面，彼此卻好像已經熟識了幾千年一樣。為什麼呢?因為我們內邊說相同的語言，它使我們在高等的意識中彼此了解。","date":"清海無上師以英文講於保加利亞19990518(讓生充滿愛力與奇蹟)","url":"P125"},{"content":"真正的快樂並非來自世俗的崇高地位、書本的知識、社會地位或財產多寡。真正的快樂唯有從自我了悟與開悟中獲得。","date":"清海無上師以英文講於美國洛杉磯 1993.4.3","url":"甘露法語"},{"content":"事實上所有的加持都來自我們自己，明師和我們同一體，只有在二分法的世界才有所謂的師父和徒弟，以及不同類別的人。一旦超越二分法境界，我們看事情只有榮耀、和平和愛，萬物同一體。因為我們都來自相同源頭，那時我們沒有我和你的分別，即使看起來仍有我和你……","date":"清海無上師以英文講於美國科羅拉多19930411","url":"http://magazine.godsdirectcontact.net/chinese_t/51/"},{"content":"為上帝工作是一種純然的喜樂，可以讓我們的身心靈獲得提昇，甚至病痛會痊癒、沮喪的心情也會煙消雲散，我們的智慧會開展，心胸會開闊、愛力會增強，我們的聰明才智也會開啟，知道如何處理困難的情況。當我們打坐越多、越往內靜觀上帝時，我們就越脫胎換骨，成為天使、聖人，或無憂無慮的靈魂。","date":"清海無上師以英文講於瑞典斯德哥爾摩19990531","url":"http://www.godsdirectcontact.org.tw/ch/news/150/mt1.htm"},{"content":"閉關的目的，是為了要了解只要和內在自性在一起，到哪裡都會快樂。","date":"清海無上師以英文講於福爾摩沙三地門19921226（BMD473天堂就在聖人裡面）","url":""},{"content":"當我們打坐越多、越往內靜觀上帝時，我們就越脫胎換骨，成為天使、聖人，或無憂無慮的靈魂。","date":"清海無上師以英文講於瑞典斯德哥爾摩19990531","url":"http://www.godsdirectcontact.org.tw/ch/news/150/mt1.htm"},{"content":"大家修了觀音法門以後，會變得越來越漂亮，這是很自然的，因為我們想成為上帝，而上帝是完美無缺的，所以我們就會越來越接近上帝和天使的品質。","date":"清海無上師以英文講於柬埔寨Raising Center 1996.7.23","url":"為生命上彩P252"},{"content":"並不是開悟以後就什麼都不用做，那就變成無用佛了！我要提醒你們，越開悟工作就越多，開悟的目的就是要幫助弱小、幫助需要你的人。","date":"～清海無上師（原文為英文）","url":"http://magazine.godsdirectcontact.net/chinese_t/94/k-0.htm"},{"content":"一切的痛苦不是來自外在的情況，而是源自我們自己的態度。","date":"清海無上師(原文為英文)","url":"http://www.godsdirectcontact.org.tw/ch/news/47/g-0.htm"},{"content":"任何一位明師在世時，都要替當時的人擔一些業障，特別是相信他的人或他的徒弟，明師必須替他們處裡業障，因此這些明師才要為徒弟和人類受苦。","date":"清海無上師以英文講於美國哈佛大學19910224","url":"https://www.youtube.com/watch?v=ZypTqgbQOc0&feature=youtu.be"},{"content":"我們必須只為了智慧而修行，為了認識我們自己，為了認識我們原本的家，為了得到解脫、愛心和快樂，別無所求。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/49/"},{"content":"試著過個最充實的人生，不要虛度生命，做你們想做的事，試著學習新事物，要外向、社交些，要友善，用愛心對待所有人，並互相學習每一件事。不要坐在那兒自憐並感到不幸，人生並沒有這麼不幸。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/49/"},{"content":"只要你們能真正相信你們自己的美意、相信自己所做的事，你們就能影響其他人；所以即使有一個人而已也能產生大變化。如果你們不相信，別人就會影響你；試著做個個性堅強的人。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/49/"},{"content":"無論是走路、睡覺、談話、坐著、躺著時，都要把注意力集中在智慧中心，那樣的話你們修行會更快進步，那時你們自己會感受得到；而你越進步，你就會越受到鼓舞，從而會更努力地修行。","date":"清海無上師以英文講於福爾摩沙西湖共修會1995.6.5","url":"http://www.godsdirectcontact.org.tw/ch/news/47/b-1.htm"},{"content":"我不鼓勵人放下世界跑去森林隱居等等，只不過那真的有好處。因為我知道對你們所有人來說，那很難做到。我不能老是鼓勵那些你們不可能做到的事，幾乎是不可能的事。你們盡力而為就好，師父力量會永遠幫助你們，等到你們往生的那一刻，你們的功德會倍增，就能夠去很高的境界，當下你們難免會有一點掙扎，即使師父加持你，你也看不到、聽不到，因為你們的注意力太過渙散，你們的心思渙散，但只要你誠心，師父永遠不會離開你。師父都知道，也會大力幫忙，加倍地幫忙。有誠心也很重要，在這個世界，有誰能夠坐下來就馬上專心打坐呢?有一大堆事情要做，貓、狗、丈夫、太太、小孩都需要你們照顧，他們分走你的注意力。所以佛陀總是鼓勵人出家，但是一定要有誠心，不是為了過輕鬆的日子才進入僧團，也不是為了想體驗出家生活是什麼樣子或是為了受人尊重才來，這樣就沒有用，那會比在家人還糟糕。出家並不表示你就會變得更好或修行更好，那也要看你個性、誠心而定。","date":"清海無上師以英文講於法國20150801","url":"https://youtu.be/L8q95qHuxNk?list=PLpJLaN6_bnEECoPKWa4J-ngydLcthK4qe&t=1351   (22:30)"},{"content":"沒什麼事情是真正難的，就看我們要不要改變自己，想不想坦白認識我們哪一個品質是真的好；哪一個品質是騙我們、對我們傷害的，自己要坦白，沒有人能告訴我們。即使我們自己知道，不過如果自己太固執；或是太懶得改；或是愛面子，然後自己不想改、不認錯，這樣才有很多麻煩","date":"清海無上師","url":"http://magazine.godsdirectcontact.net/chinese_t/41/m-1.htm"},{"content":"我們在哪一種情況中，都要找好的地方、看樂觀的一面，不要挖毛蟲。我們轉換不好的情況，變它成為對我們有利益的方面。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/41/m-1.htm"},{"content":"當我們把關愛、仁慈、寬容和體諒擴及於別人時，我們就創造了天堂。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/41/m-1.htm"},{"content":"自古以來，任何的大修行人，或是大君王、大丈夫，都是從耐心訓練出來的，他們不是一朝就功成名就。所以我們有困難的時候，要感激造化、佛祖給我們機會訓練自己的耐心。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/41/m-1.htm"},{"content":"愛情就像花草樹木一樣，需要每天灌溉………你們必須長養愛，要奉獻投入，每天都要注入新的活力，要重視彼此的價值和愛心關懷，幫助另一半發展對方內在最好的品質，這才是真正的婚姻、真正的伴侶關係。","date":"清海無上師以英文講於美國加州長堤國際禪五19961228","url":"為生命上彩P239"},{"content":"布施或對別人好時，不應該驕傲；我們可能會感到舒服，不過也應該感激能夠有機會布施行善。","date":"","url":""},{"content":"我們不要責怪小孩，因為我們大人有的時候也會弄錯，比如說，我們的衣服有可能不夠莊嚴、我們的人格不夠高雅，或是我們道德不夠深厚。我們要從家庭開始教育小孩，不是從學校開始，因為父母是小孩最大、最基本的老師，也是最重要的老師。","date":"清海無上師以中文講於福爾摩沙屏東19881201","url":"為生命上彩P270"},{"content":"光談論美德是不夠的，我們必須強迫自己一起集體付諸實踐，然後每天、每個禮拜不斷地鞏固增強這個美德良行，直到它變成我們的第二天性一般。","date":"清海無上師以英文講於福爾摩沙西湖 1995.11.3","url":"http://www.godsdirectcontact.org.tw/ch/news/126/ms1-1.htm"},{"content":"整個宇宙都會因我們所做的每一項善行，及我們對同胞所發出的愛心而感到歡喜雀躍。如果我們已被賦予足夠的裝備，有足夠的機會能幫助人類而不去做的話，那實在是非常令人惋惜的事。","date":"清海無上師以英文講於泰國共修會1994.9.10","url":"http://magazine.godsdirectcontact.net/chinese_t/41/"},{"content":"挑戰越大，我們靈性的領悟及成長也越大。","date":"清海無上師以英文講於泰國共修會1994.9.10","url":"http://magazine.godsdirectcontact.net/chinese_t/41/"},{"content":"我們越工作、幫助別人越多，我們越會長大。","date":"清海無上師以英文講於泰國共修會1994.9.10","url":"http://magazine.godsdirectcontact.net/chinese_t/41/"},{"content":"在這世界上，不論我們的任務是什麼，最重要的是要愛別人、彼此相愛。","date":"清海無上師以英文講於泰國共修會1994.9.10","url":"http://magazine.godsdirectcontact.net/chinese_t/41/"},{"content":"任何時候，只要情況需要，我們都要發揮愛心，並付諸行動，身、口、意。隨時都要有愛心、善意，這樣對我們的靈性成長、對我們的同胞都是最好的。","date":"清海無上師以英文講於泰國共修會1994.9.10","url":"http://magazine.godsdirectcontact.net/chinese_t/41/"},{"content":"布施或對別人好時，不應該驕傲；我們可能會感到舒服，不過也應該感激能夠有機會布施行善。","date":"清海無上師以英文講於泰國共修會1994.9.10","url":"http://www.godsdirectcontact.org.tw/ch/news/41/i-1.htm"},{"content":"我們大家多多少少都是囚犯啦！有的人被關在一個房子，有的人被關在心；不同在這裡而已。被關在房子裡面是最簡單、最有希望的；被關在心裡面，就不容易解開。假如說，我們因為犯錯被關在一個房子裡面一段時間，等時間到了我們就可以走。不過，我們被關在貪瞋癡、無明 ，或慾望的心裡面，就不容易、也不曉得什麼時候可以解開，也許死的時候還解不開！","date":"福爾摩沙宜蘭監獄講經一九八九年三月二十一日","url":"http://magazine.godsdirectcontact.net/chinese_t/41/"},{"content":"我們盡量做好自己的責任、本分，是為了讓自己良心安穩;萬一發生任何事情，我們就不會良心不安，可以坦然面對自己的良心，因為我們知道自己責任都有負好，該做的都做了。","date":"清海無上師以中文講於福爾摩沙西湖19960121","url":"為生命上彩P255"},{"content":"你們都是光造成的，整個身體都是由光聚集起來，一旦你了解到這一點，你就解脫了！","date":"清海無上師以英文講於福爾摩沙西湖道場1995.10.28","url":"http://www.godsdirectcontact.org.tw/ch/news/88/h-1.htm"},{"content":"無論做什麼都要考慮到對方，這樣才能了解對方的立場而感同身受。所以，不用問我你有多開悟、你是哪個等級的聖人，檢查一下自己就知道了，看看自己如何與他人應對、如何對待他人、如何對待那些較不幸的動物，這樣你就知道自己的等級在哪裡，不用來問我！","date":"清海無上師以英文講於英國舍瑞 2006.01.08","url":"http://www.godsdirectcontact.org.tw/ch/news/170/mt1.htm"},{"content":"如果我們還怕鬼的話，表示說我們對上帝、對佛還沒有足夠信心，我們的信心還太少。所以，鬼只能夠恐嚇那些比較軟弱的人；有修行的人意志力比較強，鬼就會怕他們。","date":"清海無上師以中文講於福爾摩沙西湖 1995.1.8（影帶編號＃466）","url":"http://www.godsdirectcontact.org.tw/ch/news/138/index2.htm"},{"content":"有時候，我們可以變壞的情況成好的情況，像塞翁失馬焉知非福一樣。所以任何情況，都有好處的地方，我們只要有一點樂觀的心，我們就可以看到。","date":"清海無上師以中文講於福爾摩沙花蓮19890727","url":"http://magazine.godsdirectcontact.net/chinese_t/41/q-1.htm"},{"content":"把心思集中在較高的意識層次，別太在乎世俗的事情，這樣才能讓這裡的氣氛總是能利益每位來打坐的人。","date":"清海無上師 以英文講於歐洲  20130705(DVD1016一心想念上帝與開悟)","url":"DVD1016 一心想念上帝與開悟1:19:53"},{"content":"你越往上提昇，利益就越多，以後會覺得更堅強，甚至回家後，在處理那些世俗的問題時，…","date":"清海無上師以英文講於歐洲20130705","url":"DVD1016 一心想念上帝與開悟30:15"},{"content":"你的愛心、信心和神聖的生活方式，會幫助你克服萬難。不一定要靠我，但師父的力量，時時都在幫助自力自助的人。只要過正當的生活，思想正確、行事合乎正道，那麼一生都會走在正途上。考驗和磨難雖多，只要確立目標、持戒，生活就會更順利。","date":"清海無上師以英文講於歐洲 國際聚會 20130718","url":"詳細介紹"},{"content":"不論面對何種情況，順其自然就好，如果你無法控制自己的情緒，或無法完全控制住，至少試著不要含恨在心。有什麼感受，盡可能用最好的方式和態度表達出來，如果一直忍氣吞聲，憋久了身體會悶出病來。當然，最好的方法是我們先擁有上帝的品質，然後貪、瞋、癡等等情緒就會逐漸減弱。","date":"清海無上師以英文講於美國科羅拉多丹佛市19930410(VHS350開悟才能解答一切)","url":"http://edenrules.com/index.php?route=product/product&product_id=335"},{"content":"如果我們過簡單的生活，就比較容易幫助他人也幫助自己，同時我們從靈性修行中得到保障，所以我們很少會害怕。（原文為英文)","date":"","url":"http://www.godsdirectcontact.com/aphorisms/aph_c.htm"},{"content":"我們越投入物質的活動中，就越容易失去自己，也越不了解真正的自我。","date":"清海無上師以英文講於美國加州舊金山19890525 (「道」與「音」)","url":"帶我回家P109"},{"content":"我們應花時間來認識上帝，而不是講一些沒用的話題。","date":"清海無上師以英文講於美國加州舊金山19890525 (「道」與「音」)","url":"帶我回家P123"},{"content":"進步不進步就看你的個性有沒有變改、你的思想有沒有開朗，看你的度量有沒有擴展，那個就是真正實際的進步、實際的境界。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/38/"},{"content":"只要你有誠心，並記得師父的教理，那就是最好的供養。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/38/"},{"content":"為了怕人家評斷你們，你們把氣吞下去，這不是愛心、不是柔和，不是為了那個人好，而是為了自己好！那叫自私，不是君子、不是好人。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/38/"},{"content":"自己不看自己，看明師有什麼用！要看自己黑暗的地方，那種懷疑、不對的地方；那種被我執蓋住的地方，然後才能夠看到自己內邊的明師！","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/38/"},{"content":"愛別人就是愛我們自己，我們實在是誇張了自己的榮耀，並非我們幫助了什麼人，我們是在幫助自己。要記住這點，當你做好事的時候，那就是蒼天的意願，這對你們有好處，你們應該做得更多、更有愛心、內邊不斷奮鬥、運用智慧，在群眾當中不必畏縮，要盡量記住更多你們下來之前對天父以及高等眾生所做的承諾，那是你們來這裡的目的。","date":"清海無上師以英文講於美國夏威夷19940906","url":"http://edenrules.com/index.php?route=product/product&product_id=1161"},{"content":"任何你想做的，你認為是高雅、偉大的理想，能利益其他人，而你也認為這是好的，那你必須努力去做，不管代價是什麼，直接去做，不要講太多。","date":"清海無上師以英文講於美國加州\n洛杉磯共修會 1996.3.13\n（影帶編號#536）","url":"http://www.godsdirectcontact.org.tw/ch/news/155/mt1.htm"},{"content":"上帝並非要我們以相同的方式愛每一個人，我們不必逼自己這樣做。愛他們是指任何時候，只要他們有需要，即使他們曾經傷害過我們，我們也義無反顧地立刻幫忙。愛他們的意思是我們對他們沒有怨恨、沒有壞念頭、不 詛咒他們，只希望他們好，為他們祈禱，為他們打坐。","date":"清海無上師以英文講於福爾摩沙西湖道場19951225","url":"http://magazine.godsdirectcontact.net/chinese_t/55/o-1.htm"},{"content":"如果我們的肯定力量很強，內邊的否定力量自然會減弱，另外，四周人所散發的否定力量，或別人想用來攻擊我們的否定力量，也對我們莫可奈何。所以我們才要修行，跟上帝同在，透過每天打坐，發展我們肯定的一面。","date":"清海無上師以英文講於美國加州 1994.03.09（影帶編號＃409）","url":"http://www.godsdirectcontact.org.tw/ch/news/141/qa2.htm"},{"content":"我們想佛菩薩的時候，我們加持力滿滿的衝過來給我們；我們想魔的時候，不管是同情他或是跟他同意，或是幫助他什麼地方，那個魔加持力會來。然後不管我們對他做好、做不好，他們那個品質、他們那種力量，會染到我們的身上，我們無形中就變他們的部下了。同性會相吸，從那天以後，我們會吸到很多不好的那種氣氛，我們修行愈來愈難過，有時候也想離開師父，想丟掉觀音法門。等我們後悔再回來的話，哎呀，又重新再爬，已經爬到一半山，那又掉下來嗎?要再爬的話，哎呀，比以前還要累，因為我們那個元氣已經消耗很多…","date":"清海無上師以中文講於福爾摩沙西湖19910901","url":"https://youtu.be/Is3S3Le-L14?t=5113"},{"content":"恩惠不是佛菩薩永久給我們的！給我們一次、兩次、三次，然後我們又拒絕、浪費、不珍惜的話，以後不再給！","date":"清海無上師以中文講於福爾摩沙西湖19910901","url":"https://www.youtube.com/watch?v=Is3S3Le-L14&feature=youtu.be&t=5114"},{"content":"要確實地檢討自己的心智是否健康，\n吃的習慣、思考習慣、想的東西、\n反應方式是不是有什麼極端，\n太多的頭腦運作，太多的知識體操，\n也會使人筋疲力盡，\n而不再有元氣來管開悟的事。","date":"清海無上師以英文講於福爾摩沙屏東三地門","url":"http://www.godsdirectcontact.org.tw/ch/news/50/index.htm"},{"content":"真正救我們的命是上帝，真正養我們長大的是上帝，真正疼愛我們的也是上帝，意思說那個最高的力量，也就是我們自己本來的智慧。","date":"","url":"http://www.godsdirectcontact.org.tw/ch/news/161/ms1.htm"},{"content":"任何工作都是一個讓我們學習、成長的工具而已，所以事實上我們沒做什麼工作，你們不要在那邊抱怨，認為自己太辛苦。那只是給我們學習的工具而已。上帝用這種方式來教育我們，使我們開悟，讓我們有機會發展自己的才華、修養自己的個性、美化自己的風度和培養細心的品質。任何工作都一樣，因為我們應該用那種方法才可以學到別的東西。","date":"清海無上師以中文講於福爾摩沙西湖共修會19920425","url":"輕鬆修行的秘訣P201"},{"content":"如果我們有一顆不求回報的心，真正用愛心來工作，那麼工作一定很順利。我們不管工作對自己是不是有利益、或是替誰工作，需要工作的時候就工作，任何需要我們工作的時刻，我們就配合工作，這樣我們將感覺到自己的靈性生活越來越進步、越能忍辱;越工作、越奉獻，我們越快進步，不需要誰來讚歎我們，自己也會知道。","date":"","url":"輕鬆修行的秘訣P203"},{"content":"你們最好不要崇拜我、不要跟隨我，只要學我的榜樣就好了。看看我的努力有什麼成果，崇拜那個成果，然後做一樣的事，不久你也可以成為明師。","date":"清海無上師以英文講於美國加州洛杉磯共修會19960313","url":"輕鬆修行的秘訣P206"},{"content":"我們修行的人，內邊會發出一種很美麗的那種氣氛，就給人家高興、很快樂、很喜歡靠近，他們不會看你那個外表，好像眼睛盲掉啦~盲目了看不到，就喜歡靠近，很喜歡很喜歡，越靠近越舒服這樣子，所以那個是修行的功德比那個外表還要重要。","date":"19920517以中文在福爾摩沙西湖開示(金剛公主)","url":"http://edenrules.com/index.php?route=product/product&product_id=766"},{"content":"跟很多人一起工作時，要很有忍耐心，堅持達持目標，克服週遭所有障礙與困難。","date":"","url":""},{"content":"我們的教導是不用語言的，如果你信心夠堅定，知道師父是真明師的話，我們連講話也不需要。","date":"1995年8月26, 德國漢堡市愛力奉獻的法門 (2/2)","url":"https://www.youtube.com/watch?v=P4hS8L_xK_I"},{"content":"我們如果無意中或是故意分給我們隔壁一點福報的話，也很好啊。我們修行如果不分享給人家的話，就有何用嘛?我們的世界都是這樣子染來染去，所以多數的人都差不多一樣的等級，……如果我們沒有很大的福報的話，即使我們上面是佛菩薩的果位，一下去還是被汙染、忘記。如果我們等級不真正的很高的話，會有危險，會被拉，會被拉下來，會被整個世界汙染。","date":"19920518以中文在福爾摩沙西湖開示(金剛公主)","url":"http://edenrules.com/index.php?route=product/product&product_id=766"},{"content":"只有裡面要堅持保護自己那個智慧，自己那個修行得到的果位才行，不然的話，一不小心就倒，所以我們修行都要時時都要記得，我們在這個世界像在那個戰場中央一樣，時時都要保護自己，要念五句、要念佛，要想我們修行的目標","date":"19920519以中文在福爾摩沙西湖開示(金剛公主)","url":"http://edenrules.com/index.php?route=product/product&product_id=766"},{"content":"更精進打坐、祈禱，先幫助你們自己，然後才能運用內邊的力量幫助世界。","date":"清海無上師以英文與美國加州洛杉磯視訊會議2011.04.27(DVD944)","url":"http://suprememastertv.com/tw/worldvegan/"},{"content":"別太把自己曝露在考驗之下比較好","date":"清海無上師以英文講於歐洲2013.07.08（DVD1019減少飲食有助打坐）","url":"http://suprememastertv.com/tw/2013-EU-Gathering/"},{"content":"你吃素越久的話，我是指純素、吃素，看到其他眾生就更能感受到他們的痛苦，所以不可能去吃他們，因為你感受到他們太多的痛苦，即使你記得那些美味，也不會想吃，因為你感受到雞、豬等無辜生命和無助動物的痛苦。","date":"清海無上師以英文講於歐洲2013.07.08（DVD1019減少飲食有助打坐）","url":"http://suprememastertv.com/tw/2013-EU-Gathering/"},{"content":"如果有人很自卑、沮喪，來求我們幫忙，\n我們應該幫助他，讓他變成很有精神、有理想、有自信的人，不會再對自己灰心、不用跳樓，這樣子是我們的神通，這個是「無畏布施」，跟觀世音菩薩一樣。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/56/"},{"content":"神通是我們每到一個地方，把那邊髒的氣氛弄乾淨，這樣子是神通。神通是用我們的手，把沒有用的東西變成花瓶，或是開墾一塊空地成富足的田，改變一塊乾燥的枯地成栽種果樹的園地，這樣子是我們的神通。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/56/"},{"content":"我們的意是天意，所以我們每一個人的念頭很重要，看我們要什麼，全宇宙都會配合。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/56/"},{"content":"我們應養成一種習慣，讓我們每天都想到好的事情；有戒律、有規矩，然後我們打坐的時候自然會想佛，跟祂們溝通。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/56/"},{"content":"時時要保持我們身口意乾淨，這樣會避免當來很多的麻煩和痛苦，因為過去的因果已經滿了，現在不要再吸不好的因緣來，讓我們更受苦。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/56/"},{"content":"打坐也是工作，那個時候是我們在準備精神，準備糧食、功力，可以明天再出去奮鬥。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/56/"},{"content":"修行要婉轉才是開悟的人，情況怎麼樣，我們就隨順怎麼樣，這樣才不會得「禪病」！","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/56/"},{"content":"要做什麼就做到成功，全心全意放在那裡才不會浪費時間。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/56/"},{"content":"修行要進步快，應該忘記自己，做一個最低的人，拿最髒、人家最不喜歡的工作做。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/56/"},{"content":"被人罵是被人讚歎！","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/56/"},{"content":"要成佛前應該先成人，成一個好的人以後成佛。","date":"","url":"http://magazine.godsdirectcontact.net/chinese_t/56/"},{"content":"當你快樂的時候，當然會吸引幸運快樂的能量到這個世界，而帶來更多的和平繁榮，也會為世界帶來更多有益而正面的事。","date":"清海無上師與無上師電視台\n工作人員的電話會議，\n美國加州洛杉磯\n黃金10年（2013年）6月16日\n（原文為英文）Video-1013","url":"https://news.godsdirectcontact.net/love-action-less-karma-spiritual-growth-ch/"},{"content":"一切都是為了愛，不同方式的愛，把愛付諸行動。 愛、仁慈、保護，愛心溫柔對待眾生，有如對待自己； 這樣做會讓你覺得舒坦，這就是把愛付諸行動！","date":"清海無上師與無上師電視台工作人員視訊會議，美國加州洛杉磯黃金11年（2014年）1月26日\n(原文為英文) (DVD & MP4-1048 (1.2.3))","url":"https://news.godsdirectcontact.net/love-action-less-karma-spiritual-growth-ch/"},{"content":"試著簡化生活，減少使用資源；你愈少用資源，就愈少業障。","date":"清海無上師講於歐洲國際聚會黃金9年（2012年）4月2日(原文為英文) (DVD & MP4-1004)","url":"https://news.godsdirectcontact.net/love-action-less-karma-spiritual-growth-ch/"},{"content":"推廣純素飲食和打坐， 對個人的提昇以及對這個世界都是有助益的。","date":"清海無上師與無上師電視台\n工作人員視訊會議，\n美國加州洛杉磯\n黃金9年（2012年）12月22日\n(原文為英文) (DVD & MP4-1011 (1.2))","url":"https://news.godsdirectcontact.net/love-action-less-karma-spiritual-growth-ch/"},{"content":"愛默生說：「如果我們讓上帝運轉宇宙，我們將會卸下肩上的重擔。」大部分人卻在運轉宇宙，我們煩惱這個、照顧那個，我們沒有信賴上帝的力量，所以事倍功半、疲累不堪。如果我們盡力而為，任由上帝安排結果，我們就不會感到如此受傷、失望和疲憊","date":"清海無上師以英文講於印尼泗水1997.3.19","url":"如何讓上帝安排一切"},{"content":"那些醜陋的東西，有的時候也是一種功課，有它的美，如果我們用比較開悟的眼睛看，任何東西都看得到它們的美。","date":"清海無上師以中文講於福爾摩沙西湖共修會19910409","url":"http://blog.xuite.net/ccymcw99/divinelove/109923442"},{"content":"我們應該竭盡所能，將對環境的傷害減至最低，因為這是我們的本分。我們應該這麼做，應該善待地球。","date":"清海無上師與無上師電視台\n工作人員視訊會議，\n美國加州洛杉磯\n黃金11年（2014年）1月26日\n（原文為英文）Video-1048","url":"https://news.godsdirectcontact.net/affect-happiness-benefits-world-protect-environment-kind-170597-ch/"},{"content":"你內邊永遠只有師父力量而已。","date":"1995年8月26, 德國漢堡市愛力奉獻的法門 (1/2)","url":"https://www.youtube.com/watch?v=9xVGpd0p9tg"},{"content":"我們永遠照顧不完這個世界，只要盡力這樣就好。","date":"1995年8月26, 德國漢堡市愛力奉獻的法門 (2/2)","url":"https://www.youtube.com/watch?v=P4hS8L_xK_I"},{"content":"我們誠心要修改自己，我們會離道越來越近。","date":"","url":""},{"content":"由於我們全心全意地喜愛著一、二個人或事物，使自己愈來愈孤單，和宇宙的大力量斷開，變成一個很小的力量，一下就用完了。","date":"清海無上師講於福爾摩沙台北 一九八六‧三‧六","url":"師父開示"},{"content":"光和音會把我們裡面的細胞、精神等等都清洗乾淨。所以我們越修行，越覺得年輕、越覺得舒服，多數的病痛都會消失。","date":"清海無上師以中文講於日本東京機場 1994.9.8（影帶編號#444A）","url":"教理選粹"},{"content":"任何人用功打坐，一定會改變自己的身心、改變自己的思想，讓自己好像重新再生一樣。沒有別的方法比打坐好，所以我們要了脫生死、要減少痛苦、要幫助世界的話，先要打坐，先要淨化自己的業障，然後才能夠想得通，知道用什麼辦法來幫助別人。","date":"清海無上師以中文講於福爾摩沙西湖 1991.6.13","url":"http://www.godsdirectcontact.org.tw/ch/news/157/pw1.htm"},{"content":"因為團結的力量非常強大，許多人同心進行有意義的活動，一定會很快獲得成效。","date":"清海無上師以英文與美國加州洛杉磯視訊會議2011.04.27(DVD944)","url":"http://smchbooks.com/new-c/dvd/dvd944.htm"},{"content":"如果你一心所要的只有靈性提昇，你得到的也就是靈性提昇。","date":"清海無上師 以英文講於歐洲  20130705(DVD1016一心想念上帝與開悟)","url":"http://suprememastertv.com/tw/2013-EU-Gathering/?wr_id=5&page=1"},{"content":"我們那個謙卑心是從裡面跑出來的啦，我們有謙卑心的人，根本不知道自己有謙卑心。那個跟罵人也沒關係啦，不是罵我們小孩子就是輕視他，不是這樣子，就是驕慢……..我們沒有依靠自己的權力，沒有壓迫別人、輕視別人，就是有謙卑心。","date":"","url":"http://edenrules.com/index.php?route=product/product&product_id=797"},{"conte
