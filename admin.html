<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>甘露法語後台</title>
<style>
body{font-family:sans-serif;background:#f5f5f5;padding:20px}
.card{background:#fff;padding:20px;border-radius:12px;margin-bottom:20px}
input,textarea,select{width:100%;padding:8px;margin:8px 0}
button{padding:10px;margin-top:10px}
.item{border:1px solid #ddd;padding:10px;margin-top:10px}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBoJ0byHJGwOHCkUmyZkx1jXLrctYYdzSM",
  authDomain: "ganlu-music.firebaseapp.com",
  projectId: "ganlu-music",
  appId: "1:661017374980:web:904c57d0f61fb9b51ba051"
};

const ADMIN_EMAIL="trueloveshops@gmail.com";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

window.login=async()=>{
  const email=document.getElementById("email").value;
  const password=document.getElementById("password").value;
  const user=await signInWithEmailAndPassword(auth,email,password);

  if(user.user.email!==ADMIN_EMAIL){
    alert("不是管理員");
    return;
  }

  document.getElementById("panel").style.display="block";
  load();
};

window.save=async()=>{
  const text=document.getElementById("text").value;
  const date=document.getElementById("date").value;
  const url=document.getElementById("url").value;
  const audio=document.getElementById("audio").value;
  const image=document.getElementById("image").value;

  await addDoc(collection(db,"phrases"),{
    text,
    date,
    url,
    audioUrl:audio?`https://trueloveshops.github.io/ganlu-music-/music/${audio}`:"",
    imageUrl:image?`https://trueloveshops.github.io/ganlu-music-/images/${image}`:"",
    published:true,
    order:Date.now()
  });

  alert("新增成功");
  load();
};

async function load(){
  const list=document.getElementById("list");
  list.innerHTML="";
  const snap=await getDocs(collection(db,"phrases"));

  snap.forEach(doc=>{
    const d=doc.data();
    const div=document.createElement("div");
    div.className="item";
    div.innerHTML=`
    <div>${d.text}</div>
    <div>${d.date||""}</div>
    ${d.url?`<a href="${d.url}" target="_blank">來源</a>`:""}
    `;
    list.appendChild(div);
  });
}
</script>
</head>

<body>

<div class="card">
<h2>登入</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">登入</button>
</div>

<div id="panel" class="card" style="display:none">
<h2>新增法語</h2>

<textarea id="text" placeholder="法語"></textarea>

<input id="date" placeholder="日期 / 來源">
<input id="url" placeholder="超連結網址">

<input id="audio" placeholder="音檔檔名 001.mp3">
<input id="image" placeholder="圖片檔名 001.jpg">

<button onclick="save()">儲存</button>

<h2>列表</h2>
<div id="list"></div>

</div>

</body>
</html>
