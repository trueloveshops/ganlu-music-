<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>甘露法語後台管理</title>
<style>
body{font-family:Arial,sans-serif;background:#f6f6f6;margin:0;padding:20px;color:#222}
.wrap{max-width:1100px;margin:auto}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:18px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
input,textarea,select{width:100%;box-sizing:border-box;padding:10px;margin:8px 0 14px;border:1px solid #ccc;border-radius:10px;font-size:16px}
textarea{min-height:110px;resize:vertical}button{border:0;border-radius:10px;padding:10px 16px;cursor:pointer;margin-right:8px;margin-bottom:8px}
button[disabled]{opacity:.6;cursor:not-allowed}.btn-primary{background:#2d6a4f;color:#fff}.btn-blue{background:#2b6cb0;color:#fff}.btn-gray{background:#ddd}.btn-danger{background:#b00020;color:#fff}.btn-purple{background:#7c3aed;color:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.hidden{display:none}
.item{border:1px solid #e4e4e4;border-radius:12px;padding:14px;margin-bottom:12px;background:#fafafa}.meta{font-size:14px;color:#666;margin-bottom:10px;line-height:1.6}
.help{font-size:13px;color:#666;line-height:1.5}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar input{margin:0}
.preview-box{max-height:260px;overflow:auto;border:1px solid #ddd;border-radius:10px;padding:10px;background:#fafafa}.preview-row{padding:8px 0;border-bottom:1px solid #e8e8e8}.preview-row:last-child{border-bottom:none}
@media(max-width:860px){.row,.row3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>甘露法語後台管理</h1>

  <div class="card" id="loginCard">
    <h2>管理員登入</h2>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button class="btn-primary" id="loginBtn" type="button">登入</button>
    <p id="loginMsg"></p>
  </div>

  <div class="card hidden" id="adminPanel">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
      <h2>新增 / 編輯法語</h2>
      <button class="btn-gray" id="logoutBtn" type="button">登出</button>
    </div>
    <input id="docId" type="hidden">
    <label>法語內容</label>
    <textarea id="text" placeholder="輸入法語內容"></textarea>
    <div class="row">
      <div><label>日期 / 來源（可空）</label><input id="date" type="text" placeholder="例如：DVD745"></div>
      <div><label>超連結網址（可空）</label><input id="url" type="text" placeholder="例如：https://example.com"></div>
    </div>
    <div class="row">
      <div><label>音檔檔名（可空）</label><input id="audioFile" type="text" placeholder="例如：0001.mp3"><div class="help">只填檔名即可，系統會自動組成完整網址。</div></div>
      <div><label>圖片檔名（可空）</label><input id="imageFile" type="text" placeholder="例如：0001.jpg"><div class="help">只填檔名即可，系統會自動組成完整網址。</div></div>
    </div>
    <div class="row">
      <div><label>排序</label><input id="order" type="number" placeholder="1"></div>
      <div><label>發布狀態</label><select id="published"><option value="true">發布</option><option value="false">下架</option></select></div>
    </div>
    <button class="btn-primary" id="saveBtn" type="button">儲存</button>
    <button class="btn-gray" id="resetBtn" type="button">清空</button>
    <p id="saveMsg"></p>
  </div>

  <div class="card hidden" id="importPanel">
    <h2>批量匯入 CSV</h2>
    <div class="help">CSV 欄位順序：text,date,url,audioFile,imageFile,order,published</div>
    <input id="csvFile" type="file" accept=".csv,text/csv">
    <div class="toolbar">
      <button class="btn-blue" id="previewBtn" type="button">預覽 CSV</button>
      <button class="btn-primary" id="importBtn" type="button" disabled>開始匯入</button>
      <button class="btn-gray" id="downloadTemplateBtn" type="button">下載模板</button>
      <label class="help" style="display:flex;align-items:center;gap:8px;"><input id="clearBeforeImport" type="checkbox" style="width:auto;margin:0;">匯入前先清空舊資料</label>
    </div>
    <p id="importMsg"></p>
    <div id="previewBox" class="preview-box hidden"></div>
  </div>

  <div class="card hidden" id="themePanel">
    <h2>外觀主題控制</h2>
    <div class="row3">
      <div><label>背景主題</label><select id="themeName"><option value="default">預設</option><option value="zen">禪風詩意</option><option value="romance">浪漫戀愛</option><option value="energy">活力充沛</option></select></div>
      <div><label>法語字體</label><select id="quoteFontFamily"><option value="Noto Serif TC">Noto Serif TC</option><option value="Microsoft JhengHei">Microsoft JhengHei</option><option value="serif">serif</option><option value="sans-serif">sans-serif</option></select></div>
      <div><label>標題字體</label><select id="titleFontFamily"><option value="Noto Serif TC">Noto Serif TC</option><option value="Microsoft JhengHei">Microsoft JhengHei</option><option value="serif">serif</option><option value="sans-serif">sans-serif</option></select></div>
    </div>
    <div class="row3">
      <div><label>法語字級（px）</label><input id="quoteFontSize" type="number" min="12" max="40" step="1"></div>
      <div><label>卡片透明度（0~1）</label><input id="cardOpacity" type="number" min="0.05" max="1" step="0.01"></div>
      <div><label>來源文字顏色</label><input id="sourceTextColor" type="color" value="#f6fcfc"></div>
    </div>
    <div class="row3">
      <div><label>法語文字顏色</label><input id="quoteTextColor" type="color" value="#eef7f6"></div>
      <div><label>標題文字顏色</label><input id="titleTextColor" type="color" value="#eef7f6"></div>
      <div><label>預覽提示</label><input value="日期目前固定顯示" readonly></div>
    </div>
    <button class="btn-purple" id="saveThemeBtn" type="button">儲存外觀設定</button>
    <button class="btn-gray" id="loadThemeBtn" type="button">重新讀取設定</button>
    <p id="themeMsg"></p>
  </div>

  <div class="card hidden" id="exportPanel">
    <h2>資料匯出</h2>
    <div class="toolbar">
      <button class="btn-primary" id="exportJsonBtn" type="button">匯出 JSON</button>
      <button class="btn-blue" id="exportCsvBtn" type="button">匯出 CSV</button>
      <button class="btn-gray" id="exportPublishedJsonBtn" type="button">匯出已發布 JSON</button>
      <button class="btn-danger" id="clearAllBtn" type="button">清空全部資料</button>
    </div>
    <p id="exportMsg"></p>
  </div>

  <div class="card hidden" id="listPanel">
    <h2>法語列表</h2>
    <div class="toolbar" style="margin-bottom:14px;">
      <input id="searchInput" type="text" placeholder="搜尋法語、日期、網址、音檔、圖片…">
      <button class="btn-blue" id="runSearchBtn" type="button">搜尋</button>
      <button class="btn-gray" id="clearSearchBtn" type="button">清除搜尋</button>
    </div>
    <div id="searchStatus" class="help"></div>
    <div id="items"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {apiKey:"AIzaSyBoJ0byHJGwOHCkUmyZkx1jXLrctYYdzSM",authDomain:"ganlu-music.firebaseapp.com",projectId:"ganlu-music",appId:"1:661017374980:web:904c57d0f61fb9b51ba051"};
const ADMIN_EMAIL = "trueloveshops@gmail.com";
const AUDIO_BASE = "https://trueloveshops.github.io/ganlu-music-/music/";
const IMAGE_BASE = "https://trueloveshops.github.io/ganlu-music-/images/";
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const $ = (id)=>document.getElementById(id);
let allItems = [], parsedRows = [], isSaving = false, isLoggingIn = false;

function buildUrl(base, filename){filename=String(filename||'').trim(); if(!filename) return ''; if(/^https?:\/\//i.test(filename)) return filename; return base + encodeURIComponent(filename).replace(/%2F/g,'/');}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
function csvEsc(s){s=String(s||''); return (s.includes('"')||s.includes(',')||s.includes('\n')) ? '"' + s.replace(/"/g,'""') + '"' : s;}
function titleFromText(v){v=String(v||'').trim(); return v ? v.slice(0,20) : '未命名';}
function hashString(str){let h=5381; for(let i=0;i<str.length;i++){h=((h<<5)+h)+str.charCodeAt(i); h=h>>>0;} return 'p_'+h.toString(16);}
function buildId(payload){return hashString([payload.text||'',payload.date||'',payload.url||'',payload.audioFile||'',payload.imageFile||'',String(payload.order||''),String(payload.published||'')].join('||'));}
function normalizePublished(v){v=String(v||'').trim().toLowerCase(); return v==='true'||v==='1'||v==='yes'||v==='y';}
function payloadFromFields(obj){const text=String(obj.text||'').trim(); return {title:titleFromText(text),text:text,date:String(obj.date||'').trim(),url:String(obj.url||'').trim(),audioFile:String(obj.audioFile||'').trim(),imageFile:String(obj.imageFile||'').trim(),audioUrl:buildUrl(AUDIO_BASE,obj.audioFile||''),imageUrl:buildUrl(IMAGE_BASE,obj.imageFile||''),order:Number(obj.order||0),published:typeof obj.published==='boolean'?obj.published:normalizePublished(obj.published),updatedAt:firebase.firestore.FieldValue.serverTimestamp()};}

async function loginNow(){
  if(isLoggingIn) return;
  isLoggingIn = true;
  $('loginMsg').textContent = '登入中…';
  $('loginBtn').disabled = true;
  try{
    const cred = await auth.signInWithEmailAndPassword($('email').value.trim(), $('password').value);
    if((cred.user.email||'').toLowerCase() !== ADMIN_EMAIL.toLowerCase()){
      await auth.signOut();
      $('loginMsg').textContent = '這不是管理員帳號。';
    }else{
      $('loginMsg').textContent = '';
    }
  }catch(err){
    $('loginMsg').textContent = '登入失敗：' + err.message;
  }finally{
    $('loginBtn').disabled = false;
    isLoggingIn = false;
  }
}
$('loginBtn').addEventListener('click', loginNow);
['email','password'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault(); loginNow();}}));
$('logoutBtn').addEventListener('click', ()=>auth.signOut());

auth.onAuthStateChanged(async user=>{
  const ok = user && (user.email||'').toLowerCase() === ADMIN_EMAIL.toLowerCase();
  ['loginCard'].forEach(id=>$(id).classList.toggle('hidden', !!ok));
  ['adminPanel','importPanel','themePanel','exportPanel','listPanel'].forEach(id=>$(id).classList.toggle('hidden', !ok));
  if(ok){await loadItems(); await loadThemeSettings();}
});

function clearForm(){['docId','text','date','url','audioFile','imageFile','order'].forEach(id=>$(id).value=''); $('published').value='true'; $('saveMsg').textContent=''; $('saveBtn').disabled=false; $('saveBtn').textContent='儲存'; isSaving=false;}
$('resetBtn').addEventListener('click', clearForm);

$('saveBtn').addEventListener('click', async ()=>{
  if(isSaving) return;
  const text = $('text').value.trim();
  if(!text){$('saveMsg').textContent='請填寫法語內容。'; return;}
  const payload = payloadFromFields({text:text,date:$('date').value,url:$('url').value,audioFile:$('audioFile').value,imageFile:$('imageFile').value,order:$('order').value,published:$('published').value});
  isSaving=true; $('saveBtn').disabled=true; $('saveBtn').textContent='儲存中...'; $('saveMsg').textContent='';
  try{
    if($('docId').value){
      await db.collection('phrases').doc($('docId').value).update(payload);
      $('saveMsg').textContent='更新成功';
    }else{
      const id = buildId(payload);
      payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection('phrases').doc(id).set(payload,{merge:true});
      $('saveMsg').textContent='新增成功';
    }
    clearForm();
    await loadItems();
  }catch(err){
    $('saveMsg').textContent='儲存失敗：'+err.message;
    $('saveBtn').disabled=false; $('saveBtn').textContent='儲存'; isSaving=false;
  }
});

function parseCsvLine(line){
  const out=[]; let cur='', inQuotes=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i], next=line[i+1];
    if(ch==='"'){ if(inQuotes && next==='"'){cur+='"'; i++;} else inQuotes=!inQuotes; }
    else if(ch===',' && !inQuotes){ out.push(cur); cur=''; }
    else cur+=ch;
  }
  out.push(cur);
  return out.map(v=>v.trim());
}
function parseCsv(text){
  const lines=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n').filter(x=>x.trim()!=='');
  if(lines.length<2) return [];
  const headers=parseCsvLine(lines[0]);
  return lines.slice(1).map(line=>{ const vals=parseCsvLine(line); const obj={}; headers.forEach((h,i)=>obj[h]=vals[i]??''); return obj;});
}
async function clearAllPhrases(){
  const snap = await db.collection('phrases').orderBy('order','asc').get();
  let count=0, batch=db.batch(), n=0;
  for(const d of snap.docs){
    batch.delete(d.ref); count++; n++;
    if(n===200){ await batch.commit(); batch=db.batch(); n=0; }
  }
  if(n>0) await batch.commit();
  return count;
}

$('previewBtn').addEventListener('click', async ()=>{
  $('importMsg').textContent=''; $('previewBox').innerHTML=''; $('previewBox').classList.add('hidden'); $('importBtn').disabled=true; parsedRows=[];
  const file = $('csvFile').files[0];
  if(!file){$('importMsg').innerHTML='<span style="color:#b00020">請先選擇 CSV 檔。</span>'; return;}
  try{
    const rows = parseCsv(await file.text());
    const req=['text','date','url','audioFile','imageFile','order','published'];
    if(!rows.length){$('importMsg').innerHTML='<span style="color:#b00020">CSV 沒有可匯入資料。</span>'; return;}
    const missing=req.filter(k=>!Object.keys(rows[0]).includes(k));
    if(missing.length){$('importMsg').innerHTML='<span style="color:#b00020">缺少欄位：'+missing.join(', ')+'</span>'; return;}
    parsedRows = rows.filter(r=>String(r.text||'').trim()!=='');
    $('previewBox').classList.remove('hidden');
    $('previewBox').innerHTML = parsedRows.slice(0,20).map((r,i)=>`<div class="preview-row"><strong>${i+1}. ${esc(r.text)}</strong><br><span>date: ${esc(r.date)}</span><br><span>audioFile: ${esc(r.audioFile)}</span> ｜ <span>imageFile: ${esc(r.imageFile)}</span> ｜ <span>order: ${esc(r.order)}</span> ｜ <span>published: ${esc(r.published)}</span></div>`).join('');
    if(parsedRows.length>20) $('previewBox').innerHTML += `<div class="preview-row">只顯示前 20 筆，實際將匯入 ${parsedRows.length} 筆。</div>`;
    $('importMsg').innerHTML=`<span style="color:#2d6a4f">預覽完成，可匯入 ${parsedRows.length} 筆。</span>`;
    $('importBtn').disabled=false;
  }catch(err){$('importMsg').innerHTML='<span style="color:#b00020">讀取 CSV 失敗：'+esc(err.message)+'</span>';}
});

$('importBtn').addEventListener('click', async ()=>{
  if(!parsedRows.length){$('importMsg').innerHTML='<span style="color:#b00020">請先預覽 CSV。</span>'; return;}
  $('importBtn').disabled=true; $('previewBtn').disabled=true; $('importMsg').innerHTML='<span style="color:#b45309">匯入中...</span>';
  try{
    let cleared=0;
    if($('clearBeforeImport').checked) cleared = await clearAllPhrases();
    for(let i=0;i<parsedRows.length;i+=200){
      const batch = db.batch();
      parsedRows.slice(i,i+200).forEach(row=>{
        const payload = payloadFromFields(row);
        payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
        batch.set(db.collection('phrases').doc(buildId(payload)), payload, {merge:true});
      });
      await batch.commit();
    }
    $('importMsg').innerHTML=`<span style="color:#2d6a4f">批量匯入完成，共處理 ${parsedRows.length} 筆。${$('clearBeforeImport').checked ? `已先清空 ${cleared} 筆舊資料。` : ''}</span>`;
    parsedRows=[]; $('csvFile').value=''; $('previewBox').classList.add('hidden'); $('previewBox').innerHTML=''; $('previewBtn').disabled=false;
    await loadItems();
  }catch(err){
    $('importMsg').innerHTML='<span style="color:#b00020">批量匯入失敗：'+esc(err.message)+'</span>';
    $('previewBtn').disabled=false; $('importBtn').disabled=false;
  }
});

$('downloadTemplateBtn').addEventListener('click', ()=>{
  const content=['text,date,url,audioFile,imageFile,order,published','願眾生離苦得樂,DVD745,https://example.com,0001.mp3,0001.jpg,1,true','心存善念世界更美好,DVD746,https://example.com,0002.mp3,0002.jpg,2,true'].join('\n');
  const blob=new Blob([content],{type:'text/csv;charset=utf-8;'}), url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download='ganlu_import_template.csv'; a.click(); URL.revokeObjectURL(url);
});

async function loadThemeSettings(){
  try{
    const snap = await db.collection('site_settings').doc('appearance').get();
    if(!snap.exists){$('themeMsg').textContent='尚未儲存外觀設定'; return;}
    const d=snap.data()||{};
    $('themeName').value=d.themeName||'default';
    $('quoteFontFamily').value=d.quoteFontFamily||'Noto Serif TC';
    $('titleFontFamily').value=d.titleFontFamily||'Noto Serif TC';
    $('quoteFontSize').value=d.quoteFontSize ?? 18;
    $('cardOpacity').value=d.cardOpacity ?? 0.16;
    $('quoteTextColor').value=d.quoteTextColor||'#eef7f6';
    $('titleTextColor').value=d.titleTextColor||'#eef7f6';
    $('sourceTextColor').value=d.sourceTextColor||'#f6fcfc';
    $('themeMsg').textContent='已載入外觀設定。';
  }catch(err){$('themeMsg').textContent='讀取外觀設定失敗：'+err.message;}
}
$('saveThemeBtn').addEventListener('click', async ()=>{
  try{
    await db.collection('site_settings').doc('appearance').set({
      themeName:$('themeName').value,
      quoteFontFamily:$('quoteFontFamily').value,
      titleFontFamily:$('titleFontFamily').value,
      quoteFontSize:Number($('quoteFontSize').value||18),
      cardOpacity:Number($('cardOpacity').value||0.16),
      quoteTextColor:$('quoteTextColor').value,
      titleTextColor:$('titleTextColor').value,
      sourceTextColor:$('sourceTextColor').value,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    },{merge:true});
    $('themeMsg').textContent='外觀設定已儲存。';
  }catch(err){$('themeMsg').textContent='儲存外觀設定失敗：'+err.message;}
});
$('loadThemeBtn').addEventListener('click', loadThemeSettings);

function sanitizeExportRecord(item){return {text:item.text||'',date:item.date||'',url:item.url||'',audioFile:item.audioFile||'',imageFile:item.imageFile||'',order:Number(item.order||0),published:!!item.published};}
async function exportData(format, onlyPublished=false){
  try{
    const snap = await db.collection('phrases').orderBy('order','asc').get();
    let rows=[]; snap.forEach(d=>rows.push(sanitizeExportRecord(d.data()))); if(onlyPublished) rows=rows.filter(r=>r.published);
    if(!rows.length){$('exportMsg').textContent='目前沒有可匯出的資料。'; return;}
    if(format==='json'){
      const blob=new Blob([JSON.stringify(rows,null,2)],{type:'application/json;charset=utf-8;'}), url=URL.createObjectURL(blob), a=document.createElement('a');
      a.href=url; a.download=onlyPublished?'phrases_published.json':'phrases.json'; a.click(); URL.revokeObjectURL(url);
      $('exportMsg').textContent=`已匯出 ${rows.length} 筆 JSON。`; return;
    }
    const header=['text','date','url','audioFile','imageFile','order','published'];
    const csv=[header.join(',')]; rows.forEach(r=>csv.push(header.map(k=>csvEsc(r[k])).join(',')));
    const blob=new Blob(["\uFEFF"+csv.join('\n')],{type:'text/csv;charset=utf-8;'}), url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download='phrases.csv'; a.click(); URL.revokeObjectURL(url);
    $('exportMsg').textContent=`已匯出 ${rows.length} 筆 CSV。`;
  }catch(err){$('exportMsg').textContent='匯出失敗：'+err.message;}
}
$('exportJsonBtn').addEventListener('click', ()=>exportData('json', false));
$('exportCsvBtn').addEventListener('click', ()=>exportData('csv', false));
$('exportPublishedJsonBtn').addEventListener('click', ()=>exportData('json', true));
$('clearAllBtn').addEventListener('click', async ()=>{
  if(!confirm('確定要清空全部法語資料嗎？這個動作無法復原。')) return;
  $('exportMsg').textContent='清空中...';
  try{ const n = await clearAllPhrases(); $('exportMsg').textContent=`已清空 ${n} 筆資料。`; await loadItems(); }
  catch(err){ $('exportMsg').textContent='清空失敗：'+err.message; }
});

function renderItems(keyword=''){
  const kw=String(keyword||'').trim().toLowerCase();
  const filtered=!kw?allItems:allItems.filter(d=>[d.text,d.date,d.url,d.audioFile,d.imageFile,d.audioUrl,d.imageUrl,d.title,d.order,d.published?'發布 true published':'下架 false unpublished'].some(v=>String(v||'').toLowerCase().includes(kw)));
  $('searchStatus').textContent = kw ? `搜尋「${keyword}」：${filtered.length} 筆` : `全部資料：${allItems.length} 筆`;
  if(!filtered.length){$('items').innerHTML='<p>找不到符合資料</p>'; return;}
  $('items').innerHTML = filtered.map(d=>`
    <div class="item">
      <div class="meta">排序：${d.order ?? ''} ｜ 狀態：${d.published ? '發布' : '下架'}</div>
      <div style="white-space:pre-wrap;margin-bottom:10px;">${esc(d.text || '')}</div>
      ${d.date ? `<div>日期/來源：${esc(d.date)}</div>` : ''}
      ${d.url ? `<div class="help">超連結：<a href="${escapeURI(d.url)}" target="_blank" rel="noopener noreferrer">${esc(d.url)}</a></div>` : ''}
      ${d.audioFile ? `<div>音檔檔名：${esc(d.audioFile)}</div>` : ''}
      ${d.imageFile ? `<div>圖片檔名：${esc(d.imageFile)}</div>` : ''}
      <div style="margin-top:10px;">
        <button class="btn-primary" data-edit="${d.id}" type="button">編輯</button>
        <button class="btn-danger" data-del="${d.id}" type="button">刪除</button>
      </div>
    </div>`).join('');
  document.querySelectorAll('[data-edit]').forEach(btn=>btn.addEventListener('click', ()=>{
    const d=allItems.find(x=>x.id===btn.dataset.edit); if(!d) return;
    $('docId').value=d.id; $('text').value=d.text||''; $('date').value=d.date||''; $('url').value=d.url||''; $('audioFile').value=d.audioFile||''; $('imageFile').value=d.imageFile||''; $('order').value=d.order??''; $('published').value=String(!!d.published);
    window.scrollTo({top:0,behavior:'smooth'});
  }));
  document.querySelectorAll('[data-del]').forEach(btn=>btn.addEventListener('click', async ()=>{
    if(!confirm('確定要刪除這筆資料嗎？')) return;
    await db.collection('phrases').doc(btn.dataset.del).delete();
    await loadItems();
  }));
}
async function loadItems(){
  $('items').innerHTML='讀取中...';
  const snap = await db.collection('phrases').orderBy('order','asc').get();
  allItems=[]; snap.forEach(d=>allItems.push({id:d.id, ...d.data()}));
  renderItems($('searchInput').value.trim());
}
function runSearch(){ renderItems($('searchInput').value.trim()); }
$('searchInput').addEventListener('input', runSearch);
$('searchInput').addEventListener('change', runSearch);
$('searchInput').addEventListener('compositionend', runSearch);
$('searchInput').addEventListener('keydown', e=>{ if(e.key==='Enter'){e.preventDefault(); runSearch();} });
$('runSearchBtn').addEventListener('click', runSearch);
$('clearSearchBtn').addEventListener('click', ()=>{ $('searchInput').value=''; renderItems(''); });
</script>
</body>
</html>
