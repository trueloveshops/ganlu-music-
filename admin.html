<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>甘露後台</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBoJ0byHJGwOHCkUmyZkx1jXLrctYYdzSM",
  authDomain: "ganlu-music.firebaseapp.com",
  projectId: "ganlu-music",
  appId: "1:661017374980:web:904c57d0f61fb9b51ba051"
};

const ADMIN_EMAIL = "trueloveshops@gmail.com";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.login = async () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const user = await signInWithEmailAndPassword(auth, email, password);

  if (user.user.email !== ADMIN_EMAIL) {
    alert("不是管理員");
    return;
  }

  document.getElementById("panel").style.display = "block";
};

window.save = async () => {
  const text = document.getElementById("text").value;
  const audio = document.getElementById("audio").value;
  const image = document.getElementById("image").value;

  await addDoc(collection(db, "phrases"), {
    text: text,
    audioUrl: audio ? "https://trueloveshops.github.io/ganlu-music-/music/" + audio : "",
    imageUrl: image ? "https://trueloveshops.github.io/ganlu-music-/images/" + image : "",
    published: true,
    order: Date.now()
  });

  alert("新增成功");
};
</script>
</head>

<body>

<h2>登入</h2>
<input id="email" placeholder="Email"><br>
<input id="password" placeholder="Password" type="password"><br>
<button onclick="login()">登入</button>

<div id="panel" style="display:none">
<h2>新增法語</h2>

<textarea id="text" placeholder="法語"></textarea><br>
<input id="audio" placeholder="音檔檔名 001.mp3"><br>
<input id="image" placeholder="圖片檔名 001.jpg"><br>

<button onclick="save()">儲存</button>
</div>

</body>
</html>
