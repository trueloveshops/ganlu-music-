<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>甘露法語後台</title>

<style>
body{
  font-family: "Microsoft JhengHei";
  background:#f5f7fa;
  margin:0;
  padding:20px;
}
.card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,0.08);
}
input,textarea{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #ccc;
}
button{
  padding:10px 16px;
  border:none;
  border-radius:10px;
  margin-top:10px;
  cursor:pointer;
}
.btn{background:#2d6a4f;color:white;}
.btn-red{background:#b00020;color:white;}
.drop{
  border:2px dashed #aaa;
  padding:20px;
  text-align:center;
  border-radius:12px;
  margin-top:10px;
}
.hidden{display:none;}
</style>
</head>

<body>

<div id="login" class="card">
<h2>歡迎使用 甘露法語音樂播放器</h2>
<p>請輸入管理員帳號登入</p>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button class="btn" onclick="login()">登入</button>
<p id="msg"></p>
</div>

<div id="admin" class="hidden">

<div class="card">
<h3>新增法語</h3>
<textarea id="text" placeholder="法語內容"></textarea>
<input id="date" placeholder="日期">
<input id="url" placeholder="連結">

<input id="audioFile" placeholder="音檔">
<div class="drop" id="audioDrop">拖拉音檔到這裡</div>

<input id="imageFile" placeholder="圖片">
<div class="drop" id="imgDrop">拖拉圖片到這裡</div>

<button class="btn" onclick="save()">儲存</button>
</div>

<div class="card">
<h3>備份 / 還原</h3>

<button class="btn" onclick="backup()">下載備份</button>

<input type="file" id="restoreFile">
<button class="btn" onclick="restore()">還原（覆蓋）</button>

</div>

<div class="card">
<button class="btn-red" onclick="logout()">登出</button>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script>
// ⚠️ 這裡用你原本的 Firebase 設定（請保持不變）
const firebaseConfig = {
  apiKey: "你的KEY",
  authDomain: "你的",
  projectId: "你的"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function login(){
  auth.signInWithEmailAndPassword(
    email.value,
    password.value
  ).then(()=>{
    loginDiv.style.display="none";
    admin.classList.remove("hidden");
  }).catch(e=>{
    msg.innerText=e.message;
  });
}

function logout(){
  auth.signOut();
  location.reload();
}

function save(){
  db.collection("phrases").add({
    text:text.value,
    date:date.value,
    url:url.value,
    audioFile:audioFile.value,
    imageFile:imageFile.value,
    createdAt:Date.now()
  });
  alert("已新增");
}

async function backup(){
  const snap = await db.collection("phrases").get();
  const data = snap.docs.map(d=>d.data());
  const blob = new Blob([JSON.stringify(data)],{type:"application/json"});
  const a = document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="backup.json";
  a.click();
}

async function restore(){
  const file = restoreFile.files[0];
  const text = await file.text();
  const data = JSON.parse(text);

  const snap = await db.collection("phrases").get();
  snap.forEach(d=>d.ref.delete());

  data.forEach(item=>{
    db.collection("phrases").add(item);
  });

  alert("還原完成");
}

// 拖拉
audioDrop.ondrop = e=>{
  e.preventDefault();
  audioFile.value = e.dataTransfer.files[0].name;
};
audioDrop.ondragover = e=>e.preventDefault();

imgDrop.ondrop = e=>{
  e.preventDefault();
  imageFile.value = e.dataTransfer.files[0].name;
};
imgDrop.ondragover = e=>e.preventDefault();
</script>

</body>
</html>
