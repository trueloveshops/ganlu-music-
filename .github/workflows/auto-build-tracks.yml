name: Auto Build Tracks

on:
  push:
    paths:
      - 'music/**'
      - 'images/**'
      - '.github/workflows/auto-build-tracks.yml'
      - 'tools/build_tracks.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tracks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate tracks.json
        run: python tools/build_tracks.py

      - name: Commit tracks.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracks.json
          git diff --cached --quiet || git commit -m "Auto update tracks.json"
          git push

